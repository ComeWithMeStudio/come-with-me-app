<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e5f1d7"><title>Ігри природи — Come With Me Studio</title><style>*{box-sizing:border-box}body{margin:0;padding:18px;background:#e5f1d7;color:#324735;font-family:"Trebuchet MS",system-ui,sans-serif}.shell{width:min(720px,100%);margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.head h1{font-size:clamp(29px,7vw,42px);margin:0}.back,.card{color:inherit;text-decoration:none}.back{border:0;border-radius:999px;padding:11px 15px;background:#fff9e9;font-weight:900;white-space:nowrap}.card{display:block;position:relative;aspect-ratio:16/10;border:3px solid white;border-radius:26px;overflow:hidden;box-shadow:0 8px 24px #34492d25}.card img{width:100%;height:100%;object-fit:cover}.veil{position:absolute;inset:auto 0 0;padding:60px 18px 18px;background:linear-gradient(transparent,#152811d9);color:white;text-shadow:0 2px 5px #0008}.veil strong{display:block;font-size:clamp(28px,7vw,42px)}.veil small{font-size:16px;font-weight:900}.badge,.lock{position:absolute;top:13px;padding:9px 12px;border-radius:999px;background:#fffde9ef;color:#40543b;font-weight:900}.badge{left:13px}.lock{right:13px}.note{text-align:center;font-weight:800;line-height:1.5;color:#5d7158}.message{margin-top:20px;padding:15px;border-radius:16px;background:#fff9e9;text-align:center;font-weight:900}.message[hidden]{display:none}</style></head><body><main class="shell"><header class="head"><h1>Ігри природи 🧩</h1><a class="back" href="nature.html">← Природа</a></header><a class="card paid-card" href="#" data-target="media/pograymo/pryroda/ihry/komakhy/index.html" aria-label="Комахи — платна гра"><img src="media/pograymo/pryroda/ihry/komakhy/assets/meadow.webp" alt="Літня галявина з квітами"><span class="badge">ПЛАТНО</span><span class="lock">🔒</span><span class="veil"><strong>Комахи</strong><small>4 рівні · 24 завдання</small></span></a><p class="note">Обирай гру й досліджуй природу разом із Мімі 🌿</p><div class="message" id="lockedMessage" hidden>Ця гра входить до платної колекції Come With Me Studio ❤️</div></main><script>const params=new URLSearchParams(location.search);if(params.get('preview')==='alona')sessionStorage.setItem('cwm-author-preview','1');const author=sessionStorage.getItem('cwm-author-preview')==='1',card=document.querySelector('.paid-card'),message=document.getElementById('lockedMessage');if(author){card.querySelector('.badge').textContent='РЕЖИМ АВТОРА';card.querySelector('.lock').textContent='🔓';card.href=card.dataset.target}else card.addEventListener('click',e=>{e.preventDefault();message.hidden=false;message.scrollIntoView({behavior:'smooth',block:'center'})});</script></body></html>
