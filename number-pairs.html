<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Числові пари Мімі</title><style>*{box-sizing:border-box}body{margin:0;background:#e6f2ff;color:#49362d;font:20px system-ui;text-align:center;padding:16px}main{max-width:800px;margin:auto}header{display:flex;justify-content:space-between;gap:12px}button,a{font:inherit;color:inherit;background:#fff9e9;border:3px solid white;border-radius:20px;padding:12px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:4px solid #8057b5}h1{font-size:clamp(26px,6vw,40px)}.mimi{height:110px;max-width:100%;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.tile{min-height:110px;font-size:32px;word-break:break-word}.tile.found{background:#ccebc8}.tile:disabled{opacity:1;color:#49362d}.dots{font-size:25px;color:#8057b5}#message{min-height:58px}button[hidden],section[hidden]{display:none}@media(max-width:450px){.grid{gap:8px}.tile{min-height:92px;padding:5px;font-size:28px}.dots{font-size:21px}header{font-size:16px}}</style><main><header><a href="number-games.html">← Ігри</a><button id="sound" aria-pressed="true">Звук: увімкнено</button></header><img class="mimi" src="mimi-home.png" alt="Мімі"><h1>Числові пари Мімі</h1><p id="message" role="status" aria-live="polite">Знайди пару: цифру та стільки ж крапочок. Відкривай по дві картки й запам’ятовуй!</p><button id="start">Почнімо!</button><section id="play" hidden><p id="progress"></p><div class="grid" id="board"></div></section><button id="next" hidden>Наступний рівень</button><button id="again" hidden>Зіграти ще</button></main><script>
const $=id=>document.getElementById(id);let task=0;const totals=[5,4,3];let level=0,opened=[],matched=0,locked=false,timer=null,enabled=true,epoch=0;const sounds=[];const music=new Audio('audio/games/find-for-mimi/music/level-1.mp3');music.loop=true;music.volume=.12;
function sound(name){if(!enabled)return;const a=new Audio('audio/games/common/'+name+'.mp3');sounds.push(a);a.play().catch(()=>{});a.onended=()=>{const i=sounds.indexOf(a);if(i>=0)sounds.splice(i,1)}}
function stop(){music.pause();sounds.forEach(a=>{a.pause();a.currentTime=0});sounds.length=0}
$('sound').onclick=()=>{enabled=!enabled;$('sound').textContent='Звук: '+(enabled?'увімкнено':'вимкнено');$('sound').setAttribute('aria-pressed',enabled);if(!enabled)stop();else if(!$('play').hidden)music.play().catch(()=>{})};
function round(){epoch++;clearTimeout(timer);opened=[];matched=0;locked=false;$('start').hidden=true;$('next').hidden=true;$('again').hidden=true;$('play').hidden=false;$('board').replaceChildren();$('message').textContent='Знайди цифру та відповідну кількість крапочок.';const n=level+2;const deck=Array.from({length:n},(_,i)=>[{value:i+1,dots:false},{value:i+1,dots:true}]).flat();for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}update();deck.forEach(c=>{const b=document.createElement('button');b.className='tile';b.textContent='✦';b.setAttribute('aria-label','Відкрити картку');b.onclick=()=>{if(locked||opened.includes(b)||b.disabled)return;b.textContent=c.dots?'● '.repeat(c.value).trim():c.value;b.classList.toggle('dots',c.dots);b.setAttribute('aria-label',c.dots?c.value+' крапочок':'Цифра '+c.value);b.dataset.value=c.value;opened.push(b);if(opened.length<2)return;locked=true;const pair=opened.slice(),version=epoch;if(pair[0].dataset.value===pair[1].dataset.value){pair.forEach(x=>{x.disabled=true;x.classList.add('found')});matched++;sound('correct_chime');$('message').textContent='Так! Це пара. Чудово!';opened=[];locked=false;update();if(matched===n){$('message').textContent=(level===2&&task===totals[level]-1)?'⭐⭐⭐ Усі числові пари знайдено! Дякую за гру!':'Усі пари знайдено! Рушаймо далі.';sound('scene_complete');if(level===2&&task===totals[level]-1){$('again').hidden=false;music.pause()}else {$('next').textContent=task<totals[level]-1?'Наступне завдання':'Наступний рівень';$('next').hidden=false}}}else{$('message').textContent='Запам’ятай ці картки й спробуй іншу пару.';timer=setTimeout(()=>{if(version!==epoch)return;pair.forEach(x=>{x.textContent='✦';x.classList.remove('dots');x.setAttribute('aria-label','Відкрити картку')});opened=[];locked=false},1300)}};$('board').append(b)});if(enabled)music.play().catch(()=>{})}
function update(){$('progress').textContent=`Рівень ${level+1} з 3 · Завдання ${task+1} з ${totals[level]} · Пари: ${matched} з ${level+2}`}$('start').onclick=round;$('next').onclick=()=>{task++;if(task===totals[level]){task=0;level++}round()};$('again').onclick=()=>{level=0;task=0;round()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(enabled&&!$('play').hidden&&$('again').hidden)music.play().catch(()=>{})});window.addEventListener('pagehide',()=>{clearTimeout(timer);stop()});
</script></html>
