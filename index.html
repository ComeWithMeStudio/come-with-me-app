<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Come With Me</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #F8F2EC;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
    }

    .splash {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand {
      text-align: center;
    }

    .cwm {
      font-size: clamp(54px, 15vw, 100px);
      font-weight: 700;
      letter-spacing: 4px;
      color: #111111;
    }

    .gold {
      color: #CF9C50;
    }

    .name {
      margin-top: 14px;
      font-size: clamp(15px, 4vw, 22px);
      letter-spacing: 7px;
      color: #111111;
    }
  </style>
</head>

<body>
  <main class="splash">
    <div class="brand">
      <div class="cwm">CW<span class="gold">M</span></div>
      <div class="name">COME WITH ME</div>
    </div>
  </main>
</body>
</html>
