<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152f27"><title>Come With Me</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#152f27;font-family:"Trebuchet MS",system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#476d59,#152f27 72%)}button{font:inherit}.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#f8f2ec;transition:opacity .65s ease,visibility .65s ease}.splash.hide{opacity:0;visibility:hidden}.splash img{width:min(76vw,520px)}.stage{position:relative;width:min(100vw,720px);aspect-ratio:1536/1024;max-height:100vh;background:#1d4a39 url('home-world-bg.png') center/contain no-repeat;overflow:hidden;box-shadow:0 28px 90px #071d1477}.hotspot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;border-radius:28px;outline:0}.hotspot:focus-visible{box-shadow:0 0 0 4px #fff,0 0 0 8px #ffd95b}.hotspot:after{content:"";position:absolute;inset:3%;border-radius:inherit;opacity:0;background:radial-gradient(ellipse,#fff5ad38,transparent 70%);transition:opacity .18s ease;pointer-events:none}.hotspot:hover:after,.hotspot:focus-visible:after{opacity:1}.go{left:21%;top:43%;width:29%;height:11%}.quiet{left:54%;top:43%;width:29%;height:11%}.story{left:17%;top:58%;width:31%;height:11%}.play{left:55%;top:58%;width:31%;height:11%}.mimi-home{position:absolute;z-index:6;left:42%;top:55%;width:17%;height:27%;border:0;background:transparent;border-radius:48%;cursor:pointer}.mimi-home:after{content:"";position:absolute;inset:-8%;border-radius:50%;opacity:0;box-shadow:0 0 28px #fff3a8;transition:opacity .2s}.mimi-home:hover:after{opacity:.5}.language,.adult{position:absolute;z-index:8;top:3.15%;border:0;background:transparent;color:#4d3b32;font-weight:900;cursor:pointer;box-shadow:none}.language{right:20.7%;width:6.5%;height:7%;padding:0}.adult{right:3.2%;width:16.5%;height:7%;padding:0;font-size:0}.adult span{font-size:0}.status{position:absolute;z-index:8;left:50%;bottom:2.7%;transform:translateX(-50%);width:47%;height:7.5%;display:grid;place-items:center;padding:7px 14px;text-align:center;border:0;border-radius:24px;background:#fff9e8f2;color:#3d2a23;font-weight:900;font-size:clamp(11px,1.65vw,16px);line-height:1.05;box-shadow:none}.world-panel{position:absolute;z-index:20;inset:13% 13% 12%;display:grid;place-items:center;text-align:center;padding:28px 22px;border:3px solid #f2dfbd;border-radius:34px;background:#fff9ebf2;color:#3d2a23;box-shadow:0 20px 55px #102a2366;backdrop-filter:blur(8px)}.world-panel[hidden]{display:none}.world-icon{font-size:58px}.world-title{margin:8px 0;font-size:clamp(28px,5vw,42px)}.world-coming{font-weight:800}.back{border:0;border-radius:24px;padding:12px 20px;background:#fff;color:#35445d;font-weight:900;box-shadow:0 5px 14px #35502d22;cursor:pointer}@media(max-aspect-ratio:3/2){body{align-items:center}.stage{width:100vw;max-width:none;max-height:none;aspect-ratio:1536/1024}}@media(max-width:700px){.status{font-size:10px;padding:4px 8px}}
</style></head><body><section class="splash" id="splash"><img src="cwm-logo.png" alt="Come With Me"></section><main class="stage" id="stage" aria-label="Світ Come With Me"><button class="language" id="languageButton" aria-label="Змінити мову">UA</button><button class="adult" id="adultButton" aria-label="Для дорослих"><span data-i18n="adult">Для дорослих</span></button><button class="hotspot go" data-world="go" aria-label="Рушаймо"></button><button class="hotspot quiet" data-world="quiet" aria-label="Тихіше"></button><button class="hotspot story" data-world="story" aria-label="Розкажи мені"></button><button class="hotspot play" data-world="play" aria-label="Пограймо"></button><button class="mimi-home" id="mimiButton" aria-label="Мімі"></button><section class="world-panel" id="worldPanel" hidden><div><div class="world-icon" id="worldIcon"></div><h1 class="world-title" id="worldTitle"></h1><p class="world-coming" id="worldComing"></p><button class="back" id="backButton"></button></div></section><div class="status" id="status" data-i18n="choose">Обери, куди підемо сьогодні ✨</div></main><script src="app.js"></script></body></html>
