<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f8f2ec">
  <title>Come With Me</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#3d2a23}html,body{min-height:100%;background:#173d2c}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 18%,#f5e9bd 0,#b8d49d 28%,#315e43 68%,#173d2c 100%)}button{font:inherit}.splash{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#f8f2ec;transition:opacity .65s ease,visibility .65s ease}.splash.hide{opacity:0;visibility:hidden}.splash img{width:min(76vw,520px);height:auto}.stage{width:100%;min-height:100svh;margin:0 auto;position:relative;overflow:hidden;background:linear-gradient(#54bff1 0 23%,#bce9ff 37%,#a7d98c 62%,#4e9458 100%)}.app{min-height:100svh;position:relative;padding:18px 16px 24px}.sun{position:absolute;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,#fffbd3 0 25%,#ffe16a 50%,#ffc943 70%,transparent 72%);top:135px;left:-22px;filter:drop-shadow(0 0 22px #fff19b)}.moon-nook{position:absolute;right:-38px;top:120px;width:185px;height:250px;border-radius:52% 0 0 52%;background:radial-gradient(circle at 48% 38%,#38417d 0 25%,#151d58 62%,#0a123d 100%);box-shadow:inset 18px 0 0 #315c3b,0 8px 24px #203c4b33}.moon-nook:before{content:'☾';position:absolute;top:27px;left:48px;font-size:68px;color:#ffe88d;text-shadow:0 0 16px #fff2a0}.moon-nook:after{content:'✦  ·  ✧';position:absolute;top:105px;left:35px;color:#ffe8a3;font-size:22px;letter-spacing:8px}.hills{position:absolute;inset:34% -18% auto;height:39%;background:linear-gradient(150deg,#82c87b,#4f9d67);border-radius:50% 50% 25% 25%/42% 42% 15% 15%;box-shadow:inset 0 22px 35px #c4ec9b66}.path{position:absolute;left:50%;bottom:-75px;transform:translateX(-50%);width:min(58vw,310px);height:54%;background:linear-gradient(90deg,#c9a96d,#f0d89f 28%,#f6e4b6 52%,#d4b477);clip-path:polygon(44% 0,56% 0,88% 100%,12% 100%);opacity:.95}.leaves{position:absolute;z-index:1;left:-4%;right:-4%;top:-18px;height:96px;background:radial-gradient(ellipse at 10% 20%,#285d2e 0 18%,transparent 19%),radial-gradient(ellipse at 24% 10%,#4c8736 0 17%,transparent 18%),radial-gradient(ellipse at 43% 12%,#6b9d38 0 18%,transparent 19%),radial-gradient(ellipse at 66% 8%,#3f7b32 0 17%,transparent 18%),radial-gradient(ellipse at 86% 17%,#2d642d 0 20%,transparent 21%)}.top{position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;margin:auto}.brand{width:160px;max-width:38vw;filter:drop-shadow(0 3px 5px #ffffff88)}.controls{display:flex;gap:7px}.adult,.language{border:2px solid #fff7e9;border-radius:22px;padding:9px 12px;background:#fff8edee;color:#4d3b32;font-weight:800;box-shadow:0 4px 12px #36522b33;cursor:pointer}.language{min-width:48px}.hello{position:relative;z-index:4;margin:14px auto 10px;width:min(88%,560px);background:#fffaf0f2;border:2px solid #f2ddbd;border-radius:28px;padding:11px 18px;text-align:center;font-weight:900;font-size:clamp(18px,4.6vw,27px);box-shadow:0 6px 16px #49683d2c}.worlds{position:relative;z-index:4;display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:700px;margin:14px auto 0}.world{border:3px solid #ffffffa8;border-radius:27px;padding:12px 9px;min-height:96px;box-shadow:0 7px 0 #42613c45,0 10px 20px #34542f30;color:#402d25;font-weight:900;cursor:pointer;transition:transform .16s ease}.world:active{transform:translateY(4px) scale(.98)}.world .icon{font-size:30px;display:block;margin-bottom:3px}.world strong{display:block;font-size:clamp(18px,5vw,27px)}.world small{display:block;font-weight:800;margin-top:3px;opacity:.78}.go{background:linear-gradient(145deg,#ffe96f,#f7b633)}.quiet{background:linear-gradient(145deg,#c98af4,#7d4bc8);color:#fff}.story{background:linear-gradient(145deg,#b7d95a,#5c982d)}.play{background:linear-gradient(145deg,#65c6f3,#168dcc);color:#fff}.mimi-zone{position:relative;z-index:3;min-height:300px;max-width:720px;margin:-2px auto 0;display:flex;align-items:flex-end;justify-content:center}.mimi-home{position:relative;z-index:3;display:block;width:min(64vw,310px);max-height:295px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 13px 13px #203c2e55);transform-origin:50% 100%;animation:mimi-arrive .7s cubic-bezier(.2,.85,.35,1.15) both}.mimi-home:active{animation:mimi-bounce .38s ease}@keyframes mimi-arrive{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes mimi-bounce{50%{transform:translateY(-10px) rotate(-2deg) scale(1.02)}}.book-nook,.blocks{position:absolute;z-index:2;bottom:86px;font-size:clamp(38px,10vw,64px);filter:drop-shadow(0 6px 5px #26432c55)}.book-nook{left:3%}.blocks{right:3%}.status{position:relative;z-index:6;margin:-2px auto 0;max-width:520px;min-height:44px;background:#fff9e8ef;border:2px solid #f0d6ae;border-radius:22px;padding:10px 16px;text-align:center;font-weight:900;box-shadow:0 5px 15px #35502d33}@media(min-width:700px){body{padding:18px}.stage{width:min(100%,760px);height:calc(100svh - 36px);min-height:0;border-radius:34px;box-shadow:0 30px 90px #071d1466,0 0 0 7px #fff5dc26}.app{height:100%;min-height:0;padding:18px 24px 18px;overflow:hidden}.brand{width:165px}.hello{font-size:22px;margin-top:8px}.worlds{gap:12px;margin-top:10px}.world{min-height:92px}.world strong{font-size:22px}.world small{font-size:14px}.mimi-zone{min-height:285px;height:32vh;max-height:310px}.mimi-home{width:min(38vw,285px);max-height:275px}.book-nook,.blocks{bottom:78px}.status{font-size:14px}}@media(min-width:1100px){body{padding:18px;display:flex;align-items:center;justify-content:center}.stage{width:min(720px,calc(100vw - 72px));height:min(900px,calc(100vh - 36px));max-height:none;overflow:hidden}.app{height:100%;min-height:0}.sun{top:88px}.moon-nook{top:74px}.hills{inset:35% -18% auto}.hello{font-size:21px}.world{min-height:88px}.mimi-zone{height:31vh;min-height:250px;max-height:290px}.mimi-home{max-height:260px}.book-nook,.blocks{bottom:70px}}
  </style>
</head>
<body>
  <section class="splash" id="splash" aria-label="Come With Me"><img src="cwm-logo.png" alt="Come With Me"></section>
  <div class="stage"><main class="app">
    <div class="leaves" aria-hidden="true"></div><div class="sun" aria-hidden="true"></div><div class="moon-nook" aria-hidden="true"></div><div class="hills" aria-hidden="true"></div><div class="path" aria-hidden="true"></div>
    <header class="top"><img class="brand" src="cwm-logo.png" alt="Come With Me"><div class="controls"><button class="language" id="languageButton" type="button">UA</button><button class="adult" id="adultButton" type="button">⚙ <span data-i18n="adult">Для дорослих</span></button></div></header>
    <div class="hello" data-i18n="greeting">Мімі: «Ходімо зі мною! Що будемо робити?»</div>
    <section class="worlds" aria-label="Куди підемо з Мімі">
      <button class="world go" data-world data-i18n="go"><span class="icon">🎵</span><strong data-i18n="go">Рушаймо!</strong><small data-i18n="goSub">пісні • рух • пригоди</small></button>
      <button class="world quiet" data-world data-i18n="quiet"><span class="icon">🌙</span><strong data-i18n="quiet">Тихіше…</strong><small data-i18n="quietSub">колискові • перед сном</small></button>
      <button class="world story" data-world data-i18n="story"><span class="icon">📖</span><strong data-i18n="story">Розкажи мені</strong><small data-i18n="storySub">казки • історії</small></button>
      <button class="world play" data-world data-i18n="play"><span class="icon">⭐</span><strong data-i18n="play">Пограймо!</strong><small data-i18n="playSub">ігри • букви • цифри</small></button>
    </section>
    <section class="mimi-zone" aria-label="Мімі"><div class="book-nook" aria-hidden="true">📖</div><img class="mimi-home" src="mimi-home.png" alt="Мімі — маленький мандрівник Come With Me"><div class="blocks" aria-hidden="true">🧩⭐</div></section>
    <div class="status" id="status" data-i18n="choose">Обери, куди підемо сьогодні ✨</div>
  </main></div>
  <script src="app.js"></script>
</body>
</html>
