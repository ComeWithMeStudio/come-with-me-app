<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f2ec"><title>Come With Me</title><style>
*{box-sizing:border-box;margin:0;padding:0}:root{font-family:"Trebuchet MS",system-ui,sans-serif;color:#3d2a23}html,body{min-height:100%;background:#173d2c}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 18%,#f7ebbd 0,#aecb92 30%,#315e43 68%,#173d2c 100%)}button{font:inherit}.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#f8f2ec;transition:opacity .65s ease,visibility .65s ease}.splash.hide{opacity:0;visibility:hidden}.splash img{width:min(76vw,520px)}.stage{width:100%;min-height:100svh;margin:auto;position:relative;overflow:hidden;background:linear-gradient(#56c3f1 0 22%,#c9efff 38%,#a9db91 62%,#55985e 100%)}.app{min-height:100svh;position:relative;padding:18px 16px 24px}.sky-glow{position:absolute;inset:0;background:radial-gradient(circle at 22% 19%,#fff5aa70 0 7%,transparent 22%),radial-gradient(circle at 78% 25%,#b9d5ff33 0 8%,transparent 24%);pointer-events:none}.sun{position:absolute;width:102px;height:102px;border-radius:50%;background:radial-gradient(circle,#fffde1 0 24%,#ffe36e 49%,#ffc83f 69%,transparent 71%);top:128px;left:-20px;filter:drop-shadow(0 0 22px #fff19b);animation:glow 4s ease-in-out infinite}.moon-nook{position:absolute;right:-38px;top:112px;width:185px;height:245px;border-radius:52% 0 0 52%;background:radial-gradient(circle at 48% 38%,#414b8b 0 25%,#18205f 62%,#0b123d 100%);box-shadow:inset 18px 0 0 #315c3b,0 8px 24px #203c4b33}.moon-nook:before{content:'☾';position:absolute;top:27px;left:48px;font-size:68px;color:#ffe88d;text-shadow:0 0 16px #fff2a0}.moon-nook:after{content:'✦ · ✧';position:absolute;top:105px;left:35px;color:#ffe8a3;font-size:22px;letter-spacing:8px}.far-hill{position:absolute;left:-22%;right:-22%;top:34%;height:34%;background:linear-gradient(#8fce79,#67af69);border-radius:50% 50% 20% 20%/42% 42% 12% 12%;box-shadow:inset 0 18px 28px #d8f5ae55}.near-hill{position:absolute;left:-28%;right:-28%;bottom:-12%;height:54%;background:linear-gradient(#7fbd70,#4d8d57);border-radius:48% 52% 0 0/24% 26% 0 0}.path{position:absolute;left:50%;bottom:-45px;transform:translateX(-50%);width:min(60vw,330px);height:58%;background:linear-gradient(90deg,#caa66b,#efd59b 28%,#f7e6b8 51%,#d0ac70);clip-path:polygon(46% 0,54% 0,91% 100%,9% 100%);opacity:.98}.leaves{position:absolute;z-index:2;left:-4%;right:-4%;top:-18px;height:105px;background:radial-gradient(ellipse at 5% 18%,#204f29 0 18%,transparent 19%),radial-gradient(ellipse at 18% 6%,#3f7c31 0 18%,transparent 19%),radial-gradient(ellipse at 35% 12%,#65963b 0 18%,transparent 19%),radial-gradient(ellipse at 53% 3%,#356f30 0 18%,transparent 19%),radial-gradient(ellipse at 72% 9%,#5a9037 0 18%,transparent 19%),radial-gradient(ellipse at 91% 16%,#25572b 0 21%,transparent 22%);filter:drop-shadow(0 7px 6px #173c2a44)}.sparkles{position:absolute;z-index:2;inset:0;pointer-events:none}.sparkles i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fffbd1;box-shadow:0 0 9px #fff4a7;animation:twinkle 2.8s ease-in-out infinite}.sparkles i:nth-child(1){left:12%;top:29%}.sparkles i:nth-child(2){left:23%;top:41%;animation-delay:.7s}.sparkles i:nth-child(3){right:17%;top:38%;animation-delay:1.2s}.sparkles i:nth-child(4){right:9%;top:48%;animation-delay:1.8s}.top{position:relative;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:760px;margin:auto}.brand{width:160px;max-width:38vw;filter:drop-shadow(0 3px 5px #ffffff88)}.controls{display:flex;gap:7px}.adult,.language{border:2px solid #fff7e9;border-radius:22px;padding:9px 12px;background:#fff8edee;color:#4d3b32;font-weight:800;box-shadow:0 4px 12px #36522b33;cursor:pointer}.language{min-width:48px}.hello{position:relative;z-index:5;margin:12px auto 8px;width:min(88%,560px);background:#fffaf0f2;border:2px solid #f2ddbd;border-radius:28px;padding:10px 18px;text-align:center;font-weight:900;font-size:clamp(18px,4.6vw,27px);box-shadow:0 6px 16px #49683d2c}.worlds{position:relative;z-index:5;max-width:650px;height:230px;margin:7px auto 0}.world{position:absolute;width:47%;min-height:86px;border:3px solid #fff7d5c7;padding:10px 12px;color:#402d25;font-weight:900;cursor:pointer;transition:transform .16s ease,filter .2s ease;box-shadow:0 8px 0 #4b633a55,0 12px 20px #29442c30}.world:after{content:"";position:absolute;bottom:-23px;width:18px;height:28px;background:linear-gradient(90deg,#7c572f,#a97843,#6a4928);z-index:-1;box-shadow:2px 4px 4px #29442c44}.world:hover{filter:brightness(1.06)}.world:active{transform:translateY(4px) rotate(var(--tilt)) scale(.98)}.world .icon{font-size:27px;display:inline-block;margin-right:5px;vertical-align:middle}.world strong{font-size:clamp(17px,4.5vw,24px);vertical-align:middle}.world small{display:block;font-weight:800;margin-top:3px;opacity:.78}.go{--tilt:-2deg;left:1%;top:7px;transform:rotate(-2deg);border-radius:13px 28px 14px 24px;background:linear-gradient(145deg,#ffe96f,#f5b631)}.go:after{right:23%}.quiet{--tilt:2deg;right:1%;top:12px;transform:rotate(2deg);border-radius:27px 12px 25px 14px;background:linear-gradient(145deg,#c98af4,#7546c5);color:#fff}.quiet:after{left:24%}.story{--tilt:1.5deg;left:3%;top:124px;transform:rotate(1.5deg);border-radius:25px 13px 27px 12px;background:linear-gradient(145deg,#b8dc5e,#59952c)}.story:after{right:27%}.play{--tilt:-1.5deg;right:3%;top:122px;transform:rotate(-1.5deg);border-radius:12px 26px 13px 28px;background:linear-gradient(145deg,#67c8f2,#168dcc);color:#fff}.play:after{left:28%}.mimi-zone{position:relative;z-index:4;min-height:290px;max-width:720px;margin:-15px auto 0;display:flex;align-items:flex-end;justify-content:center}.mimi-home{position:relative;z-index:4;display:block;width:min(64vw,310px);max-height:295px;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 13px 13px #203c2e55);transform-origin:50% 100%;animation:mimi-arrive .7s cubic-bezier(.2,.85,.35,1.15) both}.mimi-home:active{animation:mimi-bounce .38s ease}.grass{position:absolute;z-index:3;bottom:2px;left:8%;right:8%;height:28px;background:repeating-linear-gradient(75deg,transparent 0 10px,#387c42 11px 13px,transparent 14px 22px);opacity:.75}.book-nook,.blocks{position:absolute;z-index:3;bottom:82px;font-size:clamp(38px,10vw,64px);filter:drop-shadow(0 6px 5px #26432c55)}.book-nook{left:3%}.blocks{right:3%}.status{position:relative;z-index:7;margin:-2px auto 0;max-width:520px;min-height:44px;background:#fff9e8ef;border:2px solid #f0d6ae;border-radius:22px;padding:10px 16px;text-align:center;font-weight:900;box-shadow:0 5px 15px #35502d33}@keyframes glow{50%{filter:drop-shadow(0 0 34px #fff4ae)}}@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.6)}50%{opacity:1;transform:scale(1.35)}}@keyframes mimi-arrive{from{opacity:0;transform:translateY(24px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}@keyframes mimi-bounce{50%{transform:translateY(-10px) rotate(-2deg) scale(1.02)}}
@media(min-width:700px){body{padding:18px}.stage{width:min(100%,760px);height:calc(100svh - 36px);min-height:0;border-radius:34px;box-shadow:0 30px 90px #071d1466,0 0 0 7px #fff5dc26}.app{height:100%;min-height:0;padding:18px 24px;overflow:hidden}.brand{width:165px}.hello{font-size:22px;margin-top:7px}.worlds{height:215px}.world{min-height:80px}.world strong{font-size:21px}.world small{font-size:13px}.story,.play{top:112px}.mimi-zone{min-height:270px;height:30vh;max-height:290px}.mimi-home{width:min(38vw,280px);max-height:270px}.book-nook,.blocks{bottom:72px}.status{font-size:14px}}
@media(min-width:1100px){body{padding:18px;display:flex;align-items:center;justify-content:center}.stage{width:min(720px,calc(100vw - 72px));height:min(900px,calc(100vh - 36px));overflow:hidden}.app{height:100%;min-height:0}.sun{top:88px}.moon-nook{top:74px}.far-hill{top:35%}.hello{font-size:21px}.worlds{height:205px}.world{min-height:76px}.story,.play{top:105px}.mimi-zone{height:29vh;min-height:235px;max-height:275px}.mimi-home{max-height:250px}.book-nook,.blocks{bottom:66px}}
</style></head><body><section class="splash" id="splash"><img src="cwm-logo.png" alt="Come With Me"></section><div class="stage"><main class="app"><div class="sky-glow"></div><div class="leaves"></div><div class="sun"></div><div class="moon-nook"></div><div class="far-hill"></div><div class="near-hill"></div><div class="path"></div><div class="sparkles"><i></i><i></i><i></i><i></i></div><header class="top"><img class="brand" src="cwm-logo.png" alt="Come With Me"><div class="controls"><button class="language" id="languageButton">UA</button><button class="adult" id="adultButton">⚙ <span data-i18n="adult">Для дорослих</span></button></div></header><div class="hello" data-i18n="greeting">Мімі: «Ходімо зі мною! Що будемо робити?»</div><section class="worlds" aria-label="Куди підемо з Мімі"><button class="world go" data-world data-i18n="go"><span class="icon">🎵</span><strong data-i18n="go">Рушаймо!</strong><small data-i18n="goSub">пісні • рух • пригоди</small></button><button class="world quiet" data-world data-i18n="quiet"><span class="icon">🌙</span><strong data-i18n="quiet">Тихіше…</strong><small data-i18n="quietSub">колискові • перед сном</small></button><button class="world story" data-world data-i18n="story"><span class="icon">📖</span><strong data-i18n="story">Розкажи мені</strong><small data-i18n="storySub">казки • історії</small></button><button class="world play" data-world data-i18n="play"><span class="icon">⭐</span><strong data-i18n="play">Пограймо!</strong><small data-i18n="playSub">ігри • букви • цифри</small></button></section><section class="mimi-zone"><div class="grass"></div><div class="book-nook">📖</div><img class="mimi-home" src="mimi-home.png" alt="Мімі — маленький мандрівник Come With Me"><div class="blocks">🧩⭐</div></section><div class="status" id="status" data-i18n="choose">Обери, куди підемо сьогодні ✨</div></main></div><script src="app.js"></script></body></html>
