<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#152f27"><title>Come With Me</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#152f27;font-family:"Trebuchet MS",system-ui,sans-serif}body{min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 20%,#476d59,#152f27 72%)}button{font:inherit}.splash{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:#f8f2ec;transition:opacity .65s ease,visibility .65s ease}.splash.hide{opacity:0;visibility:hidden}.splash img{width:min(76vw,520px)}.stage{position:relative;width:min(100vw,720px);aspect-ratio:1402/1122;max-height:100vh;background:#1d4a39 url('home-world-bg.png') center/100% 100% no-repeat;overflow:hidden;box-shadow:0 28px 90px #071d1477}.hotspot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;border-radius:28px;outline:0;color:#fff;text-align:center;text-shadow:0 2px 3px #0009}.hotspot:focus-visible{box-shadow:0 0 0 3px #fff,0 0 0 6px #ffd95b}.hotspot:after{content:"";position:absolute;inset:4%;border-radius:inherit;opacity:0;background:radial-gradient(ellipse,#fff6b842,transparent 72%);transition:opacity .18s ease;pointer-events:none}.hotspot:hover:after,.hotspot:focus-visible:after{opacity:1}.sign-copy{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;pointer-events:none}.sign-title{font-weight:900;font-size:clamp(12px,2.25vw,22px);white-space:nowrap}.sign-sub{margin-top:5px;font-weight:800;font-size:clamp(7px,1.12vw,11px);white-space:nowrap}.go{left:12.5%;top:43.2%;width:31%;height:12%}.quiet{left:54.5%;top:43.2%;width:31%;height:12%}.story{left:8%;top:60.2%;width:33%;height:12%}.play{left:57%;top:60.2%;width:33%;height:12%}.go .sign-copy{left:34%;right:4%;top:22%;bottom:14%}.quiet .sign-copy{left:31%;right:4%;top:22%;bottom:14%}.story .sign-copy{left:31%;right:4%;top:19%;bottom:15%}.play .sign-copy{left:30%;right:4%;top:19%;bottom:15%}.mimi-home{position:absolute;z-index:6;left:39%;top:51%;width:21%;height:34%;border:0;background:transparent;border-radius:48%;cursor:pointer}.mimi-home:after{content:"";position:absolute;inset:-5%;border-radius:50%;opacity:0;box-shadow:0 0 28px #fff3a8;transition:opacity .2s}.mimi-home:hover:after{opacity:.5}.language,.adult{position:absolute;z-index:8;top:2.05%;border:0;background:transparent;color:transparent;font-size:0;cursor:pointer;box-shadow:none;padding:0}.language{right:20.45%;width:7.3%;height:5.8%}.adult{right:1.25%;width:18.8%;height:5.8%}.adult span{display:none}.status{position:absolute;z-index:12;left:50%;bottom:3.1%;transform:translateX(-50%);width:50%;height:6.6%;display:grid;place-items:center;padding:5px 14px;text-align:center;border:1px solid #e4d5b8;border-radius:999px;background:#fff9eb;color:#332b27;font-weight:900;font-size:clamp(10px,1.45vw,15px);line-height:1.08;box-shadow:0 4px 13px #102a2340;overflow:hidden}.world-panel{position:absolute;z-index:20;inset:13% 13% 12%;display:grid;place-items:center;text-align:center;padding:28px 22px;border:3px solid #f2dfbd;border-radius:34px;background:#fff9ebf2;color:#3d2a23;box-shadow:0 20px 55px #102a2366;backdrop-filter:blur(8px)}.world-panel[hidden]{display:none}.world-icon{font-size:58px}.world-title{margin:8px 0;font-size:clamp(28px,5vw,42px)}.world-coming{font-weight:800}.back{border:0;border-radius:24px;padding:12px 20px;background:#fff;color:#35445d;font-weight:900;box-shadow:0 5px 14px #35502d22;cursor:pointer}@media(max-aspect-ratio:1.25){body{align-items:center}.stage{height:min(100vh,calc(100vw * 1122 / 1402));width:min(100vw,calc(100vh * 1402 / 1122))}}@media(max-width:700px){.status{font-size:9px;padding:4px 9px}.sign-sub{margin-top:3px}}
</style></head><body><section class="splash" id="splash"><img src="cwm-logo.png" alt="Come With Me"></section><main class="stage" id="stage" aria-label="Світ Come With Me"><button class="language" id="languageButton" aria-label="Змінити мову"></button><button class="adult" id="adultButton" aria-label="Для дорослих"><span data-i18n="adult">Для дорослих</span></button><button class="hotspot go" data-world="go" aria-label="Рушаймо"><span class="sign-copy"><strong class="sign-title" data-i18n="go">Рушаймо!</strong><small class="sign-sub" data-i18n="goSub">пісні • рух • пригоди</small></span></button><button class="hotspot quiet" data-world="quiet" aria-label="Тихіше"><span class="sign-copy"><strong class="sign-title" data-i18n="quiet">Тихіше…</strong><small class="sign-sub" data-i18n="quietSub">колискові • тихі пісні • казки</small></span></button><button class="hotspot story" data-world="story" aria-label="Розкажи мені"><span class="sign-copy"><strong class="sign-title" data-i18n="story">Розкажи мені</strong><small class="sign-sub" data-i18n="storySub">історії • казки • знання</small></span></button><button class="hotspot play" data-world="play" aria-label="Пограймо"><span class="sign-copy"><strong class="sign-title" data-i18n="play">Пограймо!</strong><small class="sign-sub" data-i18n="playSub">ігри • букви • цифри</small></span></button><button class="mimi-home" id="mimiButton" aria-label="Мімі"></button><section class="world-panel" id="worldPanel" hidden><div><div class="world-icon" id="worldIcon"></div><h1 class="world-title" id="worldTitle"></h1><p class="world-coming" id="worldComing"></p><button class="back" id="backButton"></button></div></section><div class="status" id="status" data-i18n="choose">Обери, куди підемо сьогодні ✨</div></main><script src="app.js"></script></body></html>
