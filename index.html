<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Come With Me</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background: #F8F2EC;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .splash {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }

    .logo {
      display: block;
      width: min(78vw, 620px);
      height: auto;
    }
  </style>
</head>

<body>
  <main class="splash">
    <img
      class="logo"
      src="cwm-logo.png"
      alt="Come With Me"
    >
  </main>
</body>
</html>
