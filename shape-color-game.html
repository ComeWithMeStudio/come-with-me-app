<!doctype html>
<html lang="uk" style="color-scheme:only light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#aee6fb">
  <title>Знайди фігуру — Come With Me</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#49362d;background:#8fd7f3}button{font:inherit}.game{width:min(100%,760px);min-height:100vh;margin:auto;padding:14px 12px 28px;background:radial-gradient(circle at 12% 7%,#fff2a6 0 5%,transparent 18%),linear-gradient(180deg,#aee7fb 0 45%,#dff5c6 45%);overflow:hidden}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.pill{border:0;border-radius:999px;padding:10px 14px;background:#fff9e9ed;color:#49362d;font-weight:900;box-shadow:0 5px 14px #49362d25;text-decoration:none}.title{margin:0;text-align:center;font-size:clamp(22px,5vw,36px)}.level-badge{width:max-content;margin:12px auto 6px;padding:7px 14px;border-radius:999px;background:#fff9e9dd;color:#654c72;font-weight:900}.progress{margin:9px auto 10px;display:flex;justify-content:center;gap:9px}.dot{width:13px;height:13px;border-radius:50%;background:#fff9;border:2px solid #fff}.dot.done{background:#62bb73}.dot.active{background:#ffb72f;transform:scale(1.22)}.question{min-height:58px;display:grid;place-items:center;text-align:center;margin:4px auto 12px;font-size:clamp(21px,4.8vw,31px);font-weight:900}.scene{position:relative;min-height:400px;border:5px solid #fff7e8;border-radius:34px;padding:38px 15px 86px;background:linear-gradient(#bdeaff 0 62%,#b9df85 62%);box-shadow:0 14px 30px #416f7230,inset 0 0 35px #fff8;overflow:hidden}.scene:before{content:"";position:absolute;left:7%;top:9%;width:60px;height:28px;border-radius:50px;background:#fff9;box-shadow:44px 8px 0 5px #fff9}.scene:after{content:"";position:absolute;left:0;right:0;bottom:20%;height:7px;background:#ebc17f;box-shadow:0 5px 0 #d4a25d}.choices{position:relative;z-index:2;min-height:260px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(10px,3vw,30px)}.choice{width:min(30%,170px);min-width:92px;min-height:160px;border:4px solid #fff;background:#fff9e9d9;border-radius:27px;padding:17px 8px 14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:16px;box-shadow:0 10px 20px #49362d25;cursor:pointer;transition:.2s}.choice:active{transform:scale(.96)}.choice.good{outline:7px solid #63c875;animation:pop .45s}.choice.bad{animation:shake .35s}.choice small{font-weight:900;font-size:clamp(13px,2.7vw,17px);text-align:center}.geom{--c:#32a9e6;display:block;filter:drop-shadow(0 8px 7px #49362d35);background:linear-gradient(135deg,#fff8 0 12%,transparent 35%),var(--c);box-shadow:inset -9px -10px 13px #49362d22}.circle{width:92px;height:92px;border-radius:50%}.square{width:90px;height:90px;border-radius:15px}.rectangle{width:112px;height:72px;border-radius:14px}.oval{width:112px;height:76px;border-radius:50%}.diamond{width:76px;height:76px;border-radius:12px;transform:rotate(45deg);margin:9px}.hexagon{width:102px;height:90px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}.triangle{width:0;height:0;background:none;border-left:52px solid transparent;border-right:52px solid transparent;border-bottom:92px solid var(--c);box-shadow:none}.red{--c:#f25762}.blue{--c:#269bd5}.yellow{--c:#f5c52e}.green{--c:#55b96b}.orange{--c:#f39a35}.purple{--c:#8858d3}.pink{--c:#ee76ad}.teal{--c:#35b9ae}.mimi{position:absolute;z-index:3;right:1%;bottom:2%;width:22%;max-width:140px;filter:drop-shadow(0 7px 8px #3455)}.message{min-height:52px;margin:13px 0 3px;display:grid;place-items:center;text-align:center;font-size:19px;font-weight:900}.actions{display:flex;justify-content:center}.next{border:0;border-radius:999px;padding:13px 22px;background:#ffcb4d;color:#49362d;font-weight:900;box-shadow:0 5px 14px #49362d25}.level-card{width:min(90%,430px);align-self:center;padding:28px;border-radius:32px;background:#fff9e9e8;text-align:center;box-shadow:0 12px 28px #49362d25}.level-card strong{display:block;font-size:28px}.level-card span{display:block;margin-top:12px;font-size:18px;font-weight:900}.palette{margin-top:18px;font-size:35px;letter-spacing:6px}.spark{position:absolute;z-index:8;font-size:28px;animation:spark 1s ease-out forwards;pointer-events:none}@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes spark{to{transform:translateY(-90px) rotate(35deg);opacity:0}}@media(max-width:520px){.game{padding:10px 8px 24px}.top{grid-template-columns:auto 1fr}.top .reset{grid-column:1/3;grid-row:2;padding:7px 12px;justify-self:center}.pill{font-size:13px;padding:9px 11px}.scene{min-height:390px;border-radius:27px;padding:32px 6px 82px}.choices{gap:7px}.choice{min-width:0;width:32%;min-height:145px;padding:14px 4px 12px}.circle{width:74px;height:74px}.square{width:73px;height:73px}.rectangle{width:88px;height:58px}.oval{width:89px;height:60px}.diamond{width:62px;height:62px}.hexagon{width:84px;height:74px}.triangle{border-left-width:42px;border-right-width:42px;border-bottom-width:76px}.mimi{width:25%}}
  </style>
</head>
<body>
<main class="game">
  <header class="top"><a class="pill" href="geometry-games-catalog.html">← До ігор</a><h1 class="title">Знайди фігуру</h1><button class="pill reset" id="reset">↻ Спочатку</button></header>
  <div class="level-badge" id="levelBadge">Два рівні</div><div class="progress" id="progress"></div><div class="question" id="question"></div>
  <section class="scene" id="scene"><div class="choices" id="choices"></div></section>
  <div class="message" id="message">Спочатку впізнаємо фігури, а потім — їхні кольори 🎨</div><div class="actions"><button class="next" id="next">Почати ▶</button></div>
</main>
<script>
const S=(type,label,correct=false,color='blue')=>({type,label,correct,color});
const levelOne=[
 {question:'Знайди коло',choices:[S('circle','Коло',true,'red'),S('square','Квадрат',false,'blue'),S('triangle','Трикутник',false,'yellow')]},
 {question:'Знайди квадрат',choices:[S('oval','Овал',false,'orange'),S('square','Квадрат',true,'green'),S('rectangle','Прямокутник',false,'purple')]},
 {question:'Знайди трикутник',choices:[S('diamond','Ромб',false,'purple'),S('triangle','Трикутник',true,'yellow'),S('circle','Коло',false,'red')]},
 {question:'Знайди прямокутник',choices:[S('square','Квадрат',false,'blue'),S('rectangle','Прямокутник',true,'orange'),S('oval','Овал',false,'green')]},
 {question:'Знайди овал',choices:[S('circle','Коло',false,'pink'),S('oval','Овал',true,'blue'),S('rectangle','Прямокутник',false,'yellow')]},
 {question:'Знайди ромб',choices:[S('square','Квадрат',false,'green'),S('diamond','Ромб',true,'purple'),S('hexagon','Шестикутник',false,'orange')]},
 {question:'Знайди шестикутник',choices:[S('triangle','Трикутник',false,'yellow'),S('hexagon','Шестикутник',true,'red'),S('diamond','Ромб',false,'blue')]},
 {question:'Ще раз знайди овал',choices:[S('rectangle','Прямокутник',false,'purple'),S('circle','Коло',false,'orange'),S('oval','Овал',true,'green')]},
 {question:'Ще раз знайди ромб',choices:[S('diamond','Ромб',true,'blue'),S('square','Квадрат',false,'pink'),S('hexagon','Шестикутник',false,'yellow')]},
 {question:'Ще раз знайди шестикутник',choices:[S('oval','Овал',false,'red'),S('triangle','Трикутник',false,'green'),S('hexagon','Шестикутник',true,'purple')]}
];
const levelTwo=[
 {question:'Знайди синє коло',choices:[S('circle','Синє коло',true,'blue'),S('square','Синій квадрат',false,'blue'),S('circle','Червоне коло',false,'red')]},
 {question:'Знайди червоний трикутник',choices:[S('triangle','Жовтий трикутник',false,'yellow'),S('triangle','Червоний трикутник',true,'red'),S('diamond','Червоний ромб',false,'red')]},
 {question:'Знайди жовтий квадрат',choices:[S('square','Жовтий квадрат',true,'yellow'),S('circle','Жовте коло',false,'yellow'),S('square','Синій квадрат',false,'blue')]},
 {question:'Знайди зелений прямокутник',choices:[S('rectangle','Помаранчевий прямокутник',false,'orange'),S('square','Зелений квадрат',false,'green'),S('rectangle','Зелений прямокутник',true,'green')]},
 {question:'Знайди помаранчевий овал',choices:[S('oval','Помаранчевий овал',true,'orange'),S('circle','Помаранчеве коло',false,'orange'),S('oval','Рожевий овал',false,'pink')]},
 {question:'Знайди фіолетовий ромб',choices:[S('diamond','Синій ромб',false,'blue'),S('hexagon','Фіолетовий шестикутник',false,'purple'),S('diamond','Фіолетовий ромб',true,'purple')]},
 {question:'Знайди червоний шестикутник',choices:[S('hexagon','Червоний шестикутник',true,'red'),S('diamond','Червоний ромб',false,'red'),S('hexagon','Жовтий шестикутник',false,'yellow')]},
 {question:'Знайди рожевий овал',choices:[S('oval','Синій овал',false,'blue'),S('oval','Рожевий овал',true,'pink'),S('circle','Рожеве коло',false,'pink')]},
 {question:'Знайди синій ромб',choices:[S('diamond','Синій ромб',true,'blue'),S('square','Синій квадрат',false,'blue'),S('diamond','Фіолетовий ромб',false,'purple')]},
 {question:'Знайди жовтий шестикутник',choices:[S('hexagon','Фіолетовий шестикутник',false,'purple'),S('triangle','Жовтий трикутник',false,'yellow'),S('hexagon','Жовтий шестикутник',true,'yellow')]}
];
const correctFeedback=[
 {text:'Так! Молодець! ⭐',audio:'audio/games/common/correct-1.mp3'},{text:'Правильно! Чудова робота! ⭐',audio:'audio/games/common/correct-2.mp3'},{text:'У тебе все вийшло! ⭐',audio:'audio/games/common/correct-3.mp3'},{text:'Супер! Ти все помічаєш! ⭐',audio:'audio/games/common/correct-4.mp3'},{text:'Так тримати! ⭐',audio:'audio/games/common/correct-5.mp3'}
];
const retryFeedback=[
 {text:'Майже! Подивись ще раз 🐾',audio:'audio/games/common/retry-1.mp3'},{text:'Спробуй іще раз — у тебе вийде 🐾',audio:'audio/games/common/retry-2.mp3'},{text:'Не поспішай. Поглянь уважніше 🐾',audio:'audio/games/common/retry-3.mp3'}
];
const auditMode=new URLSearchParams(location.search).get('test')==='1';
const shuffle=list=>{const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
const pick=list=>list[Math.floor(Math.random()*list.length)];
const question=document.getElementById('question'),choices=document.getElementById('choices'),message=document.getElementById('message'),next=document.getElementById('next'),scene=document.getElementById('scene'),progress=document.getElementById('progress'),levelBadge=document.getElementById('levelBadge');
let phase=0,tasks=[],task=0,answered=false,mode='intro',activeVoice=null,currentMusic=null;
const audioCache=new Map();[...correctFeedback,...retryFeedback].forEach(item=>{const audio=new Audio(item.audio);audio.preload='auto';audioCache.set(item.audio,audio)});
function playVoice(path){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0}const voice=audioCache.get(path);if(!voice)return;if(currentMusic)currentMusic.volume=.08;voice.currentTime=0;voice.onended=()=>{if(currentMusic)currentMusic.volume=.20};voice.play().catch(()=>{});activeVoice=voice}
function startMusic(){if(currentMusic)return;currentMusic=new Audio('audio/games/find-for-mimi/music/level-2.mp3');currentMusic.loop=true;currentMusic.volume=.20;currentMusic.play().catch(()=>{})}
function render(){mode='task';answered=false;next.hidden=true;next.textContent='Далі →';levelBadge.textContent=`Рівень ${phase+1} з 2 — ${phase?'Форма і колір':'Впізнай фігуру'}`;question.textContent=tasks[task].question;message.textContent='Мімі: «Дивись уважно!» 🐾';progress.innerHTML=tasks.map((_,i)=>`<span class="dot ${i<task?'done':i===task?'active':''}"></span>`).join('');choices.innerHTML='';const list=auditMode?tasks[task].choices:shuffle(tasks[task].choices);list.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`<i class="geom ${c.type} ${c.color}"></i><small>${c.label}</small>`;b.onclick=()=>answer(b,c.correct);choices.appendChild(b)})}
function answer(button,correct){if(answered)return;if(!correct){button.classList.remove('bad');void button.offsetWidth;button.classList.add('bad');const f=pick(retryFeedback);message.textContent=f.text;playVoice(f.audio);return}answered=true;button.classList.add('good');for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','●'][i%3];s.style.left=(14+Math.random()*68)+'%';s.style.top=(28+Math.random()*48)+'%';scene.appendChild(s);setTimeout(()=>s.remove(),1100)}if(phase===1&&task===tasks.length-1){message.textContent='Обидва рівні пройдено! Чудова робота! 🎉';mode='done';return}const f=pick(correctFeedback);message.textContent=f.text;playVoice(f.audio);next.hidden=false;if(task===tasks.length-1){mode='toBreak';next.textContent='До другого рівня →'}}
function startLevel(number){phase=number;tasks=auditMode?[...(number?levelTwo:levelOne)]:shuffle(number?levelTwo:levelOne);task=0;render()}
function showBreak(){mode='break';levelBadge.textContent='Рівень 1 пройдено!';progress.innerHTML='';question.textContent='Тепер шукаємо фігуру й колір';choices.innerHTML='<div class="level-card"><strong>Другий рівень 🎨</strong><span>Дивись одночасно на форму та колір</span><div class="palette">● ◆ ▲ ⬡</div></div>';message.textContent='Готові до складнішої місії?';next.hidden=false;next.textContent='Почати рівень 2 →'}
next.onclick=()=>{startMusic();if(mode==='intro'){startLevel(0);return}if(mode==='task'){task++;render();return}if(mode==='toBreak'){showBreak();return}if(mode==='break'){startLevel(1)}};
function reset(){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0}phase=0;task=0;mode='intro';levelBadge.textContent=auditMode?'Послідовна перевірка — 20 завдань':'Два рівні по 10 завдань';progress.innerHTML='';question.textContent='Готові шукати фігури?';choices.innerHTML='<div class="level-card"><strong>Знайди фігуру</strong><span>Спочатку форма, потім форма й колір</span><div class="palette">● ■ ▲ ◆ ⬡</div></div>';message.textContent=auditMode?'У режимі перевірки все йде по порядку 🔎':'Мімі вже підготувала перший рівень 🐾';next.hidden=false;next.textContent='Почати ▶'}
document.getElementById('reset').onclick=reset;reset();
</script>
</body>
</html>
