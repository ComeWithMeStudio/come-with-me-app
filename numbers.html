<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6f2ff">
<title>Цифри — Come With Me Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;background:#e6f2ff;color:#49362d;font-family:"Trebuchet MS",system-ui,sans-serif}.shell{width:min(760px,100%);margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.head h1{font-size:clamp(30px,7vw,44px);margin:0}.back{color:inherit;text-decoration:none;border:0;border-radius:999px;padding:11px 15px;background:#fff9e9;font-weight:900;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{min-height:220px;border:3px solid #fff;border-radius:26px;padding:22px 14px;background:#fff9e9;color:inherit;box-shadow:0 8px 24px #34492d20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;cursor:pointer;font:inherit}.icon{font-size:54px}.card strong{font-size:clamp(21px,4vw,29px)}.card small{font-size:14px;font-weight:800;opacity:.75}.note{margin:22px auto 0;padding:13px 16px;border-radius:999px;background:#fff9e9;text-align:center;font-weight:900;line-height:1.45;width:max-content;max-width:96%}
@media(max-width:600px){.head{align-items:flex-start}.grid{grid-template-columns:1fr;gap:12px}.card{min-height:120px;display:grid;grid-template-columns:68px 1fr;grid-template-rows:auto auto;justify-content:stretch;text-align:left;padding:16px 20px}.icon{grid-row:1/3;font-size:42px}.card strong,.card small{justify-self:start}}
</style></head>
<body><main class="shell"><header class="head"><h1>Цифри 🔢</h1><a class="back" href="index.html">← До Мімі</a></header>
<nav class="grid" aria-label="Розділи: Цифри">
<button class="card" type="button" data-kind="Історії"><span class="icon">📖</span><strong>Історії</strong><small>Історії про цифри</small></button>
<button class="card" type="button" data-kind="Пісні"><span class="icon">🎵</span><strong>Пісні</strong><small>Пісні з цифрами</small></button>
<button class="card" type="button" data-kind="Ігри"><span class="icon">🧩</span><strong>Ігри</strong><small>Ігри з цифрами</small></button>
</nav><p class="note" id="note">Обери, що спробуємо ✨</p></main>
<script>const note=document.getElementById('note');document.querySelectorAll('[data-kind]').forEach(card=>card.addEventListener('click',()=>{note.textContent=card.dataset.kind+' цифри додамо сюди, коли будуть готові матеріали ✨'}));</script>
</body></html>
