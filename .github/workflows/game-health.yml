name: Game asset health check

on:
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * *'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - '.github/workflows/game-health.yml'

permissions:
  contents: read

jobs:
  verify-game-assets:
    name: Verify game asset references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check local files referenced by games
        run: python3 tools/check_game_assets.py
      - name: Pixel checks first game structure
        if: always()
        run: python3 tools/check_first_game.py
      - name: Check public game pages on the live website
        if: always()
        run: python3 tools/check_live_routes.py

  browser-smoke:
    name: Open app and linked games in mobile browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Test mobile browser navigation
        run: node tools/browser_smoke.cjs

      - name: Pixel plays the first game locally
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cwm-pixel-server.log 2>&1 &
          sleep 2
          node tools/pixel_play_first_game.cjs

      - name: Pixel plays Find for Mimi (30 questions)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cwm-pixel-second-server.log 2>&1 &
          sleep 2
          node tools/pixel_play_find_for_mimi.cjs

      - name: Pixel plays Colors Workshop basket scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cwm-pixel-colors-server.log 2>&1 &
          sleep 2
          node tools/pixel_play_colors_basket.cjs

      - name: Pixel plays Colors Workshop bouquet scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cwm-pixel-bouquet-server.log 2>&1 &
          sleep 2
          node tools/pixel_play_colors_bouquet.cjs

      - name: Pixel plays Colors Workshop toy box scene
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/cwm-pixel-toys-server.log 2>&1 &
          sleep 2
          node tools/pixel_play_colors_toy_box.cjs

      - name: Pixel tests the pyramid
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pixel-pyramid.log 2>&1 &
          sleep 2
          node tools/pixel_pyramid.cjs

      - name: Pixel decorates Colors Workshop tree
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pixel-tree.log 2>&1 &
          sleep 2
          node tools/pixel_tree.cjs

      - name: Pixel tests Mimi balloon flight
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pixel-balloons.log 2>&1 &
          sleep 2
          node tools/pixel_balloons.cjs

      - name: Pixel tests Colors Workshop ice cream
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pixel-icecream.log 2>&1 &
          sleep 2
          node tools/pixel_icecream.cjs

      - name: Pixel tests Colors Workshop train
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/pixel-train.log 2>&1 &
          sleep 2
          node tools/pixel_train.cjs
