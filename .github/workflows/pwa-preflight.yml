name: PWA preflight (test branch)
on:
  push:
    branches:
      - test/pwa-install-2026-11-04
    paths:
      - manifest.webmanifest
      - index.html
      - service-worker.js
      - icons/icon-192.png
      - icons/icon-512.png
      - scripts/check_pwa.py
      - .github/workflows/pwa-preflight.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate PWA files and icon dimensions
        run: python scripts/check_pwa.py
