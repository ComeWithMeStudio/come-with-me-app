name: Build CWM PWA icons (test branch)
on:
  push:
    branches:
      - test/pwa-install-2026-11-04
    paths:
      - .github/workflows/build-pwa-icons.yml
      - scripts/build_pwa_icons.py
      - icons/cwm-app-icon.svg
      - cwm-logo.png
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow
      - name: Generate icons from original logo
        run: python scripts/build_pwa_icons.py
      - name: Commit generated icons to test branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "PWA: generate approved 192px and 512px logo icons"
            git push
          fi

# Rebuild corrected aspect-ratio icons for PWA device testing.
