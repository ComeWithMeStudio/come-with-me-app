<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#dff4f4">
  <title>Повтори за Мімі</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493f4c;background:linear-gradient(180deg,#dff4f4,#fff1dc)}
    button{font:inherit}.app{width:min(100%,720px);min-height:100vh;margin:auto;padding:14px 12px 34px}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.head h1{margin:0;font-size:clamp(25px,7vw,40px);line-height:1}.back{border:0;border-radius:999px;padding:10px 14px;background:#fffaf0;box-shadow:0 4px 14px #493f4c24;font-weight:900;color:#493f4c;cursor:pointer}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}.level-dot{border:0;border-radius:999px;padding:8px 3px;background:#ffffff8c;color:#675e68;font-weight:900}.level-dot.active{background:#ff9e55;color:#fff}.level-dot.done{background:#82c9b6;color:#fff}.stage{position:relative;overflow:hidden;border-radius:26px;background:linear-gradient(180deg,#7acbe9,#cceef5);box-shadow:0 10px 28px #493f4c24;aspect-ratio:16/10}.stage video,.stage img{display:block;width:100%;height:100%;object-fit:cover}.stage img{object-fit:contain;padding:4%}.stage-badge{position:absolute;left:12px;top:12px;padding:7px 11px;border-radius:999px;background:#fffce9e8;font-size:12px;font-weight:900;box-shadow:0 3px 10px #0002}.stage-status{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);width:max-content;max-width:90%;padding:8px 14px;border-radius:999px;background:#fffdf2ed;text-align:center;font-weight:900;box-shadow:0 3px 12px #0002}.panel{margin-top:13px;padding:15px;border-radius:24px;background:#fffdf2d9;box-shadow:0 8px 24px #493f4c1c;text-align:center}.message{min-height:48px;display:grid;place-items:center;font-size:clamp(17px,4.6vw,22px);font-weight:900;line-height:1.25}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px}.action{min-height:48px;border:0;border-radius:999px;padding:11px 18px;background:#fff;color:#493f4c;font-weight:900;box-shadow:0 4px 13px #493f4c22;cursor:pointer}.action.primary{background:#ff8d4b;color:#fff}.action:disabled{opacity:.5;cursor:default}.sound{position:absolute;right:12px;top:12px;width:42px;height:42px;border:0;border-radius:50%;background:#fffdf2e8;font-size:20px;cursor:pointer}.start-cover{position:absolute;inset:0;z-index:3;display:grid;place-items:center;padding:12px 22px;background:linear-gradient(155deg,#82d4e7,#ffe1a8);text-align:center}.start-cover[hidden]{display:none}.start-card{display:grid;justify-items:center;gap:clamp(5px,1.3vh,11px);max-height:100%}.start-card img{width:auto;height:min(34vh,165px);max-width:48%;padding:0;filter:drop-shadow(0 9px 10px #493f4c2b)}.start-card h2{margin:0;font-size:clamp(28px,7vw,44px);line-height:.95;color:#fff;text-shadow:0 4px 0 #db6e49,0 7px 14px #493f4c35}.start-card p{margin:0;font-weight:900}.start{border:0;border-radius:999px;padding:11px 25px;background:#ff7448;color:#fff;font-size:20px;font-weight:900;box-shadow:0 6px 16px #a9483340;cursor:pointer}.finish-stars{font-size:42px;letter-spacing:8px}.hidden{display:none!important}@media(max-width:420px){.app{padding:10px 8px 26px}.head h1{font-size:25px}.back{padding:8px 10px;font-size:13px}.stage{border-radius:21px;aspect-ratio:4/5}.stage video{object-fit:cover}.start-card img{height:min(29vh,190px);max-width:60%}.start-card h2{font-size:clamp(31px,10vw,44px)}.panel{border-radius:20px;padding:12px}.message{font-size:18px}.action{padding:10px 14px}}
    .stage video{object-fit:contain}
  </style>
</head>
<body>
  <main class="app">
    <header class="head"><h1>Повтори за Мімі</h1><button class="back" id="back">← Усі руханки</button></header>
    <div class="progress" id="progress" aria-label="Рівні гри"></div>
    <section class="stage" aria-live="polite">
      <div class="start-cover" id="startCover"><div class="start-card"><img src="../../../mimi-library/illustrations/mimi-paws-up.webp" alt="Мімі"><h2>Повтори<br>за Мімі</h2><p>Дивись, запам’ятовуй і повторюй!</p><button class="start" id="start">Почати</button></div></div>
      <video id="video" muted playsinline preload="auto"></video>
      <img id="mimiStill" src="../../../mimi-library/illustrations/mimi-standing-front.webp" alt="Мімі чекає" hidden>
      <span class="stage-badge" id="levelBadge">Рівень 1</span>
      <button class="sound" id="sound" aria-label="Вимкнути звук">🔊</button>
      <div class="stage-status" id="stageStatus">Готові?</div>
    </section>
    <section class="panel">
      <div class="message" id="message">Натисни «Почати»</div>
      <div class="actions">
        <button class="action" id="replay" hidden>Показати ще раз</button>
        <button class="action primary" id="next" hidden>Далі</button>
      </div>
    </section>
  </main>
  <audio id="voice" preload="auto"></audio>
  <audio id="music" preload="auto" loop></audio>
  <script>
    const ROOT='../../../mimi-library/blue-background/movement/';
    const MUSIC='../../../../audio/games/find-for-mimi/music/';
    const levels=[
      {intro:'repeat-mimi-02-level-1.mp3',turn:'repeat-mimi-04-your-turn-1.mp3',moves:[
        ['repeat-mimi-03-head-tilts.mp3','Нахиляй голову праворуч і ліворуч','MIMI-MOVE-008-head-tilts-shoulder-to-shoulder-right-left-body-still-front-blue-bg.mp4']
      ]},
      {intro:'repeat-mimi-05-level-2.mp3',turn:'repeat-mimi-08-your-turn-2.mp3',moves:[
        ['repeat-mimi-06-arms-out.mp3','Розведи руки в сторони','MIMI-MOVE-018-arms-out-to-sides-horizontal-wide-hold-then-lower-front-blue-bg.mp4'],
        ['repeat-mimi-07-spin.mp3','Покрутися навколо себе','MIMI-MOVE-006-full-body-spins-multiple-turns-back-visible-tail-swing-front-blue-bg.mp4']
      ]},
      {intro:'repeat-mimi-09-level-3.mp3',turn:'repeat-mimi-13-your-turn-3.mp3',moves:[
        ['repeat-mimi-10-stretch-up.mp3','Потягнися високо вгору','MIMI-MOVE-015-stretch-up-arms-rise-out-to-overhead-hold-front-blue-bg.mp4'],
        ['repeat-mimi-11-two-jumps.mp3','Стрибни два рази','MIMI-MOVE-019-two-jumps-in-place-arms-up-both-feet-airborne-front-blue-bg.mp4'],
        ['repeat-mimi-12-sway.mp3','Погойдуйся з боку в бік','MIMI-DANCE-002-side-to-side-weight-shifts-bouncy-knees-alternating-paw-swings-front-blue-bg.mp4']
      ]},
      {intro:'repeat-mimi-14-level-4.mp3',turn:'repeat-mimi-19-your-turn-4.mp3',moves:[
        ['repeat-mimi-15-knees-and-kicks.mp3','Коліна й махи ніжками','MIMI-DANCE-001-alternating-knee-lifts-side-kicks-bouncy-paw-moves-front-blue-bg.mp4'],
        ['repeat-mimi-16-clap.mp3','Поплескай у долоні','MIMI-MOVE-013-clapping-paws-rhythmic-multiple-claps-front-standing-blue-bg.mp4'],
        ['repeat-mimi-17-side-steps.mp3','Крокуй з боку в бік','MIMI-DANCE-003-alternating-one-leg-steps-side-to-side-arm-swings-tail-sway-front-blue-bg.mp4'],
        ['repeat-mimi-18-torso-turns.mp3','Повертай тулуб з боку в бік','MIMI-DANCE-005-side-to-side-torso-turns-paws-forward-bouncy-steps-tail-swing-blue-bg.mp4']
      ]}
    ];
    const video=document.getElementById('video'),still=document.getElementById('mimiStill'),voice=document.getElementById('voice'),music=document.getElementById('music'),message=document.getElementById('message'),status=document.getElementById('stageStatus'),badge=document.getElementById('levelBadge'),replay=document.getElementById('replay'),next=document.getElementById('next'),progress=document.getElementById('progress'),sound=document.getElementById('sound');
    let level=0,running=false,muted=false;
    const waitEnded=media=>new Promise(resolve=>{const done=()=>{media.removeEventListener('ended',done);resolve()};media.addEventListener('ended',done,{once:true});media.play().catch(resolve)});
    function renderProgress(){progress.innerHTML=levels.map((_,i)=>`<button class="level-dot ${i===level?'active':''} ${i<level?'done':''}" disabled>${i+1}</button>`).join('');badge.textContent=`Рівень ${level+1}`}
    function showVideo(){still.hidden=true;video.hidden=false}
    function showStill(){video.pause();video.hidden=true;still.hidden=false}
    async function say(file,text){message.textContent=text;status.textContent=text;music.volume=muted?0:.08;voice.src='audio/'+file;voice.muted=muted;await waitEnded(voice);music.volume=muted?0:.24}
    async function playMove(move){await say(move[0],move[1]);showVideo();status.textContent='Дивись уважно';video.src=ROOT+move[2];video.currentTime=0;await waitEnded(video)}
    async function demonstrate(){if(running)return;running=true;replay.hidden=true;next.hidden=true;renderProgress();music.src=MUSIC+`level-${level+1}.mp3`;music.volume=muted?0:.24;music.muted=muted;music.play().catch(()=>{});await say(levels[level].intro,`Рівень ${level+1}`);for(const move of levels[level].moves)await playMove(move);showStill();await say(levels[level].turn,'Тепер ти!');status.textContent='Тепер повторюй ти!';message.textContent='Повтори рухи в тому самому порядку';replay.hidden=false;next.hidden=false;next.textContent=level===levels.length-1?'Завершити':'Далі';running=false}
    async function begin(){document.getElementById('startCover').hidden=true;await say('repeat-mimi-01-intro.mp3','Слухай Мімі');demonstrate()}
    async function finish(){running=true;replay.hidden=true;next.hidden=true;music.volume=muted?0:.08;showStill();await say('repeat-mimi-20-finish.mp3','У тебе вийшло!');music.pause();status.innerHTML='<span class="finish-stars">⭐️⭐️⭐️</span>';message.textContent='Усі чотири рівні пройдено!';next.hidden=false;next.textContent='Зіграти ще раз';next.onclick=()=>location.reload();running=false}
    document.getElementById('start').addEventListener('click',begin);replay.addEventListener('click',demonstrate);next.addEventListener('click',()=>{if(running)return;if(level===levels.length-1){finish();return}level++;demonstrate()});sound.addEventListener('click',()=>{muted=!muted;voice.muted=muted;music.muted=muted;sound.textContent=muted?'🔇':'🔊';sound.setAttribute('aria-label',muted?'Увімкнути звук':'Вимкнути звук')});document.getElementById('back').addEventListener('click',()=>{if(history.length>1)history.back();else location.href='../../../../index.html'});renderProgress();showStill();
  </script>
</body>
</html>
