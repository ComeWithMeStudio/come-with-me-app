<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bce58d">
<title>Комахи — Come With Me Studio</title>
<style>
:root{color-scheme:only light;--ink:#283c2e;--green:#448b45;--cream:#fff9e9}*{box-sizing:border-box}body{margin:0;background:#bce58d;color:var(--ink);font-family:"Trebuchet MS",system-ui,sans-serif}.app{width:min(100%,800px);min-height:100dvh;margin:auto;padding:12px 14px 24px;background:#ebf5dc}.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.btn{border:0;border-radius:999px;background:var(--cream);color:var(--ink);font:inherit;font-weight:900;padding:10px 15px;box-shadow:0 3px 10px #243c2520;cursor:pointer}.top h1{font-size:clamp(20px,5vw,32px);text-align:center;margin:6px 0}.progress{display:flex;justify-content:center;gap:6px;margin:10px 0}.dot{width:10px;height:10px;border-radius:100%;background:#c8d4bd}.dot.done{background:#51a75b}.dot.current{background:#f0ad32;transform:scale(1.25)}.stage{position:relative;min-height:68vh;border-radius:30px;overflow:hidden;background:#9bd76b url("assets/meadow.webp") center/cover no-repeat;box-shadow:0 8px 24px #283c2e25}.shade{position:absolute;inset:0;background:linear-gradient(180deg,#fff4 0%,transparent 38%,#203a2222)}.bar{position:absolute;z-index:2;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:8px 13px;border-radius:999px;background:#fff9e9ed;font-weight:900;white-space:nowrap}.bar img{height:35px;width:35px;object-fit:contain}.question{position:relative;z-index:2;margin:64px 12px 5px;text-align:center;font-size:clamp(21px,5vw,31px);font-weight:1000;text-shadow:0 1px #fff}.choices{position:relative;z-index:2;min-height:42vh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:clamp(8px,2.5vw,20px);padding:12px 10px 64px}.choice{width:clamp(105px,27vw,170px);height:clamp(125px,31vw,205px);border:3px solid #fff;border-radius:26px;background:#fff9e9e8;box-shadow:0 7px 16px #273e2733;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;transition:transform .2s,outline .2s}.choice img{width:85%;height:75%;object-fit:contain;filter:drop-shadow(0 5px 4px #293d2835)}.choice span{font-size:clamp(13px,3vw,17px);font-weight:900}.choice:active{transform:scale(.95)}.choice.correct{outline:5px solid #42ad50;transform:scale(1.06)}.choice.wrong{animation:shake .3s}.mimi-tip{position:absolute;z-index:2;bottom:12px;left:50%;transform:translateX(-50%);max-width:92%;padding:10px 16px;border-radius:18px;background:#fff9e9ed;text-align:center;font-weight:900;box-shadow:0 3px 12px #273e2730}.footer{min-height:68px;display:flex;align-items:center;justify-content:center;gap:10px;padding:9px 0;text-align:center}.footer p{margin:0;font-weight:900}.next{background:#f3c84f}.welcome{position:absolute;z-index:4;inset:0;display:grid;place-items:center;padding:20px;background:#fff8}.welcome-card{width:min(94%,500px);text-align:center;padding:25px 20px;border-radius:28px;background:#fff9e9ef;box-shadow:0 8px 24px #243c2530}.welcome-card h2{font-size:clamp(28px,8vw,46px);margin:0 0 8px}.welcome-card p{font-size:18px;line-height:1.45}.start{background:#54ae58;color:#fff;font-size:18px;padding:14px 24px}.fact{font-size:clamp(16px,4vw,22px)}.free-grid{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:15px}.free-grid button{border:2px solid white;border-radius:18px;background:#fff9e9e8;padding:5px;min-width:0}.free-grid img{width:100%;height:100px;object-fit:contain}.free-grid span{display:block;font-weight:900;font-size:13px}@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}@media(max-width:520px){.app{padding:8px 9px 16px}.stage{min-height:72vh;border-radius:24px}.choices{min-height:50vh;padding-bottom:62px}.choice{width:calc((100vw - 48px)/3);height:clamp(115px,31vw,160px);border-radius:20px}.choice img{height:72%}.free-grid{grid-template-columns:repeat(3,1fr)}.free-grid img{height:83px}.top .btn{font-size:13px;padding:9px 11px}}
</style>
</head>
<body><main class="app">
<header class="top"><a class="btn" href="../../../../../nature-games.html">← Природа</a><h1>Комахи 🐞</h1><button class="btn" id="restart">↻ Спочатку</button></header>
<div class="progress" id="progress" aria-label="Прогрес гри"></div>
<section class="stage" id="stage"><div class="shade"></div><div class="bar"><img id="tool" hidden><span id="levelLabel">Галявина Мімі</span></div><h2 class="question" id="question">Знайомимося з мешканцями галявини!</h2><div class="choices" id="choices"></div><div class="mimi-tip" id="tip">Торкнися істоти, щоб обрати 🐾</div>
<div class="welcome" id="welcome"><div class="welcome-card"><h2>Комахи на галявині</h2><p>Знайомся з маленькими мешканцями, досліджуй їх і грай разом із Мімі.</p><button class="btn start" id="start">Почати пригоду</button></div></div>
</section><footer class="footer"><p id="feedback">24 завдання · 4 рівні</p><button class="btn next" id="next" hidden>Далі →</button></footer>
</main>
<script>
const ROOT="/",A="assets/",V="audio/voice/",COMMON="/audio/games/common/";
const names={ant:"Мурашка",bee:"Бджілка",beetle:"Жук",butterfly:"Метелик",dragonfly:"Бабка",grasshopper:"Коник",ladybug:"Сонечко",snail:"Равлик",spider:"Павук",worm:"Черв'ячок"};
const bugFiles=Object.keys(names),nonInsects=new Set(["snail","spider","worm"]);
const q=(prompt,correct,options,extra={})=>({prompt,correct,options,...extra});
const tasks=[
q("03_find_butterfly","butterfly",["butterfly","beetle","ladybug"]),q("04_catch_ladybug","ladybug",["ladybug","bee","butterfly"]),q("05_find_bee","bee",["bee","beetle","grasshopper"]),q("06_find_beetle","beetle",["beetle","ladybug","ant"]),q("07_find_ant","ant",["ant","grasshopper","bee"]),q("08_find_dragonfly","dragonfly",["dragonfly","butterfly","ladybug"]),q("09_catch_grasshopper","grasshopper",["grasshopper","beetle","ant"]),
q("11_find_spider","spider",["spider","snail","butterfly"],{fact:"12_spider_fact",level:2}),q("13_find_ladybug","ladybug",["ladybug","ant","bee"],{fact:"14_ladybug_fact",level:2}),q("15_find_snail","snail",["snail","worm","spider"],{fact:"16_snail_fact",level:2}),q("03_find_butterfly","butterfly",["butterfly","bee","dragonfly"],{fact:"18_butterfly_fact",level:2}),q("19_find_worm","worm",["worm","snail","ant"],{fact:"20_worm_fact",level:2}),q("21_find_bee_2","bee",["bee","ladybug","butterfly"],{fact:"22_bee_fact",level:2}),
q("25_who_catch","butterfly",["butterfly","snail"],{level:3}),q("25_who_catch","bee",["bee","spider"],{level:3}),q("25_who_catch","ladybug",["ladybug","worm"],{level:3}),q("26_find_insect","ant",["ant","snail","spider"],{level:3}),q("26_find_insect","butterfly",["spider","butterfly","worm"],{level:3}),q("26_find_insect","bee",["snail","bee","spider"],{level:3}),
q("32_find_not_insect","spider",["butterfly","bee","spider"],{level:4,fact:"34_correct_spider"}),q("32_find_not_insect","snail",["beetle","ladybug","snail"],{level:4,fact:"35_correct_snail"}),q("32_find_not_insect","worm",["ant","dragonfly","worm"],{level:4,fact:"36_correct_worm"}),q("32_find_not_insect","spider",["bee","beetle","butterfly","spider"],{level:4,fact:"34_correct_spider"}),q("33_final_question","snail",["ladybug","grasshopper","ant","snail"],{level:4,fact:"35_correct_snail"})
];
const levelFor=i=>i<7?1:i<13?2:i<19?3:4;
const title={1:"Рівень 1 · На галявині",2:"Рівень 2 · Познайомимося ближче",3:"Рівень 3 · Кого ловимо?",4:"Рівень 4 · Хто тут зайвий?"};
const startVoice={1:"02_level_1_start",2:"10_level_2_start",3:"24_level_3_start",4:"31_level_4_start"};
const phrase={"01_intro":"Привіт! Сьогодні ми вирушаємо на галявину. Тут живе стільки цікавих маленьких істот! Ходімо подивимося!","02_level_1_start":"Полюємо на комах! Тільки обережно. Потім усіх відпустимо.","10_level_2_start":"А тепер познайомимося з мешканцями галявини ближче!","24_level_3_start":"У сачок ловимо тільки комах. Готовий? Шукай уважно!","31_level_4_start":"А тепер найскладніше. Дивись уважно!","23_six_legs_rule":"Тепер ми знаємо секрет: у комах шість лапок!","38_finish":"Знайшов! Тепер ти знаєш, хто тут комаха! Ходімо подивимося, що вони роблять!","39_free_play":"Торкайся мешканців галявини й дивись, що вони вміють!"};
let index=-1,locked=true,free=false,player=null;
const stage=document.getElementById("stage"),question=document.getElementById("question"),choices=document.getElementById("choices"),tip=document.getElementById("tip"),feedback=document.getElementById("feedback"),next=document.getElementById("next"),welcome=document.getElementById("welcome"),tool=document.getElementById("tool"),label=document.getElementById("levelLabel"),progress=document.getElementById("progress");
function play(id){if(!id)return Promise.resolve();if(player){player.pause();player=null}return new Promise(resolve=>{player=new Audio(V+id+".mp3");player.onended=()=>resolve();player.onerror=()=>resolve();player.play().catch(()=>resolve())})}
function common(kind){const n=kind==="correct"?1+Math.floor(Math.random()*5):1+Math.floor(Math.random()*3);return new Audio(COMMON+kind+"-"+n+".mp3").play().catch(()=>{})}
function renderProgress(){progress.innerHTML=tasks.map((_,i)=>`<i class="dot ${i<index?"done":i===index?"current":""}"></i>`).join("")}
function iconLevel(l){tool.hidden=true;tool.removeAttribute("src");if(l===2||l===4){tool.src=A+"magnifying-glass.webp";tool.hidden=false}if(l===1||l===3){tool.src=A+"net.webp";tool.hidden=false}label.textContent=title[l]}
function showTask(){if(index>=tasks.length){finish();return}const item=tasks[index],lev=levelFor(index);locked=false;next.hidden=true;renderProgress();iconLevel(lev);question.textContent=phrase[item.prompt]||"Торкнися правильної відповіді!";tip.textContent=lev===1?"Натисни на потрібну істоту — Мімі відпустить її після привітання 🐾":lev===2?"Роздивись уважно під лупою 🔎":lev===3?"У сачок ловимо тільки комах 🥅":"Знайди того, хто не комаха 🔎";feedback.textContent=`Завдання ${index+1} з 24`;choices.innerHTML="";const shuffled=[...item.options].sort(()=>Math.random()-.5);for(const species of shuffled){const b=document.createElement("button");b.className="choice";b.innerHTML=`<img src="${A+species}.webp" alt="${names[species]}"><span>${names[species]}</span>`;b.onclick=()=>choose(b,species,item,lev);choices.append(b)}play(item.prompt)}
async function choose(button,species,item,lev){if(locked)return;if(species!==item.correct){button.classList.add("wrong");locked=true;if(lev===3&&nonInsects.has(species)){play(species==="snail"?"27_wrong_snail":species==="spider"?"28_wrong_spider":"29_wrong_worm").then(()=>locked=false)}else if(lev===4&& !nonInsects.has(species)){play("37_wrong_insect").then(()=>locked=false)}else common("retry").finally(()=>locked=false);return}
locked=true;button.classList.add("correct");choices.querySelectorAll("button").forEach(b=>{if(b!==button)b.disabled=true});if(item.fact){await play(item.fact)}else await common("correct");feedback.textContent=lev===2?"Чудове спостереження! 🐞":"Молодець! Так і є! ✨";next.hidden=false;next.textContent=index===tasks.length-1?"На галявину!":"Далі →"}
async function advance(){if(index===12)await play("23_six_legs_rule");index++;if(index>=tasks.length){finish();return}const lev=levelFor(index);if(index===7||index===13||index===19)await play(startVoice[lev]);showTask()}
async function finish(){locked=true;progress.innerHTML=tasks.map(()=>'<i class="dot done"></i>').join("");question.textContent="Галявина відкрита!";iconLevel(1);tip.textContent=phrase["38_finish"];choices.innerHTML="";feedback.textContent="Тепер можна гратися з мешканцями галявини 🦋";next.hidden=true;await play("38_finish");await play("39_free_play");free=true;choices.classList.add("free-grid");for(const id of bugFiles){const b=document.createElement("button");b.innerHTML=`<img src="${A+id}.webp" alt="${names[id]}"><span>${names[id]}</span>`;b.onclick=()=>{b.animate([{transform:"scale(1)"},{transform:"scale(1.16) rotate(-5deg)"},{transform:"scale(1)"}],{duration:500});tip.textContent=names[id]+" вітається з тобою! 🐾"};choices.append(b)}}
document.getElementById("start").onclick=async()=>{welcome.hidden=true;document.getElementById("start").disabled=true;await play("01_intro");await play("02_level_1_start");index=0;showTask()};next.onclick=advance;document.getElementById("restart").onclick=()=>location.reload();renderProgress();
</script></body></html>
