<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мама поспішає до лошати</title><style>
:root{font-family:system-ui,sans-serif;color:#254a39}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#a9e5fc,#e3f8fc 55%,#b8e9a1 55%);min-height:100dvh}.wrap{max-width:900px;margin:auto;padding:14px}header{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(20px,4vw,30px)}button{font:inherit;cursor:pointer;border:0;border-radius:18px;padding:12px 18px;background:#fff4b7;color:#345}.scene{position:relative;overflow:hidden;height:min(54vh,420px);min-height:300px;border-radius:28px;background:linear-gradient(#9adcfb 0 62%,#8fd17d 62%);box-shadow:0 8px 25px #3453}.scene:after{content:"";position:absolute;bottom:0;left:0;right:0;height:15%;background:#d9ba83}.animal{position:absolute;bottom:14%;width:clamp(115px,27%,200px);object-fit:contain;filter:drop-shadow(0 8px 5px #3245);transition:left .55s ease,bottom .35s ease}.mare{left:8%;z-index:3}.foal{right:5%;width:24%;max-width:150px}.obstacle{position:absolute;bottom:14%;left:59%;font-size:clamp(65px,13vw,100px);transition:transform .5s;z-index:2}.speech{margin:15px 0;font-size:clamp(18px,3vw,25px);font-weight:700;text-align:center;min-height:56px}.actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.actions button{background:#ffdc70;font-weight:700;min-width:130px}.actions button:disabled{opacity:.5}.progress{text-align:center;font-weight:700;margin:8px}.hidden{display:none}.jump{animation:hop .7s ease}@keyframes hop{50%{bottom:43%}}@media(prefers-reduced-motion:reduce){.jump{animation:none}.animal{transition:none}}</style></head><body><main class="wrap"><header><a href="../">← Природа</a><h1>Мама поспішає до лошати</h1><button id="restart">↻ Спочатку</button></header><div class="progress" id="progress"></div><section class="scene" aria-label="Кобила прямує до лошати"><img class="animal mare" id="mare" src="../../../../pryroda/assets/farm/mare.webp" alt="Кобила"><div class="obstacle" id="obstacle" aria-hidden="true">🌳</div><img class="animal foal" src="../../../../pryroda/assets/farm/foal-caramel-trotting.webp" alt="Лоша"></section><p class="speech" id="speech" aria-live="polite"></p><div class="actions" id="actions"><button id="jump">Перестрибнути</button><button id="around">Обійти</button><button id="next" class="hidden">Далі →</button></div></main><script>
const stages=[{icon:"🌳",name:"дерево",hint:"Попереду дерево! Як допоможемо мамі пройти?" ,correct:"around"},{icon:"🪨",name:"каміння",hint:"На стежці каміння. Перестрибнемо?",correct:"jump"},{icon:"💦",name:"струмок",hint:"Перед нами струмок. Як його подолати?",correct:"jump"},{icon:"🌿",name:"кущі",hint:"Попереду густі кущі. Обійдемо їх?",correct:"around"}];
let step=0,busy=false;const $=id=>document.getElementById(id),mare=$("mare"),obstacle=$("obstacle"),speech=$("speech");
function show(){busy=false;mare.style.left="8%";mare.classList.remove("jump");$("progress").textContent="Пригода "+Math.min(step+1,stages.length)+" із "+stages.length;if(step>=stages.length){obstacle.textContent="❤️";obstacle.style.transform="scale(0)";mare.style.left="65%";speech.textContent="Ура! Мама знайшла своє лошатко!";$("jump").hidden=true;$("around").hidden=true;$("next").hidden=true;return}obstacle.style.transform="";obstacle.textContent=stages[step].icon;speech.textContent=stages[step].hint;$("jump").hidden=false;$("around").hidden=false;$("next").hidden=true}
function act(choice){if(busy||step>=stages.length)return;if(choice!==stages[step].correct){speech.textContent="Спробуй інший шлях. У тебе вийде!";return}busy=true;speech.textContent=choice==="jump"?"Чудовий стрибок!":"Молодець, знайшли дорогу!";if(choice==="jump")mare.classList.add("jump");mare.style.left="64%";setTimeout(()=>{$("jump").hidden=true;$("around").hidden=true;$("next").hidden=false;},750)}
$("jump").onclick=()=>act("jump");$("around").onclick=()=>act("around");$("next").onclick=()=>{step++;show()};$("restart").onclick=()=>{step=0;show()};show();
</script></body></html>
