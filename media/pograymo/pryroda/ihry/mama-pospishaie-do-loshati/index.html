<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мама поспішає до лошати — Come With Me Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#235345;background:linear-gradient(#b9eaff,#e8fbff 58%,#c5edb0 58%);min-height:100dvh}.wrap{max-width:1000px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(21px,3.5vw,32px);margin:8px 0;text-align:center}button{border:0;border-radius:18px;background:#ffdf75;color:#294a40;font:700 18px system-ui;padding:13px 18px;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.5;cursor:default}a{color:#165e90}.progress{text-align:center;font-weight:700;margin:7px}.track{height:10px;background:#ffffffaa;border-radius:20px;overflow:hidden;max-width:600px;margin:6px auto 12px}.track>div{height:100%;width:0;background:#5eaf6d;transition:width .5s}.scene{position:relative;overflow:hidden;height:clamp(330px,55vh,490px);border-radius:28px;background:linear-gradient(#a4e1ff 0 60%,#9ed58c 60% 83%,#d9ba86 83%);box-shadow:0 9px 25px #2354}.sun{position:absolute;right:8%;top:8%;width:70px;height:70px;border-radius:50%;background:#fff1a0;box-shadow:0 0 45px #fff7a5}.hill{position:absolute;bottom:27%;width:80%;height:35%;background:#85c77b;border-radius:50% 50% 0 0;opacity:.7}.hill.one{left:-30%}.hill.two{right:-25%;background:#74c47d}.landscape{position:absolute;inset:0;pointer-events:none}.tree{position:absolute;bottom:18%;height:49%;width:23%;object-fit:contain;filter:drop-shadow(0 6px 3px #3563)}.tree.t1{left:5%}.tree.t2{right:4%;height:43%}.tree.t3{left:42%;height:30%;bottom:28%;opacity:.65}.moving .tree{animation:trees 1.6s linear infinite}@keyframes trees{from{transform:translateX(12px)}to{transform:translateX(-18px)}}.mare{position:absolute;bottom:16%;left:13%;height:47%;max-width:43%;object-fit:contain;z-index:4;filter:drop-shadow(0 8px 5px #3454);transition:left 1.1s ease,bottom .35s ease}.mare.running{animation:run .48s ease-in-out infinite alternate}@keyframes run{to{transform:translateY(-13px) rotate(-1deg)}}.mare.jump{animation:jump 1.25s ease-in-out}@keyframes jump{45%{transform:translate(75px,-100px) rotate(-5deg)}80%{transform:translateX(120px)}}.mare.around{animation:around 1.4s ease-in-out}@keyframes around{40%{transform:translate(70px,-35px) scale(.87)}85%{transform:translateX(120px)}}.obstacle{position:absolute;left:62%;bottom:17%;z-index:3;display:none;align-items:end;justify-content:center;font-size:clamp(66px,12vw,115px);width:25%;height:35%;filter:drop-shadow(0 5px 2px #3453)}.obstacle.show{display:flex}.foal{position:absolute;right:12%;bottom:16%;height:33%;max-width:30%;object-fit:contain;display:none;filter:drop-shadow(0 7px 4px #3454)}.foal.show{display:block;animation:appear 1s ease-out}@keyframes appear{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}.message{font-weight:700;text-align:center;font-size:clamp(18px,2.6vw,24px);min-height:62px;margin:16px 5px 8px}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:8px 0 20px}.actions button{min-width:150px}.muted{font-size:13px;text-align:center;opacity:.75}.hidden{display:none!important}@media(max-width:560px){.tree{height:38%;width:31%}.tree.t3{height:24%}.mare{height:41%;left:6%}.obstacle{left:58%}.foal{right:4%}.scene{height:370px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body><main class="wrap"><header><a href="../../">← Природа</a><h1>🐴 Мама поспішає до лошати</h1><button id="restart">↻ Спочатку</button></header>
<div class="progress" id="progress">Початок пригоди</div><div class="track"><div id="bar"></div></div>
<section class="scene" id="scene" aria-label="Пригода кобили в саду"><div class="sun"></div><div class="hill one"></div><div class="hill two"></div><div class="landscape" id="landscape">
<img class="tree t1" src="../../../assets/illustrations/farm_scene/apple-tree.webp" alt="">
<img class="tree t2" src="../../../assets/illustrations/farm_scene/pear-tree.webp" alt="">
<img class="tree t3" src="../../../assets/illustrations/farm_scene/apple-tree.webp" alt="">
</div><img class="mare" id="mare" src="../../assets/farm/mare.webp" alt="Мама-кобила">
<div class="obstacle" id="obstacle" aria-hidden="true"></div><img class="foal" id="foal" src="../../assets/farm/foal-caramel-trotting.webp" alt="Лошатко"></section>
<p class="message" id="message" aria-live="polite"></p><div class="actions" id="actions"></div><p class="muted">Тестова версія гри • без озвучення</p></main>
<script>
const steps=[
{icon:'🪵',name:'повалене дерево',correct:'jump',say:'Ой! На стежці лежить дерево. Допоможи мамі перестрибнути!'},
{icon:'🪨',name:'великі камені',correct:'around',say:'Попереду великі камені. Краще обійти їх!'},
{icon:'💧',name:'струмок',correct:'jump',say:'Дорогу перетинає струмок. Перестрибнемо!'},
{icon:'🌳',name:'густе дерево',correct:'around',say:'Дерево перекрило дорогу. Знайдемо шлях навколо!'},
{icon:'🪵',name:'колода',correct:'jump',say:'Ще одна колода! Мама може перестрибнути.'},
{icon:'🪨',name:'каміння',correct:'around',say:'Обережно, каміння! Обійдемо його.'}
];
const $=id=>document.getElementById(id),mare=$('mare'),obstacle=$('obstacle'),foal=$('foal'),land=$('landscape'),actions=$('actions'),msg=$('message');
let index=0,phase='intro',timer=null;
function clear(){if(timer)clearTimeout(timer);timer=null;mare.className='mare';land.classList.remove('moving');obstacle.classList.remove('show');foal.classList.remove('show');mare.style.left='';}
function buttons(items){actions.innerHTML='';for(const [label,fn] of items){let b=document.createElement('button');b.textContent=label;b.addEventListener('click',fn);actions.append(b)}}
function setProgress(){ $('progress').textContent=phase==='final'?'Мама знайшла лошатко!':phase==='intro'?'Початок пригоди':'Перешкода '+(index+1)+' із '+steps.length;$('bar').style.width=(phase==='final'?100:index/steps.length*100)+'%';}
function start(){clear();index=0;phase='intro';setProgress();msg.textContent='Маленьке лошатко чекає на маму далеко за садом. Допоможемо їй дістатися!';buttons([['🐎 Рушаймо!',run]])}
function run(){clear();phase='run';setProgress();msg.textContent='Мама біжить стежинкою. Дивись, що буде попереду!';buttons([]);mare.classList.add('running');land.classList.add('moving');timer=setTimeout(showObstacle,2400)}
function showObstacle(){clear();phase='challenge';setProgress();let s=steps[index];obstacle.textContent=s.icon;obstacle.classList.add('show');msg.textContent=s.say;buttons([['↗ Перестрибнути',()=>choose('jump')],['↪ Обійти',()=>choose('around')]])}
function choose(action){let s=steps[index];if(action!==s.correct){msg.textContent='Спробуймо інакше! '+(s.correct==='jump'?'Тут краще перестрибнути.':'Тут безпечніше обійти.');return}phase='move';buttons([]);msg.textContent='Чудово! Мама долає перешкоду!';mare.classList.add(action);timer=setTimeout(()=>{mare.className='mare';obstacle.classList.remove('show');index++;if(index>=steps.length)finish();else run()},1550)}
function finish(){clear();phase='final';setProgress();foal.classList.add('show');msg.textContent='Ура! Мама знайшла своє лошатко! 💛';mare.style.left='40%';buttons([['↻ Зіграти ще раз',start]])}
$('restart').addEventListener('click',start);start();
</script></body></html>
