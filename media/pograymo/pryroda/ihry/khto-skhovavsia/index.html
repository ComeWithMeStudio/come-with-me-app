<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e6f2d9"><title>Хто сховався? — Come With Me Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e6f2d9;color:#344a37;font-family:"Trebuchet MS",system-ui,sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:0}button:focus-visible,a:focus-visible{outline:4px solid #635cb6;outline-offset:4px}.shell{max-width:1100px;margin:auto;padding:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill{padding:11px 16px;border-radius:30px;background:#fffbea;color:inherit;text-decoration:none;font-weight:bold}.top h1{font-size:clamp(20px,4vw,32px);margin:0}.intro{text-align:center;margin:16px auto;max-width:680px;line-height:1.5}.scene{position:relative;isolation:isolate;height:clamp(360px,62vh,620px);border:4px solid #fffbed;border-radius:32px;overflow:hidden;background:linear-gradient(#c5eaf0 0%,#e8f4d1 47%,#c3dc91 48%,#89b86c 100%);box-shadow:0 12px 35px #314b351a}.sun{position:absolute;right:10%;top:6%;width:66px;height:66px;border-radius:50%;background:#ffe7a0;box-shadow:0 0 50px #fff5c7}.cloud{position:absolute;top:13%;left:16%;width:120px;height:28px;background:#fffdf2;border-radius:100%;box-shadow:28px -13px 0 1px #fffdf2}.hill{position:absolute;left:-20%;top:38%;width:130%;height:40%;border-radius:50%;background:#accd88;transform:rotate(-5deg)}.path{position:absolute;bottom:-20%;left:26%;width:47%;height:65%;border-radius:50%;background:#ead9ad;transform:rotate(-15deg)}.guide{position:absolute;left:2%;bottom:3%;width:clamp(85px,19%,180px);height:38%;object-fit:contain;z-index:5;filter:drop-shadow(0 5px 3px #45643a30)}.spots{position:absolute;inset:0}.spot{position:absolute;bottom:27%;width:27%;height:46%;background:transparent;padding:0;color:#344a37}.spot:nth-child(1){left:9%}.spot:nth-child(2){left:39%;bottom:31%}.spot:nth-child(3){left:69%;bottom:24%}.cover{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:2;filter:drop-shadow(0 7px 3px #385a3330);transition:transform .6s,opacity .6s}.hidden-animal{position:absolute;inset:16% 2% 6%;width:96%;height:78%;object-fit:contain;z-index:1;transition:transform .7s}.spot.revealed .cover{transform:translateY(55%) scale(.8);opacity:0;pointer-events:none}.spot.revealed .hidden-animal{transform:translateY(-8%)}.label{position:absolute;bottom:-33px;left:50%;transform:translateX(-50%);background:#fffbeaef;border-radius:20px;padding:7px 12px;white-space:nowrap;font-size:clamp(12px,2.6vw,17px);font-weight:bold;z-index:3}.peek .hidden-animal{transform:translateY(-28%)}.wiggle{animation:wiggle .55s}.surprise{position:absolute;font-size:clamp(28px,5vw,50px);left:35%;top:5%;z-index:4;animation:flutter 1.5s forwards;pointer-events:none}.friends{position:absolute;bottom:0;left:23%;right:2%;height:22%;display:flex;justify-content:center;align-items:end;gap:2%}.friends img{width:17%;height:100%;object-fit:contain;animation:arrive .65s both;filter:drop-shadow(0 4px 2px #385a3330)}.panel{background:#fffbea;border-radius:24px;padding:17px;margin-top:14px;text-align:center}.hint{font-size:clamp(18px,4vw,25px);margin:0 0 12px;min-height:2.5em;display:grid;place-items:center;line-height:1.4}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.action{background:#638a61;color:white;border-radius:24px;padding:12px 20px;font-weight:bold}.secondary{background:#e8e5f4;color:#5c517d}.progress{letter-spacing:7px;color:#718d5c;min-height:25px;margin-bottom:6px}.status{font-size:14px;color:#667762;margin:12px 0 0}button:disabled{cursor:default}.spot:disabled{opacity:1}[hidden]{display:none!important}@keyframes wiggle{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}@keyframes flutter{to{transform:translate(25px,-95px) rotate(15deg);opacity:0}}@keyframes arrive{from{opacity:0;transform:translateY(25px)}to{opacity:1;transform:translateY(0)}}@media(max-width:520px){.shell{padding:9px}.top .pill{font-size:13px;padding:10px}.scene{height:49vh;min-height:330px;border-radius:25px}.intro{font-size:14px;margin:10px 4px}.spot{width:29%;height:40%}.spot:nth-child(1){left:5%}.spot:nth-child(2){left:36%}.spot:nth-child(3){left:68%}.guide{left:0;bottom:0}.panel{padding:13px}.label{padding:6px 8px}.hint{min-height:3em}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

/* Mimi uses the original animated transparent artwork from Shape Workshop. */
.guide{left:-2%;bottom:0;width:32%;max-width:300px;height:49%;object-position:center bottom;pointer-events:none}
.spot.mimi-round .hidden-animal{inset:-8% -17% 0;width:134%;height:108%}
.friends img.mimi-friend{width:24%;height:145%;object-position:center bottom;flex-shrink:0}
.friends button.mimi-friend-button{width:23%!important;overflow:visible}
.friends button.mimi-friend-button img.mimi-friend{width:100%;height:150%;max-width:none}
@media(max-width:520px){.guide{left:-3%;bottom:0;width:33%;height:45%}}

/* Collected friends sit above every hiding-place label. */
.friends{z-index:8;pointer-events:none}
.friends button{pointer-events:auto}
.spot.revealed{z-index:6}
.spot.revealed .hidden-animal{z-index:5}
.friends button.mimi-friend-button{position:absolute;left:77%;bottom:78%;width:23%!important;height:100%!important;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}
.friends button.mimi-friend-button img.mimi-friend{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom}

.friends img.kitten-friend{transform:scale(1.15);transform-origin:center bottom}
</style></head>
<body><main class="shell"><header class="top"><a class="pill" href="../../../../../nature-games.html">← Природа</a><h1>Хто сховався? 🌿</h1><button class="pill" id="sound" aria-pressed="false" aria-label="Увімкнути озвучення">🔇</button></header><p class="intro" id="intro">У саду хтось сховався! Торкайся схованок і шукай друзів разом із Мімі.</p>
<section class="scene" aria-label="Сад зі схованками"><div class="sun"></div><div class="cloud"></div><div class="hill"></div><div class="path"></div><img class="guide" id="guide" src="../../../../../mimi-run-transparent-v2b.webp" alt="Мімі"><div class="spots" id="spots"></div><div class="friends" id="friends" aria-label="Знайдені друзі"></div></section>
<section class="panel"><div class="progress" id="progress" aria-label="Поступ"></div><p class="hint" id="hint" role="status" aria-live="polite">Готові до хованок?</p><div class="controls"><button class="action" id="next">Почнімо!</button><button class="action secondary" id="repeat" hidden>🔊 Підказка</button><button class="action secondary" id="peek" hidden>Ще підказка 👀</button></div><p class="status" id="voiceNote" hidden>Озвучення залежить від українського голосу на пристрої.</p></section></main>
<script>
'use strict';
const farm='../../assets/farm/',mimi='../../../../../mimi-run-transparent-v2b.webp';
const rounds=[
{name:'Кошеня',image:farm+'kitten-gray-sitting.webp',hint:'Няв-няв! Хто сховався у саду?',extra:'У нього вуса, м’які лапки й довгий хвостик.'},
{name:'Цуценя',image:farm+'puppy-cream-caramel-sitting.webp',hint:'Гав-гав! Хто кличе нас погратися?',extra:'Цей маленький друг махає хвостиком і любить гуляти.'},
{name:'Каченя',image:farm+'duckling.webp',hint:'Кря-кря! Чий це голос?',extra:'У нього дзьобик і лапки, якими зручно плавати.'},
{name:'Зайчик',image:farm+'rabbit-gray-white-sitting.webp',hint:'Виглядають довгі вушка… Хто там?',extra:'Він має куций хвостик і стрибає на сильних задніх лапках.'},
{name:'Курчатко',image:farm+'chick-yellow-wings-down.webp',hint:'Пі-пі-пі! Хто такий маленький і пухнастий?',extra:'Воно вилупилося з яйця. Його мама — курочка.'},
{name:'Мімі',image:mimi,hint:'А де ж Мімі? Тепер її черга ховатися!',extra:'Шукай нашу подружку. Вона весь цей час гралася з тобою!'}
];
const covers=[
'<svg class="cover" viewBox="0 0 200 220" aria-hidden="true"><path fill="#719e59" d="M15 202Q-8 159 29 130Q10 91 57 85Q60 30 105 51Q156 16 167 83Q208 85 187 133Q224 182 181 205Z"/><path fill="#8db96b" d="M28 175Q3 127 53 119Q48 69 96 87Q124 40 151 93Q200 102 174 152Q201 191 151 192Z"/><circle fill="#e5a5a7" cx="59" cy="147" r="7"/><circle fill="#e5a5a7" cx="142" cy="118" r="6"/></svg>',
'<svg class="cover" viewBox="0 0 200 220" aria-hidden="true"><path d="M81 211L87 95H119L130 211Z" fill="#aa8056"/><path d="M99 151L57 112M110 133L150 90" stroke="#aa8056" stroke-width="15" stroke-linecap="round"/><path fill="#7da761" d="M15 100Q-5 61 38 45Q38 5 84 21Q113-9 146 22Q194 13 185 58Q218 93 180 114Q154 142 120 120Q76 146 49 118Q24 125 15 100Z"/><path fill="#9bc17b" d="M36 75Q29 42 66 47Q83 14 113 40Q156 24 163 60Q186 89 150 100Q110 80 89 108Q54 114 36 75Z"/></svg>',
'<svg class="cover" viewBox="0 0 200 220" aria-hidden="true"><path d="M42 120C33 17 171 17 162 120" fill="none" stroke="#b88a55" stroke-width="13"/><path d="M17 109L34 205Q100 223 169 205L185 109Z" fill="#caa16d"/><path d="M22 135H180M27 162H175M32 188H170M55 115L62 210M88 115L90 215M120 115L118 215M151 115L145 211" stroke="#e6c48c" stroke-width="8"/><path d="M17 109Q100 91 185 109" fill="none" stroke="#a77a48" stroke-width="14" stroke-linecap="round"/></svg>'
];
const labels=['Кущик','Дерево','Кошик'],spots=document.getElementById('spots'),hint=document.getElementById('hint'),next=document.getElementById('next'),repeat=document.getElementById('repeat'),peek=document.getElementById('peek'),friends=document.getElementById('friends'),guide=document.getElementById('guide'),progress=document.getElementById('progress');
let round=-1,target=-1,solved=false,sound=false,finished=false,lastTarget=-1,timers=[];
function later(fn,ms){const t=setTimeout(fn,ms);timers.push(t)}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function speak(text){if(!sound||!('speechSynthesis'in window))return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='uk-UA';u.rate=.88;const voice=window.speechSynthesis.getVoices().find(v=>/^uk/i.test(v.lang));if(voice)u.voice=voice;window.speechSynthesis.speak(u)}
function say(text){hint.textContent=text;speak(text)}
function updateProgress(){progress.textContent=rounds.map((_,i)=>i<round||(i===round&&solved)?'●':'○').join('');progress.setAttribute('aria-label','Знайдено '+Math.max(0,round+(solved?1:0))+' із '+rounds.length)}
function startRound(){clearTimers();round++;solved=false;next.hidden=true;repeat.hidden=false;peek.hidden=false;peek.disabled=false;let choices=[0,1,2].filter(i=>i!==lastTarget);target=choices[Math.floor(Math.random()*choices.length)];lastTarget=target;spots.replaceChildren();guide.hidden=round===rounds.length-1;for(let i=0;i<3;i++){const b=document.createElement('button');b.className='spot'+(round===rounds.length-1?' mimi-round':'');b.setAttribute('aria-label','Пошукати: '+labels[i]);b.innerHTML=(i===target?'<img class="hidden-animal" src="'+rounds[round].image+'" alt="">':'')+covers[i]+'<span class="label">'+labels[i]+'</span>';b.addEventListener('click',()=>choose(i,b));spots.append(b)}say(rounds[round].hint);updateProgress()}
function choose(i,b){if(solved||finished)return;if(i!==target){b.classList.remove('wiggle');void b.offsetWidth;b.classList.add('wiggle');const s=document.createElement('span');s.className='surprise';s.textContent=i===0?'🦋':i===1?'🍃':'✨';b.append(s);later(()=>s.remove(),1600);say('Тут маленький сюрприз! Пошукаймо ще. '+rounds[round].hint);return}solved=true;spots.querySelectorAll('button').forEach(el=>el.disabled=true);b.classList.remove('peek');b.classList.add('revealed');b.querySelector('.hidden-animal').alt=rounds[round].name;peek.hidden=true;repeat.hidden=true;say(round===5?'Ось і Мімі! Ми знайшли всіх друзів!':'Ось хто сховався! '+rounds[round].name+'!');updateProgress();later(()=>{const img=document.createElement('img');img.src=rounds[round].image;img.alt=rounds[round].name;if(round===0)img.classList.add('kitten-friend');if(round===rounds.length-1)img.classList.add('mimi-friend');friends.append(img);b.querySelector('.hidden-animal').style.visibility='hidden';next.textContent=round===5?'До всіх друзів 🌸':'Шукаймо далі →';next.hidden=false},1300)}
next.addEventListener('click',()=>{if(finished){finished=false;round=-1;lastTarget=-1;friends.replaceChildren();friends.style.height='';friends.style.left='';document.getElementById('intro').textContent='У саду хтось сховався! Торкайся схованок і шукай друзів разом із Мімі.';startRound();return}if(round===5&&solved){clearTimers();finished=true;spots.replaceChildren();guide.hidden=true;friends.style.height='42%';friends.style.left='4%';say('Усі друзі разом! Дякуємо за веселі хованки!');next.textContent='Зіграємо ще раз?';document.getElementById('intro').textContent='Торкнися друга — згадаймо, кого ми знайшли!';Array.from(friends.children).forEach(img=>{const b=document.createElement('button');b.style.cssText='background:transparent;padding:0;width:16%;height:100%';b.setAttribute('aria-label',img.alt);if(img.classList.contains('mimi-friend'))b.classList.add('mimi-friend-button');img.style.width='100%';b.append(img);if(img.classList.contains('mimi-friend')){b.disabled=true;b.setAttribute('aria-label','Мімі радіє разом із друзями')}else b.onclick=()=>say(img.alt+'!');friends.append(b)});return}friends.style.height='';friends.style.left='';startRound()});
repeat.onclick=()=>{if(round>=0)say(rounds[round].hint)};
peek.onclick=()=>{if(solved||round<0)return;say(rounds[round].extra);spots.children[target].classList.add('peek');peek.disabled=true};
document.getElementById('sound').onclick=()=>{sound=!sound;const b=document.getElementById('sound');b.textContent=sound?'🔊':'🔇';b.setAttribute('aria-pressed',String(sound));b.setAttribute('aria-label',sound?'Вимкнути озвучення':'Увімкнути озвучення');document.getElementById('voiceNote').hidden=!sound;if(sound)speak(hint.textContent);else if('speechSynthesis'in window)window.speechSynthesis.cancel()};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&'speechSynthesis'in window)window.speechSynthesis.cancel()});
window.addEventListener('pagehide',()=>{clearTimers();if('speechSynthesis'in window)window.speechSynthesis.cancel()});
updateProgress();
</script></body></html>
