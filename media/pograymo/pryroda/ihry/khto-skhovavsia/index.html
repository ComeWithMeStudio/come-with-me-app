let voiceAudio=null,voiceToken=0;
function stopVoice(){voiceToken++;if(voiceAudio){voiceAudio.pause();voiceAudio.onended=null;voiceAudio.onerror=null;voiceAudio=null}if('speechSynthesis'in window)window.speechSynthesis.cancel()}
function speak(text){
stopVoice();if(!sound)return;
const prefix='Тут маленький сюрприз! Пошукаймо ще.';
const parts=recordedVoices[text]?[text]:text.startsWith(prefix)?[prefix,text.slice(prefix.length).trim()]:[];
const paths=parts.map(t=>recordedVoices[t]).filter(Boolean);if(!paths.length)return;
const token=voiceToken;let index=0;
function playNext(){if(token!==voiceToken||!sound||index>=paths.length)return;const a=new Audio(paths[index++]);voiceAudio=a;a.onended=playNext;a.onerror=()=>{if(token===voiceToken){document.getElementById('voiceNote').textContent='Не вдалося завантажити звук. Натисни підказку ще раз.';document.getElementById('voiceNote').hidden=false}};const pending=a.play();if(pending&&pending.catch)pending.catch(()=>{if(token===voiceToken){document.getElementById('voiceNote').textContent='Натисни підказку, щоб відтворити голос Мімі.';document.getElementById('voiceNote').hidden=false}})}
playNext();
}

function say(text){hint.textContent=text;speak(text)}
function updateProgress(){progress.textContent=rounds.map((_,i)=>i<round||(i===round&&solved)?'●':'○').join('');progress.setAttribute('aria-label','Знайдено '+Math.max(0,round+(solved?1:0))+' із '+rounds.length)}
function startRound(){clearTimers();round++;solved=false;next.hidden=true;repeat.hidden=false;peek.hidden=false;peek.disabled=false;let choices=[0,1,2].filter(i=>i!==lastTarget);target=choices[Math.floor(Math.random()*choices.length)];lastTarget=target;spots.replaceChildren();guide.hidden=round===rounds.length-1;for(let i=0;i<3;i++){const b=document.createElement('button');b.className='spot'+(round===rounds.length-1?' mimi-round':'');b.setAttribute('aria-label','Пошукати: '+labels[i]);b.innerHTML=(i===target?'<img class="hidden-animal" src="'+rounds[round].image+'" alt="">':'')+covers[i]+'<span class="label">'+labels[i]+'</span>';b.addEventListener('click',()=>choose(i,b));spots.append(b)}say(rounds[round].hint);updateProgress()}
function choose(i,b){if(solved||finished)return;if(i!==target){b.classList.remove('wiggle');void b.offsetWidth;b.classList.add('wiggle');const s=document.createElement('span');s.className='surprise';s.textContent=i===0?'🦋':i===1?'🍃':'✨';b.append(s);later(()=>s.remove(),1600);say('Тут маленький сюрприз! Пошукаймо ще. '+rounds[round].hint);return}solved=true;spots.querySelectorAll('button').forEach(el=>el.disabled=true);b.classList.remove('peek');b.classList.add('revealed');b.querySelector('.hidden-animal').alt=rounds[round].name;peek.hidden=true;repeat.hidden=true;say(round===5?'Ось і Мімі! Ми знайшли всіх друзів!':'Ось хто сховався! '+rounds[round].name+'!');updateProgress();later(()=>{const img=document.createElement('img');img.src=rounds[round].image;img.alt=rounds[round].name;if(rounds[round].name==='Кошеня')img.classList.add('kitten-friend');if(rounds[round].name==='Сова')img.classList.add('owl-friend');if(round===rounds.length-1)img.classList.add('mimi-friend');friends.append(img);b.querySelector('.hidden-animal').style.visibility='hidden';next.textContent=round===5?'До всіх друзів 🌸':'Шукаймо далі →';next.hidden=false},1300)}
next.addEventListener('click',()=>{if(finished){if(wholeAdventure&&locationIndex<2){selectLocation(locationIndex+1,true);startRound();return}finished=false;round=-1;lastTarget=-1;friends.replaceChildren();friends.style.height='';friends.style.left='';document.getElementById('intro').textContent=locations[locationIndex].intro;startRound();return}if(round===5&&solved){clearTimers();finished=true;spots.replaceChildren();guide.hidden=true;friends.style.height='42%';friends.style.left='4%';say('Усі друзі разом! Дякуємо за веселі хованки!');next.textContent=wholeAdventure&&locationIndex<2?'Далі: '+locations[locationIndex+1].name+' →':'Зіграємо ще раз?';document.getElementById('intro').textContent='Торкнися друга — згадаймо, кого ми знайшли!';Array.from(friends.children).forEach(img=>{const b=document.createElement('button');b.style.cssText='background:transparent;padding:0;width:16%;height:100%';b.setAttribute('aria-label',img.alt);if(img.classList.contains('mimi-friend'))b.classList.add('mimi-friend-button');img.style.width='100%';b.append(img);if(img.classList.contains('mimi-friend')){b.disabled=true;b.setAttribute('aria-label','Мімі радіє разом із друзями')}else b.onclick=()=>say(img.alt+'!');friends.append(b)});return}friends.style.height='';friends.style.left='';startRound()});
repeat.onclick=()=>{if(round>=0)say(rounds[round].hint)};
peek.onclick=()=>{if(solved||round<0)return;say(rounds[round].extra);spots.children[target].classList.add('peek');peek.disabled=true};
document.getElementById('sound').onclick=()=>{sound=!sound;const b=document.getElementById('sound');b.textContent=sound?'🔊':'🔇';b.setAttribute('aria-pressed',String(sound));b.setAttribute('aria-label',sound?'Вимкнути озвучення':'Увімкнути озвучення');document.getElementById('voiceNote').hidden=!sound;if(sound)speak(hint.textContent);else stopVoice()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopVoice()});
window.addEventListener('pagehide',()=>{clearTimers();stopVoice()});

makeRound('Їжачок',forest+'hedgehog-walking.webp','У листі щось зашурхотіло. Хто там?','На його спинці багато голочок. Коли страшно, він згортається клубочком.'),
makeRound('Лисичка',forest+'red-fox-standing.webp','Руда шубка, пухнастий хвіст… Хто причаївся?','У неї гострі вушка і довга мордочка.'),

makeRound('Сова',forest+'tawny-owl-standing.webp','Угу-угу! Хто озвався поміж деревами?','Цей птах має великі очі й часто полює вночі.'),
mimiRound]},
{name:'Ферма',theme:'farm',intro:'Ми на фермі! Прислухаймося: хто грається з нами у хованки?',labels:['Сіно','Хатинка','Парканчик'],covers:[

svg('<path fill="#d99b73" d="M32 94H169V209H32Z"/><path fill="#bb725e" d="M10 98L100 20L190 98Z"/><path fill="#f1cc97" d="M75 132Q101 110 126 132V209H75Z"/><path fill="#a8d3d3" stroke="#fff4d7" stroke-width="7" d="M45 113H68V145H45Z"/><path fill="#a8d3d3" stroke="#fff4d7" stroke-width="7" d="M135 113H158V145H135Z"/><circle fill="#987044" cx="114" cy="170" r="4"/>'),
svg('<path d="M3 137H197M3 181H197" stroke="#d1ae7d" stroke-width="16"/><path fill="#f0d6aa" d="M15 211V105L34 83L53 105V211ZM81 211V105L100 83L119 105V211ZM147 211V105L166 83L185 105V211Z"/><path d="M27 137H40M93 137H106M159 137H172" stroke="#ae885c" stroke-width="5"/>')],rounds:[
makeRound('Теля',farm+'calf.webp','Му-у! Хто кличе маму-корову?','Це маленька дитина корови.'),
makeRound('Лоша',farm+'foal-caramel-trotting.webp','І-го-го! Хто тупотить копитцями?','Його мама — кобила. Коли підросте, стане конем.'),
makeRound('Ягня',farm+'lamb.webp','Бе-е! Хто має м’яку кучеряву шубку?','Це маленька дитина вівці.'),
makeRound('Порося',farm+'piglet.webp','Хрю-хрю! Хто заховав свій п’ятачок?','У нього маленькі копитця й хвостик гачечком.'),
makeRound('Козеня',farm+'kid.webp','Ме-е! Хто так весело стрибає на фермі?','Його мама — коза. Воно любить гратися і підстрибувати.'),
mimiRound]}
];
let locationIndex=0,wholeAdventure=false;
function selectLocation(index,all=false){
clearTimers();stopVoice();
locationIndex=index;wholeAdventure=all;rounds=locations[index].rounds;covers=locations[index].covers;labels=locations[index].labels;
round=-1;target=-1;lastTarget=-1;solved=false;finished=false;
spots.replaceChildren();friends.replaceChildren();friends.style.height='';friends.style.left='';guide.hidden=false;
document.querySelector('.scene').className='scene '+locations[index].theme;
document.querySelector('.scene').setAttribute('aria-label',locations[index].name+' зі схованками');
document.getElementById('intro').textContent=locations[index].intro;
document.querySelectorAll('[data-location]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.location)===index)));
document.getElementById('adventure').setAttribute('aria-pressed',String(all));
next.hidden=false;next.textContent='Почнімо!';repeat.hidden=true;peek.hidden=true;say('Хованки: '+locations[index].name+'. Готові шукати друзів?');updateProgress();
}
document.querySelectorAll('[data-location]').forEach(b=>b.onclick=()=>selectLocation(Number(b.dataset.location)));
document.getElementById('adventure').onclick=()=>selectLocation(0,true);
selectLocation(0);
