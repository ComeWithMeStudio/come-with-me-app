<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Літерна пошта Мімі</title>
<style>body{margin:0;background:#fff0cf;color:#44332d;font:1.15rem system-ui}main{max-width:620px;margin:auto;padding:16px;text-align:center}nav,#cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}button,a{font:inherit;padding:12px;border:2px solid #b97b55;background:#fff9eb;color:inherit;border-radius:15px;text-decoration:none;cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #382584}.mascot{height:104px;margin-top:12px}#letter{font-size:3rem;margin:8px}.icon{display:block;width:110px;height:110px;object-fit:contain;margin:0 auto 8px}#cards button{flex:1 1 140px;max-width:190px}*{box-sizing:border-box}button:disabled{opacity:.75}@media(max-width:380px){.icon{width:80px;height:80px}#cards button{flex-basis:110px}}#status{min-height:2.8em}.word-card{display:flex;flex-direction:column;gap:6px;flex:1 1 140px;max-width:190px}.word-card button{width:100%}#cards .word-card>button{max-width:none;flex:none}.word-card>button:last-child{font-size:.9rem;padding:8px}@media(max-width:520px){h1{font-size:1.8rem;margin:18px 0}.mascot{height:80px}nav{font-size:1rem}.word-card{flex:1 1 0;min-width:0;max-width:none}.word-card>button:first-child{padding:8px 4px;font-size:clamp(14px,4vw,18px)}.icon{width:100%;height:88px;margin-bottom:6px}.word-card>button:last-child{min-height:44px;padding:8px 2px}.listen-label{display:none}#letter{font-size:2.6rem}#status{font-size:1rem}} </style></head>
<body><main><nav><a href="/letter-games.html">← Ігри з літерами</a><button id="sound" aria-pressed="true">Звук увімкнено</button></nav>
<img class="mascot" src="/mimi-home.png" alt="Мімі"><h1>Літерна пошта Мімі</h1><p id="task" tabindex="-1">Допоможи Мімі рознести листи. Обирай картинку, назва якої починається з літери на конверті.</p>
<button id="listen">Послухати правила</button><div id="letter"></div><div id="cards"></div><p id="status" role="status"></p><button id="next">Рознести листи</button></main>
<script>
const rounds = [["А","Автобус","Кіт","Груша"],["К","Кіт","Слон","Ведмідь"],["С","Слон","Кіт","Груша"],["Л","Лис","Риба","Сова"],["В","Ведмідь","Лис","Риба"],["Р","Риба","Сова","Кіт"],["Г","Груша","Автобус","Лис"],["С","Сова","Ведмідь","Риба"],["К","Кіт","Груша","Автобус"],["А","Автобус","Слон","Сова"],["В","Ведмідь","Кіт","Груша"],["Л","Лис","Автобус","Риба"]];
const pictures = {"Кіт":"/media/pograymo/pryroda/assets/farm/cat.webp","Груша":"/media/pograymo/assets/illustrations/fruits/pear-green.webp","Слон":"/media/pograymo/pryroda/assets/africa/african-elephant-gray-walking.webp","Лис":"/media/pograymo/pryroda/assets/forest/red-fox-standing.webp","Ведмідь":"/media/pograymo/pryroda/assets/forest/brown-bear-walking.webp","Риба":"/media/pograymo/pryroda/assets/aquatic/fish/fish-goldfish-orange.webp","Сова":"/media/pograymo/pryroda/assets/forest/tawny-owl-standing.webp","Автобус":"assets/bus-v2.webp"};
const [task, letter, cards, status, next, sound] = ['task','letter','cards','status','next','sound'].map(id => document.getElementById(id));
function clip(url) { const audio = new Audio(url); audio.hidden = true; audio.preload = 'metadata'; document.body.append(audio); return audio; }
const praise = clip('/audio/games/common/correct-1.mp3');
const retry = clip('/audio/games/common/retry-1.mp3');
const intro = clip('audio/intro.mp3');
const finalVoice = clip('audio/final.mp3');
const wordVoices = Object.fromEntries(Object.entries({
'Автобус':'bus','Кіт':'cat','Груша':'pear','Слон':'elephant','Лис':'fox','Ведмідь':'bear','Риба':'fish','Сова':'owl'
}).map(([word,file]) => [word,clip('audio/'+file+'.mp3')]));
let finished = false;
document.getElementById('listen').onclick = () => play(finished ? finalVoice : intro);
let step = 0;
let muted = false;
function stop() {
  intro.pause();
  finalVoice.pause();
  Object.values(wordVoices).forEach(clip => clip.pause());
  praise.pause();
  retry.pause();
}
function play(clip) {
  stop();
  if (muted || document.hidden) return;
  clip.currentTime = 0;
  clip.play().catch(() => {});
}
sound.onclick = () => {
  muted = !muted;
  sound.textContent = muted ? 'Звук вимкнено' : 'Звук увімкнено';
  sound.setAttribute('aria-pressed', String(!muted));
  if (muted) stop();
};
window.addEventListener('pagehide', stop);
document.addEventListener('visibilitychange', () => { if (document.hidden) stop(); });
next.onclick = () => {
  stop();
  cards.replaceChildren();
  letter.textContent = '';
  status.textContent = '';
  if (step === rounds.length) {
    task.textContent = 'Усі 12 листів доставлено! Мімі дякує за допомогу.';
    next.textContent = 'Зіграти ще раз';
    step = 0;
    finished = true;
    document.getElementById('listen').textContent = 'Послухати привітання';
    play(finalVoice);
    task.focus();
    return;
  }
  if (step === 0) play(intro);
  finished = false;
  document.getElementById('listen').textContent = 'Послухати правила';
  const [initial, ...words] = rounds[step];
  const choices = [...words];
  for (let i = choices.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [choices[i], choices[j]] = [choices[j], choices[i]];
  }
  letter.textContent = '✉ ' + initial;
  task.textContent = 'Лист ' + (step + 1) + ' з ' + rounds.length + '. Яка назва починається на «' + initial + '»?';
  next.hidden = true;
  task.focus();
  for (const word of choices) {
    const button = document.createElement('button');
    const icon = document.createElement('img');
    icon.className = 'icon';
    icon.setAttribute('aria-hidden','true');
    icon.src = pictures[word];
    icon.alt = '';
    button.append(icon, word);
    button.onclick = () => {
      if (!word.startsWith(initial)) {
        status.textContent = 'Спробуй ще. Поглянь на першу літеру назви.';
        play(retry);
        return;
      }
      status.textContent = 'Так! «' + word + '» починається на «' + initial + '». Лист доставлено!';
      play(praise);
      for (const choice of cards.querySelectorAll('.word-card > button:first-child')) choice.disabled = true;
      step++;
      next.textContent = step === rounds.length ? 'Завершити' : 'Наступний лист';
      next.hidden = false;
      next.focus();
    };
    const card = document.createElement('div');
    card.className = 'word-card';
    const listen = document.createElement('button');
    listen.type = 'button';
    listen.append('🔊 ');
    const label = document.createElement('span');
    label.className = 'listen-label';
    label.textContent = 'Послухати';
    listen.append(label);
    listen.setAttribute('aria-label', 'Послухати слово ' + word);
    listen.onclick = () => play(wordVoices[word]);
    card.append(button, listen);
    cards.append(card);
  }
};
</script></body></html>
