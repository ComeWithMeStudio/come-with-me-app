<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кольорова лабораторія Мімі</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4e9ef;color:#513e46;font-family:"Trebuchet MS",system-ui,sans-serif}.game{max-width:760px;min-height:100dvh;margin:auto;padding:14px;background:linear-gradient(#f8e6ef,#fff7e5,#e7f4dc)}header{display:flex;align-items:center;gap:10px}h1{font-size:clamp(23px,5vw,33px);text-align:center;flex:1;margin:8px 0}.back,.primary{border:0;border-radius:30px;padding:12px 18px;background:#fff;font-weight:bold;color:inherit;text-decoration:none}.primary{background:#ffd55b;cursor:pointer}.panel{background:#fffaf2;border:4px solid white;border-radius:30px;min-height:440px;padding:20px 12px;text-align:center;box-shadow:0 12px 25px #6c526722}h2{font-size:clamp(21px,5vw,28px)}.equation{display:flex;justify-content:center;align-items:center;gap:clamp(5px,2vw,16px);margin:35px auto;flex-wrap:nowrap}.swatch{width:clamp(48px,13vw,88px);height:clamp(48px,13vw,88px);border:3px solid #fff;box-shadow:0 4px 12px #0002;border-radius:50%}.equation.level-2 .swatch{width:clamp(40px,10.5vw,74px);height:clamp(40px,10.5vw,74px)}.equation .swatch{flex-shrink:0}.sign{font-size:clamp(25px,6vw,38px);font-weight:bold}.unknown{background:#eee4e7;display:grid;place-items:center;font-size:35px}.choices{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:25px 0}.choice{border:3px solid white;width:clamp(65px,18vw,100px);height:clamp(65px,18vw,100px);border-radius:23px;box-shadow:0 5px 12px #0002;cursor:pointer}.choice:focus-visible{outline:4px solid #513e46}.message{min-height:48px;font-size:19px;font-weight:bold}.brush{width:75px;height:95px;object-fit:contain;transform:rotate(-18deg);transition:transform .65s}.brush.paint{transform:translateX(25px) rotate(18deg)}.result{margin:0;border-radius:50%;border:5px solid white;box-shadow:0 5px 15px #0002;animation:appear .8s ease both}@keyframes appear{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}.hidden{display:none!important}.small{font-size:15px;opacity:.8}.levels{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.progress{text-align:center;font-weight:bold;margin:15px}.feedback{font-size:20px;font-weight:bold;min-height:30px}.brushline{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto}.palette{width:78px;height:85px;object-fit:contain}.brushline span{max-width:125px;text-align:left}@media(max-width:390px){.palette{width:60px}.brush{width:60px}.brushline span{font-size:14px}}
.brush-holder{position:relative;width:75px;height:95px;flex:none}.brush-holder .brush{display:block}.brush-tip{position:absolute;left:17px;top:8px;width:15px;height:18px;border-radius:60% 60% 40% 40%;transform:rotate(-18deg);pointer-events:none}.brush-holder .brush.paint+.brush-tip{transform:translateX(25px) rotate(18deg);transition:transform .65s}@media(max-width:390px){.brush-holder{width:60px}.brush-tip{left:14px}}.art-scene{position:relative;width:min(100%,420px);aspect-ratio:1.12;margin:12px auto 4px;overflow:visible}.art-stage{position:absolute;left:50%;top:1%;width:54%;aspect-ratio:762/1011;transform:translateX(-50%);filter:drop-shadow(0 8px 7px #513e4630)}.art-easel{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.art-canvas{position:absolute;left:14%;right:14%;top:12%;height:55%;overflow:hidden}.art-piece{position:absolute;transform:translate(-50%,-50%);animation:paintReveal .5s ease-out both}.art-piece.sun{left:25%;top:25%;width:22%}.art-piece.cloud{left:70%;top:27%;width:34%}.art-piece.grass{left:50%;top:78%;width:78%}.art-piece.flower{left:28%;top:64%;width:22%}.art-piece.butterfly{left:69%;top:59%;width:23%}.art-palette{position:absolute;right:-51%;bottom:19%;width:39%}.art-brush{position:absolute;right:-17%;bottom:23%;width:14%;transform:rotate(-18deg)}.art-stage.alive .art-piece.sun{animation:sunAlive 2.1s ease-in-out infinite}.art-stage.alive .art-piece.cloud{animation:cloudAlive 3.3s ease-in-out infinite}.art-stage.alive .art-piece.grass{animation:grassAlive 3s ease-in-out infinite}.art-stage.alive .art-piece.flower{animation:flowerAlive 2.8s ease-in-out infinite}.art-stage.alive .art-piece.butterfly{animation:butterflyAlive 4.5s ease-in-out infinite}@keyframes paintReveal{from{opacity:0;transform:translate(-50%,-50%) scale(.7)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes sunAlive{50%{transform:translate(-50%,-50%) scale(1.12)}}@keyframes cloudAlive{50%{transform:translate(-43%,-50%)}}@keyframes grassAlive{50%{transform:translate(-50%,-50%) rotate(2deg)}}@keyframes flowerAlive{50%{transform:translate(-50%,-50%) rotate(-7deg)}}@keyframes butterflyAlive{50%{transform:translate(-35%,-65%) rotate(10deg)}}.art-appear{animation:paintReveal .55s ease both}.art-caption{min-height:24px;font-weight:bold}.mimi-finale{display:block;width:min(100%,350px);max-height:320px;object-fit:contain;margin:8px auto;border-radius:22px;background:#bdeaff}.art-scene.intro .art-stage{animation:paintReveal .65s ease both}.art-scene.intro .art-brush{animation:paintReveal .6s .65s ease both}.art-scene.intro .art-palette{animation:paintReveal .6s 1.25s ease both}.art-scene.intro{margin:12px auto 4px;aspect-ratio:1.12}.art-scene.intro+.art-caption{margin:6px auto 10px}.art-scene.intro+h2{margin:0 auto 6px}.art-scene.intro .art-stage{top:32%}.art-stage.alive .art-piece.sun{animation:labSunGlow 2s ease-in-out infinite;filter:drop-shadow(0 0 9px #ffd84d)}.art-stage.alive .art-piece.cloud{animation:labCloudDrift 3.3s ease-in-out infinite}.art-stage.alive .art-piece.grass{animation:labGrassSway 1.8s ease-in-out infinite;transform-origin:50% 95%}.art-stage.alive .art-piece.flower{animation:labFlowerSway 2.1s ease-in-out infinite;transform-origin:50% 95%}.art-stage.alive .art-piece.butterfly{z-index:6;animation:labButterflyFlight 3.5s ease-in-out infinite}@keyframes labSunGlow{0%,100%{transform:translate(-50%,-50%) scale(1);filter:drop-shadow(0 0 3px #ffd84d)}50%{transform:translate(-50%,-50%) scale(1.25);filter:drop-shadow(0 0 15px #ffc526) drop-shadow(0 0 10px #ffeb8a)}}@keyframes labCloudDrift{0%,100%{transform:translate(-62%,-50%)}50%{transform:translate(-34%,-53%)}}@keyframes labGrassSway{0%,100%{transform:translate(-50%,-50%) rotate(-4deg)}50%{transform:translate(-50%,-50%) rotate(5deg)}}@keyframes labFlowerSway{0%,100%{transform:translate(-50%,-50%) rotate(-12deg)}50%{transform:translate(-50%,-50%) rotate(12deg)}}@keyframes labButterflyFlight{0%,100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1)}25%{transform:translate(-105%,-90%) rotate(-18deg) scale(1.12)}55%{transform:translate(10%,-125%) rotate(12deg) scale(1.17)}80%{transform:translate(0%,-75%) rotate(5deg) scale(1.08)}}.welcome-art{position:relative;width:min(88%,390px);height:220px;margin:20px auto 0;pointer-events:none}.welcome-palette{position:absolute;width:118px;max-width:35%;left:20%;top:54%;transform:translate(-50%,-50%) rotate(-13deg);filter:drop-shadow(0 7px 8px #513e4628);animation:welcomePalette 1s ease both}.welcome-brush{position:absolute;width:65px;height:150px;object-fit:contain;left:57%;top:12%;transform-origin:50% 80%;filter:drop-shadow(0 5px 5px #513e4628);animation:welcomeBrush 4s ease-in-out infinite alternate}@keyframes welcomePalette{from{opacity:0;transform:translate(-50%,-35%) rotate(-25deg) scale(.8)}to{opacity:1;transform:translate(-50%,-50%) rotate(-13deg) scale(1)}}@keyframes welcomeBrush{0%{transform:translate(-25px,8px) rotate(-32deg)}30%{transform:translate(24px,36px) rotate(-5deg)}60%{transform:translate(-12px,54px) rotate(18deg)}100%{transform:translate(36px,4px) rotate(-18deg)}}</style></head><body><main class="game"><header><a class="back" href="../../../../index.html">← Назад</a><h1>Кольорова лабораторія Мімі</h1></header><p class="progress" id="progress"></p><section class="panel" id="panel"></section></main><script>
const ROOT='../../../../',COMMON=ROOT+'audio/games/common/',SFX=ROOT+'audio/games/sfx/',ART=ROOT+'media/pograymo/assets/illustrations/painted_scene/';
const praise=['correct-1.mp3','correct-2.mp3','correct-3.mp3','correct-4.mp3','correct-5.mp3'],retry=['retry-1.mp3','retry-2.mp3','retry-3.mp3'];
const colors={red:'#e83d4c',yellow:'#f8d536',blue:'#2486d4',green:'#38aa62',orange:'#f58b2d',purple:'#9252bb',brown:'#9a6543',pink:'#f2a0bb',white:'#ffffff',lightblue:'#81c8ed',lightgreen:'#a4d78b',peach:'#f5b68c',lavender:'#c7a6dc',mint:'#9bd7c2',cream:'#f7e6aa'};
const names={red:'червоний',yellow:'жовтий',blue:'синій',green:'зелений',orange:'помаранчевий',purple:'фіолетовий',brown:'коричневий',pink:'рожевий',white:'білий',lightblue:'блакитний',lightgreen:'світло-зелений',peach:'персиковий',lavender:'бузковий',mint:'м’ятний',cream:'кремовий'};
const levels=[
[{mix:['yellow','blue'],result:'green',options:['green','orange','purple']},{mix:['red','yellow'],result:'orange',options:['purple','orange','green']},{mix:['red','blue'],result:'purple',options:['orange','green','purple']},{mix:['red','white'],result:'pink',options:['pink','lightblue','orange']},{mix:['blue','white'],result:'lightblue',options:['purple','lightblue','green']},{mix:['green','white'],result:'lightgreen',options:['orange','pink','lightgreen']}],
[{mix:['yellow','blue','white'],intermediate:'green',result:'lightgreen',options:['lightgreen','pink','orange']},{mix:['red','yellow','white'],intermediate:'orange',result:'peach',options:['purple','peach','green']},{mix:['red','blue','white'],intermediate:'purple',result:'lavender',options:['lavender','orange','mint']},{mix:['blue','yellow','white'],intermediate:'green',result:'mint',options:['peach','mint','purple']},{mix:['yellow','red','white'],intermediate:'orange',result:'peach',options:['green','lavender','peach']},{mix:['blue','red','white'],intermediate:'purple',result:'lavender',options:['orange','lavender','pink']}]
];
let level=0,index=0,busy=false,audio=null,sequence=0;
const VOICE=ROOT+'audio/games/color-lab/';const voiceFiles={intro:'color_lab_intro.mp3',level1:'color_lab_level_1.mp3',level2:'color_lab_level_2.mp3',alive:'color_lab_painting_alive.mp3',final:'color_lab_final.mp3',two:'color_lab_mix_two.mp3',three:'color_lab_mix_three.mp3'};function speak(key){return new Promise(resolve=>{if(audio){audio.pause();audio=null}const a=new Audio(VOICE+voiceFiles[key]);audio=a;let done=false;const finish=()=>{if(done)return;done=true;if(audio===a)audio=null;resolve()};a.onended=finish;a.onerror=finish;a.play().catch(finish);setTimeout(finish,12000)})}const panel=document.getElementById('panel'),progress=document.getElementById('progress');
function sound(path){return new Promise(resolve=>{if(audio){audio.pause();audio=null}const a=new Audio(path);audio=a;let done=false;const finish=()=>{if(done)return;done=true;resolve()};a.onended=finish;a.onerror=finish;a.play().catch(finish);setTimeout(finish,3500)})}
const artPieces=['sun','cloud','grass','flower','butterfly'];const artNames={sun:'сонечко',cloud:'хмаринка',grass:'травичка',flower:'квіточка',butterfly:'метелик'};let collected=[],runToken=0;
function artMarkup(alive=false,intro=false){return '<div class="art-scene'+(intro?' intro':'')+'"><div class="art-stage'+(alive?' alive':'')+'"><img class="art-easel" src="'+ART+'painting-easel.webp" alt="Мольберт"><div class="art-canvas">'+collected.map(id=>'<img class="art-piece '+id+'" src="'+ART+'painted-'+id+'.webp" alt="'+artNames[id]+'">').join('')+'</div><img class="art-palette" src="'+ART+'paint-palette.webp" alt="Палітра"><img class="art-brush" src="'+ART+'paint-brush.webp" alt="Пензлик"></div></div>'}
function start(){sequence++;runToken++;level=0;index=0;collected=[];progress.textContent='Кольорова лабораторія';panel.innerHTML='<h2>Створимо чарівну картину!</h2><p>Змішуй фарби та відкривай нові кольори.</p><button class="primary" id="startGame">Почати</button>';document.getElementById('startGame').onclick=async()=>{const token=++runToken;busy=true;panel.innerHTML='<h2>Створимо чарівну картину!</h2><p>Змішуй фарби та відкривай нові кольори.</p><div class="welcome-art" aria-hidden="true"><img class="welcome-palette" src="'+ART+'paint-palette.webp"><img class="welcome-brush" src="'+ART+'paint-brush.webp"></div>';await speak('intro');if(token!==runToken)return;beginLevel()}}
async function beginLevel(){const token=++runToken;busy=true;collected=[];progress.textContent='Рівень '+(level+1);panel.innerHTML=artMarkup(false,true)+'<h2>Рівень '+(level+1)+'</h2><p class="art-caption">'+(level===0?'Приготуймо фарби та створімо чарівний малюнок!':'А тепер змішаємо три фарби й намалюємо ще одну картину!')+'</p>';await Promise.all([new Promise(r=>setTimeout(r,2200)),speak(level===0?'level1':'level2')]);if(token!==runToken)return;render()}
async function artPreview(success,finished=false){const token=++runToken;const t=levels[level][index];if(success){const preferred=t.result==='pink'?'flower':(t.result==='lightgreen'||t.result==='green'||t.result==='mint')?'grass':t.result==='lightblue'?'cloud':t.result==='orange'||t.result==='peach'?'sun':null;const next=(preferred&&!collected.includes(preferred)?preferred:artPieces.find(id=>!collected.includes(id)));if(next)collected.push(next)}const alive=success&&finished;panel.innerHTML='<h2>'+(success?'Чудово!':'Спробуй ще раз!')+'</h2>'+artMarkup(alive)+'<p class="art-caption">'+(alive?'Малюнок ожив!':success?'Картина стає яскравішою!':'Картина чекає на новий колір!')+'</p>';await new Promise(r=>setTimeout(r,alive?3600:1800));return token===runToken}
function finale(){speak('final');progress.textContent='Гру завершено!';panel.innerHTML='<h2>Браво! Ти справжній художник!</h2><video class="mimi-finale" src="'+ROOT+'media/mimi-library/blue-background/movement/MIMI-MOVE-013-clapping-paws-rhythmic-multiple-claps-front-standing-blue-bg.mp4" autoplay muted playsinline loop></video><p>Подивись, скільки краси ми створили разом!</p><button class="primary" id="again">Ще раз</button> <a class="primary" href="geometry-games-catalog.html">До ігор</a>';document.getElementById('again').onclick=start}
function dot(k){return '<span class="swatch" style="background:'+colors[k]+'" aria-label="'+names[k]+'"></span>'}
function render(){busy=false;const t=levels[level][index];progress.textContent='Рівень '+(level+1)+' · Завдання '+(index+1)+' з '+levels[level].length;panel.innerHTML='<h2>Який колір утвориться?</h2><div class="equation level-'+(level+1)+'">'+t.mix.map(dot).join('<span class="sign">+</span>')+'<span class="sign">=</span><span class="swatch unknown" id="unknown">?</span></div><p>Обери правильний колір</p><div class="choices">'+t.options.map(k=>'<button class="choice" data-color="'+k+'" style="background:'+colors[k]+'" aria-label="'+names[k]+'"></button>').join('')+'</div><div class="message" id="message" aria-live="polite"></div>';panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.color,b));if(index>0)speak(level===0?'two':'three')}
async function choose(k,b){if(busy)return;const t=levels[level][index];busy=true;const token=++sequence;if(k!==t.result){b.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});sound(COMMON+'wrong_boop.mp3');await artPreview(false);if(token!==sequence)return;render();await sound(COMMON+retry[index%retry.length]);return}
panel.querySelector('.choices').classList.add('hidden');const u=document.getElementById('unknown');u.style.background=colors[t.result];u.textContent='';u.classList.add('result');const brush=document.createElement('div');brush.className='brushline';brush.innerHTML='<img class="palette" src="'+ART+'paint-palette.webp" alt="Палітра"><img class="brush" src="'+ART+'paint-brush.webp" alt="Пензлик"><span>Фарби змішуються!</span>';panel.querySelector('.equation').after(brush);brush.querySelector('.brush').classList.add('paint');sound(SFX+'paint-brush-stroke.mp3');await new Promise(r=>setTimeout(r,900));if(token!==sequence)return;const last=index===levels[level].length-1;if(last){await Promise.all([artPreview(true,true),speak('alive')])}else{await artPreview(true,false);if(token!==sequence)return;await sound(COMMON+praise[index%praise.length])}if(token!==sequence)return;index++;if(index<levels[level].length){render();return}if(level===0){level=1;index=0;beginLevel()}else finale()}
start();
</script></body></html>
