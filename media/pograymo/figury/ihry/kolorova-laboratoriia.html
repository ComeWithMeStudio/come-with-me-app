<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кольорова лабораторія Мімі</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4e9ef;color:#513e46;font-family:"Trebuchet MS",system-ui,sans-serif}.game{max-width:760px;min-height:100dvh;margin:auto;padding:14px;background:linear-gradient(#f8e6ef,#fff7e5,#e7f4dc)}header{display:flex;align-items:center;gap:10px}h1{font-size:clamp(23px,5vw,33px);text-align:center;flex:1;margin:8px 0}.back,.primary{border:0;border-radius:30px;padding:12px 18px;background:#fff;font-weight:bold;color:inherit;text-decoration:none}.primary{background:#ffd55b;cursor:pointer}.panel{background:#fffaf2;border:4px solid white;border-radius:30px;min-height:440px;padding:20px 12px;text-align:center;box-shadow:0 12px 25px #6c526722}h2{font-size:clamp(21px,5vw,28px)}.equation{display:flex;justify-content:center;align-items:center;gap:clamp(5px,2vw,16px);margin:35px auto;flex-wrap:wrap}.swatch{width:clamp(48px,13vw,88px);height:clamp(48px,13vw,88px);border:3px solid #fff;box-shadow:0 4px 12px #0002;border-radius:50%}.equation:has(.swatch:nth-of-type(3)) .swatch{width:clamp(42px,10.5vw,74px);height:clamp(42px,10.5vw,74px)}.sign{font-size:clamp(25px,6vw,38px);font-weight:bold}.unknown{background:#eee4e7;display:grid;place-items:center;font-size:35px}.choices{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:25px 0}.choice{border:3px solid white;width:clamp(65px,18vw,100px);height:clamp(65px,18vw,100px);border-radius:23px;box-shadow:0 5px 12px #0002;cursor:pointer}.choice:focus-visible{outline:4px solid #513e46}.message{min-height:48px;font-size:19px;font-weight:bold}.brush{width:75px;height:95px;object-fit:contain;transform:rotate(-18deg);transition:transform .65s}.brush.paint{transform:translateX(25px) rotate(18deg)}.result{margin:0 auto;width:clamp(90px,23vw,130px);height:clamp(90px,23vw,130px);border-radius:50%;border:5px solid white;box-shadow:0 5px 15px #0002;animation:appear .8s ease both}@keyframes appear{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}.hidden{display:none!important}.small{font-size:15px;opacity:.8}.levels{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.progress{text-align:center;font-weight:bold;margin:15px}.feedback{font-size:20px;font-weight:bold;min-height:30px}.brushline{display:flex;align-items:center;justify-content:center;gap:10px;margin:12px auto}.palette{width:78px;height:85px;object-fit:contain}.brushline span{max-width:125px;text-align:left}@media(max-width:390px){.palette{width:60px}.brush{width:60px}.brushline span{font-size:14px}}
.brush-holder{position:relative;width:75px;height:95px;flex:none}.brush-holder .brush{display:block}.brush-tip{position:absolute;left:17px;top:8px;width:15px;height:18px;border-radius:60% 60% 40% 40%;transform:rotate(-18deg);pointer-events:none}.brush-holder .brush.paint+.brush-tip{transform:translateX(25px) rotate(18deg);transition:transform .65s}@media(max-width:390px){.brush-holder{width:60px}.brush-tip{left:14px}}</style></head><body><main class="game"><header><a class="back" href="../../../../index.html">← Назад</a><h1>Кольорова лабораторія Мімі</h1></header><p class="progress" id="progress"></p><section class="panel" id="panel"></section></main><script>
const ROOT='../../../../',COMMON=ROOT+'audio/games/common/',SFX=ROOT+'audio/games/sfx/',ART=ROOT+'media/pograymo/assets/illustrations/painted_scene/';
const praise=['correct-1.mp3','correct-2.mp3','correct-3.mp3','correct-4.mp3','correct-5.mp3'],retry=['retry-1.mp3','retry-2.mp3','retry-3.mp3'];
const colors={red:'#e83d4c',yellow:'#f8d536',blue:'#2486d4',green:'#38aa62',orange:'#f58b2d',purple:'#9252bb',brown:'#9a6543',pink:'#f2a0bb',white:'#ffffff',lightblue:'#81c8ed',lightgreen:'#a4d78b'};
const names={red:'червоний',yellow:'жовтий',blue:'синій',green:'зелений',orange:'помаранчевий',purple:'фіолетовий',brown:'коричневий',pink:'рожевий',white:'білий',lightblue:'блакитний',lightgreen:'світло-зелений'};
const levels=[
[{mix:['yellow','blue'],result:'green',options:['green','orange','purple']},{mix:['red','yellow'],result:'orange',options:['purple','orange','green']},{mix:['red','blue'],result:'purple',options:['orange','green','purple']},{mix:['red','white'],result:'pink',options:['pink','lightblue','orange']},{mix:['blue','white'],result:'lightblue',options:['purple','lightblue','green']},{mix:['green','white'],result:'lightgreen',options:['orange','pink','lightgreen']}],
[{mix:['yellow','blue','white'],intermediate:'green',result:'lightgreen',options:['lightgreen','pink','orange']},{mix:['red','yellow','white'],intermediate:'orange',result:'pink',options:['purple','pink','green']}]
];
let level=0,index=0,busy=false,audio=null,sequence=0;
const panel=document.getElementById('panel'),progress=document.getElementById('progress');
function sound(path){return new Promise(resolve=>{if(audio){audio.pause();audio=null}const a=new Audio(path);audio=a;let done=false;const finish=()=>{if(done)return;done=true;resolve()};a.onended=finish;a.onerror=finish;a.play().catch(finish);setTimeout(finish,3500)})}
function start(){progress.textContent='Обери рівень';panel.innerHTML='<h2>Змішуємо фарби!</h2><p>Подивись на кольори та знайди, який утвориться.</p><div class="levels"><button class="primary" data-level="0">Рівень 1 · Два кольори</button><button class="primary" data-level="1">Рівень 2 · Три кольори</button></div><p class="small">Без поспіху, крок за кроком.</p>';panel.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;index=0;render()})}
function dot(k){return '<span class="swatch" style="background:'+colors[k]+'" aria-label="'+names[k]+'"></span>'}
function render(){busy=false;const t=levels[level][index];progress.textContent='Рівень '+(level+1)+' · Завдання '+(index+1)+' з '+levels[level].length;panel.innerHTML='<h2>Який колір утвориться?</h2><div class="equation">'+t.mix.map(dot).join('<span class="sign">+</span>')+'<span class="sign">=</span><span class="swatch unknown" id="unknown">?</span></div><p>Обери правильний колір</p><div class="choices">'+t.options.map(k=>'<button class="choice" data-color="'+k+'" style="background:'+colors[k]+'" aria-label="'+names[k]+'"></button>').join('')+'</div><div class="brushline"><img class="palette" src="'+ART+'paint-palette.webp" alt="Палітра фарб"><div class="brush-holder"><img class="brush" src="'+ART+'paint-brush.webp" alt="Пензлик"><span class="brush-tip" style="background:'+colors[t.result]+'" aria-hidden="true"></span></div><span>Фарби чекають!</span></div><div class="message" id="message" aria-live="polite"></div>';panel.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(b.dataset.color,b))}
async function choose(k,b){if(busy)return;const t=levels[level][index];if(k!==t.result){busy=true;b.animate([{transform:'translateX(0)'},{transform:'translateX(-8px)'},{transform:'translateX(8px)'},{transform:'translateX(0)'}],{duration:350});document.getElementById('message').textContent='Спробуй ще раз!';await sound(COMMON+'wrong_boop.mp3');await sound(COMMON+retry[index%retry.length]);busy=false;return}
busy=true;const token=++sequence;panel.querySelector('.choices').classList.add('hidden');document.getElementById('message').textContent='';const u=document.getElementById('unknown');u.style.background=colors[t.result];u.textContent='';u.classList.add('result');const brush=panel.querySelector('.brushline');brush.querySelector('.brush').classList.add('paint');brush.querySelector('span:last-child').textContent='Фарби змішуються!';sound(SFX+'paint-brush-stroke.mp3');if(t.intermediate){const first=panel.querySelector('.swatch');first.style.background=colors[t.intermediate];first.setAttribute('aria-label',names[t.intermediate]);await new Promise(r=>setTimeout(r,950));if(token!==sequence)return;u.style.background=colors[t.result]}
await new Promise(r=>setTimeout(r,2000));if(token!==sequence)return;document.getElementById('message').textContent='Вийшов '+names[t.result]+'!';await sound(COMMON+praise[index%praise.length]);if(token!==sequence)return;index++;if(index>=levels[level].length){progress.textContent='Рівень завершено';panel.innerHTML='<h2>Чудова робота!</h2><p>Ти дослідив нові кольори!</p><button class="primary" id="back">До вибору рівнів</button>';document.getElementById('back').onclick=start}else render()}
start();
</script></body></html>
