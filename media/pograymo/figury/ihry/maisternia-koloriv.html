<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#513e46;background:#f3e8ef}button{font:inherit}
.game{width:min(100%,760px);min-height:100vh;margin:auto;padding:12px 10px 28px;background:linear-gradient(180deg,#f8e6ef,#fff6df 56%,#e7f4dc)}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.pill{border:0;border-radius:999px;padding:10px 14px;background:#fff9f1;color:#513e46;font-weight:900;box-shadow:0 5px 14px #513e4620;text-decoration:none}.title{margin:0;text-align:center;font-size:clamp(22px,5vw,34px)}
.progress{margin:12px auto 8px;text-align:center;font-weight:900;color:#765b69}.question{min-height:56px;display:grid;place-items:center;text-align:center;margin:2px auto 8px;font-size:clamp(20px,4.7vw,29px);font-weight:900}
.scene{position:relative;min-height:470px;border:5px solid #fff9ef;border-radius:34px;background:linear-gradient(180deg,#fff8ef,#f6ead9);box-shadow:0 14px 30px #6c52672b;overflow:hidden}
.basket{position:absolute;z-index:2;left:50%;top:31%;width:min(48%,300px);transform:translateX(-50%);filter:drop-shadow(0 10px 8px #6c513c35);pointer-events:none}.basket.wobble{animation:wobble .65s ease}
.tray{position:absolute;z-index:4;left:3%;right:3%;bottom:14px;display:flex;align-items:flex-end;justify-content:space-around;gap:4px;padding:9px 5px 7px;border-radius:25px;background:#fff9f0cc;box-shadow:0 6px 18px #6c526720}
.fruit{border:0;background:transparent;padding:3px;width:18%;min-width:52px;cursor:pointer;transition:.2s}.fruit img{display:block;width:100%;max-height:104px;object-fit:contain;filter:drop-shadow(0 6px 4px #513e4630)}.fruit:active{transform:scale(.94)}.fruit.bad{animation:shake .35s}.fruit.used{visibility:hidden;pointer-events:none}
.placed{position:absolute;z-index:3;width:16%;max-width:92px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both;filter:drop-shadow(0 5px 4px #513e4630)}
.message{min-height:44px;margin:9px 0 2px;display:grid;place-items:center;text-align:center;font-weight:900}.start{display:grid;place-items:center;height:100%;min-height:460px;text-align:center;padding:28px}.start strong{font-size:clamp(28px,7vw,45px)}.start span{display:block;margin-top:12px;font-size:19px;font-weight:900}.start button{margin-top:25px;border:0;border-radius:999px;padding:14px 24px;background:#ffd35c;color:#513e46;font-weight:900;box-shadow:0 6px 15px #513e4628}
.spark{position:absolute;z-index:8;font-size:27px;animation:spark 1s ease-out forwards;pointer-events:none}
.bouquet{position:absolute;z-index:2;left:50%;top:30%;width:min(48%,300px);transform:translateX(-50%);filter:drop-shadow(0 10px 8px #6c513c35);pointer-events:none}
.flower{border:0;background:transparent;padding:3px;width:18%;min-width:52px;cursor:pointer;transition:.2s}.flower img{display:block;width:100%;max-height:104px;object-fit:contain;filter:drop-shadow(0 6px 4px #513e4630)}.flower:active{transform:scale(.94)}.flower.bad{animation:shake .35s}.flower.used{visibility:hidden;pointer-events:none}
.bouquet-flower{position:absolute;z-index:3;width:15%;max-width:86px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both;filter:drop-shadow(0 5px 4px #513e4630)}
.pyramid-base{position:absolute;z-index:2;left:50%;top:22%;width:min(46%,285px);transform:translateX(-50%);filter:drop-shadow(0 10px 8px #6c513c35);pointer-events:none}.pyramid-ring{border:0;background:transparent;padding:3px;width:18%;min-width:52px;cursor:pointer;transition:.2s}.pyramid-ring img{display:block;width:100%;max-height:104px;object-fit:contain;filter:drop-shadow(0 6px 4px #513e4630)}.pyramid-ring:active{transform:scale(.94)}.pyramid-ring.bad{animation:shake .35s}.pyramid-ring.used{visibility:hidden;pointer-events:none}.pyramid-placed{position:absolute;z-index:3;width:31%;max-width:190px;transform:translate(-50%,-50%);pointer-events:none;filter:drop-shadow(0 5px 4px #513e4630);animation:drop .45s ease both}.pyramid-wobble{animation:pyramidWobble .8s ease-in-out 2}
.tree-base{position:absolute;z-index:2;left:50%;top:8%;width:min(54%,335px);transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 10px 8px #31533135)}.scene-item{border:0;background:transparent;padding:3px;width:16%;min-width:48px;cursor:pointer}.scene-item img{display:block;width:100%;max-height:100px;object-fit:contain;filter:drop-shadow(0 5px 4px #513e4630)}.scene-item.used{visibility:hidden;pointer-events:none}.scene-item.bad{animation:shake .35s}.tree-decoration{position:absolute;z-index:4;width:11%;max-width:68px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both}.tree-glow{animation:treeGlow 1s ease-in-out 2}.mimi-flight{position:absolute;z-index:2;left:50%;top:27%;width:min(39%,235px);transform:translateX(-50%)}.mimi-balloons{display:block;width:100%;filter:drop-shadow(0 8px 7px #513e4630)}.balloon-placed{position:absolute;z-index:3;width:16%;max-width:96px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both}.mimi-flight .balloon-placed{position:fixed}.fly-up-return{animation:flyUpReturn 2.8s ease-in-out}.icecream-cone{position:absolute;z-index:2;left:50%;top:28%;width:min(29%,175px);transform:translateX(-50%);pointer-events:none;filter:drop-shadow(0 9px 7px #513e4630)}.icecream-scoop{position:absolute;z-index:4;width:19%;max-width:112px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both}.mimi-lick-video{position:absolute;z-index:12;inset:0;width:100%;height:100%;object-fit:cover;border-radius:24px}.butterfly{position:absolute;z-index:7;width:min(15%,92px);left:-18%;top:20%;pointer-events:none;filter:drop-shadow(0 5px 4px #513e4630);animation:butterflyLand 2.1s ease-in-out forwards}

.toy-box{position:absolute;z-index:2;left:50%;top:30%;width:min(48%,290px);transform:translateX(-50%);pointer-events:none}.toy-placed{position:absolute;z-index:3;width:16%;max-width:95px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both}.toy-bounce{animation:toyBounce 1.4s ease-out forwards}.train-track{position:absolute;left:3%;right:3%;top:53%;height:8px;background:#8b6449;border-radius:8px;box-shadow:0 18px 0 #8b6449}.train-track:after{content:'';position:absolute;inset:-7px 0 -25px;background:repeating-linear-gradient(90deg,transparent 0 24px,#ad835e 24px 31px,transparent 31px 44px);z-index:0}.train-line{position:absolute;z-index:3;left:3%;top:31%;width:94%;height:27%;display:flex;align-items:flex-end;gap:0}.train-unit{display:block;width:16.66%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 3px #513e4630)}.train-unit.wagon{animation:wagonArrive .9s ease-out both}.train-line.depart{animation:trainDepart 2.6s ease-in forwards}.train-choice{width:18%;min-width:0}.train-choice img{max-height:96px}.train-choice.used{visibility:hidden;pointer-events:none}.train-choice.bad{animation:shake .35s}@keyframes wagonArrive{from{transform:translateX(70vw)}to{transform:translateX(0)}}@keyframes trainDepart{to{transform:translateX(-125%)}}@keyframes toyBounce{0%{transform:translate(-50%,-50%)}30%{transform:translate(-15%,-105%)}55%{transform:translate(20%,-55%)}75%{transform:translate(65%,-78%)}100%{transform:translate(155%,-48%)}}
@keyframes treeGlow{0%,100%{filter:drop-shadow(0 10px 8px #31533135)}50%{filter:drop-shadow(0 0 24px #ffd95c)} }
@keyframes flyUpReturn{0%,100%{transform:translateX(-50%) translateY(0)}45%{transform:translateX(-50%) translateY(-120px)}60%{transform:translateX(-50%) translateY(-120px)}}
@keyframes pyramidWobble{0%,100%{transform:translateX(-50%) rotate(0)}25%{transform:translateX(-50%) rotate(-2deg)}75%{transform:translateX(-50%) rotate(2deg)}}
@keyframes butterflyLand{0%{left:-18%;top:18%;transform:rotate(-12deg) scale(.85)}35%{left:30%;top:12%;transform:rotate(8deg) scale(1)}70%{left:61%;top:24%;transform:rotate(-5deg) scale(.92)}100%{left:58%;top:38%;transform:rotate(0) scale(.82)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes drop{from{transform:translate(-50%,-75%) scale(.75);opacity:.4}70%{transform:translate(-50%,-47%) scale(1.08)}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes wobble{25%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}75%{transform:translateX(-50%) rotate(-1deg)}}@keyframes spark{to{transform:translateY(-90px) rotate(35deg);opacity:0}}
@media(max-width:520px){.game{padding:8px 6px 22px}.top{grid-template-columns:auto 1fr}.top .reset{grid-column:1/3;grid-row:2;justify-self:center;padding:7px 11px}.pill{font-size:13px}.scene{min-height:430px;border-radius:27px}.basket,.bouquet{top:29%;width:56%}.pyramid-base{top:21%;width:54%}.tray{left:2%;right:2%;bottom:10px}.fruit,.flower{width:19%;padding:1px}.fruit img,.flower img{max-height:82px}}
</style></head>

 scene.innerHTML=bases[sceneNo]+'<div class="tray" id="tray"></div>';
 const tray=document.getElementById('tray');
 shuffle(currentItems()).forEach(f=>{const b=document.createElement('button');b.className=(sceneNo===1?'fruit':sceneNo===2?'flower':sceneNo===4?'pyramid-ring':'scene-item')+(sceneNo===8?' train-choice':'');b.dataset.id=f.id;b.setAttribute('aria-label',f.label);b.innerHTML='<img src="'+f.img+'" alt="'+f.label+'">';b.onclick=()=>choose(b,f);tray.appendChild(b)});
}
function choose(btn,f){
 if(!started||busy||btn.classList.contains('used'))return;
 if(f.id!==order[step].id){btn.classList.remove('bad');void btn.offsetWidth;btn.classList.add('bad');play(COMMON+'wrong_boop.mp3',()=>play(COMMON+nextFrom(retry,'retry')));return}
 busy=true;btn.classList.add('used');
 if(sceneNo===8){
  const line=document.getElementById('trainLine'),wagon=document.createElement('img');wagon.className='train-unit wagon';wagon.src=f.img;wagon.alt=f.label;
  play(SFX+'train_wheels.mp3');line.appendChild(wagon);
  wagon.addEventListener('animationend',()=>play(SFX+'soft_click.mp3',()=>afterCorrect()),{once:true});return;
 }
 const slots=sceneNo===1?basketSlots:sceneNo===2?bouquetSlots:sceneNo===3?toySlots:sceneNo===4?pyramidSlots:sceneNo===5?treeSlots:sceneNo===6?balloonSlots:icecreamSlots;
 const slot=slots[step],im=document.createElement('img');im.className=sceneNo===1?'placed':sceneNo===2?'bouquet-flower':sceneNo===3?'toy-placed':sceneNo===4?'pyramid-placed':sceneNo===5?'tree-decoration':sceneNo===6?'balloon-placed':'icecream-scoop';im.src=f.img;im.alt='';im.style.left=slot.x+'%';im.style.top=slot.y+'%';if(sceneNo===3&&f.id==='ball')im.id='toyBall';scene.appendChild(im);
 const sound=(sceneNo===4||sceneNo===7)?SFX+'soft_click.mp3':(sceneNo===5||sceneNo===6)?SFX+'soft_chime.mp3':COMMON+'item_place.mp3';play(sound,afterCorrect);
}
function afterCorrect(){play(COMMON+nextFrom(correct,'correct'),()=>{step++;if(step===(sceneNo===5?6:5))finishScene();else{busy=false;prompt()}})}
function complete(next){play(COMMON+'scene_complete.mp3',()=>{if(next)setTimeout(()=>startScene(next),700)});sparkles()}
function finishScene(){
 busy=true;progress.textContent=sceneNames[sceneNo]+' • готово!';message.textContent='Чудова робота! ✨';
 if(sceneNo===1){q.textContent='Кошик наповнений!';document.getElementById('base').classList.add('wobble');complete(2)}
 else if(sceneNo===2){q.textContent='Букет готовий!';const b=document.createElement('img');b.className='butterfly';b.src=KOMAKHY+'assets/butterfly.webp';b.alt='Метелик';scene.appendChild(b);play(KOMAKHY+'audio/sfx/butterfly_wings.mp3',()=>complete(3))}
 else if(sceneNo===3){q.textContent='Коробка наповнена!';const ball=document.getElementById('toyBall');if(ball)ball.classList.add('toy-bounce');play(SFX+'ball_bounce_2x_roll.mp3',()=>complete(4))}
 else if(sceneNo===4){q.textContent='Пірамідка готова!';document.getElementById('base').classList.add('pyramid-wobble');complete(5)}
 else if(sceneNo===5){q.textContent='Ялинка прикрашена!';document.getElementById('base').classList.add('tree-glow');play(SFX+'christmas_bells_soft.mp3',()=>complete(6))}
 else if(sceneNo===6){q.textContent='Мімі злітає!';const flight=document.getElementById('base');scene.querySelectorAll('.balloon-placed').forEach(x=>flight.appendChild(x));flight.classList.add('fly-up-return');play(SFX+'air_whoosh.mp3',()=>complete(7))}
 else if(sceneNo===7){q.textContent='Морозиво готове!';const v=document.createElement('video');v.className='mimi-lick-video';v.src=ROOT+'media/mimi-library/animations/mimi-licking-lips.mp4';v.autoplay=true;v.muted=true;v.playsInline=true;v.onended=()=>v.remove();scene.appendChild(v);complete(8)}
 else if(sceneNo===8){q.textContent='Паровоз готовий!';play(SFX+'train_whistle.mp3',()=>{setTimeout(()=>{play(SFX+'train_wheels.mp3');document.getElementById('trainLine').classList.add('depart');setTimeout(()=>complete(0),2700)},350)})}
}
function sparkles(){for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✨':'⭐';s.style.left=(18+Math.random()*64)+'%';s.style.top=(25+Math.random()*42)+'%';scene.appendChild(s);setTimeout(()=>s.remove(),1100)}}
function startScene(n){sceneNo=n;started=true;busy=false;step=0;feedbackBag=[];retryBag=[];message.textContent='';order=n===1?basketOrder():shuffle(currentItems());renderScene();prompt()}
function begin(){startScene(1)}
function intro(){started=false;busy=false;sceneNo=1;progress.textContent='Сцена 1 • Кошик';q.textContent='';message.textContent='';scene.innerHTML='<div class="start"><div><strong>Майстерня кольорів 🎨</strong><span>Допоможи створювати яскраві речі</span><button id="startBtn">Починаймо!</button></div></div>';document.getElementById('startBtn').onclick=()=>play(VOICE+'00_game_intro.mp3',begin)}
document.getElementById('reset').onclick=()=>{if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}intro()};intro();
</script></body></html>
