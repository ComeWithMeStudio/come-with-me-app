<!doctype html>
<html lang="uk" style="color-scheme:only light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8e7f0">
<title>Майстерня кольорів — Come With Me</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#513e46;background:#f3e8ef}button{font:inherit}
.game{width:min(100%,760px);min-height:100vh;margin:auto;padding:12px 10px 28px;background:linear-gradient(180deg,#f8e6ef,#fff6df 56%,#e7f4dc)}
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.pill{border:0;border-radius:999px;padding:10px 14px;background:#fff9f1;color:#513e46;font-weight:900;box-shadow:0 5px 14px #513e4620;text-decoration:none}.title{margin:0;text-align:center;font-size:clamp(22px,5vw,34px)}
.progress{margin:12px auto 8px;text-align:center;font-weight:900;color:#765b69}.question{min-height:56px;display:grid;place-items:center;text-align:center;margin:2px auto 8px;font-size:clamp(20px,4.7vw,29px);font-weight:900}
.scene{position:relative;min-height:470px;border:5px solid #fff9ef;border-radius:34px;background:linear-gradient(180deg,#fff8ef,#f6ead9);box-shadow:0 14px 30px #6c52672b;overflow:hidden}
.basket{position:absolute;z-index:2;left:50%;top:31%;width:min(48%,300px);transform:translateX(-50%);filter:drop-shadow(0 10px 8px #6c513c35);pointer-events:none}.basket.wobble{animation:wobble .65s ease}
.tray{position:absolute;z-index:4;left:3%;right:3%;bottom:14px;display:flex;align-items:flex-end;justify-content:space-around;gap:4px;padding:9px 5px 7px;border-radius:25px;background:#fff9f0cc;box-shadow:0 6px 18px #6c526720}
.fruit{border:0;background:transparent;padding:3px;width:18%;min-width:52px;cursor:pointer;transition:.2s}.fruit img{display:block;width:100%;max-height:104px;object-fit:contain;filter:drop-shadow(0 6px 4px #513e4630)}.fruit:active{transform:scale(.94)}.fruit.bad{animation:shake .35s}.fruit.used{visibility:hidden;pointer-events:none}
.placed{position:absolute;z-index:3;width:16%;max-width:92px;transform:translate(-50%,-50%);pointer-events:none;animation:drop .45s ease both;filter:drop-shadow(0 5px 4px #513e4630)}
.message{min-height:44px;margin:9px 0 2px;display:grid;place-items:center;text-align:center;font-weight:900}.start{display:grid;place-items:center;height:100%;min-height:460px;text-align:center;padding:28px}.start strong{font-size:clamp(28px,7vw,45px)}.start span{display:block;margin-top:12px;font-size:19px;font-weight:900}.start button{margin-top:25px;border:0;border-radius:999px;padding:14px 24px;background:#ffd35c;color:#513e46;font-weight:900;box-shadow:0 6px 15px #513e4628}
.spark{position:absolute;z-index:8;font-size:27px;animation:spark 1s ease-out forwards;pointer-events:none}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes drop{from{transform:translate(-50%,-75%) scale(.75);opacity:.4}70%{transform:translate(-50%,-47%) scale(1.08)}to{transform:translate(-50%,-50%) scale(1);opacity:1}}@keyframes wobble{25%{transform:translateX(-50%) rotate(-3deg)}50%{transform:translateX(-50%) rotate(3deg)}75%{transform:translateX(-50%) rotate(-1deg)}}@keyframes spark{to{transform:translateY(-90px) rotate(35deg);opacity:0}}
@media(max-width:520px){.game{padding:8px 6px 22px}.top{grid-template-columns:auto 1fr}.top .reset{grid-column:1/3;grid-row:2;justify-self:center;padding:7px 11px}.pill{font-size:13px}.scene{min-height:430px;border-radius:27px}.basket{top:29%;width:56%}.tray{left:2%;right:2%;bottom:10px}.fruit{width:19%;padding:1px}.fruit img{max-height:82px}}
</style></head>
<body><main class="game">
<header class="top"><a class="pill" href="geometry-games-catalog.html">← До ігор</a><h1 class="title">Майстерня кольорів</h1><button class="pill reset" id="reset">↻ Спочатку</button></header>
<div class="progress" id="progress"></div><div class="question" id="question"></div><section class="scene" id="scene"></section><div class="message" id="message"></div>
</main>
<script>
const ROOT='../../../../';
const A=ROOT+'media/pograymo/assets/illustrations/';
const VOICE=ROOT+'audio/games/maisternia-koloriv/voice/';
const COMMON=ROOT+'audio/games/common/';
const fruits=[
 {id:'apple',img:A+'fruits/apple-green.png',label:'зелене яблуко',voice:'01_basket_green_apple.mp3'},
 {id:'strawberry',img:A+'fruits/strawberry-red.png',label:'червону полуницю',voice:'01_basket_red_strawberry.mp3'},
 {id:'plum',img:A+'fruits/plum-purple.png',label:'фіолетову сливу',voice:'01_basket_purple_plum.mp3'},
 {id:'blackberry',img:A+'fruits/blackberry-blue.png',label:'ожину синього кольору',voice:'01_basket_blue_blackberry.mp3'},
 {id:'apricot',img:A+'fruits/apricot-orange.png',label:'помаранчевий абрикос',voice:'01_basket_orange_apricot.mp3'}
];
const correct=['correct-1.mp3','correct-2.mp3','correct-3.mp3','correct-4.mp3','correct-5.mp3'];
const retry=['retry-1.mp3','retry-2.mp3','retry-3.mp3'];
const slots=[{x:39,y:48},{x:50,y:45},{x:61,y:49},{x:45,y:55},{x:56,y:55}];
const q=document.getElementById('question'),scene=document.getElementById('scene'),message=document.getElementById('message'),progress=document.getElementById('progress');
let order=[],step=0,started=false,busy=false,activeAudio=null,feedbackBag=[],retryBag=[];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeOrder(){const others=shuffle(fruits.filter(f=>f.id!=='blackberry'));const pos=2+Math.floor(Math.random()*3);others.splice(pos,0,fruits.find(f=>f.id==='blackberry'));return others}
function nextFrom(files,type){let bag=type==='correct'?feedbackBag:retryBag;if(!bag.length){bag=shuffle(files);if(type==='correct')feedbackBag=bag;else retryBag=bag}return bag.pop()}
function play(path,onEnd){if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}const a=new Audio(path);activeAudio=a;a.onended=()=>{if(onEnd)onEnd()};a.play().catch(()=>{if(onEnd)onEnd()})}
function prompt(){const f=order[step];q.textContent=f.id==='blackberry'?'Поклади ожину синього кольору.':'Поклади '+f.label+' в кошик.';progress.textContent='Кошик • '+(step+1)+' з 5';play(VOICE+f.voice)}
function renderScene(){
 scene.innerHTML='<img class="basket" id="basket" src="'+A+'containers/fruit-basket.png" alt="Кошик"><div class="tray" id="tray"></div>';
 const tray=document.getElementById('tray');shuffle(fruits).forEach(f=>{const b=document.createElement('button');b.className='fruit';b.dataset.id=f.id;b.setAttribute('aria-label',f.label);b.innerHTML='<img src="'+f.img+'" alt="'+f.label+'">';b.onclick=()=>choose(b,f);tray.appendChild(b)});
}
function choose(btn,f){if(!started||busy||btn.classList.contains('used'))return;const target=order[step];if(f.id!==target.id){btn.classList.remove('bad');void btn.offsetWidth;btn.classList.add('bad');play(COMMON+'wrong_boop.mp3',()=>play(COMMON+nextFrom(retry,'retry')));return}
 busy=true;btn.classList.add('used');const slot=slots[step],im=document.createElement('img');im.className='placed';im.src=f.img;im.alt='';im.style.left=slot.x+'%';im.style.top=slot.y+'%';scene.appendChild(im);
 play(COMMON+'item_place.mp3',()=>{const praise=nextFrom(correct,'correct');play(COMMON+praise,()=>{step++;if(step===5){finish()}else{busy=false;prompt()}})})
}
function finish(){progress.textContent='Кошик • готово!';q.textContent='Кошик наповнений!';message.textContent='Чудова робота! ✨';play(COMMON+'scene_complete.mp3');const basket=document.getElementById('basket');basket.classList.add('wobble');for(let i=0;i<9;i++){const s=document.createElement('span');s.className='spark';s.textContent=i%2?'✨':'⭐';s.style.left=(18+Math.random()*64)+'%';s.style.top=(25+Math.random()*42)+'%';scene.appendChild(s);setTimeout(()=>s.remove(),1100)}busy=true}
function begin(){started=true;busy=false;step=0;order=makeOrder();feedbackBag=[];retryBag=[];message.textContent='';renderScene();prompt()}
function intro(){started=false;busy=false;progress.textContent='Сцена 1 • Кошик';q.textContent='';message.textContent='';scene.innerHTML='<div class="start"><div><strong>Майстерня кольорів 🎨</strong><span>Допоможи наповнити кошик фруктами</span><button id="startBtn">Починаймо!</button></div></div>';document.getElementById('startBtn').onclick=()=>play(VOICE+'00_game_intro.mp3',begin)}
document.getElementById('reset').onclick=()=>{if(activeAudio){activeAudio.pause();activeAudio.currentTime=0}intro()};intro();
</script></body></html>
