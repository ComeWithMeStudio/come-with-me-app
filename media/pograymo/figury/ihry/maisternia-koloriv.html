let cakeAudioContext=null;
function cakeSound(kind){
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=cakeAudioContext||(cakeAudioContext=new C());c.resume().catch(()=>{});
  const now=c.currentTime;
  if(kind==='blow'){
   const buffer=c.createBuffer(1,c.sampleRate*.65,c.sampleRate),data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=(Math.random()*2-1)*.45;
   const src=c.createBufferSource(),filter=c.createBiquadFilter(),gain=c.createGain();src.buffer=buffer;filter.type='lowpass';filter.frequency.value=1100;gain.gain.setValueAtTime(0,now);gain.gain.linearRampToValueAtTime(.22,now+.12);gain.gain.exponentialRampToValueAtTime(.001,now+.65);src.connect(filter);filter.connect(gain);gain.connect(c.destination);src.start(now);
  }else{
   [523.25,659.25,783.99,1046.5].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(0,now+i*.11);g.gain.linearRampToValueAtTime(.08,now+i*.11+.025);g.gain.exponentialRampToValueAtTime(.001,now+i*.11+.65);o.connect(g);g.connect(c.destination);o.start(now+i*.11);o.stop(now+i*.11+.7)});
  }
 }catch(e){}
}
