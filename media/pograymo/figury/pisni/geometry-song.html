<!doctype html>
<html lang="uk" style="color-scheme:only light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee7f2">
<title>Місто маленьких фігур — Come With Me</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#49362d}body{padding:18px 18px 70px;background:radial-gradient(circle at 14% 10%,#ffe598 0 6%,transparent 19%),radial-gradient(circle at 88% 17%,#bdeaff 0 7%,transparent 21%),linear-gradient(160deg,#fff7df,#f4eaff 56%,#e4f8ff)}.shell{width:min(720px,100%);margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.head h1{margin:0;font-size:clamp(27px,6vw,42px);line-height:1.05}.back{border:0;border-radius:999px;padding:12px 18px;background:#fff9e9e8;box-shadow:0 4px 14px #49362d25;font-weight:900;color:#49362d;text-decoration:none;white-space:nowrap}.label{font-size:12px;font-weight:900;letter-spacing:.08em;color:#6d5c78;margin:0 2px 12px}.hero{position:relative;min-height:360px;border:4px solid #fff;border-radius:30px;overflow:hidden;background:linear-gradient(#afe7fb 0 58%,#bde48e 58%);box-shadow:0 12px 32px #604f702b}.sun{position:absolute;right:10%;top:9%;width:68px;height:68px;border-radius:50%;background:#ffd54f;box-shadow:0 0 30px #ffd54faa}.city{position:absolute;left:7%;right:7%;bottom:0;height:58%;display:flex;align-items:flex-end;justify-content:center;gap:3%}.house{position:relative;width:24%;height:55%;border-radius:12px 12px 0 0;background:#ff9861;box-shadow:inset 0 5px 10px #fff5}.house:before{content:"";position:absolute;left:-9%;right:-9%;top:-43%;height:48%;background:#f04f67;clip-path:polygon(50% 0,100% 100%,0 100%)}.house:after{content:"";position:absolute;left:38%;bottom:0;width:25%;height:47%;border-radius:8px 8px 0 0;background:#8d5a42}.tower{width:20%;height:80%;border-radius:12px 12px 0 0;background:#7b71dd;position:relative}.tower:before{content:"";position:absolute;left:31%;top:17%;width:38%;aspect-ratio:1;border-radius:50%;background:#ffd75a;box-shadow:0 58px 0 #55c4e8}.shapes{position:absolute;left:7%;top:9%;font-size:clamp(42px,9vw,70px);letter-spacing:8px;color:#fff;text-shadow:0 5px 12px #38617b55}.copy{position:absolute;z-index:3;left:5%;right:5%;bottom:7%;padding:17px 18px;border-radius:22px;background:#fff9e9ee;text-align:center;box-shadow:0 6px 20px #49362d25}.copy strong{display:block;font-size:clamp(23px,5vw,34px)}.copy small{display:block;margin-top:5px;font-size:14px;font-weight:900;color:#6d5c78}.player{margin-top:20px;padding:20px;border-radius:27px;background:#fff9e9e8;box-shadow:0 10px 28px #604f7025}.controls{display:flex;align-items:center;justify-content:center;gap:14px}.play{width:64px;height:64px;border:0;border-radius:50%;background:#ffcb4d;color:#49362d;font-size:28px;box-shadow:0 6px 16px #49362d28;cursor:pointer}.time{min-width:48px;font-weight:900;font-size:13px;text-align:center}.progress{width:100%;margin-top:14px;accent-color:#f6a623}.note{text-align:center;margin:23px auto 0;font-weight:900;color:#6d5c78}@media(max-width:520px){body{padding:14px 12px 50px}.head{margin-bottom:25px}.head h1{font-size:29px}.back{padding:10px 13px;font-size:14px}.hero{min-height:330px;border-radius:24px}.player{padding:17px}.shapes{letter-spacing:3px}}
</style>
</head><body><main class="shell">
<header class="head"><h1>Пісня про фігури 🎵</h1><a class="back" href="../../../../index.html#figures">← Фігури</a></header>
<div class="label">БЕЗКОШТОВНО</div>
<section class="hero"><div class="sun"></div><div class="shapes">○ △ □</div><div class="city"><div class="house"></div><div class="tower"></div><div class="house"></div></div><div class="copy"><strong>Місто маленьких фігур</strong><small>Музична пригода Мімі й Тука</small></div></section>
<section class="player"><div class="controls"><span class="time" id="current">0:00</span><button class="play" id="play" aria-label="Відтворити">▶</button><span class="time" id="duration">0:00</span></div><input class="progress" id="progress" type="range" min="0" max="100" value="0" step=".1"><audio id="audio" preload="metadata" src="misto-malenkykh-fihur.mp3"></audio></section>
<p class="note">Співай, будуй і вирушай у пригоду разом із Мімі 🐾</p>
</main>
<script>
const audio=document.getElementById('audio'),play=document.getElementById('play'),progress=document.getElementById('progress'),current=document.getElementById('current'),duration=document.getElementById('duration');const fmt=s=>{if(!Number.isFinite(s))return'0:00';const m=Math.floor(s/60),v=Math.floor(s%60);return m+':'+String(v).padStart(2,'0')};play.onclick=()=>audio.paused?audio.play():audio.pause();audio.onplay=()=>play.textContent='⏸';audio.onpause=()=>play.textContent='▶';audio.onloadedmetadata=()=>duration.textContent=fmt(audio.duration);audio.ontimeupdate=()=>{current.textContent=fmt(audio.currentTime);progress.value=audio.duration?audio.currentTime/audio.duration*100:0};progress.oninput=()=>{if(audio.duration)audio.currentTime=progress.value/100*audio.duration};audio.onended=()=>{play.textContent='▶';progress.value=0};
</script></body></html>
