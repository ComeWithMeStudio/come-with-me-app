<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Автокран — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--orange:#ff9450}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:clamp(28px,7vw,46px)}.back{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:#bfeaf6;box-shadow:0 14px 36px #59432827}.site-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;filter:saturate(.9) brightness(1.04)}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:6%;top:5%;width:13%}.cloud{left:7%;top:7%;width:16%}.cloud.second{left:31%;top:13%;width:13%;opacity:.88}
    .crane{position:absolute;z-index:3;left:3%;bottom:16%;width:94%;height:auto;object-fit:contain;opacity:0;filter:drop-shadow(0 9px 8px #60452e35);transform-origin:50% 100%;transition:opacity .28s,transform 1.65s ease-in-out}.crane.active{opacity:1}.crane.entering{animation:drive-in 1.7s ease-out both}.crane.lifting{animation:lift-settle 1.45s ease-in-out both}.crane.exiting{opacity:1;animation:drive-out 2.25s ease-in forwards}
    @keyframes drive-in{from{transform:translateX(-110%)}to{transform:translateX(0)}}@keyframes drive-out{from{transform:translateX(0)}to{transform:translateX(125%)}}@keyframes lift-settle{0%{transform:translateY(2px)}55%{transform:translateY(-5px)}100%{transform:translateY(0)}}
    .pallet{position:absolute;z-index:4;right:5%;bottom:20%;width:20%;height:9%;transition:transform 1s ease-in,opacity .25s}.pallet:before{content:"";position:absolute;left:5%;right:5%;bottom:7%;height:20%;border-radius:3px;background:#b4783d;box-shadow:0 5px 0 #8c582e}.blocks{position:absolute;left:0;right:0;bottom:29%;height:68%;display:flex;gap:3px}.blocks i{flex:1;border-radius:5px;background:linear-gradient(145deg,#e4e1d9,#aaa9a4);border:1px solid #989792;box-shadow:inset 2px 2px 3px #fff8}.pallet.grabbed{transform:translateY(-8%)}.pallet.lifted{opacity:0}
    .caption{position:absolute;z-index:6;left:4%;right:4%;bottom:3%;min-height:76px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.8vw,30px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}.start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}.progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:29px}.back{padding:9px 11px;font-size:13px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.crane{left:1%;bottom:19%;width:98%}.pallet{right:3%;bottom:22%;width:21%}.caption{min-height:88px;font-size:21px}}
  </style>
</head>
<body><main class="page">
  <header class="head"><h1>Автокран</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
  <section class="scene" aria-live="polite">
    <img class="site-bg" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/construction-site-background.webp?v=20261014" alt="">
    <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка">
    <div class="pallet" id="pallet" aria-hidden="true"><span class="blocks"><i></i><i></i><i></i></span></div>
    <img class="crane active" id="low" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/mobile-crane-hook-lowered.webp?v=20261014" alt="Автокран опустив гак">
    <img class="crane" id="high" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/mobile-crane-load-raised.webp?v=20261014" alt="Автокран підняв вантаж">
    <div class="caption" id="caption">Познайомимося з автокраном!</div><button class="start" id="start" type="button"><span>▶ Послухати</span></button>
  </section><div class="progress"><i id="progress"></i></div>
</main>
<audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/06_avtokran.mp3"></audio>
<audio id="engine" preload="auto" loop src="../../../../../../audio/games/sfx/heavy-vehicle-engine.mp3"></audio>
<script>
  const voice=document.getElementById('voice'),engine=document.getElementById('engine'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),low=document.getElementById('low'),high=document.getElementById('high'),pallet=document.getElementById('pallet');
  let stage='';
  const show=(next,text)=>{caption.textContent=text;if(stage===next)return;stage=next;low.className='crane active';high.className='crane';pallet.className='pallet';if(next==='grab')pallet.classList.add('grabbed');if(next==='lift'){low.classList.remove('active');high.classList.add('active','lifting');pallet.classList.add('lifted')}};
  function reset(){engine.pause();stage='';low.className='crane active';high.className='crane';pallet.className='pallet';caption.textContent='Познайомимося з автокраном!';bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Послухати ще раз'}
  function play(){start.hidden=true;voice.currentTime=0;engine.currentTime=0;engine.volume=.11;voice.volume=1;stage='intro';low.className='crane active entering';high.className='crane';pallet.className='pallet';caption.textContent='Автокран має довгу стрілу й міцний гак.';Promise.allSettled([engine.play(),voice.play()]);setTimeout(()=>low.className='crane active',1700)}
  start.addEventListener('click',play);
  voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||9.67;bar.style.width=`${Math.min(100,t/d*100)}%`;if(t<2.62)show('intro','Автокран має довгу стрілу й міцний гак.');else if(t<5.07)show('ready','Він підіймає важкі вантажі високо вгору.');else if(t<7.18)show('grab','Гак опустив — вантаж підхопив.');else show('lift','Стрілу підняв — і на місце встановив!')});
  voice.addEventListener('ended',()=>setTimeout(()=>{high.className='crane active exiting';setTimeout(reset,2300)},750));
  if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220);
</script></body></html>
