<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Екскаватор — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--cream:#fffaf0;--orange:#ff9450;--sky:#bfeaf6}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}
    button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:clamp(28px,7vw,46px)}
    .back,.sound{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;cursor:pointer;text-decoration:none}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:linear-gradient(#9ee2f4 0 60%,#e8c888 60%);box-shadow:0 14px 36px #59432827}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:6%;top:5%;width:13%}.cloud{left:7%;top:7%;width:16%}.cloud.second{left:31%;top:13%;width:13%;opacity:.88}
    .vehicle{position:absolute;z-index:2;left:25%;bottom:16%;width:58%;height:auto;object-fit:contain;opacity:0;pointer-events:none;filter:drop-shadow(0 10px 8px #60452e35);transition:opacity .28s,transform .55s;transform:translateY(8px) scale(.98);transform-origin:50% 100%}
    .vehicle[hidden]{display:block}.vehicle.active{opacity:1;transform:none}
    .vehicle.driving{animation:excavator-drive 1.8s ease-out both}@keyframes excavator-drive{from{transform:translateX(38%) translateY(2px)}to{transform:translateX(0) translateY(0)}}
    .truck{position:absolute;z-index:3;left:8%;bottom:16%;width:40%;height:auto;object-fit:contain;filter:drop-shadow(0 9px 7px #60452e35);opacity:0;transform:translateX(-135%) scaleX(-1);transition:opacity .25s,transform 1.25s ease-out}.truck.active{opacity:1;transform:translateX(0) scaleX(-1)}.truck.leaving{opacity:1;transform:translateX(-150%) scaleX(-1);transition:transform 1.55s ease-in}
    .ground{position:absolute;left:-5%;right:-5%;bottom:0;height:20%;background:radial-gradient(ellipse at 30% 30%,#a66c3d 0 5%,transparent 6%),linear-gradient(#d4a45d,#c38c4c)}
    .caption{position:absolute;z-index:5;left:4%;right:4%;bottom:3%;min-height:76px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.8vw,30px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}
    .start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}
    .progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:29px}.back{padding:9px 11px;font-size:13px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.vehicle{width:64%;left:25%;bottom:18%}.truck{width:47%;left:7%;bottom:16%}.caption{min-height:88px;font-size:21px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="head"><h1>Екскаватор</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
    <section class="scene" aria-live="polite">
      <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><div class="ground"></div>
      <img class="vehicle active" id="intro" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/excavator-empty-bucket.webp?v=20261014-3" alt="Жовтий екскаватор із порожнім ковшем">
      <img class="vehicle" id="dig" hidden src="../../../../../../media/pograymo/assets/illustrations/transport/construction/excavator-yellow.webp?v=20261014-3" alt="Екскаватор набрав землю">
      <img class="vehicle" id="dump" hidden src="../../../../../../media/pograymo/assets/illustrations/transport/construction/excavator-dumping-soil.webp?v=20261014-2" alt="Екскаватор висипає землю">
      <img class="truck" id="truck" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/dump-truck-bed-lowered.webp?v=20261014-2" alt="Самоскид">
      <div class="caption" id="caption">Познайоммося!</div>
      <button class="start" id="start" type="button"><span>▶ Послухати</span></button>
    </section>
    <div class="progress"><i id="progress"></i></div>
  </main>
  <audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/01_ekskavator.mp3"></audio>
  <audio id="engine" preload="auto" loop src="../../../../../../audio/games/sfx/heavy-vehicle-engine.mp3"></audio>
  <audio id="work" preload="auto" src="../../../../../../audio/games/sfx/heavy-machinery-working.mp3"></audio>
  <script>
    const voice=document.getElementById('voice'),engine=document.getElementById('engine'),work=document.getElementById('work');
    const start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress');
    const intro=document.getElementById('intro'),dig=document.getElementById('dig'),dump=document.getElementById('dump'),truck=document.getElementById('truck');
    let stage='';
    const show=(nextStage,active,text,withTruck=false)=>{if(stage===nextStage){caption.textContent=text;return}stage=nextStage;[intro,dig,dump].forEach(el=>{el.hidden=false;el.classList.toggle('active',el===active)});truck.classList.toggle('active',withTruck);if(!withTruck)truck.classList.remove('leaving');caption.textContent=text};
    function reset(){truck.classList.remove('active','leaving');stage='';show('ready',intro,'Познайоммося!');bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Послухати ще раз'}
    function play(){start.hidden=true;truck.classList.remove('active','leaving');voice.currentTime=0;engine.currentTime=0;work.currentTime=0;engine.volume=.12;work.volume=.16;voice.volume=1;stage='';show('intro',intro,'Екскаватор має довгу, сильну стрілу й великий ківш.');intro.classList.remove('driving');void intro.offsetWidth;intro.classList.add('driving');setTimeout(()=>intro.classList.remove('driving'),1850);Promise.allSettled([engine.play(),work.play(),voice.play()])}
    start.addEventListener('click',play);
    voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||11.21;bar.style.width=`${Math.min(100,t/d*100)}%`;const text=t<3.95?'Екскаватор має довгу, сильну стрілу й великий ківш.':t<6.7?'Він копає землю, готує ями та допомагає будувати будинки.':t<7.95?'Ківш опускається — землю бере.':'Стріла підіймається — в кузов несе.';if(t<4.35)show('intro',intro,text);else if(t<6.9)show('dig',dig,text);else if(t<7.55)show('lift',dump,text);else show('dump',dump,text,true)});
    voice.addEventListener('ended',()=>{stage='finish';[intro,dig,dump].forEach(el=>{el.hidden=false;el.classList.toggle('active',el===intro)});truck.classList.remove('active');truck.classList.add('leaving');setTimeout(()=>{engine.pause();work.pause();reset()},1750)});
  </script>
</body>
</html>
