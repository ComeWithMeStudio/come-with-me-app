<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Навантажувач — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--orange:#ff9450}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:clamp(27px,7vw,46px)}.back{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:#bfeaf6;box-shadow:0 14px 36px #59432827}.site-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;filter:saturate(.9) brightness(1.04)}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:6%;top:5%;width:13%}.cloud{left:7%;top:7%;width:16%}.cloud.second{left:31%;top:13%;width:13%;opacity:.88}
    .loader{position:absolute;z-index:3;left:8%;bottom:16%;width:62%;height:auto;object-fit:contain;opacity:0;filter:drop-shadow(0 10px 8px #60452e35);transition:opacity .22s,transform 1.65s ease-in-out;transform-origin:50% 100%}.loader.active{opacity:1}.loader.entering{animation:drive-in 1.65s ease-out both}.loader.scooping{transform:translateX(18%)}.loader.carrying{transform:translateX(23%)}.loader.exiting{opacity:1;transform:translateX(160%);transition:transform 1.65s ease-in}
    @keyframes drive-in{from{transform:translateX(-115%)}to{transform:translateX(0)}}.raised{left:5%;bottom:16%;width:68%}
    .sand{position:absolute;z-index:4;right:5%;bottom:18%;width:31%;height:15%;transform-origin:50% 100%;transition:transform 1.35s ease-in,opacity .5s}.sand:before,.sand:after{content:"";position:absolute;bottom:0;background:linear-gradient(#d7a25f,#a56d37);box-shadow:inset 0 5px 8px #f0c78666;border-radius:55% 48% 20% 18%}.sand:before{inset:17% 0 0}.sand:after{left:20%;right:17%;top:0}.sand.taken{opacity:.18;transform:scaleX(.75) scaleY(.2)}
    .caption{position:absolute;z-index:5;left:4%;right:4%;bottom:3%;min-height:76px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.8vw,30px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}.start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}.progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:27px}.back{padding:9px 11px;font-size:13px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.loader{left:4%;bottom:18%;width:70%}.raised{left:1%;bottom:18%;width:76%}.sand{right:2%;bottom:20%;width:35%}.caption{min-height:88px;font-size:21px}}
  </style>
</head>
<body><main class="page">
  <header class="head"><h1>Навантажувач</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
  <section class="scene" aria-live="polite">
    <img class="site-bg" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/construction-site-background.webp?v=20261014" alt="">
    <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка">
    <div class="sand" id="sand" aria-hidden="true"></div>
    <img class="loader active" id="low" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/wheel-loader-bucket-lowered.webp?v=20261014" alt="Навантажувач з опущеним ковшем">
    <img class="loader raised" id="high" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/wheel-loader-bucket-raised-sand.webp?v=20261014" alt="Навантажувач підняв пісок">
    <div class="caption" id="caption">Познайомимося з навантажувачем!</div><button class="start" id="start" type="button"><span>▶ Послухати</span></button>
  </section><div class="progress"><i id="progress"></i></div>
</main>
<audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/04_navantazhuvach.mp3"></audio>
<audio id="work" preload="auto" src="../../../../../../audio/games/sfx/heavy-machinery-working.mp3"></audio>
<script>
  const voice=document.getElementById('voice'),work=document.getElementById('work'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),low=document.getElementById('low'),high=document.getElementById('high'),sand=document.getElementById('sand');
  let stage='';
  const show=(next,text)=>{caption.textContent=text;if(stage===next)return;stage=next;low.className='loader active';high.className='loader raised';sand.className='sand';if(next==='scoop'){low.classList.add('scooping');sand.classList.add('taken')}else if(next==='carry'){low.classList.remove('active');high.classList.add('active','carrying');sand.classList.add('taken')}};
  function reset(){work.pause();work.currentTime=10;stage='';low.className='loader active';high.className='loader raised';sand.className='sand';caption.textContent='Познайомимося з навантажувачем!';bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Послухати ще раз'}
  function play(){start.hidden=true;voice.currentTime=0;work.currentTime=10;work.volume=.15;voice.volume=1;stage='intro';low.className='loader active entering';high.className='loader raised';sand.className='sand';caption.textContent='Навантажувач має великий ківш.';Promise.allSettled([work.play(),voice.play()]);setTimeout(()=>low.classList.remove('entering'),1700)}
  start.addEventListener('click',play);
  voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||8.94;bar.style.width=`${Math.min(100,t/d*100)}%`;if(t<2.16)show('intro','Навантажувач має великий ківш.');else if(t<4.91)show('ready','Він набирає пісок і переносить його на будівництві.');else if(t<6.91)show('scoop','Ківш опустив — пісок набрав.');else show('carry','Підняв угору — і перевіз!')});
  voice.addEventListener('ended',()=>setTimeout(()=>{high.classList.add('exiting');setTimeout(()=>{if(new URLSearchParams(location.search).get('mode')==='story')location.href='../avtokran/index.html?mode=story&v=20261014';else reset()},1700)},700));
  if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220);
</script></body></html>
