<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Асфальтоукладач — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--orange:#ff9450}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h1{margin:0;font-size:clamp(25px,6.5vw,43px)}.back{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:#bfeaf6;box-shadow:0 14px 36px #59432827}.site-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;filter:saturate(.9) brightness(1.04)}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:6%;top:5%;width:13%}.cloud{left:7%;top:7%;width:16%}.cloud.second{left:31%;top:13%;width:13%;opacity:.88}
    .road{position:absolute;z-index:2;left:2%;bottom:17%;width:93%;height:13%;border-radius:45% 47% 12% 14%;background:linear-gradient(#414247,#27292d);box-shadow:inset 0 6px 8px #7775,0 5px 8px #493b2d45;transform:scaleX(.02);transform-origin:left center;transition:transform 5.4s linear}.road:after{content:"";position:absolute;left:4%;right:4%;top:19%;height:14%;border-radius:999px;background:linear-gradient(90deg,transparent,#85868a55 12% 88%,transparent)}
    .road.laying{transform:scaleX(.78)}.road.finished{transform:scaleX(1)}
    .paver{position:absolute;z-index:4;left:4%;bottom:16%;width:64%;height:auto;object-fit:contain;filter:drop-shadow(0 10px 8px #60452e35);transform-origin:50% 100%;transition:transform 5.4s linear}.paver.entering{animation:drive-in 1.7s ease-out both}.paver.moving{transform:translateX(48%)}.paver.finished{transform:translateX(54%);transition-duration:1.2s}.paver.exiting{animation:drive-out 1.8s ease-in forwards}
    @keyframes drive-in{from{transform:translateX(-115%)}to{transform:translateX(0)}}@keyframes drive-out{from{transform:translateX(54%)}to{transform:translateX(165%)}}
    .caption{position:absolute;z-index:6;left:4%;right:4%;bottom:3%;min-height:76px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(18px,4.5vw,29px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}.start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}.progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:25px}.back{padding:9px 10px;font-size:12px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.paver{left:1%;bottom:19%;width:72%}.road{left:1%;bottom:20%;height:12%;width:96%}.caption{min-height:88px;font-size:20px}}
  </style>
</head>
<body><main class="page">
  <header class="head"><h1>Асфальтоукладач</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
  <section class="scene" aria-live="polite">
    <img class="site-bg" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/construction-site-background.webp?v=20261014" alt="">
    <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка">
    <div class="road" id="road" aria-hidden="true"></div>
    <img class="paver" id="paver" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/asphalt-paver-yellow-repaired.webp?v=20261014" alt="Жовтий асфальтоукладач">
    <div class="caption" id="caption">Познайомимося з асфальтоукладачем!</div><button class="start" id="start" type="button"><span>▶ Послухати</span></button>
  </section><div class="progress"><i id="progress"></i></div>
</main>
<audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/07_asfaltoukladach.mp3"></audio>
<audio id="engine" preload="auto" loop src="../../../../../../audio/games/sfx/heavy-machinery-working.mp3"></audio>
<script>
  const voice=document.getElementById('voice'),engine=document.getElementById('engine'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),paver=document.getElementById('paver'),road=document.getElementById('road');
  let stage='';
  const show=(next,text)=>{caption.textContent=text;if(stage===next)return;stage=next;if(next==='intro'){paver.className='paver';road.className='road'}else if(next==='drive'||next==='lay'){paver.className='paver moving';road.className='road laying'}else if(next==='finish'){paver.className='paver finished';road.className='road finished'}};
  function reset(){engine.pause();stage='';paver.className='paver';road.className='road';caption.textContent='Познайомимося з асфальтоукладачем!';bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Послухати ще раз'}
  function play(){start.hidden=true;voice.currentTime=0;engine.currentTime=0;engine.volume=.13;voice.volume=1;stage='intro';paver.className='paver entering';road.className='road';caption.textContent='Асфальтоукладач розподіляє гарячий асфальт рівним шаром.';Promise.allSettled([engine.play(),voice.play()]);setTimeout(()=>paver.className='paver',1700)}
  start.addEventListener('click',play);
  voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||11.39;bar.style.width=`${Math.min(100,t/d*100)}%`;if(t<3.41)show('intro','Асфальтоукладач розподіляє гарячий асфальт рівним шаром.');else if(t<6.82)show('drive','Він повільно їде вперед і залишає за собою нову дорогу.');else if(t<9.36)show('lay','Асфальт приймає — рівненько вкладає.');else show('finish','Крок за кроком дорогу прокладає!')});
  voice.addEventListener('ended',()=>setTimeout(()=>{paver.className='paver exiting';setTimeout(()=>{if(new URLSearchParams(location.search).get('mode')==='story')location.href='../dorozhnii-katok/index.html?mode=story&v=20261014';else reset()},1850)},650));
  if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220);
</script></body></html>
