<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Самоскид — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--cream:#fffaf0;--orange:#ff9450}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}
    button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:10px}.head h1{margin:0;font-size:clamp(28px,7vw,46px)}
    .back{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:#bfeaf6;box-shadow:0 14px 36px #59432827}
    .site-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;filter:saturate(.9) brightness(1.04)}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:6%;top:5%;width:13%}.cloud{left:7%;top:7%;width:16%}.cloud.second{left:31%;top:13%;width:13%;opacity:.88}
    .truck{position:absolute;z-index:3;left:14%;bottom:16%;width:60%;height:auto;object-fit:contain;filter:drop-shadow(0 10px 8px #60452e35);opacity:0;transform-origin:50% 100%;transition:opacity .25s,transform .55s}
    .truck.active{opacity:1}.truck.entering{animation:drive-in 1.75s ease-out both}.truck.receiving{transform:translateX(7%)}.truck.exiting{opacity:1;transform:translateX(155%);transition:transform 1.7s ease-in}
    @keyframes drive-in{from{transform:translateX(-115%)}to{transform:translateX(0)}}
    .raised{left:9%;bottom:15%;width:67%}
    .cargo{position:absolute;z-index:4;left:17.5%;bottom:52%;width:26%;height:7%;opacity:0;transform:translateY(-90%);transition:opacity .2s,transform 1.1s ease-in}
    .cargo:before{content:"";position:absolute;inset:10% 0 0;border-radius:52% 48% 15% 15%;background:radial-gradient(circle at 24% 22%,#d09456 0 7%,transparent 8%),radial-gradient(circle at 61% 30%,#8f542e 0 8%,transparent 9%),linear-gradient(#b97842,#754326);box-shadow:inset 0 5px 7px #e1aa6a55}
    .cargo.loading{animation:load-inside 1.15s ease-in both}.cargo.dumped{opacity:0;transform:translateX(7%) translateY(75%)}
    @keyframes load-inside{0%{opacity:0;transform:translateY(-115%) scale(.78)}25%{opacity:1}70%{opacity:1;transform:translateX(5%) translateY(5%) scale(.9)}100%{opacity:0;transform:translateX(7%) translateY(68%) scale(.82)}}
    .caption{position:absolute;z-index:5;left:4%;right:4%;bottom:3%;min-height:76px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.8vw,30px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}
    .start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}
    .progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:29px}.back{padding:9px 11px;font-size:13px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.truck{left:11%;bottom:18%;width:69%}.raised{left:5%;bottom:17%;width:77%}.cargo{left:15%;bottom:49%;width:30%}.caption{min-height:88px;font-size:21px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="head"><h1>Самоскид</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
    <section class="scene" aria-live="polite">
      <img class="site-bg" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/construction-site-background.webp?v=20261014" alt="">
      <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка">
      <img class="truck active" id="lowered" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/dump-truck-bed-lowered.webp?v=20261014-4" alt="Самоскид з опущеним кузовом">
      <div class="cargo" id="cargo" aria-hidden="true"></div>
      <img class="truck raised" id="raised" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/dump-truck-raised-soil.webp?v=20261014" alt="Самоскид висипає землю">
      <div class="caption" id="caption">Познайомимося із самоскидом!</div>
      <button class="start" id="start" type="button"><span>▶ Послухати</span></button>
    </section>
    <div class="progress"><i id="progress"></i></div>
  </main>
  <audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/03_samoskyd.mp3"></audio>
  <audio id="work" preload="auto" src="../../../../../../audio/games/sfx/heavy-machinery-working.mp3"></audio>
  <script>
    const voice=document.getElementById('voice'),work=document.getElementById('work'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),lowered=document.getElementById('lowered'),raised=document.getElementById('raised'),cargo=document.getElementById('cargo');
    let stage='';
    const show=(next,text)=>{caption.textContent=text;if(stage===next)return;stage=next;lowered.className='truck active';raised.className='truck raised';cargo.className='cargo';if(next==='load'){lowered.classList.add('receiving');cargo.classList.add('loading')}else if(next==='dump'){raised.classList.add('active');lowered.classList.remove('active');cargo.classList.add('dumped')}};
    function reset(){work.pause();work.currentTime=8;stage='';lowered.className='truck active';raised.className='truck raised';cargo.className='cargo';caption.textContent='Познайомимося із самоскидом!';bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Послухати ще раз'}
    function play(){start.hidden=true;voice.currentTime=0;work.currentTime=8;work.volume=.15;voice.volume=1;stage='intro';lowered.className='truck active entering';raised.className='truck raised';cargo.className='cargo';caption.textContent='Самоскид має великий міцний кузов.';Promise.allSettled([work.play(),voice.play()]);setTimeout(()=>lowered.classList.remove('entering'),1800)}
    start.addEventListener('click',play);
    voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||9.77;bar.style.width=`${Math.min(100,t/d*100)}%`;if(t<2.35)show('intro','Самоскид має великий міцний кузов.');else if(t<4.81)show('carry','Він перевозить землю, пісок і каміння.');else if(t<7.48)show('load','Самоскид під’їжджає — вантаж приймає.');else show('dump','Кузов підіймає — землю висипає!')});
    voice.addEventListener('ended',()=>setTimeout(()=>{raised.classList.remove('active');lowered.className='truck active exiting';cargo.className='cargo';setTimeout(()=>{if(new URLSearchParams(location.search).get('mode')==='story')location.href='../navantazhuvach/index.html?mode=story&v=20261014';else reset()},1750)},750));
    if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220);
  </script>
  <script src="../story-wake-lock.js?v=20261014"></script>
</body>
</html>
