<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Бетонозмішувач — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--orange:#ff9450}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h1{margin:0;font-size:clamp(25px,6.5vw,43px)}.back{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:#bfeaf6;box-shadow:0 14px 36px #59432827}.site-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;filter:saturate(.9) brightness(1.04)}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:6%;top:5%;width:13%}.cloud{left:7%;top:7%;width:16%}.cloud.second{left:31%;top:13%;width:13%;opacity:.88}
    .mixer{position:absolute;z-index:3;left:7%;bottom:16%;width:78%;height:auto;object-fit:contain;filter:drop-shadow(0 10px 8px #60452e35);transform-origin:50% 100%}.mixer.entering{animation:drive-in 1.8s ease-out both}.mixer.working{animation:engine-rock .72s ease-in-out infinite}.mixer.exiting{animation:drive-out 2s ease-in forwards}
    @keyframes drive-in{from{transform:translateX(-125%)}to{transform:translateX(0)}}@keyframes drive-out{from{transform:translateX(0)}to{transform:translateX(135%)}}@keyframes engine-rock{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    .drum-spin{position:absolute;z-index:4;left:18%;bottom:38%;width:37%;aspect-ratio:1.4;border-radius:50%;opacity:0;pointer-events:none;overflow:hidden;transform:rotate(6deg);transform-origin:50% 50%;background:repeating-linear-gradient(145deg,#078fe8 0 19%,#ff8b22 19% 38%);background-size:100% 190%;box-shadow:inset 13px 4px 18px #fff5,inset -13px -7px 18px #123b7455,0 2px 3px #2e3b5140;transition:opacity .28s}.drum-spin:after{content:"";position:absolute;inset:4% 9% 48% 12%;border-radius:50%;background:linear-gradient(#fff8,transparent);filter:blur(1px)}.drum-spin.active{opacity:1;animation:drum-roll .9s linear infinite}@keyframes drum-roll{from{background-position:0 0}to{background-position:0 190%}}
    .caption{position:absolute;z-index:6;left:4%;right:4%;bottom:3%;min-height:76px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.7vw,30px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}.start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(22px,6vw,34px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}.progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:24px}.back{padding:9px 10px;font-size:12px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.mixer{left:3%;bottom:19%;width:88%}.drum-spin{left:15%;bottom:40%;width:42%}.caption{min-height:88px;font-size:20px}}
  </style>
</head>
<body><main class="page">
  <header class="head"><h1>Бетонозмішувач</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
  <section class="scene" aria-live="polite">
    <img class="site-bg" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/construction-site-background.webp?v=20261014" alt="">
    <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка">
    <img class="mixer" id="mixer" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/concrete-mixer-yellow-blue-orange.webp?v=20261014" alt="Жовтий бетонозмішувач із кольоровим барабаном">
    <div class="drum-spin" id="spin" aria-hidden="true"></div>
    <div class="caption" id="caption">Познайомимося з бетонозмішувачем!</div><button class="start" id="start" type="button"><span>▶ Послухати</span></button>
  </section><div class="progress"><i id="progress"></i></div>
</main>
<audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/08_betonozmishuvach.mp3"></audio>
<audio id="engine" preload="auto" loop src="../../../../../../audio/games/sfx/heavy-vehicle-engine.mp3"></audio>
<script>
  const voice=document.getElementById('voice'),engine=document.getElementById('engine'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),mixer=document.getElementById('mixer'),spin=document.getElementById('spin');
  let stage='';
  const show=(next,text)=>{caption.textContent=text;if(stage===next)return;stage=next;mixer.className='mixer';spin.className='drum-spin';if(next==='turn'||next==='mix'){mixer.classList.add('working');spin.classList.add('active')}};
  function reset(){engine.pause();stage='';mixer.className='mixer';spin.className='drum-spin';caption.textContent='Познайомимося з бетонозмішувачем!';bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Послухати ще раз'}
  function play(){start.hidden=true;voice.currentTime=0;engine.currentTime=0;engine.volume=.12;voice.volume=1;stage='intro';mixer.className='mixer entering';spin.className='drum-spin';caption.textContent='Бетонозмішувач везе бетон у великому барабані.';Promise.allSettled([engine.play(),voice.play()]);setTimeout(()=>mixer.className='mixer',1800)}
  start.addEventListener('click',play);
  voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||10.43;bar.style.width=`${Math.min(100,t/d*100)}%`;if(t<2.93)show('intro','Бетонозмішувач везе бетон у великому барабані.');else if(t<6.04)show('turn','Барабан обертається, щоб бетон не застиг у дорозі.');else if(t<8.31)show('mix','Крутиться барабан — бетон перемішує.');else show('deliver','На будівництво швиденько доставляє!')});
  voice.addEventListener('ended',()=>setTimeout(()=>{spin.className='drum-spin';mixer.className='mixer exiting';setTimeout(reset,2050)},650));
  if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220);
</script></body></html>
