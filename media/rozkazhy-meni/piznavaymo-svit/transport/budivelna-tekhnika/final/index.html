<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Чудова робота! — Come With Me Studio</title>
  <style>
    :root{color-scheme:only light;--ink:#493b49;--orange:#ff9450}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
    body{background:linear-gradient(#c9f0f7 0 62%,#f4ddb1 62%);overflow-x:hidden}button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:16px 14px 28px;display:flex;flex-direction:column;gap:14px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h1{margin:0;font-size:clamp(25px,6.5vw,43px)}.back{border:0;border-radius:999px;background:#fffaf0e8;color:var(--ink);padding:11px 15px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}
    .scene{position:relative;flex:0 1 680px;min-height:470px;border-radius:34px;overflow:hidden;background:#bfeaf6;box-shadow:0 14px 36px #59432827}.site-bg{position:absolute;z-index:0;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 46%;filter:saturate(.9) brightness(1.05)}
    .sun,.cloud{position:absolute;z-index:1;height:auto;object-fit:contain;filter:drop-shadow(0 5px 5px #55402c18)}.sun{right:5%;top:4%;width:14%}.cloud{left:5%;top:6%;width:17%}.cloud.second{left:29%;top:12%;width:13%;opacity:.88}
    .machine{position:absolute;z-index:3;height:auto;object-fit:contain;filter:drop-shadow(0 7px 6px #60452e38);opacity:0;transform:translateX(var(--from))}.machine.arrive{animation:arrive 1.15s cubic-bezier(.2,.78,.25,1) var(--delay) forwards}@keyframes arrive{0%{opacity:0;transform:translateX(var(--from))}100%{opacity:1;transform:translateX(0)}}
    .crane{left:-1%;bottom:39%;width:37%;--from:-130%;--delay:.15s}.paver{left:33%;bottom:42%;width:31%;--from:220%;--delay:.55s}.roller{right:-1%;bottom:40%;width:29%;--from:145%;--delay:.95s}.excavator{left:-5%;bottom:19%;width:31%;--from:-130%;--delay:1.35s}.bulldozer{left:15%;bottom:18%;width:30%;--from:-180%;--delay:1.75s}.truck{left:36%;bottom:19%;width:29%;--from:190%;--delay:2.15s}.loader{left:56%;bottom:18%;width:28%;--from:165%;--delay:2.55s}.mixer{right:-6%;bottom:20%;width:33%;--from:150%;--delay:2.95s}
    .caption{position:absolute;z-index:6;left:4%;right:4%;bottom:3%;min-height:88px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.7vw,30px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}.start{position:absolute;z-index:8;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:var(--orange);font-size:clamp(20px,5.5vw,32px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}.progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:var(--orange);transition:width .12s linear}
    @media(max-width:540px){.page{padding:10px 10px 20px}.head h1{font-size:24px}.back{padding:9px 10px;font-size:12px}.scene{flex-basis:auto;height:64svh;min-height:540px;border-radius:28px}.crane{width:42%;bottom:42%}.paver{left:29%;width:38%;bottom:43%}.roller{width:35%;bottom:42%}.excavator{width:37%;bottom:23%}.bulldozer{left:13%;width:36%;bottom:22%}.truck{left:34%;width:35%;bottom:23%}.loader{left:54%;width:34%;bottom:22%}.mixer{width:39%;bottom:24%}.caption{min-height:96px;font-size:20px}}
  </style>
</head>
<body><main class="page">
  <header class="head"><h1>Чудова робота!</h1><a class="back" href="../index.html">← Будівельні машини</a></header>
  <section class="scene" id="scene" aria-live="polite">
    <img class="site-bg" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/construction-site-background.webp?v=20261014" alt="">
    <img class="sun" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="Сонечко"><img class="cloud" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка"><img class="cloud second" src="../../../../../../media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="Хмаринка">
    <img class="machine crane" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/mobile-crane-load-raised.webp?v=20261014" alt="Автокран"><img class="machine paver" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/asphalt-paver-yellow-repaired.webp?v=20261014" alt="Асфальтоукладач"><img class="machine roller" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/road-roller-orange-repaired.webp?v=20261014" alt="Дорожній каток">
    <img class="machine excavator" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/excavator-empty-bucket.webp?v=20261014" alt="Екскаватор"><img class="machine bulldozer" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/bulldozer-yellow.webp?v=20261014" alt="Бульдозер"><img class="machine truck" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/dump-truck-bed-lowered.webp?v=20261014" alt="Самоскид"><img class="machine loader" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/wheel-loader-bucket-lowered.webp?v=20261014" alt="Навантажувач"><img class="machine mixer" src="../../../../../../media/pograymo/assets/illustrations/transport/construction/concrete-mixer-yellow-blue-orange.webp?v=20261014" alt="Бетонозмішувач">
    <div class="caption" id="caption">Усі машини повертаються на майданчик!</div><button class="start" id="start" type="button"><span>▶ Послухати фінал</span></button>
  </section><div class="progress"><i id="progress"></i></div>
</main>
<audio id="voice" preload="auto" src="../../../../../../audio/rozkazhy-meni/piznavaymo-svit/transport/budivelna-tekhnika/09_budivelnyi-final.mp3"></audio>
<audio id="engine" preload="auto" loop src="../../../../../../audio/games/sfx/heavy-vehicle-engine.mp3"></audio>
<script>
  const voice=document.getElementById('voice'),engine=document.getElementById('engine'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),machines=[...document.querySelectorAll('.machine')];
  function reset(){engine.pause();machines.forEach(m=>m.classList.remove('arrive'));caption.textContent='Усі машини повертаються на майданчик!';bar.style.width='0';start.hidden=false;start.querySelector('span').textContent='↻ Подивитися всю історію ще раз'}
  function play(){start.hidden=true;voice.currentTime=0;engine.currentTime=0;engine.volume=.1;voice.volume=1;machines.forEach(m=>m.classList.remove('arrive'));void document.body.offsetWidth;machines.forEach(m=>m.classList.add('arrive'));caption.textContent='Будівельні машини працювали дружно —';Promise.allSettled([engine.play(),voice.play()])}
  start.addEventListener('click',()=>{if(start.querySelector('span').textContent.includes('ще раз'))location.href='../vstup/index.html?mode=story&v=20261014-5';else play()});
  voice.addEventListener('timeupdate',()=>{const t=voice.currentTime,d=voice.duration||6.66;bar.style.width=`${Math.min(100,t/d*100)}%`;caption.textContent=t<2.2?'Будівельні машини працювали дружно —':t<4.55?'і разом підготували майданчик!':'Тепер тут можна гратися. Чудова робота!'});
  voice.addEventListener('ended',()=>setTimeout(()=>{engine.pause();bar.style.width='100%';start.hidden=false;start.style.background='transparent';start.style.alignItems='end';start.style.paddingBottom='15%';start.querySelector('span').textContent='↻ Подивитися всю історію ще раз'},700));
  if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220);
</script></body></html>
