    .earth{position:absolute;inset:64% 0 0;background:linear-gradient(#b97940,#986037)}.grass{position:absolute;z-index:2;left:-3%;width:106%;height:auto;object-fit:fill;pointer-events:none}.grass-1{bottom:16%;height:19%;opacity:.72}.grass-2{bottom:20%;height:18%;opacity:.82;transform:scaleX(-1)}.grass-3{bottom:24%;height:17%;opacity:.94}.running .grass-1{animation:grassSway 2.8s ease-in-out infinite alternate}.running .grass-2{animation:grassSwayFlip 3.2s .25s ease-in-out infinite alternate}.running .grass-3{animation:grassSway 2.5s .5s ease-in-out infinite alternate}.pheasant{position:absolute;z-index:7;left:8%;bottom:32%;width:min(30vw,330px);opacity:0;filter:drop-shadow(0 7px 5px #51311f35)}.sprayer{position:absolute;z-index:6;left:-70%;bottom:20%;width:min(48vw,550px);filter:drop-shadow(0 10px 8px #51311f45)}.mist{position:absolute;z-index:5;left:-76%;bottom:20%;width:min(57vw,650px);height:auto;opacity:0;object-fit:contain;filter:blur(.25px)}.running .pheasant{animation:escape 4.2s .2s ease-out forwards}.running .sprayer{animation:drive 10.2s .2s ease-in-out forwards}.running .mist{animation:spray 10.2s .2s ease-in-out forwards}@keyframes grassSway{from{transform:translateX(-.7%) skewX(-1deg)}to{transform:translateX(.7%) skewX(1deg)}}@keyframes grassSwayFlip{from{transform:scaleX(-1) translateX(-.7%) skewX(-1deg)}to{transform:scaleX(-1) translateX(.7%) skewX(1deg)}}@keyframes escape{0%{left:8%;bottom:32%;opacity:0;transform:scale(.55) rotate(-10deg)}10%{opacity:1}92%{left:102%;bottom:75%;opacity:1;transform:scale(.92) rotate(8deg)}100%{left:116%;bottom:80%;opacity:0;transform:scale(.95) rotate(10deg)}}@keyframes drive{0%{left:-70%}100%{left:108%}}@keyframes spray{0%{left:-76%;opacity:0}12%,78%{opacity:.58}100%{left:101%;opacity:0}}.top{position:absolute;z-index:10;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center}.pill{padding:10px 14px;border-radius:999px;background:#fffbe8e8;color:inherit;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}.title{font-size:clamp(23px,5.6vw,39px)}.panel{position:absolute;z-index:9;left:4%;right:4%;bottom:3%;padding:18px 18px 15px;border-radius:28px;background:#fffaf0ee;text-align:center;box-shadow:0 10px 30px #604f7040}.text{min-height:52px;font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}.go{margin-top:12px;border:0;border-radius:999px;padding:13px 25px;background:#69b94d;color:white;font:900 clamp(18px,4vw,24px) "Trebuchet MS"}.go:disabled{opacity:.55}.repeat{display:none}.done .start{display:none}.done .repeat{display:inline-block}@media(max-width:600px){.sun{top:15%;width:18%}.c1{top:9%;width:27%}.c2{left:37%;top:21%;width:20%}.c3{right:26%;top:7%;width:20%}.farm{width:66%;right:-4%}.sprayer{width:62vw;bottom:21%}.mist{width:72vw;bottom:22%}.pheasant{width:47vw;bottom:31%}.panel{left:3%;right:3%;bottom:2%;padding:14px}.title{max-width:62%;font-size:24px}}
</style></head><body><main class="scene" id="scene"><div class="top"><strong class="pill title">💧 Обприскувач</strong><a class="pill" href="../index.html">← Машини</a></div><img class="sun" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt=""><img class="cloud cloud-1" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud cloud-2" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud cloud-3" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="tree apple-1" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple-2" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple-3" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple-4" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree pear-1" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-1" alt="Груша"><img class="tree pear-2" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-1" alt="Груша"><img class="tree pear-3" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear-4" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear-5" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear-6" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="farm" src="../../../../../pograymo/assets/illustrations/farm_scene/farm-barn-red.webp?v=farm-scene-1" alt="Ферма"><div class="earth"></div><img class="grass grass-1" src="../../../../../pograymo/assets/illustrations/farm_scene/meadow-grass-strip.webp?v=grass-2" alt=""><img class="grass grass-2" src="../../../../../pograymo/assets/illustrations/farm_scene/meadow-grass-strip.webp?v=grass-2" alt=""><img class="grass grass-3" src="../../../../../pograymo/assets/illustrations/farm_scene/meadow-grass-strip.webp?v=grass-2" alt=""><img class="pheasant" src="../../../../../pograymo/assets/illustrations/farm_scene/pheasant-flying-v2.webp" alt="Фазан відлітає"><img class="mist" src="../../../../../pograymo/assets/illustrations/farm_scene/spray-mist.webp?v=spray-2" alt="Легкий туман розпилення"><img class="sprayer" src="../../../../../pograymo/assets/illustrations/transport/farm/crop-sprayer-turquoise-yellow.webp" alt="Обприскувач працює на полі"><section class="panel"><div class="text" id="text">На поле виїжджає обприскувач.</div><button class="go start" id="start">▶ Подивитися</button><button class="go repeat" id="repeat">↻ Ще раз</button></section></main><audio id="voice" preload="auto" src="/audio/rozkazhy-meni/piznavaymo-svit/transport/mashyny-na-fermi/03-obpryskuvach-gigi.mp3?v=2"></audio><script>
const scene=document.getElementById('scene'),text=document.getElementById('text'),start=document.getElementById('start'),repeat=document.getElementById('repeat'),voice=document.getElementById('voice'),isAll=new URLSearchParams(location.search).get('mode')==='all';const captions=[['На поле виїжджає обприскувач.',0],['Ой, фазан почув машину й полетів у безпечне місце!',900],['Обприскувач рівномірно доглядає за рослинами.',3900],['Поле оброблено — обприскувач завершив роботу!',8200]];let timers=[];function finish(){scene.classList.add('done');start.disabled=false}function play(){timers.forEach(clearTimeout);timers=[];if(!isAll){voice.pause();voice.currentTime=0}scene.classList.remove('running','done');void scene.offsetWidth;scene.classList.add('running');start.disabled=true;if(!isAll)voice.play().catch(()=>{});captions.forEach(([t,ms])=>timers.push(setTimeout(()=>text.textContent=t,ms)));timers.push(setTimeout(finish,11200))}start.onclick=play;repeat.onclick=play;if(isAll){document.querySelector('.panel').style.display='none';play()}
