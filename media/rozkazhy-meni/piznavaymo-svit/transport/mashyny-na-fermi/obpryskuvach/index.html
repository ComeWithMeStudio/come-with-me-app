<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Обприскувач — Машини на фермі</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#a9e3f4;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49}.scene{position:relative;width:100vw;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(#a9e3f4 0 51%,#8fca61 51% 64%,#b97940 64%)}.sun,.cloud,.farm,.tree{position:absolute;object-fit:contain;pointer-events:none}.sun{z-index:1;right:7%;top:13%;width:min(14vw,130px)}.cloud{z-index:1}.c1{left:5%;top:8%;width:min(22vw,205px)}.c2{left:37%;top:20%;width:min(16vw,150px)}.c3{right:25%;top:6%;width:min(18vw,165px)}.farm{z-index:2;right:1%;bottom:35%;width:min(54vw,630px)}.tree{z-index:3}.a1{left:-5%;bottom:36%;width:min(12vw,136px)}.a2{left:9%;bottom:35%;width:min(14vw,160px)}.p1{left:19%;bottom:48%;width:min(8vw,90px)}.p2{left:30%;bottom:46%;width:min(10vw,112px)}.earth{position:absolute;inset:64% 0 0;background:linear-gradient(#b97940,#986037)}.rows{position:absolute;z-index:2;left:0;right:0;bottom:16%;height:24%;background:repeating-linear-gradient(100deg,transparent 0 28px,#5f9f35 30px 42px,transparent 44px 72px);opacity:.8}.pheasant{position:absolute;z-index:7;left:8%;bottom:32%;width:min(30vw,330px);opacity:0;filter:drop-shadow(0 7px 5px #51311f35)}.sprayer{position:absolute;z-index:6;left:-70%;bottom:20%;width:min(55vw,620px);filter:drop-shadow(0 10px 8px #51311f45)}.mist{position:absolute;z-index:5;left:-76%;bottom:20%;width:min(64vw,730px);height:auto;opacity:0;object-fit:contain;filter:blur(.25px)}.running .pheasant{animation:escape 3.2s .2s ease-out forwards}.running .sprayer{animation:drive 8.2s 1.8s ease-in-out forwards}.running .mist{animation:spray 8.2s 1.8s ease-in-out forwards}@keyframes escape{0%{left:8%;bottom:32%;opacity:0;transform:scale(.55) rotate(-10deg)}10%{opacity:1}100%{left:105%;bottom:78%;opacity:0;transform:scale(.95) rotate(10deg)}}@keyframes drive{0%{left:-70%}100%{left:108%}}@keyframes spray{0%{left:-76%;opacity:0}12%,78%{opacity:.58}100%{left:101%;opacity:0}}.top{position:absolute;z-index:10;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center}.pill{padding:10px 14px;border-radius:999px;background:#fffbe8e8;color:inherit;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}.title{font-size:clamp(23px,5.6vw,39px)}.panel{position:absolute;z-index:9;left:4%;right:4%;bottom:3%;padding:18px 18px 15px;border-radius:28px;background:#fffaf0ee;text-align:center;box-shadow:0 10px 30px #604f7040}.text{min-height:52px;font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}.go{margin-top:12px;border:0;border-radius:999px;padding:13px 25px;background:#69b94d;color:white;font:900 clamp(18px,4vw,24px) "Trebuchet MS"}.go:disabled{opacity:.55}.repeat{display:none}.done .start{display:none}.done .repeat{display:inline-block}@media(max-width:600px){.sun{top:15%;width:18%}.c1{top:9%;width:27%}.c2{left:37%;top:21%;width:20%}.c3{right:26%;top:7%;width:20%}.farm{width:66%;right:-4%}.sprayer{width:72vw;bottom:21%}.mist{width:84vw;bottom:22%}.pheasant{width:47vw;bottom:31%}.panel{left:3%;right:3%;bottom:2%;padding:14px}.title{max-width:62%;font-size:24px}}
</style></head><body><main class="scene" id="scene"><div class="top"><strong class="pill title">💧 Обприскувач</strong><a class="pill" href="../index.html">← Машини</a></div><img class="sun" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt=""><img class="cloud c1" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud c2" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud c3" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="tree a1" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp" alt="Яблуня"><img class="tree a2" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp" alt="Яблуня"><img class="tree p1" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp" alt="Груша"><img class="tree p2" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp" alt="Груша"><img class="farm" src="../../../../../pograymo/assets/illustrations/farm_scene/farm-barn-red.webp" alt="Ферма"><div class="earth"></div><div class="rows"></div><img class="pheasant" src="../../../../../pograymo/assets/illustrations/farm_scene/pheasant-flying-v2.webp" alt="Фазан відлітає"><img class="mist" src="../../../../../pograymo/assets/illustrations/farm_scene/spray-mist.webp?v=spray-2" alt="Легкий туман розпилення"><img class="sprayer" src="../../../../../pograymo/assets/illustrations/transport/farm/crop-sprayer-turquoise-yellow.webp" alt="Обприскувач працює на полі"><section class="panel"><div class="text" id="text">На поле виїжджає обприскувач.</div><button class="go start" id="start">▶ Подивитися</button><button class="go repeat" id="repeat">↻ Ще раз</button></section></main><script>
const scene=document.getElementById('scene'),text=document.getElementById('text'),start=document.getElementById('start'),repeat=document.getElementById('repeat');const captions=[['На поле виїжджає обприскувач.',0],['Ой, фазан почув машину й полетів у безпечне місце!',900],['Обприскувач рівномірно доглядає за рослинами.',3900],['Поле оброблено — обприскувач завершив роботу!',8200]];let timers=[];function finish(){scene.classList.add('done');start.disabled=false}function play(){timers.forEach(clearTimeout);scene.classList.remove('running','done');void scene.offsetWidth;scene.classList.add('running');start.disabled=true;captions.forEach(([t,ms])=>timers.push(setTimeout(()=>text.textContent=t,ms)));timers.push(setTimeout(finish,10600))}start.onclick=play;repeat.onclick=play;
</script></body></html>
