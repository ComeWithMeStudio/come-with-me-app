<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Комбайн — Машини на фермі</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;overflow:hidden;background:#a9e3f4;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49}
    .scene{position:relative;width:100vw;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(#a9e3f4 0 51%,#8fca61 51% 64%,#c68c4f 64%)}
    .sun,.cloud{position:absolute;object-fit:contain;z-index:1;pointer-events:none}.sun{right:7%;top:13%;width:min(14vw,130px)}.cloud{width:min(22vw,205px)}.cloud-1{left:5%;top:8%}.cloud-2{left:36%;top:19%;width:min(16vw,150px);opacity:.9}.cloud-3{right:25%;top:6%;width:min(18vw,165px);opacity:.92}
    .farm,.tree{position:absolute;object-fit:contain;pointer-events:none}.farm{z-index:2;right:1%;bottom:35%;width:min(54vw,630px)}.tree{position:absolute;object-fit:contain;pointer-events:none}.pear-1,.pear-2,.pear-3{z-index:1}.apple-1,.apple-2,.apple-3{z-index:2}.pear-1{left:1%;bottom:49%;width:min(7vw,78px)}.pear-2{left:9%;bottom:46%;width:min(9vw,102px)}.pear-3{left:19%;bottom:43%;width:min(11vw,126px)}.apple-1{left:7%;bottom:40%;width:min(10vw,112px)}.apple-2{left:18%;bottom:37%;width:min(13vw,148px)}.apple-3{left:32%;bottom:34%;width:min(16vw,182px)}
    .tit{position:absolute;z-index:4;left:-14%;width:min(8vw,82px);height:auto;opacity:0;pointer-events:none;filter:drop-shadow(0 5px 4px #51311f28)}.tit-1{top:27%}.tit-2{top:34%;width:min(6.5vw,68px)}.scene.running .tit-1{animation:titFly 8s .4s linear forwards}.scene.running .tit-2{animation:titFly 8.6s 1.1s linear forwards}
    .earth{position:absolute;z-index:0;inset:64% 0 0;background:linear-gradient(#c68c4f,#ae713e)}
    .crop{position:absolute;left:-2%;width:104%;height:27%;bottom:17%;pointer-events:none}.crop img{width:100%;height:100%;object-fit:fill}.stubble{z-index:2}.wheat{z-index:3;clip-path:inset(0 0 0 0)}
    .combine{position:absolute;z-index:5;right:-73%;bottom:20%;width:min(66vw,760px);height:auto;filter:drop-shadow(0 10px 8px #51311f45)}
    .pheasant{position:absolute;z-index:7;left:8%;bottom:36%;width:min(20vw,205px);height:auto;opacity:0;transform:rotate(-8deg);filter:drop-shadow(0 7px 5px #51311f35)}
    .scene.running .combine{animation:harvest 10s ease-in-out forwards}.scene.running .wheat{animation:cutWheat 9.2s .55s linear forwards}.scene.running .pheasant{animation:birdEscape 4.5s 8s ease-out forwards}
    @keyframes harvest{0%{right:-73%}13%{right:-50%}100%{right:108%}}
    @keyframes cutWheat{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
    @keyframes birdEscape{0%{left:8%;bottom:36%;opacity:0;transform:rotate(-8deg) scale(.58)}9%{opacity:1}55%{opacity:1;transform:rotate(4deg) scale(1)}92%{opacity:1}100%{left:105%;bottom:76%;opacity:0;transform:rotate(12deg) scale(.86)}}
    @keyframes titFly{0%{left:-14%;opacity:0;transform:translateY(0) rotate(2deg)}7%{opacity:1}48%{transform:translateY(-18px) rotate(-3deg)}90%{opacity:1}100%{left:108%;opacity:0;transform:translateY(8px) rotate(3deg)}}
    .top{position:absolute;z-index:9;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center}.pill{padding:10px 14px;border-radius:999px;background:#fffbe8e8;color:inherit;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}.title{font-size:clamp(25px,6vw,40px)}
    .panel{position:absolute;z-index:8;left:4%;right:4%;bottom:3%;padding:18px 18px 15px;border-radius:28px;background:#fffaf0ee;text-align:center;box-shadow:0 10px 30px #604f7040}.text{min-height:52px;font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}.go{margin-top:12px;border:0;border-radius:999px;padding:13px 25px;background:#69b94d;color:#fff;font:900 clamp(18px,4vw,24px) "Trebuchet MS";box-shadow:0 7px 18px #355e2d50}.go:disabled{opacity:.55}.repeat{display:none}.done .start{display:none}.done .repeat{display:inline-block}
    @media(max-width:600px){.sun{top:15%;right:5%;width:18%}.cloud-1{top:9%;width:27%}.cloud-2{left:37%;top:21%;width:20%}.cloud-3{right:26%;top:7%;width:20%}.farm{width:66%;right:-4%;bottom:35%}.pear-1{left:2%;bottom:48%;width:8%}.pear-2{left:11%;bottom:46%;width:10%}.pear-3{left:22%;bottom:44%;width:12%}.apple-1{left:-20%;bottom:39%;width:16%}.apple-2{left:-3%;bottom:37%;width:19%}.apple-3{left:17%;bottom:35%;width:22%}.tit{width:12%;left:-16%}.tit-1{top:29%}.tit-2{top:35%;width:10%}.crop{height:27%;bottom:19%}.combine{width:74vw;bottom:19%;right:-84%}.pheasant{width:32vw;left:26%;bottom:40%}@keyframes harvest{0%{right:-84%}13%{right:-60%}100%{right:110%}}.panel{left:3%;right:3%;bottom:2%;padding:14px}.top{align-items:flex-start}.title{max-width:58%}}
    @media(prefers-reduced-motion:reduce){.scene.running .combine,.scene.running .wheat,.scene.running .pheasant{animation-duration:.01ms;animation-delay:0s}}
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <div class="top"><strong class="pill title">🌾 Комбайн</strong><a class="pill" href="../index.html">← Машини</a></div>
    <img class="sun" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="">
    <img class="cloud cloud-1" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="">
    <img class="cloud cloud-2" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="">
    <img class="cloud cloud-3" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="">
    <img class="tit tit-1" src="../../../../../pograymo/assets/illustrations/nature/birds/bird-flying.webp" alt="Синичка летить у небі">
    <img class="tit tit-2" src="../../../../../pograymo/assets/illustrations/nature/birds/bird-flying.webp" alt="Синичка летить у небі">
    <img class="tree apple-1" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple-2" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple-3" src="../../../../../pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня">
    <img class="tree pear-1" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-1" alt="Груша"><img class="tree pear-2" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-1" alt="Груша"><img class="tree pear-3" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-1" alt="Груша">
    <img class="farm" src="../../../../../pograymo/assets/illustrations/farm_scene/farm-barn-red.webp?v=farm-scene-1" alt="Ферма">
    <div class="earth"></div>
    <div class="crop stubble"><img src="../../../../../pograymo/assets/illustrations/farm_scene/wheat-stubble-strip.webp?v=combine-1" alt="Стерня після жнив"></div>
    <div class="crop wheat"><img src="../../../../../pograymo/assets/illustrations/farm_scene/wheat-field-strip.webp?v=combine-1" alt="Стигла пшениця"></div>
    <img class="pheasant" src="../../../../../pograymo/assets/illustrations/farm_scene/pheasant-flying-v2.webp?v=combine-2" alt="Фазан вилітає з пшениці">
    <img class="combine" src="../../../../../pograymo/assets/illustrations/transport/farm/combine-harvester-green.webp?v=f442394" alt="Зелений комбайн збирає пшеницю">
    <section class="panel"><div class="text" id="text">Комбайн збирає стиглу пшеницю.</div><button class="go start" id="start">▶ Подивитися</button><button class="go repeat" id="repeat">↻ Ще раз</button></section>
  </main>
  <script>
    const scene=document.getElementById('scene'),text=document.getElementById('text'),start=document.getElementById('start'),repeat=document.getElementById('repeat');
    const captions=[['Комбайн збирає стиглу пшеницю.',0],['Жатка обережно зрізає колоски.',2500],['Позаду залишається коротка стерня.',5000],['Ой, дивись — із пшениці вилетів фазан!',8200]];
    let timers=[];function finish(){scene.classList.add('done');start.disabled=false}function play(){timers.forEach(clearTimeout);timers=[];scene.classList.remove('running','done');void scene.offsetWidth;scene.classList.add('running');start.disabled=true;captions.forEach(([t,ms])=>timers.push(setTimeout(()=>text.textContent=t,ms)));timers.push(setTimeout(finish,13000))}
    start.addEventListener('click',play);repeat.addEventListener('click',play);
  </script>
</body>
</html>
