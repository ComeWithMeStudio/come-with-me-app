<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Усі машини на фермі</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49;background:#a9e3f4}
    .screen{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:linear-gradient(#a9e3f4 0 55%,#8fca61 55% 70%,#c68c4f 70%)}
    .sun,.cloud,.farm{position:absolute;object-fit:contain;pointer-events:none}.sun{right:7%;top:12%;width:min(17vw,145px)}.cloud{left:6%;top:10%;width:min(28vw,230px)}.farm{right:3%;bottom:24%;width:min(70vw,660px)}
    .card{position:relative;z-index:3;width:min(91%,620px);margin-top:auto;margin-bottom:5%;padding:22px 18px;border-radius:30px;background:#fffaf0ee;text-align:center;box-shadow:0 12px 34px #59432835}
    h1{margin:0 0 9px;font-size:clamp(28px,7vw,44px)}p{margin:0;font-size:clamp(18px,4.5vw,27px);font-weight:900;line-height:1.3}.start{margin-top:18px;border:0;border-radius:999px;padding:15px 30px;background:#69b94d;color:#fff;font:900 clamp(20px,5vw,27px) "Trebuchet MS";box-shadow:0 7px 18px #355e2d50}.start:disabled{opacity:.6}
    .back{position:fixed;z-index:20;right:12px;top:12px;padding:10px 14px;border-radius:999px;background:#fffbe8ec;color:#493b49;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}
    iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#a9e3f4;display:none}.final{display:none}.playing iframe{display:block}.playing .intro{display:none}.finished iframe,.finished .intro{display:none}.finished .final{display:grid}
  </style>
</head>
<body>
  <a class="back" href="../index.html">← Машини</a>
  <section class="screen intro">
    <img class="sun" src="/media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="">
    <img class="cloud" src="/media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt="">
    <img class="farm" src="/media/pograymo/assets/illustrations/farm_scene/farm-barn-red.webp" alt="Ферма">
    <div class="card"><h1>Машини на фермі</h1><p id="introText">Подивімося, як працює ферма!</p><button class="start" id="start" hidden>▶ Почати</button></div>
  </section>
  <iframe id="stage" title="Машини на фермі"></iframe>
  <section class="screen final">
    <img class="sun" src="/media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt="">
    <img class="farm" src="/media/pograymo/assets/illustrations/farm_scene/farm-barn-red.webp" alt="Ферма">
    <div class="card"><h1>Готово! 🌾</h1><p>Усі машини завершили роботу на фермі.</p><button class="start" id="again">↻ Ще раз</button></div>
  </section>
  <audio id="voice" preload="auto"></audio>
  <script>
    const voice=document.getElementById('voice'),stage=document.getElementById('stage'),start=document.getElementById('start'),again=document.getElementById('again');
    const base='/audio/rozkazhy-meni/piznavaymo-svit/transport/mashyny-na-fermi/';
    const scenes=[
      {page:'../traktor/index.html?mode=all&v=2',audio:'01-traktor-gigi.mp3',min:9800},
      {page:'../kombayn/index.html?mode=all&v=3',audio:'02-kombayn-gigi.mp3',min:11400},
      {page:'../obpryskuvach/index.html?mode=all&v=3',audio:'03-obpryskuvach-gigi.mp3',min:11400},
      {page:'../pres-pidbyrach/index.html?mode=all&v=3',audio:'04-pres-pidbyrach-gigi.mp3',min:13000}
    ];
    let index=-1,began=0;
    function playAudio(file,done,min=0){voice.onended=null;voice.src=base+file+'?v=2';began=Date.now();voice.onended=()=>setTimeout(done,Math.max(450,min-(Date.now()-began)));voice.play().catch(()=>{start.disabled=false});}
    function next(){index++;if(index>=scenes.length){document.body.className='finished';playAudio('05-final-gigi.mp3',()=>{},0);return}const item=scenes[index];document.body.className='playing';stage.src=item.page;playAudio(item.audio,next,item.min)}
    function begin(){if(document.body.dataset.started)return;document.body.dataset.started='1';start.hidden=true;start.disabled=true;index=-1;playAudio('00-vstup-gigi.mp3',next,6200)}
    start.onclick=begin;again.onclick=()=>{document.body.className='';document.body.dataset.started='';stage.src='';start.disabled=false;begin()};setTimeout(()=>{begin();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1){document.body.dataset.started='';start.hidden=false;start.disabled=false}},700)},220);
  </script>
<script src="/audio/games/sfx/scene-ambience.js?v=1" data-ambience="/audio/games/sfx/farm-yard-ambience.mp3"></script></body>
</html>
