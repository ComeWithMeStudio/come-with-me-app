<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Трактор — Машини на фермі</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow:hidden;background:#a9e3f4;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49}.scene{position:relative;width:100vw;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(#a9e3f4 0 53%,#8fca61 53% 65%,#c68c4f 65%)}.sun,.cloud{position:absolute;object-fit:contain;z-index:1}.sun{right:5%;top:4%;width:min(16vw,145px)}.cloud{left:6%;top:8%;width:min(25vw,230px)}.barn{position:absolute;right:5%;bottom:35%;width:21%;height:21%;border-radius:18px 18px 4px 4px;background:#e95748;box-shadow:inset 0 -12px #c84339}.barn:before{content:"";position:absolute;left:-8%;right:-8%;top:-25%;height:35%;background:#873d34;clip-path:polygon(50% 0,100% 100%,0 100%)}.barn:after{content:"";position:absolute;left:35%;bottom:0;width:30%;height:58%;border-radius:8px 8px 0 0;background:#6b3d2d}
.field{position:absolute;inset:65% 0 0;background:linear-gradient(#c68c4f,#ae713e)}.furrows{position:absolute;left:0;right:0;bottom:0;height:35%;opacity:0;background:repeating-linear-gradient(165deg,transparent 0 24px,#7d492c 25px 31px,transparent 32px 55px);clip-path:polygon(0 50%,100% 0,100% 100%,0 100%);transition:opacity 1.2s ease}.tractor{position:absolute;z-index:3;left:5%;bottom:24%;width:min(52vw,520px);height:min(25vw,250px);filter:drop-shadow(0 10px 8px #51311f45)}.tractor-body{position:absolute;left:20%;bottom:22%;width:62%;height:37%;border-radius:18px 28px 12px 10px;background:#53a63c;border:7px solid #347b2b}.tractor-hood{position:absolute;right:0;bottom:25%;width:37%;height:29%;border-radius:7px 19px 8px 5px;background:#64b847;border:7px solid #347b2b}.tractor-cabin{position:absolute;left:31%;bottom:52%;width:30%;height:43%;border-radius:10px 10px 3px 3px;background:#55ad42;border:7px solid #347b2b}.tractor-window{position:absolute;inset:10% 11% 15%;border-radius:4px;background:#a9e3f4;border:5px solid #275f2b}.tractor-pipe{position:absolute;right:14%;bottom:52%;width:5%;height:34%;border-radius:5px 5px 0 0;background:#404447}.wheel{position:absolute;bottom:0;border-radius:50%;background:#263238;border:8px solid #171d20;box-shadow:inset 0 0 0 12px #f0c744}.wheel:after{content:"";position:absolute;inset:32%;border-radius:50%;background:#6c6f70}.wheel.big{left:19%;width:34%;aspect-ratio:1}.wheel.small{right:3%;width:23%;aspect-ratio:1}.tractor-light{position:absolute;right:1%;bottom:46%;width:8%;height:10%;border-radius:50%;background:#ffe96a;border:4px solid #347b2b}.scene.running .tractor{animation:drive 7s ease-in-out forwards}.scene.running .furrows{opacity:1;transition-delay:2.2s}.dust{position:absolute;z-index:2;left:22%;bottom:28%;width:12px;height:12px;border-radius:50%;background:#e7c18c00;box-shadow:0 0 #e7c18c00}.scene.running .dust{animation:dust 3.5s 1.8s ease-out}
@keyframes drive{0%{left:-55%}28%{left:5%}78%{left:27%}100%{left:27%}}@keyframes dust{0%{box-shadow:0 0 0 0 #e7c18ca0;opacity:0}25%{box-shadow:-15px -3px 0 8px #e7c18c99,-35px 4px 0 13px #e7c18c70,-58px -5px 0 10px #e7c18c55;opacity:1}100%{box-shadow:-90px -25px 0 28px #e7c18c00,-125px -3px 0 34px #e7c18c00,-160px -35px 0 30px #e7c18c00;opacity:0}}
.top{position:absolute;z-index:8;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center}.pill{padding:10px 14px;border-radius:999px;background:#fffbe8e8;color:inherit;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}.title{font-size:clamp(25px,6vw,40px)}.panel{position:absolute;z-index:7;left:4%;right:4%;bottom:3%;padding:18px 18px 15px;border-radius:28px;background:#fffaf0ee;text-align:center;box-shadow:0 10px 30px #604f7040}.text{min-height:52px;font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}.go{margin-top:12px;border:0;border-radius:999px;padding:13px 25px;background:#69b94d;color:#fff;font:900 clamp(18px,4vw,24px) "Trebuchet MS";box-shadow:0 7px 18px #355e2d50}.go:disabled{opacity:.55}.repeat{display:none}.done .start{display:none}.done .repeat{display:inline-block}@media(max-width:600px){.barn{width:30%;height:18%;bottom:35%}.tractor{width:69vw;bottom:25%}.panel{left:3%;right:3%;bottom:2%;padding:14px}.top{align-items:flex-start}.title{max-width:56%}}
</style></head><body><main class="scene" id="scene"><div class="top"><strong class="pill title">🚜 Трактор</strong><a class="pill" href="../index.html">← Машини</a></div><img class="sun" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt=""><img class="cloud" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><div class="barn"></div><div class="field"></div><div class="furrows"></div><div class="dust"></div><div class="tractor" role="img" aria-label="Зелений трактор"><div class="tractor-body"></div><div class="tractor-hood"></div><div class="tractor-cabin"><div class="tractor-window"></div></div><div class="tractor-pipe"></div><div class="tractor-light"></div><div class="wheel big"></div><div class="wheel small"></div></div><audio id="voice" preload="auto" src="/audio/rozkazhy-meni/piznavaymo-svit/transport/mashyny-na-fermi/01-traktor-gigi.mp3"></audio><section class="panel"><div class="text" id="text">Трактор — сильний помічник на фермі.</div><button class="go start" id="start">▶ Подивитися</button><button class="go repeat" id="repeat">↻ Ще раз</button></section></main><script>
const scene=document.getElementById('scene'),text=document.getElementById('text'),start=document.getElementById('start'),repeat=document.getElementById('repeat'),voice=document.getElementById('voice');
const captions=[['Трактор — сильний помічник на фермі.',0],['Він тягне плуг і готує землю до посіву.',2100],['Їде вперед — землю розпушує.',4300],['Рівні борозенки за собою залишає!',6100]];
let timers=[];function finish(){scene.classList.add('done');start.disabled=false}function play(){timers.forEach(clearTimeout);timers=[];voice.pause();voice.currentTime=0;scene.classList.remove('running','done');void scene.offsetWidth;scene.classList.add('running');start.disabled=true;captions.forEach(([t,ms])=>timers.push(setTimeout(()=>text.textContent=t,ms)));voice.play().catch(()=>{});voice.onended=finish;timers.push(setTimeout(finish,9800))}
start.addEventListener('click',play);repeat.addEventListener('click',play);
</script></body></html>
