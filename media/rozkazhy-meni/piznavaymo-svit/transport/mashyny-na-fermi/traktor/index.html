<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Трактор — Машини на фермі</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;overflow:hidden;background:#a9e3f4;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49}
    .scene{position:relative;width:100%;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(#a9e3f4 0 51%,#8fca61 51% 64%,#c68c4f 64%)}
    .sun,.cloud{position:absolute;object-fit:contain;z-index:1}.sun{right:5%;top:13%;width:min(16%,145px)}.cloud{position:absolute;object-fit:contain;z-index:1}.cloud-1{left:6%;top:8%;width:min(25%,230px)}.cloud-2{left:38%;top:20%;width:min(16%,150px);opacity:.9}.cloud-3{right:26%;top:7%;width:min(18%,165px);opacity:.92}.tit{position:absolute;z-index:5;right:-14%;width:min(8%,82px);height:auto;opacity:0;pointer-events:none;filter:drop-shadow(0 5px 4px #51311f28);transform:scaleX(-1)}.tit-1{top:27%}.tit-2{top:34%;width:min(6.5%,68px)}
    .farm,.tree{position:absolute;object-fit:contain;pointer-events:none}.farm{z-index:2;right:1%;bottom:35%;width:min(54%,630px)}.pear-1,.pear-2,.pear-3,.pear-4,.pear-5,.pear-6{z-index:1}.apple-1,.apple-2,.apple-3,.apple-4{z-index:3}.pear-1{left:-10%;bottom:46%;width:min(6%,68px)}.pear-2{left:-1%;bottom:45%;width:min(8%,90px)}.pear-3{left:12%;bottom:46%;width:min(6%,68px)}.pear-4{left:21%;bottom:45%;width:min(8%,90px)}.pear-5{left:34%;bottom:46%;width:min(6%,68px)}.pear-6{left:43%;bottom:45%;width:min(8%,90px)}.apple-1{left:-18%;bottom:41%;width:min(9%,102px)}.apple-2{left:-6%;bottom:39%;width:min(12%,136px)}.apple-3{left:15%;bottom:38%;width:min(16%,182px)}.apple-4{left:6%;bottom:44%;width:min(11%,124px)}
    .field{position:absolute;z-index:0;inset:64% 0 0;background:linear-gradient(#c68c4f,#ae713e)}
    .furrows{position:absolute;z-index:1;left:0;bottom:17%;width:0;height:20%;opacity:0;background:repeating-linear-gradient(to bottom,transparent 0 15px,#7c4a2d 16px 22px,transparent 23px 33px);border-radius:0 20px 20px 0;filter:drop-shadow(0 2px 0 #db9f5a55)}
    .rig{position:absolute;z-index:4;left:7%;bottom:22%;width:min(72%,790px);height:min(34%,370px);filter:drop-shadow(0 10px 8px #51311f45)}
    .tractor{position:absolute;right:0;bottom:0;width:54%;height:auto}.plow{position:absolute;left:0;bottom:2%;width:51%;height:auto}
    .scene.running .rig{animation:drive 9s ease-in-out forwards}.scene.running .furrows{animation:furrowGrow 8.2s .8s linear forwards}.scene.running .tit-1{animation:titFlyOne 3.15s 2.15s linear forwards}.scene.running .tit-2{animation:titFlyTwo 3.55s 2.55s linear forwards}
    .dust{position:absolute;z-index:3;left:24%;bottom:29%;width:10px;height:10px;border-radius:50%;background:#e7c18c00}.scene.running .dust{animation:dust 4.5s 2s ease-out}
    @keyframes drive{0%{left:-78%}18%{left:-24%}100%{left:105%}}
    @keyframes furrowGrow{0%{width:0;opacity:0}8%{opacity:1}100%{width:100%;opacity:1}}
    @keyframes dust{0%{box-shadow:0 0 0 0 #e7c18ca0;opacity:0}25%{box-shadow:-15px -3px 0 8px #e7c18c99,-35px 4px 0 13px #e7c18c70;opacity:1}100%{box-shadow:-90px -25px 0 28px #e7c18c00,-125px -3px 0 34px #e7c18c00;opacity:0}}@keyframes titFlyOne{0%{right:-14%;opacity:0;transform:scaleX(-1) translateY(0) rotate(2deg)}7%{opacity:1}48%{transform:scaleX(-1) translateY(-30px) rotate(-4deg)}90%{opacity:1}100%{right:108%;opacity:0;transform:scaleX(-1) translateY(8px) rotate(3deg)}}@keyframes titFlyTwo{0%{right:-14%;opacity:0;transform:scaleX(-1) translateY(0) rotate(2deg)}7%{opacity:1}25%{transform:scaleX(-1) translateY(20px) rotate(4deg)}50%{transform:scaleX(-1) translateY(-27px) rotate(-4deg)}74%{transform:scaleX(-1) translateY(15px) rotate(4deg)}90%{opacity:1}100%{right:108%;opacity:0;transform:scaleX(-1) translateY(-12px) rotate(-3deg)}}
    .top{position:absolute;z-index:8;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center}.pill{padding:10px 14px;border-radius:999px;background:#fffbe8e8;color:inherit;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}.title{font-size:clamp(25px,6vw,40px)}
    .panel{position:absolute;z-index:7;left:4%;right:4%;bottom:3%;padding:18px 18px 15px;border-radius:28px;background:#fffaf0ee;text-align:center;box-shadow:0 10px 30px #604f7040}.text{min-height:52px;font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}.go{margin-top:12px;border:0;border-radius:999px;padding:13px 25px;background:#69b94d;color:#fff;font:900 clamp(18px,4vw,24px) "Trebuchet MS";box-shadow:0 7px 18px #355e2d50}.go:disabled{opacity:.55}.repeat{display:none}.done .start{display:none}.done .repeat{display:inline-block}
    @media(max-width:600px){.sun{top:15%;right:5%;width:18%}.cloud-1{top:9%;width:27%}.cloud-2{left:37%;top:21%;width:20%}.cloud-3{right:26%;top:7%;width:20%}.tit{width:12%;right:-16%}.tit-1{top:29%}.tit-2{top:35%;width:10%}.farm{width:66%;right:-4%;bottom:35%}.pear-1{left:-14%;bottom:46%;width:7%}.pear-2{left:-3%;bottom:45%;width:9%}.pear-3{left:10%;bottom:46%;width:7%}.pear-4{left:21%;bottom:45%;width:9%}.pear-5{left:34%;bottom:46%;width:7%}.pear-6{left:45%;bottom:45%;width:9%}.apple-1{left:-24%;bottom:40%;width:15%}.apple-2{left:-10%;bottom:39%;width:18%}.apple-3{left:12%;bottom:38%;width:22%}.apple-4{left:2%;bottom:45%;width:16%}.rig{width:94%;height:46%;bottom:24%;left:2%}.tractor{width:55%}.plow{width:52%}.furrows{bottom:20%;height:17%}.panel{left:3%;right:3%;bottom:2%;padding:14px}.top{align-items:flex-start}.title{max-width:56%}}
  </style>

<body>
  <main class="page"><header class="head"><h1>Трактор</h1><a class="back" href="../index.html">← Машини</a></header><section class="scene" id="scene" data-farm-scene="traktor">

    <img class="tree pear-3" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear-4" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear-5" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear-6" src="../../../../../pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша">

    <button class="go start" id="start"><span>▶ Подивитися</span></button><section class="panel"><div class="text" id="text">Трактор — сильний помічник на фермі.</div><button class="go repeat" id="repeat">↻ Ще раз</button></section>
  </section><div class="progress"><i id="farmProgress"></i></div></main>
  <script>
    const scene=document.getElementById('scene'),text=document.getElementById('text'),start=document.getElementById('start'),repeat=document.getElementById('repeat'),voice=document.getElementById('voice'),storyMode=new URLSearchParams(location.search).get('mode')==='story',isAll=new URLSearchParams(location.search).get('mode')==='all';
    const captions=[['Трактор — сильний помічник на фермі.',0],['Він тягне плуг і готує землю до посіву.',2100],['Їде вперед — землю розпушує.',4300],['Рівні борозенки за собою залишає!',6100]];
    let timers=[];function finish(){scene.classList.add('done');start.disabled=false;if(storyMode)setTimeout(()=>location.href='../kombayn/index.html?mode=story&v=4',500)}function play(){timers.forEach(clearTimeout);timers=[];if(!isAll){voice.pause();voice.currentTime=0}scene.classList.remove('running','done');void scene.offsetWidth;scene.classList.add('running');start.disabled=true;captions.forEach(([t,ms])=>timers.push(setTimeout(()=>text.textContent=t,ms)));if(!isAll){voice.play().catch(()=>{});voice.onended=storyMode?null:finish}timers.push(setTimeout(finish,9800))}
    start.addEventListener('click',play);repeat.addEventListener('click',play);if(isAll||storyMode){start.style.display='none';repeat.style.display='none';setTimeout(play,120)}
  </script>
<script src="../story-wake-lock.js?v=20261019-1"></script><script>document.getElementById('voice').addEventListener('timeupdate',function(){document.getElementById('farmProgress').style.width=(this.duration?Math.min(100,this.currentTime/this.duration*100):0)+'%'});</script></body>
