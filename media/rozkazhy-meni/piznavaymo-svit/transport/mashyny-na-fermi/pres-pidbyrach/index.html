<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Прес-підбирач — Машини на фермі</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#a9e3f4;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49}.scene{position:relative;width:100vw;height:100svh;min-height:560px;overflow:hidden;background:linear-gradient(#a9e3f4 0 51%,#8fca61 51% 64%,#c68c4f 64%)}.sun,.cloud,.farm,.tree{position:absolute;object-fit:contain;pointer-events:none}.sun{z-index:1;right:7%;top:13%;width:min(14vw,130px)}.cloud{z-index:1}.c1{left:5%;top:8%;width:min(22vw,205px)}.c2{left:37%;top:20%;width:min(16vw,150px)}.c3{right:25%;top:6%;width:min(18vw,165px)}.farm{z-index:2;right:1%;bottom:35%;width:min(54vw,630px)}.tree{z-index:3}.a1{left:-5%;bottom:36%;width:min(12vw,136px)}.a2{left:10%;bottom:35%;width:min(14vw,160px)}.p1{left:23%;bottom:48%;width:min(8vw,90px)}.earth{position:absolute;inset:64% 0 0;background:linear-gradient(#c68c4f,#ae713e)}.windrow{position:absolute;z-index:3;left:-2%;bottom:22%;width:104%;height:13%;object-fit:fill;clip-path:inset(0 0 0 0)}.rig{position:absolute;z-index:5;left:-82%;bottom:21%;width:min(78vw,850px);height:min(33vw,365px);filter:drop-shadow(0 10px 8px #51311f45)}.tractor{position:absolute;right:0;bottom:0;width:53%}.baler{position:absolute;left:1%;bottom:1%;width:48%;transform:scaleX(-1)}.bale{position:absolute;z-index:4;left:16%;bottom:22%;width:min(18vw,190px);opacity:0;filter:drop-shadow(0 7px 6px #51311f35)}.running .rig{animation:drive 9s ease-in-out forwards}.running .windrow{animation:pickup 8.5s .45s linear forwards}.running .bale{animation:baleOut 3.1s 6.8s ease-out forwards}@keyframes drive{0%{left:-82%}100%{left:108%}}@keyframes pickup{0%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 0 0 100%)}}@keyframes baleOut{0%{left:67%;opacity:0;transform:scale(.45) rotate(0)}18%{opacity:1}100%{left:25%;opacity:1;transform:scale(1) rotate(-55deg)}}.top{position:absolute;z-index:10;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;align-items:center}.pill{padding:10px 14px;border-radius:999px;background:#fffbe8e8;color:inherit;text-decoration:none;font-weight:900;box-shadow:0 5px 15px #614f3d20}.title{font-size:clamp(23px,5.6vw,39px)}.panel{position:absolute;z-index:9;left:4%;right:4%;bottom:3%;padding:18px 18px 15px;border-radius:28px;background:#fffaf0ee;text-align:center;box-shadow:0 10px 30px #604f7040}.text{min-height:52px;font-size:clamp(18px,4vw,27px);font-weight:900;line-height:1.25}.go{margin-top:12px;border:0;border-radius:999px;padding:13px 25px;background:#69b94d;color:white;font:900 clamp(18px,4vw,24px) "Trebuchet MS"}.go:disabled{opacity:.55}.repeat{display:none}.done .start{display:none}.done .repeat{display:inline-block}@media(max-width:600px){.sun{top:15%;width:18%}.c1{top:9%;width:27%}.c2{left:37%;top:21%;width:20%}.c3{right:26%;top:7%;width:20%}.farm{width:66%;right:-4%}.rig{width:94vw;height:43vw;bottom:23%}.bale{width:25vw;bottom:23%}.windrow{bottom:25%;height:11%}.panel{left:3%;right:3%;bottom:2%;padding:14px}.title{max-width:62%;font-size:23px}}
</style></head><body><main class="scene" id="scene"><div class="top"><strong class="pill title">🌾 Прес-підбирач</strong><a class="pill" href="../index.html">← Машини</a></div><img class="sun" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt=""><img class="cloud c1" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud c2" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud c3" src="../../../../../pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="farm" src="../../../../../pograymo/assets/illustrations/farm_scene/farm-barn-red.webp" alt="Ферма"><div class="earth"></div><img class="windrow" src="../../../../../pograymo/assets/illustrations/farm_scene/hay-windrow.webp?v=baler-1" alt="Валок сухої соломи"><img class="bale" src="../../../../../pograymo/assets/illustrations/farm_scene/round-straw-bale.webp?v=baler-1" alt="Круглий тюк соломи"><div class="rig"><img class="baler" src="../../../../../pograymo/assets/illustrations/transport/farm/round-baler-red-yellow.webp" alt="Прес-підбирач"><img class="tractor" src="../../../../../pograymo/assets/illustrations/transport/farm/tractor-green.webp" alt="Трактор"></div><section class="panel"><div class="text" id="text">Трактор привіз на поле прес-підбирач.</div><button class="go start" id="start">▶ Подивитися</button><button class="go repeat" id="repeat">↻ Ще раз</button></section></main><script>
const scene=document.getElementById('scene'),text=document.getElementById('text'),start=document.getElementById('start'),repeat=document.getElementById('repeat');const captions=[['Трактор привіз на поле прес-підбирач.',0],['Прес-підбирач збирає суху солому у валках.',2400],['Усередині солома скручується у круглий тюк.',5000],['Готово! На полі залишився міцний тюк соломи.',8200]];let timers=[];function finish(){scene.classList.add('done');start.disabled=false}function play(){timers.forEach(clearTimeout);scene.classList.remove('running','done');void scene.offsetWidth;scene.classList.add('running');start.disabled=true;captions.forEach(([t,ms])=>timers.push(setTimeout(()=>text.textContent=t,ms)));timers.push(setTimeout(finish,10400))}start.onclick=play;repeat.onclick=play;
</script></body></html>
