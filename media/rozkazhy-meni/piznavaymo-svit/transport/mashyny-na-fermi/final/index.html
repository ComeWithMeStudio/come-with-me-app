<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Машини на фермі — фінал</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493b49}body{background:linear-gradient(#a9e3f4 0 64%,#c68c4f 64%);overflow-x:hidden}button{font:inherit}.page{width:min(100%,760px);min-height:100vh;margin:auto;padding:12px 10px 20px;display:flex;flex-direction:column;gap:10px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px}.head h1{margin:0;font-size:clamp(24px,6.5vw,41px)}.back{border:0;border-radius:999px;background:#fffaf0e8;color:#493b49;padding:10px 13px;font-weight:900;box-shadow:0 5px 15px #614f3d24;text-decoration:none;white-space:nowrap}.scene{position:relative;flex:1;min-height:540px;border-radius:30px;overflow:hidden;background:linear-gradient(#a9e3f4 0 51%,#8fca61 51% 64%,#c68c4f 64%);box-shadow:0 14px 36px #59432827}.sun,.cloud,.farm,.tree{position:absolute;object-fit:contain;pointer-events:none}.sun{z-index:1;right:5%;top:13%;width:min(16vw,145px)}.cloud{z-index:1}.cloud-1{left:6%;top:8%;width:min(25vw,230px)}.cloud-2{left:38%;top:20%;width:min(16vw,150px);opacity:.9}.cloud-3{right:26%;top:7%;width:min(18vw,165px);opacity:.92}.farm{z-index:2;right:1%;bottom:35%;width:min(54vw,630px)}.pear{z-index:1}.apple{z-index:3}.p1{left:-15%;bottom:46%;width:min(6vw,68px)}.p2{left:-6%;bottom:45%;width:min(8vw,90px)}.p3{left:7%;bottom:46%;width:min(6vw,68px)}.p4{left:16%;bottom:45%;width:min(8vw,90px)}.p5{left:29%;bottom:46%;width:min(6vw,68px)}.p6{left:38%;bottom:45%;width:min(8vw,90px)}.a1{left:-18%;bottom:41%;width:min(9vw,102px)}.a2{left:-6%;bottom:39%;width:min(12vw,136px)}.a3{left:15%;bottom:38%;width:min(16vw,182px)}.a4{left:6%;bottom:44%;width:min(11vw,124px)}.caption{position:absolute;z-index:12;left:4%;right:4%;bottom:3%;min-height:92px;padding:15px 18px;border-radius:24px;background:#fffaf0ed;display:grid;place-items:center;text-align:center;font-size:clamp(19px,4.7vw,29px);font-weight:900;line-height:1.15;box-shadow:0 7px 20px #55402c2d}.start{position:absolute;z-index:15;inset:0;border:0;background:#40324780;color:white;display:grid;place-items:center;cursor:pointer}.start span{padding:17px 25px;border-radius:999px;background:#69b94d;font-size:clamp(21px,5.6vw,33px);font-weight:900;box-shadow:0 8px 24px #0004}.start[hidden]{display:none}.progress{height:8px;border-radius:999px;background:#fff9;overflow:hidden}.progress i{display:block;width:0;height:100%;background:#69b94d;transition:width .12s linear}@media(max-width:540px){.head h1{font-size:24px}.back{padding:9px 10px;font-size:12px}.scene{height:78svh;min-height:540px}.sun{top:15%;right:5%;width:18%}.cloud-1{top:9%;width:27%}.cloud-2{left:37%;top:21%;width:20%}.cloud-3{right:26%;top:7%;width:20%}.farm{width:66%;right:-4%;bottom:35%}.p1{left:-19%;bottom:46%;width:7%}.p2{left:-8%;bottom:45%;width:9%}.p3{left:5%;bottom:46%;width:7%}.p4{left:16%;bottom:45%;width:9%}.p5{left:29%;bottom:46%;width:7%}.p6{left:40%;bottom:45%;width:9%}.a1{left:-24%;bottom:40%;width:15%}.a2{left:-10%;bottom:39%;width:18%}.a3{left:12%;bottom:38%;width:22%}.a4{left:2%;bottom:45%;width:16%}.caption{min-height:98px;font-size:20px}}.unit{position:absolute;z-index:7;height:auto;object-fit:contain;opacity:0;filter:drop-shadow(0 8px 7px #60452e40)}.rig{left:3%;bottom:22%;width:48%;height:24%}.rig .tractor{position:absolute;right:0;bottom:0;width:57%}.rig .baler{position:absolute;left:0;bottom:1%;width:49%;transform:scaleX(-1)}.combine{right:4%;bottom:35%;width:39%;transform:translateX(180%)}.sprayer{left:7%;bottom:42%;width:34%;transform:translateX(-180%)}.playing .rig{animation:arriveLeft 1.5s .2s ease-out forwards}.playing .sprayer{animation:arriveLeft 1.5s .8s ease-out forwards}.playing .combine{animation:arriveRight 1.5s 1.4s ease-out forwards}@keyframes arriveLeft{from{opacity:0;transform:translateX(-180%)}to{opacity:1;transform:translateX(0)}}@keyframes arriveRight{from{opacity:0;transform:translateX(180%)}to{opacity:1;transform:translateX(0)}}@media(max-width:540px){.rig{left:-2%;bottom:24%;width:63%;height:29%}.sprayer{left:1%;bottom:44%;width:43%}.combine{right:-4%;bottom:37%;width:52%}}</style></head><body><main class="page"><header class="head"><h1>Чудова робота!</h1><a class="back" href="../index.html">← Машини</a></header><section class="scene" id="scene"><img class="sun" src="/media/pograymo/assets/illustrations/painted_scene/painted-sun.webp" alt=""><img class="cloud cloud-1" src="/media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud cloud-2" src="/media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="cloud cloud-3" src="/media/pograymo/assets/illustrations/painted_scene/painted-cloud.webp" alt=""><img class="tree apple a1" src="/media/pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple a2" src="/media/pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple a3" src="/media/pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree apple a4" src="/media/pograymo/assets/illustrations/farm_scene/apple-tree.webp?v=farm-scene-1" alt="Яблуня"><img class="tree pear p1" src="/media/pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear p2" src="/media/pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear p3" src="/media/pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear p4" src="/media/pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear p5" src="/media/pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="tree pear p6" src="/media/pograymo/assets/illustrations/farm_scene/pear-tree.webp?v=farm-scene-2" alt="Груша"><img class="farm" src="/media/pograymo/assets/illustrations/farm_scene/farm-barn-red.webp?v=farm-scene-1" alt="Ферма"><div class="unit rig"><img class="baler" src="/media/pograymo/assets/illustrations/transport/farm/round-baler-red-yellow.webp" alt="Прес-підбирач"><img class="tractor" src="/media/pograymo/assets/illustrations/transport/farm/tractor-green.webp" alt="Трактор"></div><img class="unit sprayer" src="/media/pograymo/assets/illustrations/transport/farm/crop-sprayer-turquoise-yellow.webp" alt="Обприскувач"><img class="unit combine" src="/media/pograymo/assets/illustrations/transport/farm/combine-harvester-green.webp" alt="Комбайн"><div class="caption" id="caption">Усі машини повертаються на ферму!</div><button class="start" id="start"><span>▶ Послухати фінал</span></button></section><div class="progress"><i id="progress"></i></div></main><audio id="voice" preload="auto" src="/audio/rozkazhy-meni/piznavaymo-svit/transport/mashyny-na-fermi/05-final-gigi.mp3?v=2"></audio><script>const voice=document.getElementById('voice'),start=document.getElementById('start'),caption=document.getElementById('caption'),bar=document.getElementById('progress'),scene=document.getElementById('scene');function reset(){scene.classList.remove('playing');bar.style.width='0';caption.textContent='Усі машини повертаються на ферму!';start.hidden=false;start.querySelector('span').textContent='↻ Подивитися всю історію ще раз'}function play(){start.hidden=true;voice.currentTime=0;scene.classList.remove('playing');void scene.offsetWidth;scene.classList.add('playing');voice.play().catch(reset)}start.onclick=()=>{if(start.textContent.includes('ще раз'))location.href='../vstup/index.html?mode=story&v=4';else play()};voice.ontimeupdate=()=>{const t=voice.currentTime,d=voice.duration||9;bar.style.width=Math.min(100,t/d*100)+'%';caption.textContent=t<2.5?'Ось і завершився наш день на фермі!':t<8?'Трактор розпушив землю, комбайн зібрав пшеницю, обприскувач подбав про рослини, а прес-підбирач скрутив солому в тюк.':'До нових пригод!'};voice.onended=()=>setTimeout(()=>{bar.style.width='100%';start.hidden=false;start.style.background='transparent';start.style.alignItems='end';start.style.paddingBottom='15%';start.querySelector('span').textContent='↻ Подивитися всю історію ще раз'},650);if(new URLSearchParams(location.search).get('mode')==='story')setTimeout(()=>{play();setTimeout(()=>{if(voice.paused&&voice.currentTime<.1)reset()},650)},220)</script></body></html>
