<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Знайди однакові картинки з Мімі</title><style>*{box-sizing:border-box}body{margin:0;background:#e6f2ff;color:#49362d;font:20px system-ui;text-align:center;padding:16px}main{max-width:800px;margin:auto}header{display:flex;justify-content:space-between;gap:12px}button,a{font:inherit;color:inherit;background:#fff9e9;border:3px solid white;border-radius:20px;padding:12px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:4px solid #8057b5}h1{font-size:clamp(26px,6vw,40px)}.mimi{height:110px;max-width:100%;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.tile{min-height:110px;font-size:32px;word-break:break-word}.tile.found{background:#ccebc8}.tile:disabled{opacity:1;color:#49362d}.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;justify-items:center}.objects :is(img,svg){width:100%;height:38px;object-fit:contain}.dots{font-size:25px;color:#8057b5}#message{min-height:58px}button[hidden],section[hidden]{display:none}@media(max-width:450px){.grid{gap:8px}.tile{min-height:92px;padding:5px;font-size:28px}.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;justify-items:center}.objects :is(img,svg){width:100%;height:38px;object-fit:contain}.dots{font-size:21px}header{font-size:16px}}.objects:has(>:is(img,svg):only-child){grid-template-columns:1fr;place-items:center}.objects>:is(img,svg):only-child{width:60px;max-width:100%;height:60px}

const $=id=>document.getElementById(id);let task=0;const totals=[5,4,3];let level=0,opened=[],matched=0,locked=false,timer=null,enabled=true,epoch=0;const sounds=[];const music=new Audio('../../../../audio/games/find-for-mimi/music/level-1.mp3');music.loop=true;music.volume=.12;
function sound(name){if(!enabled)return;const a=new Audio('../../../../audio/games/common/'+name+'.mp3');sounds.push(a);a.play().catch(()=>{});a.onended=()=>{const i=sounds.indexOf(a);if(i>=0)sounds.splice(i,1)}}
const narration=new Audio(window.picturePairsVoices.intro);narration.onended=()=>{music.volume=.12};
let activeVoice=null;
const voiceVolumes={"pair": 0.689, "retry": 0.908, "round": 0.58, "intro": 0.656, "level2": 0.877, "level3": 0.826, "final": 0.735};
narration.volume=voiceVolumes.intro;
const levelVoices=[narration,new Audio(window.picturePairsVoices.level2),new Audio(window.picturePairsVoices.level3)];
levelVoices[1].volume=voiceVolumes.level2;levelVoices[2].volume=voiceVolumes.level3;
const finalVoice=new Audio(window.picturePairsVoices.final);finalVoice.volume=voiceVolumes.final;
const feedbackVoices=Object.fromEntries(['pair','retry','round'].map(k=>{const a=new Audio(window.picturePairsVoices[k]);a.volume=voiceVolumes[k];return [k,a]}));
function speak(voice){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0}activeVoice=voice;if(!enabled)return;voice.currentTime=0;music.volume=.035;voice.onended=()=>{if(activeVoice===voice){activeVoice=null;music.volume=.12}};voice.play().catch(()=>{if(activeVoice===voice){activeVoice=null;music.volume=.12}})}
function speakIntro(){speak(levelVoices[level])}
function stop(){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0;activeVoice=null}music.volume=.12;music.pause();sounds.forEach(a=>{a.pause();a.currentTime=0});sounds.length=0}
const names={"fruits/strawberry-red.webp": "Полуниця", "fruits/grapes-purple.webp": "Виноград", "fruits/banana-yellow.webp": "Банан", "toys/spinning-top-green.webp": "Дзиґа", "toys/boat_green.webp": "Кораблик", "toys/ball_yellow.webp": "М’яч", "adventure_and_clothes/binoculars_yellow.webp": "Бінокль", "../../pryroda/assets/forest/red-fox-standing.webp": "Лисичка", "../../pryroda/assets/forest/hedgehog-walking.webp": "Їжачок", "../../pryroda/assets/aquatic/reptiles/sea-turtle.webp": "Черепашка", "../../pryroda/ihry/komakhy/assets/ladybug.webp": "Сонечко", "../../pryroda/ihry/komakhy/assets/snail.webp": "Равлик"};
const crops={"fruits/strawberry-red.webp": [70, 41, 372, 430], "fruits/grapes-purple.webp": [70, 41, 371, 430], "fruits/banana-yellow.webp": [76, 41, 360, 430], "toys/spinning-top-green.webp": [115, 72, 282, 367], "toys/boat_green.webp": [585, 387, 310, 251], "toys/ball_yellow.webp": [633, 448, 269, 267], "adventure_and_clothes/binoculars_yellow.webp": [556, 300, 559, 341], "../../pryroda/assets/forest/red-fox-standing.webp": [0, 16, 1354, 1129], "../../pryroda/assets/forest/hedgehog-walking.webp": [0, 31, 1458, 993], "../../pryroda/assets/aquatic/reptiles/sea-turtle.webp": [94, 151, 848, 720], "../../pryroda/ihry/komakhy/assets/ladybug.webp": [0, 3, 639, 474], "../../pryroda/ihry/komakhy/assets/snail.webp": [51, 20, 554, 392]};
// Display original files directly: no canvas/data URL conversion on the device.
const imageSizes={"fruits/strawberry-red.webp": [512, 512], "fruits/grapes-purple.webp": [512, 512], "fruits/banana-yellow.webp": [512, 512], "toys/spinning-top-green.webp": [512, 512], "toys/boat_green.webp": [1536, 1024], "toys/ball_yellow.webp": [1536, 1024], "adventure_and_clothes/binoculars_yellow.webp": [1672, 941], "../../pryroda/assets/forest/red-fox-standing.webp": [1374, 1145], "../../pryroda/assets/forest/hedgehog-walking.webp": [1536, 1024], "../../pryroda/assets/aquatic/reptiles/sea-turtle.webp": [1024, 1024], "../../pryroda/ihry/komakhy/assets/ladybug.webp": [640, 488], "../../pryroda/ihry/komakhy/assets/snail.webp": [640, 427]};
function pictureElement(file){
 const ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');
 const [x,y,w,h]=crops[file],side=Math.max(w,h)*240/220;
 svg.setAttribute('viewBox',`${x+(w-side)/2} ${y+(h-side)/2} ${side} ${side}`);
 svg.setAttribute('aria-hidden','true');svg.setAttribute('focusable','false');
 const image=document.createElementNS(ns,'image');
 const [width,height]=imageSizes[file];image.setAttribute('width',width);image.setAttribute('height',height);
 image.setAttribute('href','../../../../media/pograymo/assets/illustrations/'+file);
 image.addEventListener('error',()=>{const label=document.createElement('span');label.textContent=names[file];svg.replaceWith(label)});
 svg.append(image);return svg;
}
$('sound').onclick=()=>{enabled=!enabled;$('sound').textContent='Звук: '+(enabled?'увімкнено':'вимкнено');$('sound').setAttribute('aria-pressed',enabled);if(!enabled)stop();else if(!$('play').hidden&&$('again').hidden)music.play().catch(()=>{})};
function round(){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0;activeVoice=null;music.volume=.12}epoch++;clearTimeout(timer);opened=[];matched=0;locked=false;$('start').hidden=true;$('next').hidden=true;$('again').hidden=true;$('play').hidden=false;$('board').replaceChildren();$('message').textContent='Знайди дві однакові картинки.';const n=level+2;const art=Object.keys(names);for(let i=art.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[art[i],art[j]]=[art[j],art[i]]}const deck=Array.from({length:n},(_,i)=>[{value:i+1},{value:i+1}]).flat();for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}update();deck.forEach(c=>{const b=document.createElement('button');b.className='tile';b.dataset.pair=c.value;b.textContent='✦';b.setAttribute('aria-label','Відкрити картку');b.onclick=()=>{if(locked||opened.includes(b)||b.disabled)return;b.replaceChildren();const group=document.createElement('span');group.className='objects';group.append(pictureElement(art[c.value-1]));b.append(group);b.setAttribute('aria-label',names[art[c.value-1]]);b.dataset.value=c.value;opened.push(b);if(opened.length<2)return;locked=true;const pair=opened.slice(),version=epoch;if(pair[0].dataset.value===pair[1].dataset.value){pair.forEach(x=>{x.disabled=true;x.classList.add('found')});matched++;sound('correct_chime');$('message').textContent='Так! Це пара!';if(matched<n)speak(feedbackVoices.pair);opened=[];locked=false;update();if(matched===n){$('message').textContent=(level===2&&task===totals[level]-1)?'★★★ Усі картинки знайшли свої пари! Дякую за гру!':'Чудово! Усі пари знайдено!';sound('scene_complete');if(level===2&&task===totals[level]-1){$('again').hidden=false;music.pause();speak(finalVoice)}else {speak(feedbackVoices.round);$('next').textContent=task<totals[level]-1?'Наступне завдання':'Наступний рівень';$('next').hidden=false}}}else{$('message').textContent='Спробуй іншу пару.';speak(feedbackVoices.retry);timer=setTimeout(()=>{if(version!==epoch)return;pair.forEach(x=>{x.textContent='✦';x.classList.remove('dots');x.setAttribute('aria-label','Відкрити картку')});opened=[];locked=false},1300)}};$('board').append(b)});if(enabled)music.play().catch(()=>{})}
function update(){$('progress').textContent=`Рівень ${level+1} з 3 · Завдання ${task+1} з ${totals[level]} · Пари: ${matched} з ${level+2}`}$('start').onclick=()=>{round();speakIntro()};$('next').onclick=()=>{task++;let newLevel=false;if(task===totals[level]){task=0;level++;newLevel=true}round();if(newLevel)speakIntro()};$('again').onclick=()=>{level=0;task=0;round();speakIntro()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(enabled&&!$('play').hidden&&$('again').hidden)music.play().catch(()=>{})});window.addEventListener('pagehide',()=>{epoch++;clearTimeout(timer);opened.forEach(b=>{b.textContent='✦';b.setAttribute('aria-label','Відкрити картку')});opened=[];locked=false;stop()});
