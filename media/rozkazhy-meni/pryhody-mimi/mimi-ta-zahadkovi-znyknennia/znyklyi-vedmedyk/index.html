kground:#fff9efee;box-shadow:0 8px 24px #493b502c;transform:translateY(-130%);transition:.45s}.notebook.open{transform:translateY(0)}.notebook strong{display:block;margin-bottom:5px}.notebook ul{margin:0;padding-left:20px;font-size:13px;line-height:1.4}.final-stars{font-size:42px;letter-spacing:8px;animation:pop .7s both}.confetti{position:absolute;inset:0;pointer-events:none;z-index:12;overflow:hidden}.confetti i{position:absolute;top:-10%;width:12px;height:18px;border-radius:4px;animation:fall 2.4s linear forwards}.status{font-size:12px;color:#78677e;margin:7px 0 0}@keyframes breathe{50%{transform:scale(1.05);box-shadow:0 6px 21px #6e4d8433}}@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-10deg)}to{opacity:1;transform:scale(1) rotate(0)}}@keyframes bearIn{from{opacity:0;transform:translateY(50px) rotate(7deg)}to{opacity:1;transform:none}}@keyframes scan{to{transform:translate(50px,-30px) rotate(8deg)}}@keyframes fall{to{transform:translateY(700px) rotate(520deg)}}[hidden]{display:none!important}@media(max-width:540px){body{padding:8px 8px 28px}.top{font-size:13px}.pill{padding:9px 11px}.scene{height:52vh;min-height:390px;border-radius:24px}.mimi{width:29%;height:34%}.hotspot{min-width:55px;min-height:55px}.hotspot small{font-size:10px}.hs-window{left:4%;top:8%}.hs-shelf{right:3%;top:11%}.hs-pillow{left:34%;bottom:34%}.hs-blanket{right:7%;bottom:23%}.panel{padding:12px}.notebook{width:54%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

    .scene.case-opening:after{content:"СПРАВА № 1";position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#5d496cbb;color:#fffaf0;font-size:clamp(28px,7vw,58px);font-weight:900;letter-spacing:.08em;animation:caseIntro 1.15s both}
    .false-trail{position:absolute;left:50%;top:8%;z-index:18;transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:#fff7e8e8;color:#6a556d;font-size:13px;font-weight:900;box-shadow:0 6px 18px #4d3e512e;animation:pop .45s both}
    .evidence.thread,.evidence.fur{font-size:0;width:clamp(54px,10vw,86px);height:clamp(54px,10vw,86px);background-position:center;background-repeat:no-repeat;background-size:contain;filter:drop-shadow(0 5px 3px #563f5833)}.evidence.thread{right:16%;top:27%;background-image:url("assets/blue-thread-spool.webp?v=20261028a")}.evidence.fur{left:46%;bottom:34%;background-image:url("assets/brown-teddy-fur.webp?v=20261028a")}
    .final-reveal{position:absolute;inset:0;z-index:19;border-radius:24px;background:#ead8d0 url("assets/bear-sleeping-final.webp?v=20261028a") center/cover no-repeat;opacity:0;transform:scale(1.04);transition:opacity .7s ease,transform 1.1s ease;overflow:hidden}.final-reveal.show{opacity:1;transform:scale(1)}.sleep-z{position:absolute;color:#fff7d2;font-weight:900;text-shadow:0 3px 8px #594064aa;opacity:0;animation:floatZ 2.4s ease-in-out infinite}.z1{left:56%;top:27%;font-size:28px;animation-delay:.1s}.z2{left:61%;top:20%;font-size:38px;animation-delay:.8s}.z3{left:67%;top:12%;font-size:48px;animation-delay:1.5s}@keyframes floatZ{0%{opacity:0;transform:translateY(12px) scale(.8)}30%,70%{opacity:1}100%{opacity:0;transform:translateY(-18px) scale(1.08)}}

<body>
<main class="shell">
  <header class="top"><a class="pill" href="../../../../../mimi-adventures.html">← Пригоди</a><button class="pill" id="sound" aria-pressed="true" aria-label="Вимкнути звук">🔊</button></header>
  <section class="title"><small>МІМІ ТА ЗАГАДКОВІ ЗНИКНЕННЯ · СПРАВА №1</small><h1>Зниклий ведмедик 🧸</h1></section>
  <div class="casefile" aria-label="Знайдені підказки"><span class="clue-dot" title="Підказка 1">?</span><span class="clue-dot" title="Підказка 2">?</span><span class="clue-dot" title="Підказка 3">?</span></div>
  <section class="scene" aria-label="Дитяча кімната, де потрібно знайти підказки">
    <div class="window"></div><div class="wall-line"></div><div class="shelf"></div><div class="bed"><div class="pillow"></div><div class="blanket"></div></div><div class="rug"></div>
    <img class="mimi" src="/media/mimi-library/illustrations/mimi-standing-front.webp" alt="Мімі, хлопчик-помічник, допомагає шукати ведмедика">
    <div class="magnifier" id="magnifier" aria-hidden="true">🔎</div>
    <button class="hotspot hs-window" data-place="window"><span>🪟</span><small>Вікно</small></button>
    <button class="hotspot hs-shelf" data-place="shelf"><span>📚</span><small>Поличка</small></button>
    <button class="hotspot hs-pillow" data-place="pillow"><span>☁️</span><small>Подушка</small></button>
    <button class="hotspot hs-blanket" data-place="blanket"><span>🌙</span><small>Ковдра</small></button>
    <aside class="notebook" id="notebook" aria-live="polite"><strong>Детективний блокнот</strong><ul id="notes"><li>Ведмедик зник після тихої години.</li></ul></aside>
    <div id="clueLayer"></div><div class="confetti" id="confetti"></div>
  </section>
  <section class="panel"><p class="message" id="message" role="status" aria-live="polite">У кімнаті зник улюблений ведмедик. Допоможемо Мімі розкрити справу?</p><div class="controls"><button class="action" id="start">Відкрити справу</button><button class="action secondary" id="hint" hidden>Підказка 🔎</button><button class="action secondary" id="notesButton" hidden>Блокнот 📒</button><button class="action" id="again" hidden>Розслідувати ще раз</button></div><p class="status">Без таймера · можна досліджувати у власному темпі</p></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),message=$('message'),start=$('start'),hint=$('hint'),again=$('again'),notesButton=$('notesButton'),notebook=$('notebook'),notes=$('notes'),clueLayer=$('clueLayer'),dots=[...document.querySelectorAll('.clue-dot')],spots=[...document.querySelectorAll('.hotspot')];
const common='../../../../../audio/games/common/',voiceRoot='audio/';const music=new Audio('../../../../../audio/games/find-for-mimi/music/level-4.mp3');music.loop=true;music.volume=.11;music.preload='auto';let active=false,finished=false,sound=true,found=[],lastAudio=null,voiceAudio=null,voiceQueue=[];function startMusic(){if(sound)music.play().catch(()=>{})}
const clues={
  shelf:{icon:'',className:'thread',note:'На поличці зачепилася синя ниточка.',line:'Синя ниточка! Вона схожа на нитку з шарфика ведмедика.'},
  pillow:{icon:'',className:'fur',note:'На подушці залишилася м’яка коричнева шерстинка.',line:'М’яка коричнева шерстинка. Ведмедик точно був біля подушки.'},
  window:{icon:'🍪',className:'crumb',note:'Біля вікна є крихта, але це слід від печива, не від ведмедика.',line:'Крихта! Цікаво… але ведмедик печива не їсть. Це хибний слід. І це теж відкриття!'},
  blanket:{icon:'🐾',className:'paw',note:'З-під ковдри видно маленький відбиток лапки.',line:'Ось відбиток лапки! Зазирнімо під ковдру.'}
};
function play(file,volume=.7){if(!sound)return;if(lastAudio){lastAudio.pause();lastAudio.currentTime=0}lastAudio=new Audio(common+file);lastAudio.volume=volume;lastAudio.play().catch(()=>{})}
function nextVoice(){if(!sound){voiceQueue=[];return}const file=voiceQueue.shift();if(!file){voiceAudio=null;music.volume=.11;return}if(voiceAudio)voiceAudio.pause();voiceAudio=new Audio(voiceRoot+file);voiceAudio.volume=1;music.volume=.035;voiceAudio.onended=nextVoice;voiceAudio.onerror=nextVoice;voiceAudio.play().catch(nextVoice)}
function speak(file){if(!sound)return;voiceQueue.push(file);if(!voiceAudio||voiceAudio.paused||voiceAudio.ended)nextVoice()}
function setMessage(text){message.textContent=text}
function peekNotebook(){notebook.classList.add('open');clearTimeout(peekNotebook.timer);peekNotebook.timer=setTimeout(()=>{if(!finished)notebook.classList.remove('open')},1800)}
function markRealClue(){const count=found.filter(x=>x!=='window').length,index=count-1;if(dots[index]){dots[index].textContent='✓';dots[index].classList.add('found')}if(count===2&&!found.includes('blanket')){const target=document.querySelector('[data-place="blanket"]');target.classList.add('ready');setTimeout(()=>{setMessage('Ниточка й шерстинка ведуть до ліжка. Тепер уважно оглянь ковдру!');speak('mystery-bear-07-two-clues.mp3')},650)}}
function reveal(place,button){
  if(!active||finished||found.includes(place))return;
  if(place==='blanket'&&found.filter(x=>x==='shelf'||x==='pillow').length<2){
    setMessage('Під ковдрою щось є… Але спершу знайдімо дві підказки, щоб бути певними.');speak('mystery-bear-06-blanket-early.mp3');
    button.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:650});
    play('retry-1.mp3',.45);
    return;
  }
  const clue=clues[place],el=document.createElement('span');
  el.className='evidence '+clue.className;el.textContent=clue.icon;clueLayer.append(el);
  found.push(place);button.disabled=true;button.classList.remove('ready');setMessage(clue.line);speak({shelf:'mystery-bear-03-shelf.mp3',pillow:'mystery-bear-04-pillow.mp3',window:'mystery-bear-05-false-trail.mp3',blanket:'mystery-bear-08-blanket.mp3'}[place]);
  notes.insertAdjacentHTML('beforeend','<li>'+clue.note+'</li>');
  if(place==='window'){
    play('wrong_boop.mp3',.45);
    const tag=document.createElement('span');tag.className='false-trail';tag.textContent='Хибний слід — і це теж відкриття!';document.querySelector('.scene').append(tag);setTimeout(()=>tag.remove(),1700);
  }else{
    play('item_place.mp3',.55);markRealClue();peekNotebook();
  }
  if(place==='blanket')laterFinish();
}
function laterFinish(){spots.forEach(b=>b.disabled=true);setTimeout(finish,850)}
function finish(){finished=true;notebook.classList.remove('open');const reveal=document.createElement('div');reveal.className='final-reveal';reveal.setAttribute('aria-label','Ведмедик затишно спить у ліжечку під ковдрою');reveal.innerHTML='<span class="sleep-z z1">Z</span><span class="sleep-z z2">Z</span><span class="sleep-z z3">Z</span>';document.querySelector('.scene').append(reveal);requestAnimationFrame(()=>reveal.classList.add('show'));setMessage('Справу розкрито! Ведмедик не зник — він затишно заснув під ковдрою.');notes.insertAdjacentHTML('beforeend','<li><strong>Справу розкрито:</strong> ведмедик заснув під ковдрою.</li>');dots.forEach(d=>{d.textContent='★';d.classList.add('found')});play('scene_complete.mp3',.65);speak('mystery-bear-12-finish.mp3');confetti();hint.hidden=true;notesButton.hidden=true;again.hidden=false}
function confetti(){const colors=['#f0bd56','#d99ab5','#8fc2b4','#8f7bc2'];for(let i=0;i<22;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*.55+'s';$('confetti').append(c)}}
function begin(){active=true;startMusic();const scene=document.querySelector('.scene');scene.classList.add('case-opening');start.hidden=true;setMessage('У кімнаті зник улюблений ведмедик. Справа номер один. Головний детектив — ти, а Мімі — твій помічник!');play('game_start.mp3',.5);speak('mystery-bear-01-open.mp3');setTimeout(()=>{document.body.classList.add('case-open');scene.classList.remove('case-opening');hint.hidden=false;notesButton.hidden=false;setMessage('Оглядай кімнату й торкайся місць, де може ховатися підказка.');speak('mystery-bear-02-search.mp3');$('magnifier').classList.add('show');setTimeout(()=>$('magnifier').classList.remove('show'),1700)},1150)}
function reset(){active=false;music.pause();music.currentTime=0;voiceQueue=[];if(voiceAudio){voiceAudio.pause();voiceAudio.currentTime=0;voiceAudio=null}document.body.classList.remove('case-open');finished=false;found=[];clearTimeout(peekNotebook.timer);clueLayer.replaceChildren();$('confetti').replaceChildren();document.querySelector('.final-reveal')?.remove();spots.forEach(b=>{b.disabled=false;b.classList.remove('ready')});dots.forEach(d=>{d.textContent='?';d.classList.remove('found')});notes.innerHTML='<li>Ведмедик зник після тихої години.</li>';notebook.classList.remove('open');again.hidden=true;notesButton.hidden=true;hint.hidden=true;start.hidden=false;setMessage('У кімнаті зник улюблений ведмедик. Допоможемо Мімі розкрити справу?')}
function showHint(){const order=['shelf','pillow','blanket'],next=order.find(x=>!found.includes(x));if(!next)return;const label={shelf:'поличку',pillow:'подушку',blanket:'ковдру'}[next];setMessage('Мімі радить уважніше оглянути '+label+'.');speak({shelf:'mystery-bear-09-hint-shelf.mp3',pillow:'mystery-bear-10-hint-pillow.mp3',blanket:'mystery-bear-11-hint-blanket.mp3'}[next]);const target=document.querySelector('[data-place="'+next+'"]');target.animate([{transform:'scale(1)'},{transform:'scale(1.13)'},{transform:'scale(1)'}],{duration:800});play('retry-1.mp3',.55)}
spots.forEach(b=>b.addEventListener('click',function(){reveal(this.dataset.place,this)}));start.onclick=begin;hint.onclick=showHint;again.onclick=reset;notesButton.onclick=()=>notebook.classList.toggle('open');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'Вимкнути звук':'Увімкнути звук');if(!sound){music.pause();voiceQueue=[];if(voiceAudio){voiceAudio.pause();voiceAudio.currentTime=0;voiceAudio=null}if(lastAudio){lastAudio.pause();lastAudio.currentTime=0}}else if(active)startMusic()};document.addEventListener('visibilitychange',()=>{if(document.hidden){music.pause();if(lastAudio)lastAudio.pause();if(voiceAudio)voiceAudio.pause()}else if(sound&&active){startMusic();if(voiceAudio)voiceAudio.play().catch(()=>{})}});
</script>
