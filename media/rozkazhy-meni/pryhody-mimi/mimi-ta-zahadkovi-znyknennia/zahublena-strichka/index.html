<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5e9e0">
  <title>Загублена стрічка — Мімі та загадкові зникнення</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Trebuchet MS",system-ui,sans-serif;color:#514254;background:linear-gradient(155deg,#f0e5ef,#fff0dd);padding:10px 10px 38px}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #7954aa;outline-offset:3px}.shell{width:min(920px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:999px;padding:10px 14px;background:#fffaf0;color:#4d4052;text-decoration:none;font-weight:900;box-shadow:0 4px 14px #604f7020}.title{text-align:center;margin:8px 0 10px}.title small{display:block;color:#806d83;font-weight:900;letter-spacing:.04em}.title h1{font-size:clamp(27px,6vw,44px);line-height:1.05;margin:3px 0}.casefile{display:flex;justify-content:center;gap:8px;margin-bottom:9px}.clue-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff9ef;border:2px solid #ddcce1;font-size:15px;transition:.25s}.clue-dot.found{background:#f7d786;border-color:#e2b94a;transform:scale(1.08)}
    .scene{position:relative;isolation:isolate;overflow:hidden;width:100%;aspect-ratio:3/2;min-height:250px;border:4px solid #fffaf1;border-radius:30px;background:#ecd9cc url("assets/craft-room.webp?v=20261029a") center/cover no-repeat;box-shadow:0 15px 38px #58466224}.mimi{position:absolute;z-index:7;left:-11%;bottom:-9%;width:clamp(250px,52%,460px);height:70%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 7px 4px #553d5430);pointer-events:none}.hotspot{position:absolute;z-index:9;display:grid;place-items:center;min-width:66px;min-height:66px;border-radius:50%;background:#fffaf0dc;border:3px solid #fffdf7;box-shadow:0 6px 18px #54445f2c;backdrop-filter:blur(3px);animation:breathe 2.2s ease-in-out infinite;transition:.25s}.hotspot span{font-size:clamp(28px,5vw,42px);filter:drop-shadow(0 2px 1px #fff)}.hotspot small{position:absolute;top:100%;margin-top:4px;padding:4px 8px;border-radius:11px;background:#fff9ef;font-size:11px;font-weight:900;white-space:nowrap}.hotspot:disabled{opacity:.45;cursor:default;animation:none}.hotspot.ready{background:#fff2bae8;border-color:#f5c955;box-shadow:0 0 0 8px #f5cf6550,0 8px 24px #765b3450;animation:ready 1.05s ease-in-out infinite}.hs-box{z-index:6;left:17%;top:28%}.hs-scissors{left:39%;top:30%}.hs-drawer{left:43%;bottom:34%}.hs-basket{right:10%;bottom:22%}body:not(.case-open) .hotspot{opacity:0;pointer-events:none;transform:scale(.8)}
    .evidence{position:absolute;z-index:11;display:grid;place-items:center;animation:pop .5s both;filter:drop-shadow(0 5px 3px #563f5833);pointer-events:none}.thread{left:39%;top:45%;font-size:clamp(30px,7vw,54px)}.snip{left:55%;top:32%;font-size:clamp(29px,7vw,52px)}.paper{left:31%;top:24%;font-size:clamp(31px,7vw,56px)}.false-trail{position:absolute;z-index:15;left:50%;top:7%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:9px 15px;border-radius:20px;background:#fff7e8ee;font-size:13px;font-weight:900;line-height:1.25;text-align:center;white-space:normal;box-shadow:0 6px 18px #4d3e512e;animation:pop .4s both}.panel{margin-top:11px;padding:14px;background:#fff9ef;border-radius:24px;text-align:center;box-shadow:0 8px 25px #604f701b}.message{font-size:clamp(17px,3.7vw,24px);font-weight:900;line-height:1.35;min-height:3em;margin:0;display:grid;place-items:center}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.action{border-radius:999px;padding:12px 20px;background:#7954aa;color:#fff;font-weight:900}.secondary{background:#eadff0;color:#594b66}.status{font-size:12px;color:#7c6a7f;margin:7px 0 0}.notebook{position:absolute;right:2%;top:2%;z-index:16;width:min(250px,50%);padding:12px;border-radius:18px;background:#fff9efee;box-shadow:0 8px 24px #493b502c;transform:translateY(-130%);transition:.45s}.notebook.open{transform:translateY(0)}.notebook strong{display:block;margin-bottom:5px}.notebook ul{margin:0;padding-left:19px;font-size:13px;line-height:1.4}.case-opening:after{content:"СПРАВА № 3";position:absolute;inset:0;z-index:22;display:grid;place-items:center;background:#60496fbb;color:#fffaf0;font-size:clamp(28px,7vw,58px);font-weight:900;letter-spacing:.08em;animation:caseIntro 1.15s both}.final-reveal{position:absolute;inset:0;z-index:19;background:linear-gradient(145deg,#f7dfcb,#ead8f0);opacity:0;transform:scale(1.04);transition:opacity .7s,transform 1.1s;overflow:hidden;display:grid;place-items:center}.final-reveal.show{opacity:1;transform:scale(1)}.final-reveal img{width:72%;height:86%;object-fit:contain;filter:drop-shadow(0 16px 12px #735d5340)}.spark{position:absolute;color:#fff3a7;font-size:clamp(28px,6vw,50px);text-shadow:0 3px 8px #79533c99;animation:twinkle 1.6s ease-in-out infinite}.s1{left:24%;top:24%}.s2{right:20%;top:45%;animation-delay:.5s}.s3{left:51%;top:14%;animation-delay:1s}.confetti{position:absolute;inset:0;z-index:23;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-10%;width:12px;height:18px;border-radius:4px;animation:fall 2.4s linear forwards}
    @keyframes breathe{50%{transform:scale(1.05)}}@keyframes ready{50%{transform:scale(1.11)}}@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:scale(1)}}@keyframes caseIntro{0%{opacity:0}25%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@keyframes twinkle{50%{transform:scale(1.3) rotate(12deg);opacity:.55}}@keyframes fall{to{transform:translateY(700px) rotate(520deg)}}[hidden]{display:none!important}
    @media(max-width:540px){body{padding:8px 8px 28px}.top{font-size:13px}.pill{padding:9px 11px}.scene{border-radius:24px}.mimi{width:132%;height:130%;left:-50%;bottom:-29%}.hotspot{min-width:50px;min-height:50px}.hotspot span{font-size:25px}.hotspot small{font-size:9px}.hs-box{left:12%;top:7%}.hs-scissors{left:32%;top:17%}.hs-drawer{left:48%;bottom:43%}.hs-basket{right:7%;bottom:20%}.notebook{width:57%}.panel{padding:12px}.final-reveal img{width:92%;height:88%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><a class="pill" href="../../../../../mimi-adventures.html">← Пригоди</a><button class="pill" id="sound" aria-pressed="true" aria-label="Вимкнути звук">🔊</button></header>
  <section class="title"><small>МІМІ ТА ЗАГАДКОВІ ЗНИКНЕННЯ · СПРАВА №3</small><h1>Загублена стрічка 🎀</h1></section>
  <div class="casefile" aria-label="Знайдені підказки"><span class="clue-dot">?</span><span class="clue-dot">?</span><span class="clue-dot">?</span></div>
  <section class="scene" aria-label="Творча кімната, де потрібно знайти загублену стрічку">
    <img class="mimi" src="/media/mimi-library/illustrations/mimi-standing-front.webp" alt="Мімі, хлопчик-помічник">
    <button class="hotspot hs-box" data-place="box"><span>🎁</span><small>Коробка</small></button>
    <button class="hotspot hs-scissors" data-place="scissors"><span>✂️</span><small>Ножиці</small></button>
    <button class="hotspot hs-drawer" data-place="drawer"><span>🗄️</span><small>Шухляда</small></button>
    <button class="hotspot hs-basket" data-place="basket"><span>🧺</span><small>Кошик</small></button>
    <aside class="notebook" id="notebook" aria-live="polite"><strong>Детективний блокнот</strong><ul id="notes"><li>Кораловою стрічкою хотіли прикрасити подарунок.</li></ul></aside>
    <div id="clueLayer"></div><div class="confetti" id="confetti"></div>
  </section>
  <section class="panel"><p class="message" id="message" role="status" aria-live="polite">Стрічка для подарунка зникла зі столу. Допоможемо Мімі її знайти?</p><div class="controls"><button class="action" id="start">Відкрити справу</button><button class="action secondary" id="hint" hidden>Підказка 🔎</button><button class="action secondary" id="notesButton" hidden>Блокнот 📒</button><button class="action" id="again" hidden>Розслідувати ще раз</button></div><p class="status">Без таймера · можна досліджувати у власному темпі</p></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),scene=document.querySelector('.scene'),message=$('message'),start=$('start'),hint=$('hint'),again=$('again'),notesButton=$('notesButton'),notebook=$('notebook'),notes=$('notes'),clueLayer=$('clueLayer'),dots=[...document.querySelectorAll('.clue-dot')],spots=[...document.querySelectorAll('.hotspot')];
const common='../../../../../audio/games/common/';const music=new Audio('../../../../../audio/games/find-for-mimi/music/level-4.mp3');music.loop=true;music.volume=.11;let active=false,finished=false,sound=true,found=[],lastAudio=null;
const clues={box:{icon:'📄',className:'paper',note:'На коробці залишився шматочок пакувального паперу.',line:'Папір є, але стрічки тут немає. Це хибний слід.'},scissors:{icon:'🧵',className:'thread',note:'На ножицях зачепилася тоненька коралова ниточка.',line:'На ножицях коралова ниточка — стрічку тут відрізали.'},drawer:{icon:'➰',className:'snip',note:'У шухляді лежить маленький обрізок такої самої стрічки.',line:'Маленький обрізок! Отже, стрічка була біля шухляди.'},basket:{icon:'',className:'',note:'Кінчик стрічки визирає з-поміж тканин.',line:'Між тканинами щось коралове. Зазирнімо в кошик!'}};
function setMessage(t){message.textContent=t}function play(file,v=.55){if(!sound)return;if(lastAudio){lastAudio.pause();lastAudio.currentTime=0}lastAudio=new Audio(common+file);lastAudio.volume=v;lastAudio.play().catch(()=>{})}function peek(){notebook.classList.add('open');clearTimeout(peek.timer);peek.timer=setTimeout(()=>{if(!finished)notebook.classList.remove('open')},1800)}
function proofCount(){return found.filter(x=>x==='scissors'||x==='drawer').length}function mark(){const count=proofCount(),index=count-1;if(dots[index]){dots[index].textContent='✓';dots[index].classList.add('found')}if(count===2&&!found.includes('basket')){document.querySelector('[data-place="basket"]').classList.add('ready');setTimeout(()=>setMessage('Ниточка й обрізок ведуть до кошика з тканинами. Перевірмо його!'),500)}}
function reveal(place,button){if(!active||finished||found.includes(place))return;if(place==='basket'&&proofCount()<2){setMessage('У кошику щось є… Та спершу знайдімо дві підказки.');play('retry-1.mp3',.45);button.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:650});return}const clue=clues[place],el=document.createElement('span');el.className='evidence '+clue.className;el.textContent=clue.icon;clueLayer.append(el);found.push(place);button.disabled=true;button.classList.remove('ready');setMessage(clue.line);notes.insertAdjacentHTML('beforeend','<li>'+clue.note+'</li>');if(place==='box'){play('wrong_boop.mp3',.45);const tag=document.createElement('span');tag.className='false-trail';tag.innerHTML='Хибний слід — і він теж<br>допомагає розслідуванню!';scene.append(tag);setTimeout(()=>tag.remove(),2100)}else{play('item_place.mp3');mark();peek()}if(place==='basket'){spots.forEach(b=>b.disabled=true);setTimeout(finish,750)}}
function finish(){finished=true;notebook.classList.remove('open');const final=document.createElement('div');final.className='final-reveal';final.setAttribute('aria-label','Загублена коралова стрічка знайшлася в кошику з тканинами');final.innerHTML='<img src="assets/ribbon-found.webp?v=20261029a" alt="Коралова стрічка в кошику з тканинами"><span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>';scene.append(final);requestAnimationFrame(()=>final.classList.add('show'));setMessage('Справу розкрито! Стрічка зісковзнула зі столу просто в кошик із тканинами.');notes.insertAdjacentHTML('beforeend','<li><strong>Справу розкрито:</strong> стрічка знайшлася в кошику.</li>');dots.forEach(d=>{d.textContent='★';d.classList.add('found')});play('scene_complete.mp3',.65);hint.hidden=true;notesButton.hidden=true;again.hidden=false;confetti()}
function confetti(){const colors=['#f09a91','#f0bd56','#d99ab5','#8f7bc2'];for(let i=0;i<22;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=colors[i%4];c.style.animationDelay=Math.random()*.55+'s';$('confetti').append(c)}}
function begin(){active=true;if(sound)music.play().catch(()=>{});scene.classList.add('case-opening');start.hidden=true;setMessage('Справа номер три: коралова стрічка щойно лежала на столі, а тепер її немає!');play('game_start.mp3',.5);setTimeout(()=>{document.body.classList.add('case-open');scene.classList.remove('case-opening');hint.hidden=false;notesButton.hidden=false;setMessage('Оглядай творчу кімнату й шукай сліди коралової стрічки.')},1150)}
function reset(){active=false;finished=false;found=[];music.pause();music.currentTime=0;clearTimeout(peek.timer);document.body.classList.remove('case-open');clueLayer.replaceChildren();$('confetti').replaceChildren();document.querySelector('.final-reveal')?.remove();spots.forEach(b=>{b.disabled=false;b.classList.remove('ready')});dots.forEach(d=>{d.textContent='?';d.classList.remove('found')});notes.innerHTML='<li>Кораловою стрічкою хотіли прикрасити подарунок.</li>';notebook.classList.remove('open');again.hidden=true;notesButton.hidden=true;hint.hidden=true;start.hidden=false;setMessage('Стрічка для подарунка зникла зі столу. Допоможемо Мімі її знайти?')}
function showHint(){const order=['scissors','drawer','basket'],next=order.find(x=>!found.includes(x));if(!next)return;const label={scissors:'ножиці',drawer:'відчинену шухляду',basket:'кошик із тканинами'}[next];setMessage('Мімі радить уважніше оглянути '+label+'.');document.querySelector('[data-place="'+next+'"]').animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:800});play('retry-1.mp3',.5)}
spots.forEach(b=>b.onclick=function(){reveal(this.dataset.place,this)});start.onclick=begin;again.onclick=reset;hint.onclick=showHint;notesButton.onclick=()=>notebook.classList.toggle('open');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound));if(!sound){music.pause();if(lastAudio)lastAudio.pause()}else if(active)music.play().catch(()=>{})};document.addEventListener('visibilitychange',()=>{if(document.hidden){music.pause();if(lastAudio)lastAudio.pause()}else if(sound&&active)music.play().catch(()=>{})});
</script>
</body>
</html>
