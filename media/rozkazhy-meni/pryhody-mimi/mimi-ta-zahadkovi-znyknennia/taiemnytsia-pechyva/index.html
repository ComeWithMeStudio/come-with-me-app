<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5e9e0">
  <title>Таємниця печива — Мімі та загадкові зникнення</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Trebuchet MS",system-ui,sans-serif;color:#514254;background:linear-gradient(155deg,#f0e5ef,#fff0dd);padding:10px 10px 38px}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #7954aa;outline-offset:3px}.shell{width:min(920px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:999px;padding:10px 14px;background:#fffaf0;color:#4d4052;text-decoration:none;font-weight:900;box-shadow:0 4px 14px #604f7020}.title{text-align:center;margin:8px 0 10px}.title small{display:block;color:#806d83;font-weight:900;letter-spacing:.04em}.title h1{font-size:clamp(27px,6vw,44px);line-height:1.05;margin:3px 0}.casefile{display:flex;justify-content:center;gap:8px;margin-bottom:9px}.clue-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff9ef;border:2px solid #ddcce1;font-size:15px;transition:.25s}.clue-dot.found{background:#f7d786;border-color:#e2b94a;transform:scale(1.08)}
    .scene{position:relative;isolation:isolate;overflow:hidden;width:100%;aspect-ratio:3/2;min-height:250px;border:4px solid #fffaf1;border-radius:30px;background:#ecd9cc url("assets/kitchen-mystery.webp?v=20261028a") center/cover no-repeat;box-shadow:0 15px 38px #58466224}.mimi{position:absolute;z-index:7;left:-9%;bottom:-8%;width:clamp(250px,49%,445px);height:68%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 7px 4px #553d5430);pointer-events:none}.hotspot{position:absolute;z-index:9;display:grid;place-items:center;min-width:66px;min-height:66px;border-radius:50%;background:#fffaf0dc;border:3px solid #fffdf7;box-shadow:0 6px 18px #54445f2c;backdrop-filter:blur(3px);animation:breathe 2.2s ease-in-out infinite;transition:.25s}.hotspot span{font-size:clamp(28px,5vw,42px);filter:drop-shadow(0 2px 1px #fff)}.hotspot small{position:absolute;top:100%;margin-top:4px;padding:4px 8px;border-radius:11px;background:#fff9ef;font-size:11px;font-weight:900;white-space:nowrap}.hotspot:disabled{opacity:.45;cursor:default;animation:none}.hotspot.ready{background:#fff2bae8;border-color:#f5c955;box-shadow:0 0 0 8px #f5cf6550,0 8px 24px #765b3450;animation:ready 1.05s ease-in-out infinite}.hs-plate{left:31%;top:48%}.hs-milk{left:62%;top:39%}.hs-pantry{right:8%;top:19%}.hs-napkin{right:20%;bottom:11%}body:not(.case-open) .hotspot{opacity:0;pointer-events:none;transform:scale(.8)}
    .evidence{position:absolute;z-index:11;display:grid;place-items:center;animation:pop .5s both;filter:drop-shadow(0 5px 3px #563f5833);pointer-events:none}.crumbs{left:43%;top:56%;font-size:clamp(32px,7vw,58px)}.breeze{left:17%;top:15%;font-size:clamp(35px,8vw,68px)}.milkdrop{left:68%;top:52%;font-size:clamp(31px,7vw,56px)}.false-trail{position:absolute;z-index:15;left:50%;top:7%;transform:translateX(-50%);padding:9px 15px;border-radius:999px;background:#fff7e8ee;font-size:13px;font-weight:900;white-space:nowrap;box-shadow:0 6px 18px #4d3e512e;animation:pop .4s both}.panel{margin-top:11px;padding:14px;background:#fff9ef;border-radius:24px;text-align:center;box-shadow:0 8px 25px #604f701b}.message{font-size:clamp(17px,3.7vw,24px);font-weight:900;line-height:1.35;min-height:3em;margin:0;display:grid;place-items:center}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.action{border-radius:999px;padding:12px 20px;background:#7954aa;color:#fff;font-weight:900}.secondary{background:#eadff0;color:#594b66}.status{font-size:12px;color:#7c6a7f;margin:7px 0 0}.notebook{position:absolute;right:2%;top:2%;z-index:16;width:min(250px,50%);padding:12px;border-radius:18px;background:#fff9efee;box-shadow:0 8px 24px #493b502c;transform:translateY(-130%);transition:.45s}.notebook.open{transform:translateY(0)}.notebook strong{display:block;margin-bottom:5px}.notebook ul{margin:0;padding-left:19px;font-size:13px;line-height:1.4}.case-opening:after{content:"СПРАВА № 2";position:absolute;inset:0;z-index:22;display:grid;place-items:center;background:#60496fbb;color:#fffaf0;font-size:clamp(28px,7vw,58px);font-weight:900;letter-spacing:.08em;animation:caseIntro 1.15s both}.final-reveal{position:absolute;inset:0;z-index:19;background:#ecd9cc url("assets/cookie-found.webp?v=20261028a") center/cover no-repeat;opacity:0;transform:scale(1.04);transition:opacity .7s,transform 1.1s;overflow:hidden}.final-reveal.show{opacity:1;transform:scale(1)}.spark{position:absolute;color:#fff3a7;font-size:clamp(28px,6vw,50px);text-shadow:0 3px 8px #79533c99;animation:twinkle 1.6s ease-in-out infinite}.s1{left:44%;top:36%}.s2{left:67%;top:48%;animation-delay:.5s}.s3{left:57%;top:25%;animation-delay:1s}.confetti{position:absolute;inset:0;z-index:23;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-10%;width:12px;height:18px;border-radius:4px;animation:fall 2.4s linear forwards}
    @keyframes breathe{50%{transform:scale(1.05)}}@keyframes ready{50%{transform:scale(1.11)}}@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:scale(1)}}@keyframes caseIntro{0%{opacity:0}25%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@keyframes twinkle{50%{transform:scale(1.3) rotate(12deg);opacity:.55}}@keyframes fall{to{transform:translateY(700px) rotate(520deg)}}[hidden]{display:none!important}
    @media(max-width:540px){body{padding:8px 8px 28px}.top{font-size:13px}.pill{padding:9px 11px}.scene{border-radius:24px}.mimi{width:68%;height:72%;left:-14%;bottom:-9%}.hotspot{min-width:50px;min-height:50px}.hotspot span{font-size:25px}.hotspot small{font-size:9px}.hs-plate{left:29%;top:47%}.hs-milk{left:61%;top:36%}.hs-pantry{right:5%;top:17%}.hs-napkin{right:15%;bottom:9%}.notebook{width:57%}.panel{padding:12px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
    .napkin-icon{display:block!important;width:clamp(36px,7vw,58px);height:clamp(36px,7vw,58px);background:url("assets/napkin-icon.webp?v=20261028a") center/contain no-repeat;filter:drop-shadow(0 2px 1px #fff)}
    .false-trail{width:max-content;max-width:calc(100% - 24px);border-radius:20px;line-height:1.25;text-align:center;white-space:normal}
    @media(max-width:540px){.mimi{width:132%;height:130%;left:-49%;bottom:-29%}}
  </style>
</head>
<body>
<main class="shell">
  <header class="top"><a class="pill" href="../../../../../mimi-adventures.html">← Пригоди</a><button class="pill" id="sound" aria-pressed="true" aria-label="Вимкнути звук">🔊</button></header>
  <section class="title"><small>МІМІ ТА ЗАГАДКОВІ ЗНИКНЕННЯ · СПРАВА №2</small><h1>Таємниця печива 🍪</h1></section>
  <div class="casefile" aria-label="Знайдені підказки"><span class="clue-dot">?</span><span class="clue-dot">?</span><span class="clue-dot">?</span></div>
  <section class="scene" aria-label="Кухня, де потрібно знайти зникле печиво">
    <img class="mimi" src="/media/mimi-library/illustrations/mimi-standing-front.webp" alt="Мімі, хлопчик-помічник">
    <button class="hotspot hs-plate" data-place="plate"><span>🍽️</span><small>Тарілка</small></button>
    <button class="hotspot hs-milk" data-place="milk"><span>🥛</span><small>Молоко</small></button>
    <button class="hotspot hs-pantry" data-place="pantry"><span>🫙</span><small>Шафка</small></button>
    <button class="hotspot hs-napkin" data-place="napkin"><span class="napkin-icon" aria-hidden="true"></span><small>Серветка</small></button>
    <aside class="notebook" id="notebook" aria-live="polite"><strong>Детективний блокнот</strong><ul id="notes"><li>На тарілці було одне кругле печиво.</li></ul></aside>
    <div id="clueLayer"></div><div class="confetti" id="confetti"></div>
  </section>
  <section class="panel"><p class="message" id="message" role="status" aria-live="polite">З тарілки зникло печиво. Допоможемо Мімі розкрити таємницю?</p><div class="controls"><button class="action" id="start">Відкрити справу</button><button class="action secondary" id="hint" hidden>Підказка 🔎</button><button class="action secondary" id="notesButton" hidden>Блокнот 📒</button><button class="action" id="again" hidden>Розслідувати ще раз</button></div><p class="status">Без таймера · можна досліджувати у власному темпі</p></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),scene=document.querySelector('.scene'),message=$('message'),start=$('start'),hint=$('hint'),again=$('again'),notesButton=$('notesButton'),notebook=$('notebook'),notes=$('notes'),clueLayer=$('clueLayer'),dots=[...document.querySelectorAll('.clue-dot')],spots=[...document.querySelectorAll('.hotspot')];
const common='../../../../../audio/games/common/';const music=new Audio('../../../../../audio/games/find-for-mimi/music/level-4.mp3');music.loop=true;music.volume=.11;let active=false,finished=false,sound=true,found=[],lastAudio=null;
const clues={plate:{icon:'🍪',className:'crumbs',note:'На тарілці залишилися дві крихти.',line:'Дві крихти! Печиво було тут зовсім недавно.'},milk:{icon:'💧',className:'milkdrop',note:'Біля молока є краплинка — це хибний слід.',line:'Краплинка молока. Але печиво від неї сховатися не могло — це хибний слід.'},pantry:{icon:'💨',className:'breeze',note:'Із відчиненої шафки й від вікна тягне легкий вітерець.',line:'Відчуваєш вітерець? Він міг посунути легку серветку.'},napkin:{icon:'',className:'napkin-clue',note:'Серветка лежить не так, як раніше.',line:'Куточок серветки піднявся. Зазирнімо під неї!'}};
function setMessage(t){message.textContent=t}function play(file,v=.55){if(!sound)return;if(lastAudio){lastAudio.pause();lastAudio.currentTime=0}lastAudio=new Audio(common+file);lastAudio.volume=v;lastAudio.play().catch(()=>{})}function peek(){notebook.classList.add('open');clearTimeout(peek.timer);peek.timer=setTimeout(()=>{if(!finished)notebook.classList.remove('open')},1800)}
function mark(){const count=found.filter(x=>x==='plate'||x==='pantry').length,index=count-1;if(dots[index]){dots[index].textContent='✓';dots[index].classList.add('found')}if(count===2&&!found.includes('napkin')){document.querySelector('[data-place="napkin"]').classList.add('ready');setTimeout(()=>setMessage('Крихти й вітерець ведуть до серветки. Перевірмо її!'),500)}}
function reveal(place,button){if(!active||finished||found.includes(place))return;if(place==='napkin'&&found.filter(x=>x==='plate'||x==='pantry').length<2){setMessage('Під серветкою щось є… Та спершу знайдімо дві підказки.');play('retry-1.mp3',.45);button.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:650});return}const clue=clues[place],el=document.createElement('span');el.className='evidence '+clue.className;el.textContent=clue.icon;clueLayer.append(el);found.push(place);button.disabled=true;button.classList.remove('ready');setMessage(clue.line);notes.insertAdjacentHTML('beforeend','<li>'+clue.note+'</li>');if(place==='milk'){play('wrong_boop.mp3',.45);const tag=document.createElement('span');tag.className='false-trail';tag.innerHTML='Хибний слід — перевіряти<br>теж важливо!';scene.append(tag);setTimeout(()=>tag.remove(),1900)}else{play('item_place.mp3');mark();peek()}if(place==='napkin'){spots.forEach(b=>b.disabled=true);setTimeout(finish,750)}}
function finish(){finished=true;notebook.classList.remove('open');const final=document.createElement('div');final.className='final-reveal';final.setAttribute('aria-label','Зникле печиво знайшлося під серветкою');final.innerHTML='<span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>';scene.append(final);requestAnimationFrame(()=>final.classList.add('show'));setMessage('Справу розкрито! Вітерець накрив печиво серветкою — воно нікуди не зникало.');notes.insertAdjacentHTML('beforeend','<li><strong>Справу розкрито:</strong> печиво було під серветкою.</li>');dots.forEach(d=>{d.textContent='★';d.classList.add('found')});play('scene_complete.mp3',.65);hint.hidden=true;notesButton.hidden=true;again.hidden=false;confetti()}
function confetti(){const colors=['#f0bd56','#d99ab5','#8fc2b4','#8f7bc2'];for(let i=0;i<22;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=colors[i%4];c.style.animationDelay=Math.random()*.55+'s';$('confetti').append(c)}}
function begin(){active=true;if(sound)music.play().catch(()=>{});scene.classList.add('case-opening');start.hidden=true;setMessage('Справа номер два: печиво щойно лежало на тарілці, а тепер його немає!');play('game_start.mp3',.5);setTimeout(()=>{document.body.classList.add('case-open');scene.classList.remove('case-opening');hint.hidden=false;notesButton.hidden=false;setMessage('Оглядай кухню й торкайся місць, де може ховатися підказка.')},1150)}
function reset(){active=false;finished=false;found=[];music.pause();music.currentTime=0;clearTimeout(peek.timer);document.body.classList.remove('case-open');clueLayer.replaceChildren();$('confetti').replaceChildren();document.querySelector('.final-reveal')?.remove();spots.forEach(b=>{b.disabled=false;b.classList.remove('ready')});dots.forEach(d=>{d.textContent='?';d.classList.remove('found')});notes.innerHTML='<li>На тарілці було одне кругле печиво.</li>';notebook.classList.remove('open');again.hidden=true;notesButton.hidden=true;hint.hidden=true;start.hidden=false;setMessage('З тарілки зникло печиво. Допоможемо Мімі розкрити таємницю?')}
function showHint(){const order=['plate','pantry','napkin'],next=order.find(x=>!found.includes(x));if(!next)return;const label={plate:'тарілку',pantry:'відчинену шафку',napkin:'серветку'}[next];setMessage('Мімі радить уважніше оглянути '+label+'.');document.querySelector('[data-place="'+next+'"]').animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:800});play('retry-1.mp3',.5)}
spots.forEach(b=>b.onclick=function(){reveal(this.dataset.place,this)});start.onclick=begin;again.onclick=reset;hint.onclick=showHint;notesButton.onclick=()=>notebook.classList.toggle('open');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound));if(!sound){music.pause();if(lastAudio)lastAudio.pause()}else if(active)music.play().catch(()=>{})};document.addEventListener('visibilitychange',()=>{if(document.hidden){music.pause();if(lastAudio)lastAudio.pause()}else if(sound&&active)music.play().catch(()=>{})});
</script>
</body>
</html>
