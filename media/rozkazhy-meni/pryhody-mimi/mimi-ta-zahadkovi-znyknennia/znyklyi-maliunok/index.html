<!doctype html>
<html lang="uk">
<head>

  <meta name="theme-color" content="#f5e9e0">
  <title>Зниклий малюнок — Мімі та загадкові зникнення</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font-family:"Trebuchet MS",system-ui,sans-serif;color:#514254;background:linear-gradient(155deg,#f0e5ef,#fff0dd);padding:10px 10px 38px}button,a{font:inherit;-webkit-tap-highlight-color:transparent}button{border:0;color:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:4px solid #7954aa;outline-offset:3px}.shell{width:min(920px,100%);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.pill{border-radius:999px;padding:10px 14px;background:#fffaf0;color:#4d4052;text-decoration:none;font-weight:900;box-shadow:0 4px 14px #604f7020}.title{text-align:center;margin:8px 0 10px}.title small{display:block;color:#806d83;font-weight:900;letter-spacing:.04em}.title h1{font-size:clamp(27px,6vw,44px);line-height:1.05;margin:3px 0}.casefile{display:flex;justify-content:center;gap:8px;margin-bottom:9px}.clue-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff9ef;border:2px solid #ddcce1;font-size:15px;transition:.25s}.clue-dot.found{background:#f7d786;border-color:#e2b94a;transform:scale(1.08)}
    .scene{position:relative;isolation:isolate;overflow:hidden;width:100%;aspect-ratio:3/2;min-height:250px;border:4px solid #fffaf1;border-radius:30px;background:#ecd9cc url("assets/drawing-room.webp?v=20261029") center/cover no-repeat;box-shadow:0 15px 38px #58466224}.mimi{position:absolute;z-index:7;left:-11%;bottom:-9%;width:clamp(250px,52%,460px);height:70%;object-fit:contain;object-position:left bottom;filter:drop-shadow(0 7px 4px #553d5430);pointer-events:none}.hotspot{position:absolute;z-index:9;display:grid;place-items:center;min-width:66px;min-height:66px;border-radius:50%;background:#fffaf0dc;border:3px solid #fffdf7;box-shadow:0 6px 18px #54445f2c;backdrop-filter:blur(3px);animation:breathe 2.2s ease-in-out infinite;transition:.25s}.hotspot span{font-size:clamp(28px,5vw,42px);filter:drop-shadow(0 2px 1px #fff)}.hotspot small{position:absolute;top:100%;margin-top:4px;padding:4px 8px;border-radius:11px;background:#fff9ef;font-size:11px;font-weight:900;white-space:nowrap}.hotspot:disabled{opacity:.45;cursor:default;animation:none}.hotspot.ready{background:#fff2bae8;border-color:#f5c955;box-shadow:0 0 0 8px #f5cf6550,0 8px 24px #765b3450;animation:ready 1.05s ease-in-out infinite}.hs-pencil{left:45%;top:58%}.hs-table{left:21%;top:36%}.hs-window{left:63%;top:20%}.hs-curtain{right:10%;bottom:25%}body:not(.case-open) .hotspot{opacity:0;pointer-events:none;transform:scale(.8)}
    .evidence{position:absolute;z-index:11;display:grid;place-items:center;animation:pop .5s both;filter:drop-shadow(0 5px 3px #563f5833);pointer-events:none}.thread{left:39%;top:45%;font-size:clamp(30px,7vw,54px)}.snip{left:55%;top:32%;font-size:clamp(29px,7vw,52px)}.paper{left:31%;top:24%;font-size:clamp(31px,7vw,56px)}.false-trail{position:absolute;z-index:15;left:50%;top:7%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 24px);padding:9px 15px;border-radius:20px;background:#fff7e8ee;font-size:13px;font-weight:900;line-height:1.25;text-align:center;white-space:normal;box-shadow:0 6px 18px #4d3e512e;animation:pop .4s both}.panel{margin-top:11px;padding:14px;background:#fff9ef;border-radius:24px;text-align:center;box-shadow:0 8px 25px #604f701b}.message{font-size:clamp(17px,3.7vw,24px);font-weight:900;line-height:1.35;min-height:3em;margin:0;display:grid;place-items:center}.controls{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}.action{border-radius:999px;padding:12px 20px;background:#7954aa;color:#fff;font-weight:900}.secondary{background:#eadff0;color:#594b66}.status{font-size:12px;color:#7c6a7f;margin:7px 0 0}.notebook{position:absolute;right:2%;top:2%;z-index:16;width:min(250px,50%);padding:12px;border-radius:18px;background:#fff9efee;box-shadow:0 8px 24px #493b502c;transform:translateY(-130%);transition:.45s}.notebook.open{transform:translateY(0)}.notebook strong{display:block;margin-bottom:5px}.notebook ul{margin:0;padding-left:19px;font-size:13px;line-height:1.4}.case-opening:after{content:"СПРАВА № 5";position:absolute;inset:0;z-index:22;display:grid;place-items:center;background:#60496fbb;color:#fffaf0;font-size:clamp(28px,7vw,58px);font-weight:900;letter-spacing:.08em;animation:caseIntro 1.15s both}.final-reveal{position:absolute;inset:0;z-index:19;background:linear-gradient(#eef6d5aa,#e2edc9cc),url("assets/drawing-room.webp") center/cover;opacity:0;transform:scale(1.04);transition:opacity .7s,transform 1.1s;overflow:hidden;display:grid;place-items:center}.final-reveal.show{opacity:1;transform:scale(1)}.final-reveal img{width:72%;height:86%;object-fit:contain;filter:drop-shadow(0 16px 12px #735d5340)}.spark{position:absolute;color:#fff3a7;font-size:clamp(28px,6vw,50px);text-shadow:0 3px 8px #79533c99;animation:twinkle 1.6s ease-in-out infinite}.s1{left:24%;top:24%}.s2{right:20%;top:45%;animation-delay:.5s}.s3{left:51%;top:14%;animation-delay:1s}.confetti{position:absolute;inset:0;z-index:23;pointer-events:none;overflow:hidden}.confetti i{position:absolute;top:-10%;width:12px;height:18px;border-radius:4px;animation:fall 2.4s linear forwards}
    @keyframes breathe{50%{transform:scale(1.05)}}@keyframes ready{50%{transform:scale(1.11)}}@keyframes pop{from{opacity:0;transform:scale(.3) rotate(-8deg)}to{opacity:1;transform:scale(1)}}@keyframes caseIntro{0%{opacity:0}25%,70%{opacity:1}100%{opacity:0;visibility:hidden}}@keyframes twinkle{50%{transform:scale(1.3) rotate(12deg);opacity:.55}}@keyframes fall{to{transform:translateY(700px) rotate(520deg)}}[hidden]{display:none!important}
    @media(max-width:540px){body{padding:8px 8px 28px}.top{font-size:13px}.pill{padding:9px 11px}.scene{border-radius:24px}.mimi{width:132%;height:130%;left:-56%;bottom:-34%}.hotspot{min-width:50px;min-height:50px}.hotspot span{font-size:25px}.hotspot small{font-size:9px}.hs-pencil{left:43%;top:57%}.hs-table{left:20%;top:30%}.hs-window{left:61%;top:14%}.hs-curtain{right:7%;bottom:23%}.notebook{width:57%}.panel{padding:12px}.final-reveal img{width:92%;height:88%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  .deduction{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:12px 0}.series-end{position:absolute;inset:0;z-index:25;background:linear-gradient(145deg,#eee4f2,#fff0dc);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px}.series-end img{height:60%;max-width:90%;object-fit:contain;animation:celebrate 2s ease-in-out infinite}.series-end p{font-size:clamp(18px,4vw,30px);font-weight:bold;margin:8px}.series-end a{color:#7954aa;font-weight:bold}@keyframes celebrate{50%{transform:translateY(-10px) rotate(3deg)}} </style>
</head>
<body>
<main class="shell">
  <header class="top"><a class="pill" href="../../../../../mimi-adventures.html">← Пригоди</a><button class="pill" id="sound" aria-pressed="true" aria-label="Вимкнути звук">🔊</button></header>
  <section class="title"><small>МІМІ ТА ЗАГАДКОВІ ЗНИКНЕННЯ · СПРАВА №5</small><h1>Зниклий малюнок 🎨</h1></section>
  <div class="casefile" aria-label="Знайдені підказки"><span class="clue-dot">?</span><span class="clue-dot">?</span><span class="clue-dot">?</span></div>
  <section class="scene" aria-label="Кімната зі столом та вікном, де потрібно знайти малюнок">
    <img class="mimi" src="/media/mimi-library/illustrations/mimi-standing-front.webp" alt="Мімі, хлопчик-помічник">
    <button class="hotspot hs-pencil" data-place="pencil"><span>✏️</span><small>Олівець</small></button>
    <button class="hotspot hs-table" data-place="table"><span>🖍️</span><small>Стіл</small></button>
    <button class="hotspot hs-window" data-place="window"><span>🪟</span><small>Вікно</small></button>
    <button class="hotspot hs-curtain" data-place="curtain"><span>🪶</span><small>Штора</small></button>
    <aside class="notebook" id="notebook" aria-live="polite"><strong>Детективний блокнот</strong><ul id="notes"><li>Мімі залишив свій малюнок на столі біля вікна.</li></ul></aside>
    <div id="clueLayer"></div><div class="confetti" id="confetti"></div>
  </section>
  <section class="panel"><p class="message" id="message" role="status" aria-live="polite">Мімі намалював картину, але вона зникла зі столу. Допоможемо її знайти?</p><div class="controls"><button class="action" id="start">Відкрити справу</button><button class="action secondary" id="hint" hidden>Підказка 🔎</button><button class="action secondary" id="notesButton" hidden>Блокнот 📒</button><button class="action" id="seriesEnd" hidden>Завершити розслідування ✨</button><button class="action" id="again" hidden>Розслідувати ще раз</button></div><div class="deduction" id="deduction" hidden><button class="action secondary" id="chooseChest">У скриньці 🧰</button><button class="action" id="chooseCurtain">За шторою 🪶</button></div><p class="status">Без таймера · можна досліджувати у власному темпі</p></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),scene=document.querySelector('.scene'),message=$('message'),start=$('start'),hint=$('hint'),again=$('again'),notesButton=$('notesButton'),notebook=$('notebook'),notes=$('notes'),clueLayer=$('clueLayer'),dots=[...document.querySelectorAll('.clue-dot')],spots=[...document.querySelectorAll('.hotspot')];
const common='../../../../../audio/games/common/',voiceBase='audio/',narrationReady=false;const music=new Audio('../../../../../audio/games/find-for-mimi/music/level-4.mp3');music.loop=true;music.volume=.11;let active=false,finished=false,sound=true,found=[],lastAudio=null,lastVoice=null,voiceQueue=[],voicePlaying=false,voiceDone=null,session=0,transitioning=false,deductionSolved=false;
const clues={pencil:{icon:'✏️',className:'paper',note:'Олівець залишився в кімнаті. Він не пояснює зникнення.',line:'Знайшовся олівець! Але він не підкаже, куди подівся малюнок. Це хибний слід.'},table:{icon:'▱',className:'thread',note:'На столі порожнє місце: тут щойно лежав малюнок.',line:'На столі порожнє місце. Малюнок був тут, а тепер зник!'},window:{icon:'📄',className:'snip',note:'Вікно відчинене. Вітерець ворушить штору й паперовий куточок.',line:'Вікно відчинене! Вітерець ворушить штору. Біля неї видно паперовий куточок.'},curtain:{icon:'',className:'',note:'За шторою сховався малюнок Мімі.',line:'За шторою кольоровий аркуш. Зазирнімо туди!'}};
function setMessage(t){message.textContent=t}function play(file,v=.55){if(!sound)return;if(lastAudio){lastAudio.pause();lastAudio.currentTime=0}lastAudio=new Audio(common+file);lastAudio.volume=v;lastAudio.play().catch(()=>{})}function nextVoice(){if(voicePlaying||!voiceQueue.length)return;const job=voiceQueue.shift();if(job.session!==session){job.resolve();nextVoice();return}voicePlaying=true;let settled=false;const done=()=>{if(settled)return;settled=true;voicePlaying=false;lastVoice=null;voiceDone=null;music.volume=.11;job.resolve();nextVoice()};voiceDone=done;if(!sound||!narrationReady){done();return}lastVoice=new Audio(voiceBase+job.file+'.mp3?v=20261029');lastVoice.volume=1;music.volume=.035;lastVoice.onended=done;lastVoice.onerror=done;lastVoice.play().catch(done)}
function speak(file){return new Promise(resolve=>{voiceQueue.push({file,resolve,session});nextVoice()})}
function stopVoices(){const pending=voiceQueue.splice(0);pending.forEach(j=>j.resolve());if(lastVoice){lastVoice.pause();lastVoice.currentTime=0}if(voiceDone)voiceDone();voicePlaying=false;lastVoice=null;music.volume=.11}
function peek(){notebook.classList.add('open');clearTimeout(peek.timer);peek.timer=setTimeout(()=>{if(!finished)notebook.classList.remove('open')},1800)}
function proofCount(){return found.filter(x=>x==='table'||x==='window').length}function mark(){const count=proofCount(),index=count-1;if(dots[index]){dots[index].textContent='✓';dots[index].classList.add('found')}if(count===2&&!found.includes('curtain')){transitioning=true;const current=session;speak('curtain-ready').then(()=>{if(current!==session||finished)return;transitioning=false;$('deduction').hidden=false});setMessage('Малюнок зник зі столу, а біля вікна видно папір. Де перевіримо?')}}
function reveal(place,button){if(!active||finished||transitioning||found.includes(place))return;if(place==='curtain'&&proofCount()===2&&!deductionSolved){setMessage('Куди ведуть підказки? Обери місце під повідомленням.');$('deduction').hidden=false;return}if(place==='curtain'&&proofCount()<2){setMessage('Штора ворушиться… Та спершу знайдімо дві підказки.');speak('curtain-locked');play('retry-1.mp3',.45);button.animate([{transform:'scale(1)'},{transform:'scale(1.1)'},{transform:'scale(1)'}],{duration:650});return}const clue=clues[place],el=document.createElement('span');el.className='evidence '+clue.className;el.textContent=clue.icon;clueLayer.append(el);found.push(place);button.disabled=true;button.classList.remove('ready');setMessage(clue.line);const current=session;const spoken=speak(place==='pencil'?'false-trail':place);notes.insertAdjacentHTML('beforeend','<li>'+clue.note+'</li>');if(place==='pencil'){play('wrong_boop.mp3',.45);const tag=document.createElement('span');tag.className='false-trail';tag.innerHTML='Хибний слід — і він теж<br>допомагає розслідуванню!';scene.append(tag);setTimeout(()=>tag.remove(),2100)}else{play('item_place.mp3');peek();if(place!=='curtain'){transitioning=true;spoken.then(()=>{if(current!==session)return;transitioning=false;mark()})}}if(place==='curtain'){spots.forEach(b=>b.disabled=true);spoken.then(()=>{if(current===session)finish()})}}
function finish(){finished=true;notebook.classList.remove('open');const final=document.createElement('div');final.className='final-reveal';final.setAttribute('aria-label','Малюнок знайшовся за шторою');final.innerHTML='<img src="assets/found-drawing.svg" alt="Знайдений малюнок Мімі"><span class="spark s1">✦</span><span class="spark s2">✦</span><span class="spark s3">✦</span>';scene.append(final);requestAnimationFrame(()=>final.classList.add('show'));setMessage('Справу розкрито! Вітерець підхопив малюнок зі столу й заніс за штору.');speak('complete');notes.insertAdjacentHTML('beforeend','<li><strong>Справу розкрито:</strong> малюнок знайшовся за шторою.</li>');dots.forEach(d=>{d.textContent='★';d.classList.add('found')});play('scene_complete.mp3',.65);hint.hidden=true;notesButton.hidden=true;again.hidden=false;$('seriesEnd').hidden=false;confetti()}
function confetti(){const colors=['#f09a91','#f0bd56','#d99ab5','#8f7bc2'];for(let i=0;i<22;i++){const c=document.createElement('i');c.style.left=Math.random()*100+'%';c.style.background=colors[i%4];c.style.animationDelay=Math.random()*.55+'s';$('confetti').append(c)}}
async function begin(){if(active)return;active=true;transitioning=true;const current=session;if(sound)music.play().catch(()=>{});scene.classList.add('case-opening');start.hidden=true;setMessage('Справа номер п’ять: зі столу зник малюнок Мімі!');play('game_start.mp3',.5);await speak('case-open');if(current!==session)return;document.body.classList.add('case-open');scene.classList.remove('case-opening');setMessage('Оглядай кімнату й шукай підказки, куди подівся малюнок.');await speak('explore');if(current!==session)return;transitioning=false;hint.hidden=false;notesButton.hidden=false}
function reset(){session++;stopVoices();transitioning=false;if(lastAudio){lastAudio.pause();lastAudio.currentTime=0}active=false;finished=false;found=[];deductionSolved=false;$('deduction').hidden=true;$('seriesEnd').hidden=true;document.querySelector('.series-end')?.remove();music.pause();music.currentTime=0;clearTimeout(peek.timer);document.body.classList.remove('case-open');clueLayer.replaceChildren();$('confetti').replaceChildren();document.querySelector('.final-reveal')?.remove();spots.forEach(b=>{b.disabled=false;b.classList.remove('ready')});dots.forEach(d=>{d.textContent='?';d.classList.remove('found')});notes.innerHTML='<li>Мімі залишив свій малюнок на столі біля вікна.</li>';notebook.classList.remove('open');again.hidden=true;notesButton.hidden=true;hint.hidden=true;start.hidden=false;setMessage('Мімі намалював картину, але вона зникла зі столу. Допоможемо її знайти?')}
function showHint(){if(transitioning||voicePlaying)return;const order=['table','window','curtain'],next=order.find(x=>!found.includes(x));if(!next)return;const label={table:'стіл',window:'відчинене вікно',curtain:'штору'}[next];setMessage('Мімі радить уважніше оглянути '+label+'.');speak('hint-'+next);document.querySelector('[data-place="'+next+'"]').animate([{transform:'scale(1)'},{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:800});play('retry-1.mp3',.5)}
$('chooseChest').onclick=()=>{setMessage('У скриньці іграшки. А вітерець дме від вікна. Спробуй інше місце!');speak('choose-again')};$('chooseCurtain').onclick=()=>{deductionSolved=true;$('deduction').hidden=true;setMessage('Так! Перевірмо штору біля відчиненого вікна.');speak('choose-curtain');document.querySelector('[data-place="curtain"]').classList.add('ready')};$('seriesEnd').onclick=async()=>{if(voicePlaying||transitioning)return;const end=document.createElement('div');end.className='series-end';end.innerHTML='<img src="/media/mimi-library/illustrations/mimi-paws-up.webp" alt="Мімі вітає детектива"><p>П’ять справ розкрито!<br>Дякую тобі, детективе!</p><a href="../index.html">Обрати справу ще раз →</a>';scene.append(end);$('seriesEnd').hidden=true;music.pause();await speak('series-complete')};spots.forEach(b=>b.onclick=function(){reveal(this.dataset.place,this)});start.onclick=begin;again.onclick=reset;hint.onclick=showHint;notesButton.onclick=()=>notebook.classList.toggle('open');$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊':'🔇';$('sound').setAttribute('aria-pressed',String(sound));$('sound').setAttribute('aria-label',sound?'Вимкнути звук':'Увімкнути звук');if(!sound){music.pause();if(lastAudio)lastAudio.pause();stopVoices()}else if(active&&!finished)music.play().catch(()=>{})};document.addEventListener('visibilitychange',()=>{if(document.hidden){music.pause();if(lastAudio)lastAudio.pause();if(lastVoice)lastVoice.pause()}else if(sound&&active){if(!finished)music.play().catch(()=>{});if(lastVoice)lastVoice.play().catch(()=>{if(voiceDone)voiceDone()})}});
</script>
</body>
