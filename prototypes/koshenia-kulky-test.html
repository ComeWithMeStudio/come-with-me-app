ction point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;if(el.closest('defs'))return null;return el.closest('.paint')}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){let t=target(e);if(t)t.style.fill=color;return}if(tool==='eraser'&&!beginErase())return;if(tool==='brush'&&mask){newBrushLayer();mask=null}drawing=true;svg.setPointerCapture(e.pointerId);stroke=document.createElementNS(NS,'path');stroke.setAttribute('fill','none');stroke.setAttribute('stroke',tool==='eraser'?'black':color);stroke.setAttribute('stroke-width',tool==='eraser'?'23':'13');stroke.setAttribute('stroke-linecap','round');stroke.setAttribute('stroke-linejoin','round');stroke.dataset.draw='1';let p=point(e);stroke.setAttribute('d',`M${p.x} ${p.y} l0.01 0`);(tool==='eraser'?mask:brushLayer).append(stroke)});svg.addEventListener('pointermove',e=>{if(!drawing||!stroke)return;let p=point(e);stroke.setAttribute('d',stroke.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;stroke=null}));document.getElementById('clear').onclick=()=>{svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="paint-eraser-mask-"]').forEach(x=>x.remove());mask=null;newBrushLayer()};</script></html>
