<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Кошеня з кульками — розмальовка</title><style>body{margin:0;background:#fff4e7;font:16px system-ui;text-align:center;color:#4b3760}h2{margin:12px}main{max-width:850px;margin:auto}svg{width:96%;background:white;border-radius:20px;touch-action:none;box-shadow:0 2px 15px #cdb9aa}button{font:inherit;border:0;border-radius:13px;padding:10px;background:#fff;box-shadow:0 2px 5px #b6a5a0;margin:3px}button.active{outline:3px solid #8656bc}.palette button{width:36px;height:36px;border:2px solid #777}.paint{fill:white;stroke:#29212c;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}path.detail{fill:none;stroke:#29212c;stroke-width:3;pointer-events:none}#art{cursor:crosshair}small{display:block;margin:10px}</style><main><h2>🎈 Кошеня з кульками</h2><svg id="art" viewBox="0 0 800 570" xmlns="http://www.w3.org/2000/svg"><defs><g id="balloon"><path class="paint" d="M0 -96 C-59 -96 -82 -49 -76 1 C-72 54 -29 95 0 114 C29 95 72 54 76 1 C82 -49 59 -96 0 -96Z"/><path class="paint" d="M0 114 l-12 17 24 0Z"/><path class="detail" d="M-45 -49 Q-62 -20 -52 5"/></g></defs><g transform="translate(400 290)"><path class="detail" d="M-170 -62 Q-70 55 -8 204 M0 -88 Q-10 63 -8 204 M166 -62 Q58 55 -8 204 M-93 11 Q-38 107 -8 204 M98 12 Q38 112 -8 204"/><use href="#balloon" transform="translate(-166 -125) rotate(-15) scale(.92)"/><use href="#balloon" transform="translate(166 -125) rotate(15) scale(.92)"/><use href="#balloon" transform="translate(0 -157) scale(1.03)"/><use href="#balloon" transform="translate(-91 -54) rotate(-8) scale(.85)"/><use href="#balloon" transform="translate(98 -54) rotate(8) scale(.85)"/><path class="paint" d="M-89 146 Q-128 179 -126 220 Q-108 261 -45 250 L52 250 Q110 251 119 208 Q126 166 80 143Z"/><path class="paint" d="M-96 157 Q-143 142 -151 174 Q-153 196 -117 201 L-93 188Z"/><path class="paint" d="M96 157 Q143 142 151 174 Q153 196 117 201 L93 188Z"/><path class="paint" d="M-82 207 Q-122 222 -108 257 Q-84 277 -38 249Z"/><path class="paint" d="M70 207 Q120 219 109 256 Q83 277 36 250Z"/><path class="paint" d="M-99 60 L-118 -48 Q-80 -42 -50 -9 Q0 -26 50 -9 Q80 -42 118 -48 L99 60 Q123 137 65 168 Q0 201 -65 168 Q-123 137 -99 60Z"/><path class="paint" d="M-96 -28 L-83 24 L-42 4Z"/><path class="paint" d="M96 -28 L83 24 L42 4Z"/><ellipse class="paint" cx="0" cy="115" rx="78" ry="65"/><ellipse cx="-40" cy="75" rx="10" ry="15" fill="#29212c"/><ellipse cx="40" cy="75" rx="10" ry="15" fill="#29212c"/><circle cx="-43" cy="70" r="3" fill="white"/><circle cx="37" cy="70" r="3" fill="white"/><path class="paint" d="M-15 106 Q0 120 15 106 Q0 96 -15 106Z"/><path class="detail" d="M0 119 Q-15 140 -29 121 M0 119 Q15 140 29 121 M-30 108 L-76 98 M-30 117 L-77 122 M30 108 L76 98 M30 117 L77 122"/><circle class="paint" cx="-67" cy="112" r="10"/><circle class="paint" cx="67" cy="112" r="10"/><path class="paint" d="M-8 177 Q-42 168 -47 184 Q-50 205 -8 205Z"/><path class="paint" d="M-8 177 Q25 168 31 184 Q34 205 -8 205Z"/><circle class="paint" cx="-8" cy="187" r="9"/></g><path class="detail" d="M110 550 Q400 543 690 550"/></svg><div class="tools"><button data-tool="fill" class="active">🪣 Заливка</button><button data-tool="brush">🖌️ Пензлик</button><button data-tool="eraser">🧽 Гумка</button><button id="undo">↶ Скасувати</button><button id="clear">↺ Очистити</button></div><div class="palette" id="palette"></div><small>Торкнися кульок або кошеняти, щоб розфарбувати. Пензликом можна малювати поверх малюнка.</small></main><script>/* Expand SVG symbols into real paintable elements. SVG <use> hit-testing only targets the outer instance, so individual wing details cannot be filled. */function expandUses(root){for(const use of Array.from(root.querySelectorAll('use'))){const ref=use.getAttribute('href')||use.getAttribute('xlink:href');const source=ref&&document.getElementById(ref.slice(1));if(!source)continue;const g=document.createElementNS('http://www.w3.org/2000/svg','g');const tr=use.getAttribute('transform');if(tr)g.setAttribute('transform',tr);for(const child of Array.from(source.children))g.appendChild(child.cloneNode(true));use.replaceWith(g)}if(root.querySelector('use'))expandUses(root)}expandUses(document.getElementById('art'));const svg=document.getElementById('art'),NS='http://www.w3.org/2000/svg',colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,activePaths=[],maskSerial=0;const history=[],undo=document.getElementById('undo');function snapshot(){history.push(svg.innerHTML);if(history.length>30)history.shift();undo.disabled=false}function restore(){if(!history.length)return;svg.innerHTML=history.pop();undo.disabled=!history.length;drawing=false;activePaths=[]}undo.onclick=restore;undo.disabled=true;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;return el.closest('defs')?null:el.closest('.paint')}function newStroke(c,w){const p=document.createElementNS(NS,'path');p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');return p}function brush(){const g=document.createElementNS(NS,'g');g.dataset.paintLayer='1';svg.append(g);return g}function eraseTargets(){const defs=svg.querySelector('defs'),layers=Array.from(svg.querySelectorAll('[data-paint-layer]')).filter(x=>x.querySelector('path'));const result=[];for(const layer of layers){let id=layer.getAttribute('data-mask-id'),m=id?svg.querySelector('#'+id):null;if(!m){id='erase-'+(++maskSerial)+'-'+Date.now();m=document.createElementNS(NS,'mask');m.id=id;m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x','0');m.setAttribute('y','0');m.setAttribute('width','800');m.setAttribute('height','570');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','800');bg.setAttribute('height','570');bg.setAttribute('fill','white');m.append(bg);defs.append(m);layer.dataset.maskId=id;layer.setAttribute('mask','url(#'+id+')')}const p=newStroke('black',23);m.append(p);result.push(p)}return result}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){const t=target(e);if(t&&t.style.fill!==color){snapshot();t.style.fill=color}return}if(tool==='eraser'&&!svg.querySelector('[data-paint-layer] path'))return;snapshot();activePaths=tool==='eraser'?eraseTargets():[newStroke(color,13)];if(tool==='brush')brush().append(activePaths[0]);if(!activePaths.length){history.pop();return}drawing=true;svg.setPointerCapture(e.pointerId);const p=point(e);for(const line of activePaths)line.setAttribute('d',`M${p.x} ${p.y} l0.01 0`)});svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);for(const line of activePaths)line.setAttribute('d',line.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;activePaths=[]}));document.getElementById('clear').onclick=()=>{snapshot();svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="erase-"]').forEach(x=>x.remove())};</script></html>
