</svg><div class="tools"><button data-tool="fill" class="active">🪣 Заливка</button><button data-tool="brush">🖌️ Пензлик</button><button data-tool="eraser">🧽 Гумка</button><button id="undo">↶ Скасувати</button><button id="clear">↺ Очистити</button></div><div class="palette" id="palette"></div><small>Торкнися частинок панцира, лапок або мордочки черепашки, щоб розфарбувати. Пензликом можна малювати поверх малюнка.</small></main><script>/* Expand SVG symbols into real paintable elements. SVG <use> hit-testing only targets the outer instance, so individual wing details cannot be filled. */function expandUses(root){for(const use of Array.from(root.querySelectorAll('use'))){const ref=use.getAttribute('href')||use.getAttribute('xlink:href');const source=ref&&document.getElementById(ref.slice(1));if(!source)continue;const g=document.createElementNS('http://www.w3.org/2000/svg','g');const tr=use.getAttribute('transform');if(tr)g.setAttribute('transform',tr);for(const child of Array.from(source.children))g.appendChild(child.cloneNode(true));use.replaceWith(g)}if(root.querySelector('use'))expandUses(root)}expandUses(document.getElementById('art'));const svg=document.getElementById('art'),NS='http://www.w3.org/2000/svg',colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,activePaths=[],maskSerial=0;const history=[],undo=document.getElementById('undo');function snapshot(){history.push(svg.innerHTML);if(history.length>30)history.shift();undo.disabled=false}function restore(){if(!history.length)return;svg.innerHTML=history.pop();undo.disabled=!history.length;drawing=false;activePaths=[]}undo.onclick=restore;undo.disabled=true;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;return el.closest('defs')?null:el.closest('.paint')}function newStroke(c,w){const p=document.createElementNS(NS,'path');p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');return p}function brush(){const g=document.createElementNS(NS,'g');g.dataset.paintLayer='1';svg.append(g);return g}function eraseTargets(){const defs=svg.querySelector('defs'),layers=Array.from(svg.querySelectorAll('[data-paint-layer]')).filter(x=>x.querySelector('path'));const result=[];for(const layer of layers){let id=layer.getAttribute('data-mask-id'),m=id?svg.querySelector('#'+id):null;if(!m){id='erase-'+(++maskSerial)+'-'+Date.now();m=document.createElementNS(NS,'mask');m.id=id;m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x','0');m.setAttribute('y','0');m.setAttribute('width','800');m.setAttribute('height','570');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','800');bg.setAttribute('height','570');bg.setAttribute('fill','white');m.append(bg);defs.append(m);layer.dataset.maskId=id;layer.setAttribute('mask','url(#'+id+')')}const p=newStroke('black',23);m.append(p);result.push(p)}return result}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){const t=target(e);if(t&&t.style.fill!==color){snapshot();t.style.fill=color}return}if(tool==='eraser'&&!svg.querySelector('[data-paint-layer] path'))return;snapshot();activePaths=tool==='eraser'?eraseTargets():[newStroke(color,13)];if(tool==='brush')brush().append(activePaths[0]);if(!activePaths.length){history.pop();return}drawing=true;svg.setPointerCapture(e.pointerId);const p=point(e);for(const line of activePaths)line.setAttribute('d',`M${p.x} ${p.y} l0.01 0`)});svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);for(const line of activePaths)line.setAttribute('d',line.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;activePaths=[]}));document.getElementById('clear').onclick=()=>{snapshot();svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="erase-"]').forEach(x=>x.remove())};</script></html>
