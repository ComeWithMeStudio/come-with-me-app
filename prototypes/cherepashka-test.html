<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Черепашка — розмальовка</title><style>body{margin:0;background:#fff4e7;font:16px system-ui;text-align:center;color:#4b3760}h2{margin:12px}main{max-width:850px;margin:auto}svg{width:96%;background:white;border-radius:20px;touch-action:none;box-shadow:0 2px 15px #cdb9aa}button{font:inherit;border:0;border-radius:13px;padding:10px;background:#fff;box-shadow:0 2px 5px #b6a5a0;margin:3px}button.active{outline:3px solid #8656bc}.palette button{width:36px;height:36px;border:2px solid #777}.paint{fill:white;stroke:#29212c;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}path.detail{fill:none;stroke:#29212c;stroke-width:3;pointer-events:none}#art{cursor:crosshair}small{display:block;margin:10px}</style><main><h2>🐢 Черепашка</h2><svg id="art" viewBox="0 0 800 570" xmlns="http://www.w3.org/2000/svg"><g><path class="paint" d="M270 363 Q241 416 216 442 Q185 453 168 431 Q162 408 191 383 Q214 359 235 325Z"/><path class="paint" d="M524 365 Q559 398 593 420 Q623 428 638 406 Q642 383 610 364 L561 317Z"/><path class="paint" d="M302 434 Q280 478 250 495 Q223 501 211 480 Q203 457 235 431Z"/><path class="paint" d="M495 431 Q522 474 552 488 Q580 494 591 471 Q596 446 560 420Z"/><ellipse class="paint" cx="400" cy="310" rx="188" ry="166"/><ellipse class="paint" cx="400" cy="315" rx="148" ry="126"/><path class="paint" d="M400 190 L359 240 L381 294 L419 294 L441 240Z"/><path class="paint" d="M359 240 L301 225 L278 282 L322 323 L381 294Z"/><path class="paint" d="M441 240 L499 225 L522 282 L478 323 L419 294Z"/><path class="paint" d="M322 323 L278 282 L268 347 L317 397 L381 359 L381 294Z"/><path class="paint" d="M478 323 L522 282 L532 347 L483 397 L419 359 L419 294Z"/><path class="paint" d="M381 294 H419 L478 323 L483 397 L400 429 L317 397 L322 323Z"/><path class="detail" d="M400 429 V436"/></g><g><path class="paint" d="M555 267 Q600 235 643 263 Q676 290 667 339 Q659 385 617 394 Q582 394 558 361Z"/><ellipse class="paint" cx="630" cy="306" rx="9" ry="13"/><circle cx="628" cy="302" r="3" fill="white"/><path class="paint" d="M665 333 Q686 333 681 346 Q674 354 661 346Z"/><path class="detail" d="M661 351 Q648 365 633 350"/><ellipse class="paint" cx="596" cy="382" rx="23" ry="14"/><path class="paint" d="M342 463 Q365 451 388 463 Q405 479 386 496 Q361 508 343 492Z"/><path class="paint" d="M434 463 Q457 451 480 463 Q497 479 478 496 Q453 508 435 492Z"/></g><g><path class="paint" d="M90 475 Q72 449 89 431 Q106 413 129 433 Q153 415 171 435 Q185 454 167 475Z"/><path class="detail" d="M129 433 V475"/><path class="paint" d="M106 430 Q96 401 112 390 Q127 382 134 403 Q150 384 164 394 Q177 410 160 435Z"/></g></svg><div class="tools"><button data-tool="fill" class="active">🪣 Заливка</button><button data-tool="brush">🖌️ Пензлик</button><button data-tool="eraser">🧽 Гумка</button><button id="undo">↶ Скасувати</button><button id="clear">↺ Очистити</button></div><div class="palette" id="palette"></div><small>Торкнися частинок панцира, лапок або мордочки черепашки, щоб розфарбувати. Пензликом можна малювати поверх малюнка.</small></main><script>/* Expand SVG symbols into real paintable elements. SVG <use> hit-testing only targets the outer instance, so individual wing details cannot be filled. */function expandUses(root){for(const use of Array.from(root.querySelectorAll('use'))){const ref=use.getAttribute('href')||use.getAttribute('xlink:href');const source=ref&&document.getElementById(ref.slice(1));if(!source)continue;const g=document.createElementNS('http://www.w3.org/2000/svg','g');const tr=use.getAttribute('transform');if(tr)g.setAttribute('transform',tr);for(const child of Array.from(source.children))g.appendChild(child.cloneNode(true));use.replaceWith(g)}if(root.querySelector('use'))expandUses(root)}expandUses(document.getElementById('art'));const svg=document.getElementById('art'),NS='http://www.w3.org/2000/svg',colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,activePaths=[],maskSerial=0;const history=[],undo=document.getElementById('undo');function snapshot(){history.push(svg.innerHTML);if(history.length>30)history.shift();undo.disabled=false}function restore(){if(!history.length)return;svg.innerHTML=history.pop();undo.disabled=!history.length;drawing=false;activePaths=[]}undo.onclick=restore;undo.disabled=true;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;return el.closest('defs')?null:el.closest('.paint')}function newStroke(c,w){const p=document.createElementNS(NS,'path');p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');return p}function brush(){const g=document.createElementNS(NS,'g');g.dataset.paintLayer='1';svg.append(g);return g}function eraseTargets(){const defs=svg.querySelector('defs'),layers=Array.from(svg.querySelectorAll('[data-paint-layer]')).filter(x=>x.querySelector('path'));const result=[];for(const layer of layers){let id=layer.getAttribute('data-mask-id'),m=id?svg.querySelector('#'+id):null;if(!m){id='erase-'+(++maskSerial)+'-'+Date.now();m=document.createElementNS(NS,'mask');m.id=id;m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x','0');m.setAttribute('y','0');m.setAttribute('width','800');m.setAttribute('height','570');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','800');bg.setAttribute('height','570');bg.setAttribute('fill','white');m.append(bg);defs.append(m);layer.dataset.maskId=id;layer.setAttribute('mask','url(#'+id+')')}const p=newStroke('black',23);m.append(p);result.push(p)}return result}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){const t=target(e);if(t&&t.style.fill!==color){snapshot();t.style.fill=color}return}if(tool==='eraser'&&!svg.querySelector('[data-paint-layer] path'))return;snapshot();activePaths=tool==='eraser'?eraseTargets():[newStroke(color,13)];if(tool==='brush')brush().append(activePaths[0]);if(!activePaths.length){history.pop();return}drawing=true;svg.setPointerCapture(e.pointerId);const p=point(e);for(const line of activePaths)line.setAttribute('d',`M${p.x} ${p.y} l0.01 0`)});svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);for(const line of activePaths)line.setAttribute('d',line.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;activePaths=[]}));document.getElementById('clear').onclick=()=>{snapshot();svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="erase-"]').forEach(x=>x.remove())};</script></html>
