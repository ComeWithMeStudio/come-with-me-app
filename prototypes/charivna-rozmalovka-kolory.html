<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Чарівна розмальовка — Кольори</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4e7;color:#49375a;font:16px system-ui;text-align:center}header{padding:12px 8px 6px}h1{font-size:24px;margin:3px}p{margin:6px}.gallery{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:8px;max-width:950px;margin:auto}.gallery button,.actions button{font:inherit;background:#fff;border:0;border-radius:13px;padding:10px 13px;box-shadow:0 2px 6px #d4bfb1;color:inherit}.gallery button.active{outline:3px solid #8656bc;background:#f7eaff}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin:8px}.actions button{background:#fff}.frame{max-width:900px;margin:auto;background:#fff;border-radius:15px;overflow:hidden}iframe{display:block;width:100%;height:850px;border:0}#status{font-size:14px;min-height:24px;padding:4px}#welcome{font-size:14px;color:#68536c}@media(max-width:600px){h1{font-size:20px}.gallery{gap:4px}.gallery button{padding:7px;font-size:13px}iframe{height:830px}}</style></head><body><header><h1>🎨 Чарівна розмальовка</h1><p>Кольори · обери малюнок, твори й зберігай!</p></header><nav class="gallery" id="gallery" aria-label="Вибір малюнка"></nav><div class="actions"><button id="prev">← Попередній</button><button id="save">💾 Зберегти малюнок</button><button id="next">Наступний →</button></div><div id="status" role="status">Обирай будь-яку сцену!</div><div class="frame"><iframe id="scene" title="Полотно розмальовки"></iframe></div><p id="welcome">Після збереження шукай PNG у завантаженнях телефону. Малюнки залишаються в майстерні, поки ця сторінка відкрита.</p><script>
const scenes=[['🦋','Метелик','kazkovyi-metelyk-test.html','metelyk'],['🌸','Квіточка та їжачок','kvitka-yizhachok-test.html','yizhachok'],['🐱','Кошеня з кульками','koshenia-kulky-test.html','koshenia'],['🐶','Будиночок із цуценям','budynochok-tsutsenia-test.html','tsutsenia'],['🐢','Черепашка','cherepashka-test.html','cherepashka'],['🐠','Рибка','rybka-test.html','rybka'],['🎨','Моя творчість','moya-tvorchist-test.html','moya-tvorchist']];
let index=0,ready=false;const memory=new Map(),frame=document.getElementById('scene'),status=document.getElementById('status'),gallery=document.getElementById('gallery');
function setStatus(s){status.textContent=s}
function child(){try{return frame.contentDocument}catch(e){return null}}
function capture(){if(!ready)return;const d=child();if(!d)return;try{if(index===6){const c=d.querySelector('canvas#paper');if(c)memory.set(index,{type:'canvas',data:c.toDataURL('image/png')})}else{const s=d.querySelector('svg#art');if(s)memory.set(index,{type:'svg',markup:s.innerHTML})}}catch(e){setStatus('Не вдалося запам’ятати малюнок')}}
function navigate(n){if(n<0||n>=scenes.length)return;capture();index=n;ready=false;gallery.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('active',i===index);b.setAttribute('aria-current',i===index?'page':'false')});document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===scenes.length-1;frame.src=scenes[index][2];setStatus('Відкриваємо: '+scenes[index][1]);window.scrollTo({top:0,behavior:'smooth'})}
scenes.forEach((s,i)=>{const b=document.createElement('button');b.textContent=s[0]+' '+s[1];b.onclick=()=>navigate(i);gallery.append(b)});
frame.onload=()=>{const d=child();if(!d)return;const saved=memory.get(index);if(saved){if(saved.type==='svg'){const svg=d.querySelector('svg#art');if(svg)svg.innerHTML=saved.markup}else{const c=d.querySelector('canvas#paper');if(c){const img=new Image();img.onload=()=>c.getContext('2d').drawImage(img,0,0);img.src=saved.data}}}ready=true;setStatus('Можна малювати! 🎨')};
document.getElementById('prev').onclick=()=>navigate(index-1);document.getElementById('next').onclick=()=>navigate(index+1);
function download(data,name){const a=document.createElement('a');a.href=data;a.download=name;document.body.append(a);a.click();a.remove()}
async function save(){const d=child();if(!ready||!d){setStatus('Зачекай, малюнок ще відкривається');return}try{let data;if(index===6){data=d.querySelector('canvas#paper').toDataURL('image/png')}else{const original=d.querySelector('svg#art');if(!original)throw Error('SVG не знайдено');const clone=original.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width','800');clone.setAttribute('height','570');const style=d.createElementNS('http://www.w3.org/2000/svg','style');style.textContent=Array.from(d.styleSheets).map(s=>{try{return Array.from(s.cssRules).map(r=>r.cssText).join('\n')}catch(e){return ''}}).join('\n');clone.insertBefore(style,clone.firstChild);const svgText=new XMLSerializer().serializeToString(clone);const blob=new Blob([svgText],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob);const img=new Image();try{await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=reject;img.src=url});const c=d.createElement('canvas');c.width=800;c.height=570;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,800,570);ctx.drawImage(img,0,0,800,570);data=c.toDataURL('image/png')}finally{URL.revokeObjectURL(url)}}download(data,'come-with-me-'+scenes[index][3]+'.png');setStatus('Готово! 💖 Перевір завантаження телефону.')}catch(e){setStatus('Не вдалося зберегти PNG. Спробуй ще раз або інший браузер.');console.error(e)}}
document.getElementById('save').onclick=save;navigate(0);
</script></body></html>
