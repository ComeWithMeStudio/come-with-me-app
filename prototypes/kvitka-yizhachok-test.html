<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Квіточка та їжачок — розмальовка</title><style>body{margin:0;background:#fff4e7;font:16px system-ui;text-align:center;color:#4b3760}h2{margin:12px}main{max-width:850px;margin:auto}svg{width:96%;background:white;border-radius:20px;touch-action:none;box-shadow:0 2px 15px #cdb9aa}button{font:inherit;border:0;border-radius:13px;padding:10px;background:#fff;box-shadow:0 2px 5px #b6a5a0;margin:3px}button.active{outline:3px solid #8656bc}.palette button{width:36px;height:36px;border:2px solid #777}.paint{fill:white;stroke:#29212c;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}path.detail{fill:none;stroke:#29212c;stroke-width:3;pointer-events:none}#art{cursor:crosshair}small{display:block;margin:10px}</style><main><h2>🦋 Квіточка та їжачок</h2><svg id="art" viewBox="0 0 800 570" xmlns="http://www.w3.org/2000/svg"><defs><g id="petal"><ellipse class="paint" cx="0" cy="-94" rx="46" ry="87"/></g><g id="leaf"><path class="paint" d="M0 0 Q-115 -110 -155 -20 Q-130 55 0 0Z"/><path class="detail" d="M-5 0 Q-70 -8 -136 -18"/></g></defs><g transform="translate(275 252)"><path class="paint" d="M-13 42 Q-20 164 -5 251 L23 251 Q33 154 14 42Z"/><use href="#leaf" transform="translate(-8 137) rotate(7) scale(.9)"/><use href="#leaf" transform="translate(20 180) scale(-.85 .85)"/><use href="#petal"/><use href="#petal" transform="rotate(45)"/><use href="#petal" transform="rotate(90)"/><use href="#petal" transform="rotate(135)"/><use href="#petal" transform="rotate(180)"/><use href="#petal" transform="rotate(225)"/><use href="#petal" transform="rotate(270)"/><use href="#petal" transform="rotate(315)"/><circle class="paint" r="67"/><ellipse cx="-23" cy="-10" rx="7" ry="10" fill="#29212c"/><ellipse cx="23" cy="-10" rx="7" ry="10" fill="#29212c"/><path class="detail" d="M-23 22 Q0 47 23 22"/><circle class="paint" cx="-40" cy="16" r="8"/><circle class="paint" cx="40" cy="16" r="8"/></g><g transform="translate(577 359)"><path class="paint" d="M-129 53 L-150 21 L-121 12 L-137 -21 L-105 -24 L-109 -62 L-73 -53 L-65 -91 L-33 -71 L-14 -111 L9 -80 L45 -104 L56 -65 L92 -81 L92 -40 L126 -40 L108 -5 L136 13 L105 30 Q133 116 59 132 L-74 132 Q-143 119 -129 53Z"/><ellipse class="paint" cx="-2" cy="42" rx="108" ry="91"/><ellipse class="paint" cx="-74" cy="121" rx="29" ry="18"/><ellipse class="paint" cx="73" cy="121" rx="29" ry="18"/><ellipse class="paint" cx="-49" cy="16" rx="9" ry="12"/><ellipse class="paint" cx="43" cy="16" rx="9" ry="12"/><ellipse class="paint" cx="-4" cy="46" rx="14" ry="10"/><path class="detail" d="M-4 57 Q-25 82 -43 61 M-4 57 Q15 82 33 61"/><circle class="paint" cx="-75" cy="51" r="13"/><circle class="paint" cx="70" cy="51" r="13"/><path class="detail" d="M-95 -26 L-70 -7 M-60 -48 L-40 -23 M-22 -60 L-10 -35 M25 -61 L31 -34 M69 -44 L65 -17"/></g><path class="detail" d="M85 529 Q400 515 712 529"/></svg><div class="tools"><button data-tool="fill" class="active">🪣 Заливка</button><button data-tool="brush">🖌️ Пензлик</button><button data-tool="eraser">🧽 Гумка</button><button id="clear">↺ Очистити</button></div><div class="palette" id="palette"></div><small>Торкнися пелюсток, листочків або їжачка, щоб розфарбувати. Пензликом можна малювати поверх малюнка.</small></main><script>/* Expand SVG symbols into real paintable elements. SVG <use> hit-testing only targets the outer instance, so individual wing details cannot be filled. */function expandUses(root){for(const use of Array.from(root.querySelectorAll('use'))){const ref=use.getAttribute('href')||use.getAttribute('xlink:href');const source=ref&&document.getElementById(ref.slice(1));if(!source)continue;const g=document.createElementNS('http://www.w3.org/2000/svg','g');const tr=use.getAttribute('transform');if(tr)g.setAttribute('transform',tr);for(const child of Array.from(source.children))g.appendChild(child.cloneNode(true));use.replaceWith(g)}if(root.querySelector('use'))expandUses(root)}expandUses(document.getElementById('art'));const svg=document.getElementById('art'),colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,stroke=null;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});/* Each eraser operation closes the current brush layer; later strokes use a fresh layer above the mask. */const NS='http://www.w3.org/2000/svg';const defs=svg.querySelector('defs');let brushLayer=null,mask=null,maskSerial=0;function newBrushLayer(){brushLayer=document.createElementNS(NS,'g');brushLayer.dataset.paintLayer='1';svg.append(brushLayer)}function beginErase(){if(!brushLayer||!brushLayer.children.length)return null;mask=document.createElementNS(NS,'mask');mask.id='paint-eraser-mask-'+(++maskSerial);mask.setAttribute('maskUnits','userSpaceOnUse');mask.setAttribute('x','0');mask.setAttribute('y','0');mask.setAttribute('width','800');mask.setAttribute('height','570');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','800');bg.setAttribute('height','570');bg.setAttribute('fill','white');mask.append(bg);defs.append(mask);brushLayer.setAttribute('mask','url(#'+mask.id+')');return mask}newBrushLayer();function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;if(el.closest('defs'))return null;return el.closest('.paint')}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){let t=target(e);if(t)t.style.fill=color;return}if(tool==='eraser'&&!beginErase())return;if(tool==='brush'&&mask){newBrushLayer();mask=null}drawing=true;svg.setPointerCapture(e.pointerId);stroke=document.createElementNS(NS,'path');stroke.setAttribute('fill','none');stroke.setAttribute('stroke',tool==='eraser'?'black':color);stroke.setAttribute('stroke-width',tool==='eraser'?'23':'13');stroke.setAttribute('stroke-linecap','round');stroke.setAttribute('stroke-linejoin','round');stroke.dataset.draw='1';let p=point(e);stroke.setAttribute('d',`M${p.x} ${p.y} l0.01 0`);(tool==='eraser'?mask:brushLayer).append(stroke)});svg.addEventListener('pointermove',e=>{if(!drawing||!stroke)return;let p=point(e);stroke.setAttribute('d',stroke.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;stroke=null}));document.getElementById('clear').onclick=()=>{svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="paint-eraser-mask-"]').forEach(x=>x.remove());mask=null;newBrushLayer()};</script></html>
