<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Будиночок і цуценя — розмальовка</title><style>body{margin:0;background:#fff4e7;font:16px system-ui;text-align:center;color:#4b3760}h2{margin:12px}main{max-width:850px;margin:auto}svg{width:96%;background:white;border-radius:20px;touch-action:none;box-shadow:0 2px 15px #cdb9aa}button{font:inherit;border:0;border-radius:13px;padding:10px;background:#fff;box-shadow:0 2px 5px #b6a5a0;margin:3px}button.active{outline:3px solid #8656bc}.palette button{width:36px;height:36px;border:2px solid #777}.paint{fill:white;stroke:#29212c;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}path.detail{fill:none;stroke:#29212c;stroke-width:3;pointer-events:none}#art{cursor:crosshair}small{display:block;margin:10px}</style><main><h2>🏡 Будиночок і цуценя</h2><svg id="art" viewBox="0 0 800 570" xmlns="http://www.w3.org/2000/svg"><defs><g id="window"><rect class="paint" x="-41" y="-43" width="82" height="86" rx="8"/><path class="detail" d="M0 -41 V41 M-40 0 H40"/></g></defs><g transform="translate(44 30)"><path class="paint" d="M405 146 V83 H450 V185 L433 172Z"/><path class="paint" d="M125 256 L299 112 L472 256 V497 H125Z"/><path class="paint" d="M108 251 L299 90 L489 251 L474 263 L299 115 L123 263Z"/><rect class="paint" x="264" y="343" width="92" height="154" rx="7"/><circle class="paint" cx="340" cy="424" r="7"/><use href="#window" transform="translate(195 317) scale(.75)"/><use href="#window" transform="translate(408 317) scale(.75)"/></g><g transform="translate(611 372)"><path class="paint" d="M-78 83 Q-113 102 -103 151 Q-89 178 -46 179 H54 Q107 176 112 138 Q112 96 76 76 Q33 52 -34 64Z"/><path class="paint" d="M80 122 Q135 118 137 79 Q139 59 152 71 Q173 127 107 155Z"/><path class="paint" d="M-65 -47 Q-124 -72 -133 -10 Q-143 52 -109 85 Q-81 95 -65 48Z"/><path class="paint" d="M67 -47 Q125 -72 135 -10 Q144 52 111 85 Q83 95 67 48Z"/><path class="paint" d="M-80 -16 Q-69 -91 0 -93 Q69 -91 80 -16 Q91 69 53 95 Q0 117 -53 95 Q-91 69 -80 -16Z"/><path class="paint" d="M-42 37 Q-58 73 -39 95 Q-12 119 0 115 Q12 119 39 95 Q58 73 42 37 Q28 21 0 28 Q-28 21 -42 37Z"/><ellipse class="paint" cx="-35" cy="1" rx="9" ry="13"/><ellipse class="paint" cx="35" cy="1" rx="9" ry="13"/><circle cx="-37" cy="-3" r="3" fill="white"/><circle cx="33" cy="-3" r="3" fill="white"/><path class="paint" d="M-18 49 Q0 36 18 49 Q14 64 0 66 Q-14 64 -18 49Z"/><path class="detail" d="M0 66 Q-1 82 -15 84 M0 66 Q1 82 15 84"/><path class="paint" d="M-82 138 Q-92 163 -75 181 Q-53 193 -29 177 Q-25 151 -43 141Z"/><path class="paint" d="M82 138 Q92 163 75 181 Q53 193 29 177 Q25 151 43 141Z"/><path class="detail" d="M-66 166 L-63 179 M66 166 L63 179"/></g><g transform="translate(65 506)"><path class="paint" d="M0 0 Q40 -39 81 0Z"/><path class="paint" d="M82 0 Q115 -55 150 0Z"/><path class="paint" d="M660 0 Q698 -43 735 0Z"/></g></svg><div class="tools"><button data-tool="fill" class="active">🪣 Заливка</button><button data-tool="brush">🖌️ Пензлик</button><button data-tool="eraser">🧽 Гумка</button><button id="undo">↶ Скасувати</button><button id="clear">↺ Очистити</button></div><div class="palette" id="palette"></div><small>Торкнися даху, вікон, дверей або цуценяти, щоб розфарбувати. Пензликом можна малювати поверх малюнка.</small></main><script>/* Expand SVG symbols into real paintable elements. SVG <use> hit-testing only targets the outer instance, so individual wing details cannot be filled. */function expandUses(root){for(const use of Array.from(root.querySelectorAll('use'))){const ref=use.getAttribute('href')||use.getAttribute('xlink:href');const source=ref&&document.getElementById(ref.slice(1));if(!source)continue;const g=document.createElementNS('http://www.w3.org/2000/svg','g');const tr=use.getAttribute('transform');if(tr)g.setAttribute('transform',tr);for(const child of Array.from(source.children))g.appendChild(child.cloneNode(true));use.replaceWith(g)}if(root.querySelector('use'))expandUses(root)}expandUses(document.getElementById('art'));const svg=document.getElementById('art'),NS='http://www.w3.org/2000/svg',colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,activePaths=[],maskSerial=0;const history=[],undo=document.getElementById('undo');function snapshot(){history.push(svg.innerHTML);if(history.length>30)history.shift();undo.disabled=false}function restore(){if(!history.length)return;svg.innerHTML=history.pop();undo.disabled=!history.length;drawing=false;activePaths=[]}undo.onclick=restore;undo.disabled=true;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;return el.closest('defs')?null:el.closest('.paint')}function newStroke(c,w){const p=document.createElementNS(NS,'path');p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');return p}function brush(){const g=document.createElementNS(NS,'g');g.dataset.paintLayer='1';svg.append(g);return g}function eraseTargets(){const defs=svg.querySelector('defs'),layers=Array.from(svg.querySelectorAll('[data-paint-layer]')).filter(x=>x.querySelector('path'));const result=[];for(const layer of layers){let id=layer.getAttribute('data-mask-id'),m=id?svg.querySelector('#'+id):null;if(!m){id='erase-'+(++maskSerial)+'-'+Date.now();m=document.createElementNS(NS,'mask');m.id=id;m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x','0');m.setAttribute('y','0');m.setAttribute('width','800');m.setAttribute('height','570');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','800');bg.setAttribute('height','570');bg.setAttribute('fill','white');m.append(bg);defs.append(m);layer.dataset.maskId=id;layer.setAttribute('mask','url(#'+id+')')}const p=newStroke('black',23);m.append(p);result.push(p)}return result}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){const t=target(e);if(t&&t.style.fill!==color){snapshot();t.style.fill=color}return}if(tool==='eraser'&&!svg.querySelector('[data-paint-layer] path'))return;snapshot();activePaths=tool==='eraser'?eraseTargets():[newStroke(color,13)];if(tool==='brush')brush().append(activePaths[0]);if(!activePaths.length){history.pop();return}drawing=true;svg.setPointerCapture(e.pointerId);const p=point(e);for(const line of activePaths)line.setAttribute('d',`M${p.x} ${p.y} l0.01 0`)});svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);for(const line of activePaths)line.setAttribute('d',line.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;activePaths=[]}));document.getElementById('clear').onclick=()=>{snapshot();svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="erase-"]').forEach(x=>x.remove())};</script></html>
