<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Будиночок і цуценя — розмальовка</title><style>body{margin:0;background:#fff4e7;font:16px system-ui;text-align:center;color:#4b3760}h2{margin:12px}main{max-width:850px;margin:auto}svg{width:96%;background:white;border-radius:20px;touch-action:none;box-shadow:0 2px 15px #cdb9aa}button{font:inherit;border:0;border-radius:13px;padding:10px;background:#fff;box-shadow:0 2px 5px #b6a5a0;margin:3px}button.active{outline:3px solid #8656bc}.palette button{width:36px;height:36px;border:2px solid #777}.paint{fill:white;stroke:#29212c;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}path.detail{fill:none;stroke:#29212c;stroke-width:3;pointer-events:none}#art{cursor:crosshair}small{display:block;margin:10px}</style><main><h2>🏡 Будиночок і цуценя</h2><svg id="art" viewBox="0 0 800 570" xmlns="http://www.w3.org/2000/svg"><defs><g id="window"><rect class="paint" x="-41" y="-43" width="82" height="86" rx="8"/><path class="detail" d="M0 -41 V41 M-40 0 H40"/></g></defs><g transform="translate(44 30)"><path class="paint" d="M87 255 L299 75 L514 255 L483 275 L299 122 L117 275Z"/><path class="paint" d="M125 256 L299 112 L472 256 V497 H125Z"/><path class="paint" d="M108 251 L299 90 L489 251 L474 263 L299 115 L123 263Z"/><rect class="paint" x="264" y="343" width="92" height="154" rx="7"/><circle class="paint" cx="340" cy="424" r="7"/><use href="#window" transform="translate(195 317) scale(.75)"/><use href="#window" transform="translate(408 317) scale(.75)"/><path class="paint" d="M405 146 V83 H450 V184Z"/><path class="detail" d="M123 497 H477"/></g><g transform="translate(610 382)"><path class="paint" d="M-75 47 Q-123 77 -113 128 Q-102 160 -50 153 H64 Q112 153 120 112 Q120 66 74 42Z"/><path class="paint" d="M-80 -25 Q-146 -64 -147 3 Q-144 57 -103 63 L-72 25Z"/><path class="paint" d="M76 -25 Q143 -64 145 3 Q143 57 103 63 L69 25Z"/><ellipse class="paint" cx= p://www.w3.org/2000/svg',colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,activePaths=[],maskSerial=0;const history=[],undo=document.getElementById('undo');function snapshot(){history.push(svg.innerHTML);if(history.length>30)history.shift();undo.disabled=false}function restore(){if(!history.length)return;svg.innerHTML=history.pop();undo.disabled=!history.length;drawing=false;activePaths=[]}undo.onclick=restore;undo.disabled=true;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;return el.closest('defs')?null:el.closest('.paint')}function newStroke(c,w){const p=document.createElementNS(NS,'path');p.setAttribute('fill','none');p.setAttribute('stroke',c);p.setAttribute('stroke-width',w);p.setAttribute('stroke-linecap','round');p.setAttribute('stroke-linejoin','round');return p}function brush(){const g=document.createElementNS(NS,'g');g.dataset.paintLayer='1';svg.append(g);return g}function eraseTargets(){const defs=svg.querySelector('defs'),layers=Array.from(svg.querySelectorAll('[data-paint-layer]')).filter(x=>x.querySelector('path'));const result=[];for(const layer of layers){let id=layer.getAttribute('data-mask-id'),m=id?svg.querySelector('#'+id):null;if(!m){id='erase-'+(++maskSerial)+'-'+Date.now();m=document.createElementNS(NS,'mask');m.id=id;m.setAttribute('maskUnits','userSpaceOnUse');m.setAttribute('x','0');m.setAttribute('y','0');m.setAttribute('width','800');m.setAttribute('height','570');const bg=document.createElementNS(NS,'rect');bg.setAttribute('width','800');bg.setAttribute('height','570');bg.setAttribute('fill','white');m.append(bg);defs.append(m);layer.dataset.maskId=id;layer.setAttribute('mask','url(#'+id+')')}const p=newStroke('black',23);m.append(p);result.push(p)}return result}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){const t=target(e);if(t&&t.style.fill!==color){snapshot();t.style.fill=color}return}if(tool==='eraser'&&!svg.querySelector('[data-paint-layer] path'))return;snapshot();activePaths=tool==='eraser'?eraseTargets():[newStroke(color,13)];if(tool==='brush')brush().append(activePaths[0]);if(!activePaths.length){history.pop();return}drawing=true;svg.setPointerCapture(e.pointerId);const p=point(e);for(const line of activePaths)line.setAttribute('d',`M${p.x} ${p.y} l0.01 0`)});svg.addEventListener('pointermove',e=>{if(!drawing)return;const p=point(e);for(const line of activePaths)line.setAttribute('d',line.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;activePaths=[]}));document.getElementById('clear').onclick=()=>{snapshot();svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-paint-layer]').forEach(x=>x.remove());svg.querySelectorAll('mask[id^="erase-"]').forEach(x=>x.remove())};</script></html>
