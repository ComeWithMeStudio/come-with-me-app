const child of Array.from(source.children))g.appendChild(child.cloneNode(true));use.replaceWith(g)}if(root.querySelector('use'))expandUses(root)}expandUses(document.getElementById('art'));const svg=document.getElementById('art'),colors=['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#ffffff'];let color=colors[0],tool='fill',drawing=false,stroke=null;const palette=document.getElementById('palette');colors.forEach(c=>{let b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);b.onclick=()=>{color=c;document.querySelectorAll('.palette button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});palette.firstChild.classList.add('active');document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});function point(e){let p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())}function target(e){let el=e.target;if(el.closest('defs'))return null;return el.closest('.paint')}svg.addEventListener('pointerdown',e=>{e.preventDefault();if(tool==='fill'){let t=target(e);if(t)t.style.fill=color;return}drawing=true;svg.setPointerCapture(e.pointerId);stroke=document.createElementNS('http://www.w3.org/2000/svg','path');stroke.setAttribute('fill','none');stroke.setAttribute('stroke',tool==='eraser'?'white':color);stroke.setAttribute('stroke-width',tool==='eraser'?'23':'13');stroke.setAttribute('stroke-linecap','round');stroke.setAttribute('stroke-linejoin','round');stroke.dataset.draw='1';let p=point(e);stroke.setAttribute('d',`M${p.x} ${p.y} l0.01 0`);svg.append(stroke)});svg.addEventListener('pointermove',e=>{if(!drawing||!stroke)return;let p=point(e);stroke.setAttribute('d',stroke.getAttribute('d')+` L${p.x} ${p.y}`)});['pointerup','pointercancel'].forEach(ev=>svg.addEventListener(ev,()=>{drawing=false;stroke=null}));document.getElementById('clear').onclick=()=>{svg.querySelectorAll('.paint').forEach(x=>x.style.fill='');svg.querySelectorAll('[data-draw]').forEach(x=>x.remove())};</script></html>
