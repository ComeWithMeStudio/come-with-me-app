<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Чарівна розмальовка — прототип</title><style>body{margin:0;background:#fff5e8;font:18px system-ui;color:#47345b;text-align:center}h1{font-size:25px;margin:12px}.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:8px}button{border:2px solid #dbc6ee;border-radius:16px;padding:10px;background:white;font-size:17px;cursor:pointer}.selected{outline:3px solid #7955bc}canvas{width:min(94vw,520px);height:auto;touch-action:none;background:white;border:7px solid #e8c88f;border-radius:18px;box-sizing:border-box}#colors button{width:42px;height:42px;border-radius:50%;padding:0}small{display:block;padding:8px}</style><h1>🎨 Чарівна розмальовка</h1><div id="gallery"><button data-scene="butterfly" class="active">🦋 Метелик</button><button data-scene="flower">🌼 Квіточка</button><button data-scene="balloon">🎈 Кульки</button><button data-scene="house">🏠 Будиночок</button><button data-scene="sun">☀️ Сонечко</button><button data-scene="fish">🐟 Рибка</button></div><div class="tools"><button id="brush" class="selected">🖌️ Пензлик</button><button id="fill">🪣 Заливка</button><button id="eraser">🧽 Гумка</button><button id="clear">↻ Очистити</button></div><div id="colors" class="tools"></div><div id="status">Обери малюнок у галереї</div><canvas id="board" width="600" height="600"></canvas><div class="tools"><button id="nextScene">Наступний малюнок ➜</button></div><small>Обери колір і води пальчиком. Фарба залишається всередині обраної ділянки.</small><script>
const canvas=document.querySelector('#board'),ctx=canvas.getContext('2d'),W=600;
// Butterfly: 14 independently colorable, closed vector regions.
const shapes=[
{path:'M291 282 C224 169 102 118 93 215 C83 307 204 348 287 319 Z',color:'#f8d6e9'},
{path:'M309 282 C376 169 498 118 507 215 C517 307 396 348 313 319 Z',color:'#dce6ff'},
{path:'M286 327 C202 299 111 354 146 431 C184 506 264 438 294 361 Z',color:'#ffe5b0'},
{path:'M314 327 C398 299 489 354 454 431 C416 506 336 438 306 361 Z',color:'#d5f3df'},
// Broad spots are large enough for children's fingers.
{path:'M169 211 C135 196 120 224 145 253 C173 279 218 276 222 250 C225 232 196 218 169 211 Z',color:'#fff0a9'},
{path:'M431 211 C465 196 480 224 455 253 C427 279 382 276 378 250 C375 232 404 218 431 211 Z',color:'#fff0a9'},
{path:'M235 276 C211 253 185 269 197 291 C211 313 247 320 258 302 C265 292 252 281 235 276 Z',color:'#e6c7ff'},
{path:'M365 276 C389 253 415 269 403 291 C389 313 353 320 342 302 C335 292 348 281 365 276 Z',color:'#e6c7ff'},
{path:'M207 367 C171 361 161 387 185 406 C208 424 241 405 241 387 C241 375 223 369 207 367 Z',color:'#f7b9d3'},
{path:'M393 367 C429 361 439 387 415 406 C392 424 359 405 359 387 C359 375 377 369 393 367 Z',color:'#f7b9d3'},
{path:'M248 404 C229 405 224 427 242 438 C258 446 277 424 275 413 C273 402 261 401 248 404 Z',color:'#b5e0fa'},
{path:'M352 404 C371 405 376 427 358 438 C342 446 323 424 325 413 C327 402 339 401 352 404 Z',color:'#b5e0fa'},
{path:'M286 289 Q300 277 314 289 L313 411 Q300 432 287 411 Z',color:'#f5b896'},
{path:'M281 274 C276 249 286 229 300 229 C314 229 324 249 319 274 Q300 291 281 274 Z',color:'#f9c8aa'},
{path:'M289 233 Q253 195 261 174',color:null},
{path:'M311 233 Q347 195 339 174',color:null}
];
const regions=shapes.filter(s=>s.color!==null).map(s=>({path:new Path2D(s.path),paint:document.createElement('canvas')}));
regions.forEach(r=>{r.paint.width=r.paint.height=W});
let mode='brush',color='#ef6384',down=false,active=-1,last=null;
const palette=['#ef6384','#ffae42','#f5d84e','#72c78a','#5aaee6','#9a78da','#704b3b','#ffffff'];
const cs=document.querySelector('#colors');palette.forEach((c,i)=>{let b=document.createElement('button');b.style.background=c;b.title='Колір '+(i+1);b.onclick=()=>{color=c;document.querySelectorAll('#colors button').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')};cs.append(b);if(!i)b.classList.add('selected')});
function draw(){ctx.clearRect(0,0,W,W);ctx.fillStyle='#fff';ctx.fillRect(0,0,W,W);regions.forEach((r,i)=>{ctx.save();ctx.fillStyle=shapes[i].color;ctx.fill(r.path);ctx.clip(r.path);ctx.drawImage(r.paint,0,0);ctx.restore();ctx.strokeStyle='#43334e';ctx.lineWidth=6;ctx.lineJoin='round';ctx.stroke(r.path)});ctx.strokeStyle='#43334e';ctx.lineWidth=6;shapes.filter(s=>s.color===null).forEach(s=>ctx.stroke(new Path2D(s.path)));ctx.fillStyle='#43334e';ctx.beginPath();ctx.arc(294,255,3,0,7);ctx.arc(306,255,3,0,7);ctx.fill()}
function point(e){let b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*W/b.height}}
function hit(p){for(let i=regions.length-1;i>=0;i--)if(ctx.isPointInPath(regions[i].path,p.x,p.y))return i;return -1}
function stroke(p){if(active<0)return;let r=regions[active],c=r.paint.getContext('2d');c.save();c.beginPath();c.clip(r.path);c.lineWidth=mode==='eraser'?38:28;c.lineCap='round';c.lineJoin='round';c.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';c.strokeStyle=color;c.beginPath();c.moveTo(last?last.x:p.x,last?last.y:p.y);c.lineTo(p.x,p.y);c.stroke();c.restore();last=p;draw()}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();canvas.setPointerCapture(e.pointerId);let p=point(e);active=hit(p);if(active<0)return;down=true;last=null;if(mode==='fill'){let c=regions[active].paint.getContext('2d');c.clearRect(0,0,W,W);c.fillStyle=color;c.fillRect(0,0,W,W);draw();down=false}else stroke(p)});
canvas.addEventListener('pointermove',e=>{if(down)stroke(point(e))});['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,()=>{down=false;active=-1;last=null}));
['brush','fill','eraser'].forEach(id=>document.getElementById(id).onclick=()=>{mode=id;document.querySelectorAll('.tools button').forEach(b=>b.classList.remove('selected'));document.getElementById(id).classList.add('selected')});
document.getElementById('clear').onclick=()=>{regions.forEach(r=>r.paint.getContext('2d').clearRect(0,0,W,W));draw()};draw();
</script><style>
#gallery{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;padding:8px}
#gallery button{background:#fff;border:2px solid #d9bfe8;border-radius:15px;min-width:105px}
#gallery button.active{background:#f1dcff;border-color:#9660c9}
#status{font-size:14px;color:#715b84;margin:4px}
</style>
<script>
const scenePaths={
butterfly:null,
flower:[
'M300 270 C220 155 160 230 240 300 Q180 380 280 380 Q300 450 340 380 Q440 380 360 300 C450 230 380 155 300 270 Z',
'M300 260 A45 45 0 1 1 299.9 260 Z',
'M280 400 L320 400 L320 520 L280 520 Z',
'M250 460 Q170 395 150 470 Q190 520 250 485 Z',
'M350 460 Q430 395 450 470 Q410 520 350 485 Z'],
house:['M155 290 L300 140 L445 290 Z','M190 290 L410 290 L410 490 L190 490 Z','M265 375 L335 375 L335 490 L265 490 Z','M215 320 L265 320 L265 370 L215 370 Z','M345 320 L395 320 L395 370 L345 370 Z'],
sun:['M300 185 A115 115 0 1 1 299.9 185 Z','M270 45 L330 45 L315 135 L285 135 Z','M430 95 L480 135 L415 195 L390 165 Z','M465 270 L550 285 L550 330 L465 325 Z','M390 435 L430 410 L490 470 L445 510 Z','M120 130 L170 95 L210 165 L185 195 Z','M45 285 L135 270 L135 325 L45 330 Z'],
fish:['M105 300 Q255 115 455 300 Q255 485 105 300 Z','M455 300 L555 205 L555 395 Z','M240 210 L315 110 L355 215 Z','M240 390 L315 490 L355 385 Z','M175 270 A22 22 0 1 1 174.9 270 Z'],
balloon:[
'M190 125 C85 125 90 300 190 355 C290 300 295 125 190 125 Z',
'M410 125 C305 125 310 300 410 355 C510 300 515 125 410 125 Z',
'M300 270 C210 270 215 420 300 460 C385 420 390 270 300 270 Z',
'M175 355 L205 355 L190 375 Z',
'M395 355 L425 355 L410 375 Z']};
const sceneColors={flower:['#f6c2dc','#f9d46d','#a4d783','#79cba3','#90c2ef'],balloon:['#f5a6c8','#a5d7f5','#ffdb7e','#e5b3ff','#b5e5c6'],house:['#ffc9a5','#ffdfac','#a4c9ed','#c7b3ec','#c7b3ec'],sun:['#ffe47a','#ffcb85','#ffcb85','#ffcb85','#ffcb85','#ffcb85','#ffcb85'],fish:['#a8ddec','#e5b4f2','#f4c47a','#f4c47a','#fff']};
function setScene(name){
if(name==='butterfly'){shapes.splice(0,shapes.length,...originalShapes.map(s=>({...s})))}
else{shapes.splice(0,shapes.length,...scenePaths[name].map((path,i)=>({path,color:sceneColors[name][i]})))}
regions.splice(0,regions.length,...shapes.map(s=>({path:new Path2D(s.path),paint:document.createElement('canvas')})));
regions.forEach(r=>{r.paint.width=r.paint.height=W});
document.querySelectorAll('#gallery button').forEach(b=>b.classList.toggle('active',b.dataset.scene===name));
document.querySelector('#status').textContent='Малюй пальчиком! За бажанням обери інший малюнок.';
draw();
}
const originalShapes=shapes.map(s=>({...s}));
document.querySelectorAll('#gallery button').forEach(b=>b.addEventListener('click',()=>setScene(b.dataset.scene)));let sceneIndex=0;const sceneOrder=['butterfly','flower','balloon','house','sun','fish'];document.querySelector('#nextScene').addEventListener('click',()=>{sceneIndex=(sceneOrder.indexOf(document.querySelector('#gallery button.active').dataset.scene)+1)%sceneOrder.length;setScene(sceneOrder[sceneIndex])});
</script></html>
