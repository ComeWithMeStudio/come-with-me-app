<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Моя творчість — Come With Me Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#fff4e7;color:#4b3760;font:16px system-ui;text-align:center}main{max-width:850px;margin:auto;padding:8px}h2{margin:8px}.board{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 2px 15px #cdb9aa}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}button,select{font:inherit;border:0;border-radius:12px;padding:9px;background:white;box-shadow:0 2px 5px #b6a5a0;margin:3px;color:inherit}button.active{outline:3px solid #8656bc}.palette{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;margin:8px 0}.palette button{width:38px;height:38px;border:2px solid #777;padding:0}.controls{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px}.controls label{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:12px;padding:6px}input[type=range]{width:110px}small{display:block;margin:8px}#status{min-height:22px}</style></head><body><main><h2>🎨 Моя творчість</h2><div class="board"><canvas id="paper" width="800" height="560" aria-label="Полотно для малювання"></canvas></div><div class="controls" id="tools"><button data-tool="brush" class="active">🖌️ Пензлик</button><button data-tool="fill">🪣 Заливка</button><button data-tool="eraser">🧽 Гумка</button><button id="undo">↶ Скасувати</button><button id="clear">↺ Очистити</button></div><div class="palette" id="palette"></div><div class="controls"><label>Товщина <input id="size" type="range" min="3" max="42" value="13" step="1"><output id="sizeValue">13</output></label><label>Фон <select id="background"><option value="#ffffff">Білий</option><option value="#fff1bd">Кремовий</option><option value="#cceeff">Блакитний</option><option value="#ddf5d8">Зелений</option><option value="#ffe0ee">Рожевий</option><option value="#e9e0ff">Лавандовий</option></select></label><button id="save">💾 Зберегти малюнок</button></div><small id="status">Малюй пальчиком або мишкою. Колір фону можна змінити будь-коли!</small></main><script>
const canvas=document.getElementById('paper'),ctx=canvas.getContext('2d',{willReadFrequently:true}),W=canvas.width,H=canvas.height,history=[],MAX=25;let tool='brush',color='#f865a7',bg='#ffffff',width=13,drawing=false,last=null,dirty=false;
function blank(){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H)}blank();
function snapshot(){history.push(ctx.getImageData(0,0,W,H));if(history.length>MAX)history.shift();document.getElementById('undo').disabled=false}
function restore(){if(!history.length)return;ctx.putImageData(history.pop(),0,0);document.getElementById('undo').disabled=!history.length}
document.getElementById('undo').disabled=true;document.getElementById('undo').onclick=restore;
const palette=document.getElementById('palette');['#f865a7','#ffb347','#ffeb65','#82dc91','#69b9f4','#a68bf5','#ff8880','#8be3dc','#7d553a','#29212c','#ffffff'].forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Колір '+c);if(i===0)b.classList.add('active');b.onclick=()=>{color=c;palette.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')};palette.append(b)});
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.remove('active'));b.classList.add('active')});
document.getElementById('size').oninput=e=>{width=Number(e.target.value);document.getElementById('sizeValue').textContent=width};
document.getElementById('background').onchange=e=>{const next=e.target.value;if(next===bg)return;snapshot();const img=ctx.getImageData(0,0,W,H);const d=img.data;const old=hexRGB(bg),n=hexRGB(next);for(let i=0;i<d.length;i+=4){if(d[i]===old[0]&&d[i+1]===old[1]&&d[i+2]===old[2]){d[i]=n[0];d[i+1]=n[1];d[i+2]=n[2]}}ctx.putImageData(img,0,0);bg=next};
function hexRGB(h){return [1,3,5].map(i=>parseInt(h.slice(i,i+2),16))}
function point(e){const r=canvas.getBoundingClientRect();return{x:Math.max(0,Math.min(W-1,Math.round((e.clientX-r.left)*W/r.width))),y:Math.max(0,Math.min(H-1,Math.round((e.clientY-r.top)*H/r.height)))}}
function stroke(p,q){ctx.strokeStyle=tool==='eraser'?bg:color;ctx.fillStyle=ctx.strokeStyle;ctx.lineWidth=tool==='eraser'?Math.max(18,width*1.6):width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(p.x,p.y);ctx.stroke();ctx.beginPath();ctx.arc(p.x,p.y,ctx.lineWidth/2,0,Math.PI*2);ctx.fill()}
function fillAt(x,y){const img=ctx.getImageData(0,0,W,H),d=img.data,target=(y*W+x)*4,newC=hexRGB(color),old=[d[target],d[target+1],d[target+2]];if(old.every((v,i)=>v===newC[i]))return false;const seen=new Uint8Array(W*H),stack=[y*W+x];let count=0;while(stack.length){const idx=stack.pop();if(seen[idx])continue;seen[idx]=1;const k=idx*4;if(d[k]!==old[0]||d[k+1]!==old[1]||d[k+2]!==old[2])continue;d[k]=newC[0];d[k+1]=newC[1];d[k+2]=newC[2];count++;const px=idx%W,py=(idx/W)|0;if(px>0)stack.push(idx-1);if(px<W-1)stack.push(idx+1);if(py>0)stack.push(idx-W);if(py<H-1)stack.push(idx+W)}if(count)ctx.putImageData(img,0,0);return !!count}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();const p=point(e);if(tool==='fill'){snapshot();if(!fillAt(p.x,p.y)){history.pop();document.getElementById('undo').disabled=!history.length}return}snapshot();drawing=true;last=p;stroke(p,p);canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();const p=point(e);stroke(p,last);last=p});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,()=>{drawing=false;last=null});
document.getElementById('clear').onclick=()=>{snapshot();blank()};
document.getElementById('save').onclick=()=>{try{const a=document.createElement('a');a.href=canvas.toDataURL('image/png');a.download='moya-tvorchist.png';document.body.append(a);a.click();a.remove();document.getElementById('status').textContent='Малюнок підготовлено до збереження 💖'}catch(e){document.getElementById('status').textContent='Не вдалося зберегти. Спробуй інший браузер.'}};
</script></body></html>
