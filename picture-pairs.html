<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Знайди однакові картинки з Мімі</title><style>*{box-sizing:border-box}body{margin:0;background:#e6f2ff;color:#49362d;font:20px system-ui;text-align:center;padding:16px}main{max-width:800px;margin:auto}header{display:flex;justify-content:space-between;gap:12px}button,a{font:inherit;color:inherit;background:#fff9e9;border:3px solid white;border-radius:20px;padding:12px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible{outline:4px solid #8057b5}h1{font-size:clamp(26px,6vw,40px)}.mimi{height:110px;max-width:100%;object-fit:contain}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.tile{min-height:110px;font-size:32px;word-break:break-word}.tile.found{background:#ccebc8}.tile:disabled{opacity:1;color:#49362d}.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;justify-items:center}.objects img{width:100%;height:38px;object-fit:contain}.dots{font-size:25px;color:#8057b5}#message{min-height:58px}button[hidden],section[hidden]{display:none}@media(max-width:450px){.grid{gap:8px}.tile{min-height:92px;padding:5px;font-size:28px}.objects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;justify-items:center}.objects img{width:100%;height:38px;object-fit:contain}.dots{font-size:21px}header{font-size:16px}}.objects:has(>img:only-child){grid-template-columns:1fr;place-items:center}.objects>img:only-child{width:60px;max-width:100%;height:60px}
/* Readable desktop art; the compact phone grid keeps its existing layout. */
.objects{width:100%;height:100%;align-content:center;align-items:center;gap:6px}
.objects img{height:48px;width:100%;max-width:68px;justify-self:center}
.objects>img:only-child{width:76px;height:76px;max-width:100%}
@media(min-width:700px){.mimi{height:170px}h1{margin:12px 0}.tile{min-height:164px}.objects img{height:62px;max-width:74px}.objects>img:only-child{height:96px;width:96px}#message{margin:12px 0;min-height:52px}.grid{margin:16px 0}}
@media(max-width:450px){.objects{gap:4px}.objects img{height:38px;max-width:38px}.objects>img:only-child{height:60px;width:60px}}
.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.tile{aspect-ratio:1;min-height:0;background:linear-gradient(145deg,#fff8e9,#e8dff6);transition:background .2s,transform .2s}.tile.found{background:#d9efd3;transform:scale(.97)}.tile .objects>img:only-child{width:100%;height:110px;max-width:100%}.grid:has(>.tile:nth-child(5)):not(:has(>.tile:nth-child(7))){grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:450px){.tile .objects>img:only-child{height:65px}.grid{gap:8px}.mimi{height:100px}}@media(prefers-reduced-motion:reduce){.tile{transition:none}}body{background:linear-gradient(160deg,#f3e9f6,#e7f3ef)}h1{font-size:clamp(24px,5vw,36px)}.mimi{animation:hello 1s ease-out}@keyframes hello{from{transform:translateY(10px);opacity:.3}to{transform:translateY(0);opacity:1}}@media(prefers-reduced-motion:reduce){.mimi{animation:none}}</style><main><header><a href="mimi-adventures.html">← Ігри</a><button id="sound" aria-pressed="true">Звук: увімкнено</button></header><img class="mimi" src="mimi-home.png" alt="Мімі"><h1>Знайди однакові картинки з Мімі</h1><p id="message" role="status" aria-live="polite">Відкривай по дві картки та знаходь однакові картинки. Грай у своєму темпі!</p><button id="start">Почнімо!</button><section id="play" hidden><p id="progress"></p><div class="grid" id="board"></div></section><button id="next" hidden>Наступний рівень</button><button id="again" hidden>Зіграти ще</button></main><script src="picture-pairs-voices.js?v=20261027"></script><script>
const $=id=>document.getElementById(id);let task=0;const totals=[2,2,2];let level=0,opened=[],matched=0,locked=false,timer=null,enabled=true,epoch=0;const sounds=[];const music=new Audio('audio/games/find-for-mimi/music/level-1.mp3');music.loop=true;music.volume=.12;
function sound(name){if(!enabled)return;const a=new Audio('audio/games/common/'+name+'.mp3');sounds.push(a);a.play().catch(()=>{});a.onended=()=>{const i=sounds.indexOf(a);if(i>=0)sounds.splice(i,1)}}
const narration=new Audio(window.picturePairsVoices.intro);narration.onended=()=>{music.volume=.12};
let activeVoice=null;
const voiceVolumes={"pair": 0.689, "retry": 0.908, "round": 0.58, "intro": 0.656, "level2": 0.877, "level3": 0.826, "final": 0.735};
narration.volume=voiceVolumes.intro;
const levelVoices=[narration,new Audio(window.picturePairsVoices.level2),new Audio(window.picturePairsVoices.level3)];
levelVoices[1].volume=voiceVolumes.level2;levelVoices[2].volume=voiceVolumes.level3;
const finalVoice=new Audio(window.picturePairsVoices.final);finalVoice.volume=voiceVolumes.final;
const feedbackVoices=Object.fromEntries(['pair','retry','round'].map(k=>{const a=new Audio(window.picturePairsVoices[k]);a.volume=voiceVolumes[k];return [k,a]}));
function speak(voice){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0}activeVoice=voice;if(!enabled)return;voice.currentTime=0;music.volume=.035;voice.onended=()=>{if(activeVoice===voice){activeVoice=null;music.volume=.12}};voice.play().catch(()=>{if(activeVoice===voice){activeVoice=null;music.volume=.12}})}
function speakIntro(){speak(levelVoices[level])}
function stop(){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0;activeVoice=null}music.volume=.12;music.pause();sounds.forEach(a=>{a.pause();a.currentTime=0});sounds.length=0}
// Normalize the flower's transparent canvas once, without changing the shared source asset.
const names={'fruits/apple-red.webp':'Яблуко','toys/toy-car-blue.webp':'Машинка','painted_scene/painted-butterfly.webp':'Метелик','nature/birds/bird-perched.webp':'Синичка','plants/flower-pink-head.webp':'Квіточка','toys/bunny-plush-purple.webp':'Зайчик','fruits/pear-green.webp':'Груша','../../pryroda/assets/farm/puppy-cream-caramel-sitting.webp':'Цуценя'};
const flowerSource='media/pograymo/assets/illustrations/plants/flower-pink-head.webp';
const flowerReady=new Promise(resolve=>{const source=new Image();source.onload=()=>{try{const canvas=document.createElement('canvas');canvas.width=320;canvas.height=300;canvas.getContext('2d').drawImage(source,614,259,309,281,0,0,320,300);resolve(canvas.toDataURL('image/png'))}catch{resolve(flowerSource)}};source.onerror=()=>resolve(flowerSource);source.src=flowerSource});
$('sound').onclick=()=>{enabled=!enabled;$('sound').textContent='Звук: '+(enabled?'увімкнено':'вимкнено');$('sound').setAttribute('aria-pressed',enabled);if(!enabled)stop();else if(!$('play').hidden&&$('again').hidden)music.play().catch(()=>{})};
function round(){if(activeVoice){activeVoice.pause();activeVoice.currentTime=0;activeVoice=null;music.volume=.12}epoch++;clearTimeout(timer);opened=[];matched=0;locked=false;$('start').hidden=true;$('next').hidden=true;$('again').hidden=true;$('play').hidden=false;$('board').replaceChildren();$('message').textContent='Знайди дві однакові картинки.';const n=level+2;const art=['fruits/apple-red.webp','toys/toy-car-blue.webp','painted_scene/painted-butterfly.webp','nature/birds/bird-perched.webp','plants/flower-pink-head.webp','toys/bunny-plush-purple.webp','fruits/pear-green.webp','../../pryroda/assets/farm/puppy-cream-caramel-sitting.webp'];for(let i=art.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[art[i],art[j]]=[art[j],art[i]]}const deck=Array.from({length:n},(_,i)=>[{value:i+1},{value:i+1}]).flat();for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}update();deck.forEach(c=>{const b=document.createElement('button');b.className='tile';b.dataset.pair=c.value;b.textContent='✦';b.setAttribute('aria-label','Відкрити картку');b.onclick=()=>{if(locked||opened.includes(b)||b.disabled)return;b.replaceChildren();const group=document.createElement('span');group.className='objects';const img=document.createElement('img');img.src='media/pograymo/assets/illustrations/'+art[c.value-1];img.alt='';if(img.src.endsWith('flower-pink-head.webp'))flowerReady.then(src=>{img.src=src});group.append(img);b.append(group);b.setAttribute('aria-label',names[art[c.value-1]]);b.dataset.value=c.value;opened.push(b);if(opened.length<2)return;locked=true;const pair=opened.slice(),version=epoch;if(pair[0].dataset.value===pair[1].dataset.value){pair.forEach(x=>{x.disabled=true;x.classList.add('found')});matched++;sound('correct_chime');$('message').textContent='Так! Це пара!';if(matched<n)speak(feedbackVoices.pair);opened=[];locked=false;update();if(matched===n){$('message').textContent=(level===2&&task===totals[level]-1)?'★★★ Усі картинки знайшли свої пари! Дякую за гру!':'Чудово! Усі пари знайдено!';sound('scene_complete');if(level===2&&task===totals[level]-1){$('again').hidden=false;music.pause();speak(finalVoice)}else {speak(feedbackVoices.round);$('next').textContent=task<totals[level]-1?'Наступне завдання':'Наступний рівень';$('next').hidden=false}}}else{$('message').textContent='Спробуй іншу пару.';speak(feedbackVoices.retry);timer=setTimeout(()=>{if(version!==epoch)return;pair.forEach(x=>{x.textContent='✦';x.classList.remove('dots');x.setAttribute('aria-label','Відкрити картку')});opened=[];locked=false},1300)}};$('board').append(b)});if(enabled)music.play().catch(()=>{})}
function update(){$('progress').textContent=`Рівень ${level+1} з 3 · Завдання ${task+1} з ${totals[level]} · Пари: ${matched} з ${level+2}`}$('start').onclick=()=>{round();speakIntro()};$('next').onclick=()=>{task++;let newLevel=false;if(task===totals[level]){task=0;level++;newLevel=true}round();if(newLevel)speakIntro()};$('again').onclick=()=>{level=0;task=0;round();speakIntro()};document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else if(enabled&&!$('play').hidden&&$('again').hidden)music.play().catch(()=>{})});window.addEventListener('pagehide',()=>{epoch++;clearTimeout(timer);opened.forEach(b=>{b.textContent='✦';b.setAttribute('aria-label','Відкрити картку')});opened=[];locked=false;stop()});
</script></html>
