<!doctype html>
<html lang="uk" style="color-scheme:only light">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ebef">
<title>Історії про фігури — Come With Me</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#493f4c;background:linear-gradient(180deg,#eee7f2,#f6eadf)}body{padding:18px 18px 70px}.shell{width:min(720px,100%);margin:auto}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:38px}.head h1{margin:0;font-size:clamp(28px,6vw,42px);line-height:1.05}.back{border:0;border-radius:999px;padding:12px 18px;background:#fff9;box-shadow:0 3px 12px #0002;font-weight:900;color:#493f4c;text-decoration:none;white-space:nowrap}.section-label{font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#6d5c78;margin:0 2px 12px}.card{position:relative;display:block;width:100%;min-height:230px;border:3px solid #fff;border-radius:27px;padding:24px;overflow:hidden;box-shadow:0 8px 25px #604f7026;text-decoration:none;color:#49362d;background:radial-gradient(circle at 76% 28%,#fff4a8 0 6%,transparent 7%),linear-gradient(150deg,#bcecff 0 48%,#d6efae 48% 100%)}.card:before{content:"○ △ □";position:absolute;right:6%;top:20%;font-size:clamp(46px,10vw,78px);font-weight:900;letter-spacing:.08em;color:#fff9;text-shadow:0 5px 12px #4b698633}.card-copy{position:absolute;left:0;right:0;bottom:0;padding:54px 20px 18px;background:linear-gradient(transparent,#fffdf2f2)}.card strong{display:block;font-size:clamp(23px,5vw,36px);line-height:1.08}.card small{display:block;margin-top:7px;font-size:clamp(13px,2.6vw,17px);font-weight:900;opacity:.72}.badge{position:absolute;left:15px;top:15px;border-radius:999px;padding:8px 12px;background:#fffde8ef;font-size:12px;font-weight:900;color:#66516f;box-shadow:0 3px 10px #0002}.lock{position:absolute;right:15px;top:15px;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#fffde8ef;box-shadow:0 3px 10px #0002;font-size:19px}.soon{margin-top:24px;min-height:auto;padding:20px;background:#fffdf2a8;opacity:.62}.soon:before{display:none}.soon strong{font-size:21px}.note{text-align:center;margin:24px auto 0;font-weight:900;color:#6d5c78}.message{margin:18px auto 0;padding:13px 16px;border-radius:18px;background:#fff9;text-align:center;font-weight:900;box-shadow:0 4px 16px #604f701c}.message[hidden]{display:none}@media(max-width:520px){body{padding:14px 12px 56px}.head{margin-bottom:32px}.head h1{font-size:31px}.back{padding:10px 14px}.card{border-radius:22px;min-height:215px}.badge{left:11px;top:11px}.lock{right:11px;top:11px}}
</style>
</head>
<body><main class="shell">
<header class="head"><h1>Історії про фігури 📖</h1><a class="back" href="index.html#figures">← Фігури</a></header>
<div class="section-label">Книжкова поличка Мімі</div>
<a class="card paid-card" data-target="geometry-story-reader.html" href="#"><span class="badge">ПЛАТНО</span><span class="lock">🔒</span><span class="card-copy"><strong>Мімі та Місто Геометрії</strong><small>Перша історія про фігури</small></span></a>
<div class="card soon"><strong>✨ Наступна історія</strong><small>Скоро оселиться тут</small></div>
<p class="note">Обери історію й вирушай разом із Мімі 🐾</p><div class="message" id="lockedMessage" hidden>Ця книжка входить до платної колекції Come With Me Studio ❤️</div>
</main>
<script>const params=new URLSearchParams(location.search);if(params.get('preview')==='alona')sessionStorage.setItem('cwm-author-preview','1');const isAuthor=sessionStorage.getItem('cwm-author-preview')==='1',card=document.querySelector('.paid-card'),message=document.getElementById('lockedMessage');if(isAuthor){card.querySelector('.badge').textContent='РЕЖИМ АВТОРА';card.querySelector('.lock').textContent='🔓';card.href=card.dataset.target}else card.onclick=e=>{e.preventDefault();message.hidden=false;message.scrollIntoView({behavior:'smooth',block:'center'})};</script>
</body></html>
