<!doctype html>
<html lang="uk" style="color-scheme:only light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#aee6fb">
  <title>Знайди для Мімі — Come With Me</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#49362d;background:#8fd7f3}button{font:inherit}.game{width:min(100%,760px);min-height:100vh;margin:auto;padding:15px 14px 28px;background:radial-gradient(circle at 12% 7%,#fff2a6 0 5%,transparent 18%),linear-gradient(180deg,#aee7fb 0 45%,#dff5c6 45%);overflow:hidden}.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}.pill{border:0;border-radius:999px;padding:10px 14px;background:#fff9e9ed;color:#49362d;font-weight:900;box-shadow:0 5px 14px #49362d25;text-decoration:none}.title{margin:0;text-align:center;font-size:clamp(22px,5vw,36px)}.progress{margin:14px auto 10px;display:flex;justify-content:center;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:#fff9;border:2px solid #fff}.dot.done{background:#62bb73}.dot.active{background:#ffb72f;transform:scale(1.22)}.question{min-height:58px;display:grid;place-items:center;text-align:center;margin:4px auto 12px;font-size:clamp(20px,4.8vw,30px);font-weight:900}.scene{position:relative;min-height:390px;border:5px solid #fff7e8;border-radius:34px;padding:38px 18px 84px;background:linear-gradient(#bdeaff 0 62%,#b9df85 62%);box-shadow:0 14px 30px #416f7230,inset 0 0 35px #fff8;overflow:hidden}.scene:before{content:"";position:absolute;left:7%;top:9%;width:60px;height:28px;border-radius:50px;background:#fff9;box-shadow:44px 8px 0 5px #fff9}.scene:after{content:"";position:absolute;left:0;right:0;bottom:20%;height:7px;background:#ebc17f;box-shadow:0 5px 0 #d4a25d}.choices{position:relative;z-index:2;min-height:250px;display:flex;align-items:flex-end;justify-content:center;gap:clamp(16px,5vw,48px)}.choice{min-width:105px;min-height:124px;border:4px solid #fff;background:#fff9e9d9;border-radius:27px;padding:15px 12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:9px;box-shadow:0 10px 20px #49362d25;cursor:pointer;transition:.2s}.choice:active{transform:scale(.96)}.choice.good{outline:7px solid #63c875;animation:pop .45s}.choice.bad{animation:shake .35s}.choice span{font-size:clamp(46px,12vw,88px);line-height:1}.choice small{font-weight:900;font-size:15px}.ball{display:block;border-radius:50%;background:radial-gradient(circle at 34% 25%,#86dcff 0 9%,#169fdb 35%,#1267be 100%);box-shadow:inset -8px -9px 12px #073d8738,0 8px 12px #49362d2e}.ball.big{width:126px;height:126px}.ball.small{width:62px;height:62px}.block{display:block;width:68px;border-radius:13px;background:linear-gradient(135deg,#ffe26a,#f5a91d);box-shadow:inset 5px 5px 8px #fff7,inset -7px -8px 10px #b4691836,0 7px 10px #49362d2d}.block.tall{height:145px}.block.short{height:72px}.item{display:block;font-size:64px;line-height:1;filter:drop-shadow(0 7px 5px #49362d35)}.choice:has(.item){position:relative;min-height:190px}.choice:has(.item) small{position:absolute;bottom:14px}.choice:has(.item) .item{position:absolute;left:50%;transform:translateX(-50%)}.item.high{top:22px}.item.low{top:99px}.bar{display:block;height:35px;border-radius:999px;background:linear-gradient(135deg,#ff7b50,#ffbd3c);box-shadow:inset 4px 4px 7px #fff7,0 7px 10px #49362d2d}.bar.long{width:142px}.bar.short{width:70px}.panel{display:block;height:85px;border-radius:14px;background:linear-gradient(135deg,#a874ed,#6547c8);box-shadow:inset 5px 5px 8px #fff6,0 7px 10px #49362d2d}.panel.wide{width:138px}.panel.narrow{width:62px}.distance{display:block;line-height:1;filter:drop-shadow(0 7px 5px #49362d35)}.distance.near{font-size:88px}.distance.far{font-size:43px;opacity:.76}.shape{display:block;width:90px;height:90px;box-shadow:inset 5px 5px 8px #fff7,inset -7px -8px 10px #7c3b2530}.shape.circle{border-radius:50%;background:#ff5f78}.shape.square{border-radius:14px;background:#45bde8}.shape.triangle{width:0;height:0;border-left:52px solid transparent;border-right:52px solid transparent;border-bottom:92px solid #ffc127;box-shadow:none}.basket{width:116px;height:90px;border-radius:12px 12px 34px 34px;background:repeating-linear-gradient(90deg,#cf7b32 0 10px,#efa856 10px 20px);border:7px solid #a85d27;box-shadow:0 8px 12px #49362d2c;position:relative}.basket:before{content:"";position:absolute;left:13px;right:13px;top:-45px;height:55px;border:8px solid #a85d27;border-bottom:0;border-radius:50px 50px 0 0}.basket.small{transform:scale(.7);transform-origin:bottom}.mimi{position:absolute;z-index:3;right:1%;bottom:2%;width:23%;max-width:145px;filter:drop-shadow(0 7px 8px #3455)}.message{min-height:48px;margin:13px 0 3px;display:grid;place-items:center;text-align:center;font-size:18px;font-weight:900}.actions{display:flex;justify-content:center}.next{border:0;border-radius:999px;padding:13px 22px;background:#ffcb4d;color:#49362d;font-weight:900;box-shadow:0 5px 14px #49362d25}.spark{position:absolute;z-index:8;font-size:28px;animation:spark 1s ease-out forwards;pointer-events:none}@keyframes pop{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}@keyframes spark{to{transform:translateY(-90px) rotate(35deg);opacity:0}}@media(max-width:520px){.game{padding:11px 9px 24px}.top{grid-template-columns:auto 1fr}.top .reset{grid-column:1/3;grid-row:2;padding:7px 12px;justify-self:center}.pill{font-size:13px;padding:9px 11px}.scene{min-height:380px;border-radius:27px;padding:32px 10px 82px}.choices{min-height:245px;gap:12px}.choice{min-width:88px;min-height:112px;padding:12px 8px}.ball.big{width:108px;height:108px}.ball.small{width:56px;height:56px}.block{width:59px}.block.tall{height:130px}.block.short{height:68px}.mimi{width:25%}.choice:has(.item){min-height:180px}.item{font-size:58px}.item.high{top:20px}.item.low{top:91px}.bar.long{width:120px}.bar.short{width:62px}.panel.wide{width:118px}.panel.narrow{width:56px}}
  </style>
</head>
<body>
<main class="game">
  <header class="top"><a class="pill" href="geometry-games-catalog.html">← До ігор</a><h1 class="title">Знайди для Мімі</h1><button class="pill reset" id="reset">↻ Спочатку</button></header>
  <div class="progress" id="progress"></div><div class="question" id="question"></div>
  <section class="scene" id="scene"><div class="choices" id="choices"></div><img class="mimi" src="mimi-run-transparent-v2b.webp" alt="Мімі"></section>
  <div class="message" id="message">Мімі: «Дивись уважно!» 🐾</div><div class="actions"><button class="next" id="next" hidden>Далі →</button></div>
</main>
<script>
const levels=[
 {question:'Знайди великий м’яч',choices:[{html:'<i class="ball big"></i>',label:'Великий',correct:true},{html:'<i class="ball small"></i>',label:'Маленький'}]},
 {question:'Знайди високий кубик',choices:[{html:'<i class="block short"></i>',label:'Низький'},{html:'<i class="block tall"></i>',label:'Високий',correct:true}]},
 {question:'Хто знаходиться вище?',choices:[{html:'<i class="item low">🌸</i>',label:'Квітка'},{html:'<i class="item high">🦋</i>',label:'Метелик',correct:true}]},
 {question:'Знайди круглу фігуру',choices:[{html:'<i class="shape square"></i>',label:'Квадрат'},{html:'<i class="shape circle"></i>',label:'Коло',correct:true},{html:'<i class="shape triangle"></i>',label:'Трикутник'}]},
 {question:'Куди покладемо великий м’яч?',choices:[{html:'<i class="basket small"></i>',label:'Малий кошик'},{html:'<i class="basket"></i>',label:'Великий кошик',correct:true}]},
 {question:'Знайди довгу доріжку',choices:[{html:'<i class="bar short"></i>',label:'Коротка'},{html:'<i class="bar long"></i>',label:'Довга',correct:true}]},
 {question:'Знайди широку фігуру',choices:[{html:'<i class="panel narrow"></i>',label:'Вузька'},{html:'<i class="panel wide"></i>',label:'Широка',correct:true}]},
 {question:'Хто знаходиться ближче?',choices:[{html:'<i class="distance near">🐞</i>',label:'Близько',correct:true},{html:'<i class="distance far">🐞</i>',label:'Далеко'}]}
];
let level=0,answered=false;const question=document.getElementById('question'),choices=document.getElementById('choices'),message=document.getElementById('message'),next=document.getElementById('next'),scene=document.getElementById('scene');
function render(){answered=false;next.hidden=true;message.textContent='Мімі: «Дивись уважно!» 🐾';question.textContent=levels[level].question;document.getElementById('progress').innerHTML=levels.map((_,i)=>`<span class="dot ${i<level?'done':i===level?'active':''}"></span>`).join('');choices.innerHTML='';levels[level].choices.forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`${c.html}<small>${c.label}</small>`;b.onclick=()=>answer(b,c.correct);choices.appendChild(b)})}
function answer(button,correct){if(answered)return;if(!correct){button.classList.remove('bad');void button.offsetWidth;button.classList.add('bad');message.textContent='Мімі: «Майже! Подивись ще раз» 🐾';return}answered=true;button.classList.add('good');message.textContent='Так! Молодець! ⭐';for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','●'][i%3];s.style.left=(14+Math.random()*68)+'%';s.style.top=(28+Math.random()*48)+'%';scene.appendChild(s);setTimeout(()=>s.remove(),1100)}if(level<levels.length-1)next.hidden=false;else setTimeout(()=>message.textContent='Мімі: «Ти все знайшов! Який уважний!» ❤️🐾',900)}
next.onclick=()=>{level++;render()};document.getElementById('reset').onclick=()=>{level=0;render()};render();
</script>
</body>
</html>
