 {question:'Знайди тонкий олівець',audio:'audio/games/find-for-mimi/questions/question-30.mp3',choices:[{html:'<i class="pencil thick"></i>',label:'Товстий'},{html:'<i class="pencil thin"></i>',label:'Тонкий',correct:true}]}
];

const correctFeedback=[
 {text:'Так! Молодець! ⭐',audio:'audio/games/common/correct-1.mp3'},
 {text:'Правильно! Чудова робота! ⭐',audio:'audio/games/common/correct-2.mp3'},
 {text:'У тебе все вийшло! ⭐',audio:'audio/games/common/correct-3.mp3'},
 {text:'Супер! Ти все помічаєш! ⭐',audio:'audio/games/common/correct-4.mp3'},
 {text:'Так тримати! ⭐',audio:'audio/games/common/correct-5.mp3'}
];
const retryFeedback=[
 {text:'Майже! Подивись ще раз 🐾',audio:'audio/games/common/retry-1.mp3'},
 {text:'Спробуй іще раз — у тебе вийде 🐾',audio:'audio/games/common/retry-2.mp3'},
 {text:'Не поспішай. Поглянь уважніше 🐾',audio:'audio/games/common/retry-3.mp3'}
];
const musicTrack='audio/games/find-for-mimi/music/level-2.mp3';
const MUSIC_VOLUME=.22,DUCKED_MUSIC_VOLUME=.08;
const QUESTION_AUDIO_VERSION='20260917-clean2';

const auditMode=new URLSearchParams(location.search).get('test')==='1';
const requestedStart=Math.max(1,Math.min(30,Number(new URLSearchParams(location.search).get('start'))||1));
const shuffle=list=>{const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy};
const makeFeedbackBag=list=>{let bag=[],last=null;return()=>{if(!bag.length){bag=shuffle(list);if(bag.length>1&&bag[bag.length-1]===last)[bag[0],bag[bag.length-1]]=[bag[bag.length-1],bag[0]]}last=bag.pop();return last}};
const nextCorrectFeedback=makeFeedbackBag(correctFeedback),nextRetryFeedback=makeFeedbackBag(retryFeedback);
let levels=[],level=0,answered=false;
const question=document.getElementById('question'),choices=document.getElementById('choices'),message=document.getElementById('message'),next=document.getElementById('next'),scene=document.getElementById('scene');

const audioCache=new Map();
[...levelBank,...correctFeedback,...retryFeedback].forEach(item=>{if(item.audio){const source=item.audio.includes('/questions/')?`${item.audio}?v=${QUESTION_AUDIO_VERSION}`:item.audio;const voice=new Audio(source);voice.preload='auto';audioCache.set(item.audio,voice)}});
let activeVoice=null,currentMusic=null,currentMusicPath='';
function playVoice(path){
 if(!path)return;
 if(activeVoice){activeVoice.pause();activeVoice.currentTime=0}
 const voice=audioCache.get(path);
 if(!voice)return;
 if(currentMusic)currentMusic.volume=DUCKED_MUSIC_VOLUME;
 voice.currentTime=0;
 voice.onended=()=>{if(currentMusic)currentMusic.volume=MUSIC_VOLUME};
 voice.play().catch(()=>{if(currentMusic)currentMusic.volume=MUSIC_VOLUME});
 activeVoice=voice
}
function updateMusic(){
 const path=musicTrack;
 if(path===currentMusicPath&&currentMusic)return;
 if(currentMusic){currentMusic.pause();currentMusic.currentTime=0}
 currentMusic=new Audio(path);currentMusic.loop=true;currentMusic.volume=MUSIC_VOLUME;currentMusicPath=path;
 currentMusic.play().catch(()=>{})
}
function showFeedback(feedback){
 message.textContent=feedback.text;
 playVoice(feedback.audio)
}
function render(){
 answered=false;next.hidden=true;message.textContent='Мімі: «Дивись уважно!» 🐾';
 question.textContent=levels[level].question;
 document.getElementById('progress').innerHTML=levels.map((_,i)=>`<span class="dot ${i<level?'done':i===level?'active':''}"></span>`).join('');
 choices.innerHTML='';
 (auditMode?levels[level].choices:shuffle(levels[level].choices)).forEach(c=>{const b=document.createElement('button');b.className='choice';b.innerHTML=`${c.html}<small>${c.label}</small>`;b.onclick=()=>answer(b,c.correct);choices.appendChild(b)});
 updateMusic();playVoice(levels[level].audio)
}
function answer(button,correct){
 if(answered)return;
 if(!correct){button.classList.remove('bad');void button.offsetWidth;button.classList.add('bad');showFeedback(nextRetryFeedback());return}
 answered=true;button.classList.add('good');showFeedback(nextCorrectFeedback());
 for(let i=0;i<7;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','●'][i%3];s.style.left=(14+Math.random()*68)+'%';s.style.top=(28+Math.random()*48)+'%';scene.appendChild(s);setTimeout(()=>s.remove(),1100)}
 if(level<levels.length-1)next.hidden=false;else setTimeout(()=>message.textContent='Мімі: «Ти все знайшов! Який уважний!» ❤️🐾',900)
}
function startGame(){levels=auditMode?[...levelBank]:shuffle(levelBank).slice(0,20);level=auditMode?requestedStart-1:0;render()}
let started=false;
next.onclick=()=>{if(!started){started=true;next.textContent='Далі →';startGame();return}level++;render()};
document.getElementById('reset').onclick=()=>{started=true;next.textContent='Далі →';startGame()};
question.textContent=auditMode?'Перевірка всіх 30 завдань':'Готові грати?';message.textContent=auditMode?'Завдання й відповіді йтимуть у фіксованому порядку 🔎':'Натисни «Почати», щоб почути завдання й музику 🎵';next.hidden=false;next.textContent='Почати ▶';
</script>
</body>
</html>
