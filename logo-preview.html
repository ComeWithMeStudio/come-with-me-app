<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CWM logo preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#eee7f2,#f6eadf);font-family:Arial,sans-serif;color:#493f4c}.shell{width:min(720px,100%);margin:0 auto;padding:18px 14px 40px}h1{font-size:28px;margin:4px 0 8px}.note{margin:0 0 18px;opacity:.7}.grid{display:grid;gap:15px}.card{position:relative;border-radius:27px;overflow:hidden;background:#fff;box-shadow:0 8px 25px #604f7026}.cover{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}.badge{position:absolute;left:12px;top:12px;border-radius:999px;padding:7px 11px;background:#fffde8e8;backdrop-filter:blur(5px);font-size:11px;font-weight:900;color:#66516f;box-shadow:0 3px 10px #0002}.lock{position:absolute;right:12px;top:12px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fffde8e8;box-shadow:0 3px 10px #0002}.brand{position:absolute;left:15px;bottom:13px;width:clamp(58px,13%,88px);height:auto;object-fit:contain;filter:drop-shadow(0 2px 4px #0005);pointer-events:none}@media(max-width:520px){.card{border-radius:22px}.brand{left:12px;bottom:10px;width:64px}}
</style>
</head>
<body><main class="shell"><h1>Колискові 🌙</h1><p class="note">Проба логотипа кодом — картинки не змінені.</p><div class="grid">
<article class="card"><img class="cover" src="more-spyt.png" alt="Море спить"><span class="badge">БЕЗКОШТОВНО</span><img class="brand" src="cwm-logo.png" alt="CWM"></article>
<article class="card"><img class="cover" src="zasynaye-tsilyi-dim.png" alt="Засинає цілий дім"><span class="badge">БЕЗКОШТОВНО</span><img class="brand" src="cwm-logo.png" alt="CWM"></article>
<article class="card"><img class="cover" src="khmarynka-dlia-snu.png" alt="Хмаринка для сну"><span class="lock">🔒</span><img class="brand" src="cwm-logo.png" alt="CWM"></article>
<article class="card"><img class="cover" src="sonne-koshenia.png" alt="Сонне кошеня"><span class="lock">🔒</span><img class="brand" src="cwm-logo.png" alt="CWM"></article>
<article class="card"><img class="cover" src="nichnyi-potiah.png" alt="Нічний потяг"><span class="lock">🔒</span><img class="brand" src="cwm-logo.png" alt="CWM"></article>
</div></main></body></html>
