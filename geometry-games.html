function complete(){assembly.classList.add('complete');board.classList.add('celebrate');message.textContent=`Готово! Це ${levels[levelIndex].name.toLowerCase()}! 🎉`;for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','●'][i%3];s.style.left=(18+Math.random()*62)+'%';s.style.top=(25+Math.random()*45)+'%';board.appendChild(s);setTimeout(()=>s.remove(),1100)}setTimeout(()=>board.classList.remove('celebrate'),600);next.hidden=levelIndex===levels.length-1; if(levelIndex===levels.length-1)setTimeout(()=>message.textContent='Мімі: «Ми збудували все! Які ми майстри!» ❤️🐾',1600)}
function nearbySlot(x,y,kind){let best=null,bestDistance=Infinity;document.querySelectorAll(`.slot[data-kind="${kind}"]:not(.filled)`).forEach(slot=>{const r=slot.getBoundingClientRect(),dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom),distance=Math.hypot(dx,dy);if(distance<44&&distance<bestDistance){best=slot;bestDistance=distance}});return best}
function enableDrag(piece){let ghost=null,moved=false;piece.addEventListener('pointerdown',e=>{if(piece.classList.contains('used'))return;moved=false;ghost=piece.cloneNode();ghost.classList.add('ghost');ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.appendChild(ghost);piece.setPointerCapture(e.pointerId)});piece.addEventListener('pointermove',e=>{if(!ghost)return;moved=true;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'});piece.addEventListener('pointerup',e=>{if(!ghost)return;ghost.remove();ghost=null;piece.releasePointerCapture(e.pointerId);if(!moved){choose(piece);return}const exact=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot'),hit=exact?.dataset.kind===piece.dataset.kind?exact:nearbySlot(e.clientX,e.clientY,piece.dataset.kind);if(hit){selected=piece;placeSelected(hit)}else choose(piece)})}
next.onclick=()=>{levelIndex++;render()};document.getElementById('reset').onclick=()=>render();
render();
</script>
