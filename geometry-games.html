const requestedLevel=Math.max(1,Math.min(levels.length,Number(new URLSearchParams(location.search).get('level'))||1));
let levelIndex=requestedLevel-1,selected=null,filled=0;const board=document.getElementById('board'),assembly=document.getElementById('assembly'),tray=document.getElementById('tray'),message=document.getElementById('message'),next=document.getElementById('next'),instruction=document.getElementById('instruction');
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function render(){selected=null;filled=0;next.hidden=true;message.textContent='Мімі: «Спробуємо?» 🐾';const l=levels[levelIndex];instruction.textContent=l.prompt;assembly.className='assembly '+l.className;assembly.innerHTML='';tray.innerHTML='';document.getElementById('progress').innerHTML=levels.map((_,i)=>`<span class="dot ${i<levelIndex?'done':i===levelIndex?'active':''}"></span>`).join('');
 l.parts.forEach((p,i)=>{const s=document.createElement('button');s.className='slot '+p.kind;s.dataset.kind=p.kind;s.dataset.index=i;s.style.cssText=`left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;${p.front?'z-index:3;':''}`;s.setAttribute('aria-label','Місце для фігури');s.onclick=()=>placeSelected(s);assembly.appendChild(s)});
 shuffle(l.parts.map((p,i)=>({...p,source:i}))).forEach(p=>{const b=document.createElement('button');b.className='piece '+p.kind;b.dataset.kind=p.kind;b.dataset.source=p.source;b.style.setProperty('--color',p.color);b.setAttribute('aria-label',p.kind);b.onclick=()=>choose(b);enableDrag(b);tray.appendChild(b)});
}
function choose(piece){if(piece.classList.contains('used'))return;document.querySelectorAll('.piece').forEach(x=>x.classList.remove('chosen'));selected=piece;piece.classList.add('chosen');message.textContent='Тепер знайди для неї місце ✨'}
function placeSelected(slot){if(!selected||slot.classList.contains('filled'))return;if(selected.dataset.kind!==slot.dataset.kind){message.textContent='Мімі: «Майже! Спробуй інше місце» 🐾';slot.animate([{transform:'translateX(0)'},{transform:'translateX(-7px)'},{transform:'translateX(7px)'},{transform:'translateX(0)'}],{duration:330});return}fill(slot,selected)}
function fill(slot,piece){const p=levels[levelIndex].parts[Number(slot.dataset.index)];slot.classList.add('filled');slot.style.setProperty('--color',p.color);piece.classList.add('used');piece.classList.remove('chosen');selected=null;filled++;message.textContent='Так! Фігура на своєму місці ⭐';if(filled===levels[levelIndex].parts.length)complete()}
function complete(){assembly.classList.add('complete');board.classList.add('celebrate');message.textContent=`Готово! Це ${levels[levelIndex].name.toLowerCase()}! 🎉`;for(let i=0;i<8;i++){const s=document.createElement('span');s.className='spark';s.textContent=['⭐','✨','●'][i%3];s.style.left=(18+Math.random()*62)+'%';s.style.top=(25+Math.random()*45)+'%';board.appendChild(s);setTimeout(()=>s.remove(),1100)}setTimeout(()=>board.classList.remove('celebrate'),600);next.hidden=levelIndex===levels.length-1; if(levelIndex===levels.length-1)setTimeout(()=>message.textContent='Мімі: «Ми збудували все! Які ми майстри!» ❤️🐾',1600)}
function nearbySlot(x,y,kind){let best=null,bestDistance=Infinity;document.querySelectorAll(`.slot[data-kind="${kind}"]:not(.filled)`).forEach(slot=>{const r=slot.getBoundingClientRect(),dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom),distance=Math.hypot(dx,dy);if(distance<44&&distance<bestDistance){best=slot;bestDistance=distance}});return best}
function enableDrag(piece){let ghost=null,moved=false;piece.addEventListener('pointerdown',e=>{if(piece.classList.contains('used'))return;moved=false;ghost=piece.cloneNode();ghost.classList.add('ghost');ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';document.body.appendChild(ghost);piece.setPointerCapture(e.pointerId)});piece.addEventListener('pointermove',e=>{if(!ghost)return;moved=true;ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px'});piece.addEventListener('pointerup',e=>{if(!ghost)return;ghost.remove();ghost=null;piece.releasePointerCapture(e.pointerId);if(!moved){choose(piece);return}const exact=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot'),hit=exact?.dataset.kind===piece.dataset.kind?exact:nearbySlot(e.clientX,e.clientY,piece.dataset.kind);if(hit){selected=piece;placeSelected(hit)}else choose(piece)})}
next.onclick=()=>{levelIndex++;render()};document.getElementById('reset').onclick=()=>render();
